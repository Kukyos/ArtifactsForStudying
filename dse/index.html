.tbl.scroll{overflow-x:auto;max-width:100%}

:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#111c26; --muted:#566775; --line:#d8e0e6;
  --accent:#0a6f8f; --accent-soft:#dff0f5; --accent-ink:#ffffff;
  --var:#6d2fb0; --var-bg:#efe6fa; --term:#a8480a; --term-bg:#fdeedd;
  --ok:#1b7f45; --ok-soft:#e0f3e8; --warn:#a8480a; --warn-soft:#fdeedd; --code:#eaf0f4;

}

  --var:#c9a6f3; --var-bg:#2a2038; --term:#f1b565; --term-bg:#33261a;

  --accent:#4cc2e6; --accent-soft:#16323d; --accent-ink:#06222c;
  --var:#c9a6f3; --var-bg:#2a2038; --term:#f1b565; --term-bg:#33261a;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding:0}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.25rem;margin-top:2rem} h3{font-size:1.05rem;margin-top:1.4rem}
p{margin:.6rem 0} a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--code);padding:.08em .35em;border-radius:4px}
.v{color:var(--var);font-weight:600} .t{color:var(--term);font-weight:600}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:20px 12px 30px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
#side h4{margin:20px 0 6px;padding:0 10px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
#side a{display:flex;gap:10px;align-items:baseline;padding:5px 10px;text-align:left;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.92rem}
#side a:hover{background:var(--accent-soft)} #side a.on{background:var(--accent-soft);font-weight:600}
#side a .no{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:2.2rem;flex:none}
#side a.home{margin-top:12px}
#side .srch{position:relative;margin:10px 0 2px;padding:0 6px}
#side .srch input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem}
#side .sres{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:62vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#side .sres h5{margin:0;padding:9px 10px 3px;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
#side .sres a{display:block;padding:6px 10px;font-size:.86rem;line-height:1.3;border-radius:0}
#side .sres a.sel,#side .sres a:hover{background:var(--accent-soft)}
#side .sres a .sn{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-right:6px}
#side .sres a small{display:block;color:var(--muted);font-size:.76rem;margin-top:1px;overflow-wrap:anywhere}
#side .sres .none{padding:10px;color:var(--muted);font-size:.85rem}
#side .sres .more{padding:4px 10px 8px;color:var(--muted);font-size:.76rem}
.hit{animation:hit 2.4s ease-out}@keyframes hit{0%{outline:3px solid var(--term);outline-offset:3px}100%{outline:3px solid transparent;outline-offset:3px}}

.nav .btn{text-decoration:none}
.prog{padding:6px 10px 0;font-size:.8rem;color:var(--muted)}
.scrim{display:none}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);flex:none;transform:translateY(1px)}
.dot.done{background:var(--ok);border-color:var(--ok)} .dot.now{border-color:var(--accent);background:var(--accent-soft)}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:600;padding:0 10px;font-size:1.05rem}
.brand small{color:var(--muted);font-weight:400}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
main{padding:24px clamp(20px,4vw,56px) 80px;min-width:0;max-width:1060px;width:100%}
.menu{display:none}
.kicker{font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.pill{display:inline-block;font-size:.74rem;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:8px;vertical-align:middle}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.now{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{font-size:.78rem;font-family:var(--mono);padding:2px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.card.model{border-left:4px solid var(--accent)}
.card h3:first-child{margin-top:0}
.callout{background:var(--warn-soft);border-radius:8px;padding:10px 14px;margin:14px 0;font-size:.95rem}
.callout.ok{background:var(--ok-soft)}
.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--code);font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.g{font-family:var(--mono);font-size:.95rem;white-space:pre-wrap}
.gbox{font-family:var(--mono);background:var(--code);padding:10px 14px;border-radius:8px;white-space:pre;overflow-x:auto;margin:10px 0}
ol.practice{padding-left:0;list-style:none;counter-reset:q;display:grid;gap:12px}
ol.practice>li{counter-increment:q;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
ol.practice>li::before{content:"Q" counter(q);font-family:var(--mono);font-weight:600;color:var(--accent);margin-right:8px}
.src{font-family:var(--mono);font-size:.74rem;background:var(--code);padding:1px 7px;border-radius:4px;color:var(--muted);margin-right:6px}
details.ans{margin-top:8px} details.ans summary{cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:500}
details.ans>div{margin-top:8px;padding:10px 14px;background:var(--ok-soft);border-radius:8px;font-size:.95rem}
button,.btn{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:7px}
button:hover{border-color:var(--accent)} button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number]{font:inherit;font-family:var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;max-width:100%}
.w{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.w .cap{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;font-family:var(--mono);font-size:1.1rem}
.tok{padding:2px 8px;border-radius:6px;border:1px solid var(--line);min-width:1.9rem;text-align:center}
.tok.var{background:var(--var-bg);color:var(--var);border-color:transparent;font-weight:600}
.tok.term{background:var(--term-bg);color:var(--term);font-weight:600;border-color:transparent}
button.tok.var{cursor:pointer;font:inherit;font-family:var(--mono);font-size:1.1rem;font-weight:600}
.tok.var.sel{outline:2px solid var(--var);outline-offset:1px}
.tok.dis{opacity:.4;cursor:default}
.log{font-family:var(--mono);font-size:.88rem;color:var(--muted);margin:8px 0}
.log b{color:var(--ink);font-weight:500}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split>*{min-width:0}
.msg{margin-top:8px;font-size:.93rem}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--warn)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:38px;flex-wrap:wrap}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.big{font-size:2.6rem;font-weight:600;line-height:1;font-family:var(--mono)}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  #side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:30;box-shadow:0 0 24px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .2s;padding:18px 14px 30px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);height:100%}
  body.open #side{transform:none}
  body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
  main{padding:56px 16px 80px}
  .menu{display:inline-block}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
.dot.ready{border-color:var(--accent)}
.pill.ready{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.steps{counter-reset:s;padding-left:0;list-style:none;display:grid;gap:10px;margin:10px 0}
.steps>li{counter-increment:s;padding-left:36px;position:relative}
.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.qimg{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.pyq{border-left:3px solid var(--term);background:var(--warn-soft);border-radius:6px;padding:8px 12px;margin:6px 0 10px;font-size:.95rem;white-space:pre-line}
.steps>li,.practice>li{min-width:0;overflow-wrap:anywhere}
.steps>li .scroll,.card .scroll{max-width:100%}
.card,.w,.callout{min-width:0;max-width:100%}
code{overflow-wrap:anywhere}
pre.sql{font-family:var(--mono);background:var(--code);padding:10px 14px;border-radius:8px;overflow-x:auto;margin:10px 0;font-size:.88rem;line-height:1.5;white-space:pre;max-width:100%}
.tbl{margin:10px 0}
.qa{margin:18px 0 26px;scroll-margin-top:12px}
.qa .qh{margin:0 0 6px}
.answer{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:10px 16px;margin-top:8px;min-width:0}
.answer .kicker{color:var(--ok);font-weight:600}
.answer.todo{border-left-color:var(--line);color:var(--muted);font-size:.92rem}
.answer ul{padding-left:1.3rem}
pre.code,pre.out{font-family:var(--mono);background:var(--code);padding:10px 14px;border-radius:8px;overflow-x:auto;margin:10px 0;font-size:.86rem;line-height:1.5;white-space:pre;max-width:100%}
pre.code{border-left:3px solid var(--accent)}
pre.out{background:#0f1720;color:#d5e3ee;border-left:3px solid var(--ok)}
.qjump{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.qjump a{font-family:var(--mono);font-size:.78rem;padding:2px 7px;border:1px solid var(--line);border-radius:5px;text-decoration:none;background:var(--surface)}
.qlinks li{margin:4px 0}
.qjump a.todo{color:var(--muted);border-style:dashed}
</style>

    qs.slice(0,14).forEach(function(r){h+='<a href="#'+r.S.id+'" data-q="'+qid(r.q[0])+'"><span class="sn">'+esc(r.q[0])+'</span>'+esc(r.q[1].replace(/\s+/g,' ').slice(0,90))+'<small>'+esc(r.S.t)+'</small></a>'});
    if(qs.length>14)h+='<div class="more">and '+(qs.length-14)+' more. Add another word to narrow it down.</div>';
  }
  box.innerHTML=h;box.hidden=false;
}
function goQ(id){var el=document.getElementById(id);if(el){el.scrollIntoView({block:'start'});el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}}
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[data-q]');
  if(a){PEND=a.getAttribute('data-q');if(location.hash===a.getAttribute('href')){e.preventDefault();var p=PEND;PEND=null;document.body.classList.remove('open');goQ(p)}}
  if(!e.target.closest||!e.target.closest('.srch')){var b=$('#qres');if(b)b.hidden=true}
});
var sd=document.getElementById('side');
sd.addEventListener('input',function(e){if(e.target.id==='qs'){LASTQ=e.target.value;renderRes()}});
sd.addEventListener('focusin',function(e){if(e.target.id==='qs')renderRes()});
sd.addEventListener('keydown',function(e){
  if(e.target.id!=='qs')return;
  var box=$('#qres'),links=box?$$('a',box):[],cur=links.findIndex(function(a){return a.classList.contains('sel')});
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!links.length)return;e.preventDefault();
    if(cur>=0)links[cur].classList.remove('sel');
    cur=e.key==='ArrowDown'?Math.min(links.length-1,cur+1):Math.max(0,cur-1);
    links[cur].classList.add('sel');links[cur].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){var t=links[cur>=0?cur:0];if(t){e.preventDefault();t.click()}}
  else if(e.key==='Escape'){LASTQ='';e.target.value='';renderRes()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))){var i=$('#qs');if(i){e.preventDefault();document.body.classList.add('open');i.focus()}}
});

  h+='<a href="#cheat" class="home'+(cur==='cheat'?' on':'')+'">Formula cheat sheet</a>';
  h+='<div class="srch"><input id="qs" type="search" placeholder="Search topics, questions…  ( / )" autocomplete="off" spellcheck="false" aria-label="Search the whole site" value="'+esc(LASTQ)+'"><div id="qres" class="sres" hidden></div></div>';
  h+='<h4>Past papers (answered)</h4>';
  SECS.filter(function(S){return !S.rev}).forEach(function(S){h+='<a href="#'+S.id+'" class="'+(cur===S.id?'on':'')+'"><span class="no">'+S.q.length+'</span><span>'+esc(S.t)+'</span></a>'});
  h+='<h4>Classroom sets (answered)</h4>';
  SECS.filter(function(S){return S.rev}).forEach(function(S){h+='<a href="#'+S.id+'" class="'+(cur===S.id?'on':'')+'"><span class="no">'+S.q.length+'</span><span>'+esc(S.t)+'</span></a>'});
  MODS.forEach(function(m){
    h+='<h4>Module '+m.n+' · '+esc(m.name)+'</h4>';
    m.chunks.forEach(function(c){h+='<a href="#'+c.id+'" class="'+(cur===c.id?'on':'')+'"><span class="dot '+(c.s==='done'?'done':c.s==='now'?'now':c.s==='ready'?'ready':'')+'"></span><span class="no">'+c.no+'</span><span>'+esc(c.t)+'</span></a>'});
  });
  $('#side').innerHTML=h;
}
function home(){
  var h='<button class="menu" aria-label="Open the list">☰ Menu</button><div class="kicker" style="margin-top:12px">DATA SCIENCE ECOSYSTEM · 23CS2024 · ENDSEM PLAN</div><h1 style="font-size:1.9rem;margin-top:6px">Where you are</h1>';
  h+='<h2>Past papers, answered</h2><p>Every question is shown exactly as it was set (cut from the paper), with the answer directly under it, written the way you would write it for those marks: formula, substitution, full working table, result and a one-line conclusion, with the diagram drawn from the computed numbers.</p>';
  h+='<div class="mods">'+SECS.filter(function(S){return !S.rev}).map(function(S){var d=S.q.filter(function(q){return ANS[q[0]]}).length;
    return '<a class="card" style="margin:0;text-decoration:none;color:inherit" href="#'+S.id+'"><div class="kicker">'+esc(S.code)+(S.code==='23CS2024'?' · START HERE':'')+'</div><div style="font-weight:600;margin:2px 0 8px">'+esc(S.t)+'</div><div class="bar" style="margin:0"><i style="width:'+Math.round(d/S.q.length*100)+'%"></i></div><div class="log" style="margin:6px 0 0">'+d+' of '+S.q.length+' answered</div></a>'}).join('')+'</div>';
  h+='<h2>Classroom sets, answered</h2><p>Every problem set from the DSE Classroom (revision, K-means, agglomerative, Pearson and Spearman, KNN, the practicing problems, the ethics cases, QA2 and the pandas assignments), in the same format.</p><div class="mods">'+SECS.filter(function(S){return S.rev}).map(function(S){var d=S.q.filter(function(q){return ANS[q[0]]}).length;return '<a class="card" style="margin:0;text-decoration:none;color:inherit" href="#'+S.id+'"><div class="kicker">CLASSROOM</div><div style="font-weight:600;margin:2px 0 4px">'+esc(S.t)+'</div><div class="log" style="margin:0">'+d+' of '+S.q.length+' answered</div></a>'}).join('')+'</div>';
  h+='<h2>What the exam looks like</h2><p>100 marks in 3 hours: <b>Part A</b> 10 × 1, <b>Part B</b> 6 × 3, <b>Part C</b> any five of Q17–Q23 plus the <b>compulsory Q24</b>, 12 marks each. Part C is mostly <b>solving</b>: Pearson r, K-means for two iterations, KNN with k = 3, a regression line, a confusion matrix, a dendrogram, a box plot from the five-number summary, a confidence interval, plus pandas code. Q24 (CO6) is the ethics case study.</p>';
  h+='<div class="mods">'+MODS.map(function(m){var d=m.chunks.filter(function(c){return c.s==='done'}).length,b=m.chunks.filter(function(c){return c.h}).length,p=Math.round(d/m.chunks.length*100);
    return '<div class="card" style="margin:0"><div class="kicker">MODULE '+m.n+'</div><div style="font-weight:600;margin:2px 0 8px">'+esc(m.name)+'</div><div class="bar" style="margin:0"><i style="width:'+p+'%"></i></div><div class="log" style="margin:6px 0 0">'+d+' / '+m.chunks.length+(b<m.chunks.length?' · '+b+' built':'')+'</div></div>'}).join('')+'</div>';
  h+='<h2>Habits that earn the marks</h2><ul><li><b>Write the formula first, then substitute.</b> The first mark is for the formula, the next for the substitution, the last for the answer.</li><li><b>Draw the working table.</b> Every distance, rank, deviation and sum gets a row and a column; a correct final number with no table loses most of an 8-mark question.</li><li><b>Finish with a sentence.</b> "r = 0.99, a very strong positive correlation", "the new point is Pass", "Reject H0".</li><li><b>Use the teacher’s methods:</b> quartiles as medians of the two halves, tied ranks averaged, single linkage takes the minimum, K-means updates all centroids after assigning every point.</li></ul>';
  h+='<p class="log" style="margin-top:24px">Progress is saved in this browser only. <button data-resetprog>Reset progress</button></p>';
  return h;
}
function cheatPage(){
  var h='<button class="menu" aria-label="Open the list">☰ Menu</button><div class="kicker" style="margin-top:12px">LAST-MINUTE REVISION</div><h1 style="font-size:1.8rem;margin-top:6px">Formula cheat sheet</h1><p>Every formula and rule from the course on one page, with the methods your teacher uses. Read it the evening before and again just before the paper; the topic pages and worked answers hold the full method for each one.</p>';
  h+='<div class="qjump">'+CHEAT.map(function(c,i){return '<a href="#cheat" data-q="cs-'+i+'">'+esc(c.t)+'</a>'}).join('')+'</div>';
  CHEAT.forEach(function(c,i){h+='<section class="qa" id="cs-'+i+'"><h2>'+esc(c.t)+'</h2><div class="answer">'+c.h+'</div></section>'});
  return h;
}
function chunk(c,i){
  var h='<button class="menu" aria-label="Open the list">☰ Menu</button><div class="kicker" style="margin-top:12px">MODULE '+c.mod.n+' · '+esc(c.mod.name.toUpperCase())+'</div><h1 style="font-size:1.8rem;margin-top:6px">'+c.no+' '+esc(c.t)+'<span class="pill '+c.s+'">'+PILL[c.s]+'</span></h1>';
  if(c.exam&&c.exam.length)h+='<div class="chips"><span class="chip">'+c.exam.length+' exam and revision questions on this topic, listed at the end</span></div>';
  h+=c.h||'<div class="card"><p>This chunk is still being built. The past papers are already answered: start there.</p></div>';
  if(c.exam&&c.exam.length)h+='<h2>Questions on this topic</h2><p class="log">Each link opens the question with its full answer.</p><ul class="qlinks">'+c.exam.map(function(k){var S=SECS.filter(function(S){return S.re.test(k)})[0],q=PYQ.filter(function(q){return q[0]===k})[0];return S&&q?'<li><a href="#'+S.id+'" data-q="'+qid(k)+'"><b>'+esc(k)+'</b></a> '+esc(q[1].split(String.fromCharCode(10))[0].slice(0,110))+(q[2]?' <span class="log">('+esc(q[2])+')</span>':'')+'</li>':''}).join('')+'</ul>';
  if(c.h)h+='<div class="card" style="margin-top:28px"><div class="row" style="justify-content:space-between"><span>'+(c.s==='done'?'You marked this chunk as done.':'Finished this chunk?')+'</span><button data-mark class="'+(c.s==='done'?'':'primary')+'">'+(c.s==='done'?'Mark as not done':'Mark as done')+'</button></div></div>';
  var p=ALL[i-1],n=ALL[i+1];
  h+='<div class="nav">'+(p?'<a class="btn" href="#'+p.id+'">← '+p.no+' '+esc(p.t)+'</a>':'<span></span>')+(n?'<a class="btn" href="#'+n.id+'">'+n.no+' '+esc(n.t)+' →</a>':'')+'</div>';
  return h;
}
function hydrate(root){Object.keys(WIDGETS).forEach(function(sel){$$(sel,root).forEach(function(el){if(!el.dataset.hyd){el.dataset.hyd=1;WIDGETS[sel](el)}})})}
function route(){
  var id=(location.hash||'#home').slice(1),main=$('#main');
  document.body.classList.remove('open');recalc();
  var SS=SECS.filter(function(S){return S.id===id})[0];
  if(id==='cheat'){side('cheat');main.innerHTML=cheatPage()}
  else if(SS){side(id);main.innerHTML=srcPage(SS)}
  else if(id==='home'||!ALL.some(function(c){return c.id===id})){side('home');main.innerHTML=home()}
  else{var i=ALL.map(function(c){return c.id}).indexOf(id);side(id);main.innerHTML=chunk(ALL[i],i)}
  hydrate(main);
  var mk=$('[data-mark]',main);if(mk)mk.onclick=function(){if(PROG[id])delete PROG[id];else PROG[id]=1;saveProg();var y=window.scrollY;route();window.scrollTo(0,y)};
  var rp=$('[data-resetprog]',main);if(rp)rp.onclick=function(){if(confirm('Reset all Data Science progress in this browser?')){PROG={};saveProg();route()}};
  var mb=$('.menu',main);if(mb)mb.onclick=function(){document.body.classList.toggle('open')};
  var a=$('#side a.on');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'});
  window.scrollTo(0,0);
  if(PEND){var P=PEND;PEND=null;setTimeout(function(){goQ(P)},60)}
}
window.addEventListener('hashchange',route);route();
</script>
