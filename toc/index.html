<!doctype html>
<html lang="en" data-subject="toc">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="../shared/study.js"></script>
<meta charset="utf-8">
<title>TOC Tutor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail of chunks + one reading column. Accent teal = navigation/state,
   violet = grammar variables, amber = terminals (same colours in text, trees and steppers). */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#111c26; --muted:#566775; --line:#d8e0e6;
  --accent:#0a6f8f; --accent-soft:#dff0f5; --accent-ink:#ffffff;
  --var:#6d2fb0; --var-bg:#efe6fa; --term:#a8480a; --term-bg:#fdeedd;
  --ok:#1b7f45; --ok-soft:#e0f3e8; --warn:#a8480a; --warn-soft:#fdeedd; --code:#eaf0f4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161d; --surface:#152029; --ink:#e5ecf2; --muted:#8fa2b1; --line:#26343f;
  --accent:#4cc2e6; --accent-soft:#16323d; --accent-ink:#06222c;
  --var:#c9a6f3; --var-bg:#2a2038; --term:#f1b565; --term-bg:#33261a;
  --ok:#5fd18c; --ok-soft:#173326; --warn:#f1b565; --warn-soft:#33261a; --code:#1b2933; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161d; --surface:#152029; --ink:#e5ecf2; --muted:#8fa2b1; --line:#26343f;
  --accent:#4cc2e6; --accent-soft:#16323d; --accent-ink:#06222c;
  --var:#c9a6f3; --var-bg:#2a2038; --term:#f1b565; --term-bg:#33261a;
  --ok:#5fd18c; --ok-soft:#173326; --warn:#f1b565; --warn-soft:#33261a; --code:#1b2933; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding:0}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.25rem;margin-top:2rem} h3{font-size:1.05rem;margin-top:1.4rem}
p{margin:.6rem 0} a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--code);padding:.08em .35em;border-radius:4px}
.v{color:var(--var);font-weight:600} .t{color:var(--term);font-weight:600}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:20px 12px 30px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
#side h4{margin:20px 0 6px;padding:0 10px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
#side a{display:flex;gap:10px;align-items:baseline;padding:5px 10px;text-align:left;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.92rem}
#side a:hover{background:var(--accent-soft)} #side a.on{background:var(--accent-soft);font-weight:600}
#side a .no{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:2.2rem;flex:none}
#side a.home{margin-top:12px}
#side .srch{position:relative;margin:10px 0 2px;padding:0 6px}
#side .srch input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem}
#side .sres{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:62vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#side .sres h5{margin:0;padding:9px 10px 3px;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
#side .sres a{display:block;padding:6px 10px;font-size:.86rem;line-height:1.3;border-radius:0}
#side .sres a.sel,#side .sres a:hover{background:var(--accent-soft)}
#side .sres a .sn{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-right:6px}
#side .sres a small{display:block;color:var(--muted);font-size:.76rem;margin-top:1px;overflow-wrap:anywhere}
#side .sres .none{padding:10px;color:var(--muted);font-size:.85rem}
#side .sres .more{padding:4px 10px 8px;color:var(--muted);font-size:.76rem}
.hit{animation:hit 2.4s ease-out}@keyframes hit{0%{outline:3px solid var(--term);outline-offset:3px}100%{outline:3px solid transparent;outline-offset:3px}}

.nav .btn{text-decoration:none}
.prog{padding:6px 10px 0;font-size:.8rem;color:var(--muted)}
.scrim{display:none}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);flex:none;transform:translateY(1px)}
.dot.done{background:var(--ok);border-color:var(--ok)} .dot.now{border-color:var(--accent);background:var(--accent-soft)}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:600;padding:0 10px;font-size:1.05rem}
.brand small{color:var(--muted);font-weight:400}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
main{padding:24px clamp(20px,4vw,56px) 80px;min-width:0;max-width:1060px;width:100%}
.menu{display:none}
.kicker{font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.pill{display:inline-block;font-size:.74rem;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:8px;vertical-align:middle}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.now{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{font-size:.78rem;font-family:var(--mono);padding:2px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.card.model{border-left:4px solid var(--accent)}
.card h3:first-child{margin-top:0}
.callout{background:var(--warn-soft);border-radius:8px;padding:10px 14px;margin:14px 0;font-size:.95rem}
.callout.ok{background:var(--ok-soft)}
.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--code);font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.g{font-family:var(--mono);font-size:.95rem;white-space:pre-wrap}
.gbox{font-family:var(--mono);background:var(--code);padding:10px 14px;border-radius:8px;white-space:pre;overflow-x:auto;margin:10px 0}
ol.practice{padding-left:0;list-style:none;counter-reset:q;display:grid;gap:12px}
ol.practice>li{counter-increment:q;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
ol.practice>li::before{content:"Q" counter(q);font-family:var(--mono);font-weight:600;color:var(--accent);margin-right:8px}
.src{font-family:var(--mono);font-size:.74rem;background:var(--code);padding:1px 7px;border-radius:4px;color:var(--muted);margin-right:6px}
details.ans{margin-top:8px} details.ans summary{cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:500}
details.ans>div{margin-top:8px;padding:10px 14px;background:var(--ok-soft);border-radius:8px;font-size:.95rem}
button,.btn{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:7px}
button:hover{border-color:var(--accent)} button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number]{font:inherit;font-family:var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;max-width:100%}
.w{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.w .cap{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;font-family:var(--mono);font-size:1.1rem}
.tok{padding:2px 8px;border-radius:6px;border:1px solid var(--line);min-width:1.9rem;text-align:center}
.tok.var{background:var(--var-bg);color:var(--var);border-color:transparent;font-weight:600}
.tok.term{background:var(--term-bg);color:var(--term);font-weight:600;border-color:transparent}
button.tok.var{cursor:pointer;font:inherit;font-family:var(--mono);font-size:1.1rem;font-weight:600}
.tok.var.sel{outline:2px solid var(--var);outline-offset:1px}
.tok.dis{opacity:.4;cursor:default}
.log{font-family:var(--mono);font-size:.88rem;color:var(--muted);margin:8px 0}
.log b{color:var(--ink);font-weight:500}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split>*{min-width:0}
.msg{margin-top:8px;font-size:.93rem}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--warn)}
svg text{font-family:var(--mono)}
.tn-v{fill:var(--var-bg);stroke:var(--var);stroke-width:1.5}
.tn-v.pend{stroke-dasharray:3 3;fill:var(--surface)}
.tn-t{fill:var(--term);font-weight:600;font-size:14px}
.tn-vt{fill:var(--var);font-weight:600;font-size:14px}
.tn-e{fill:var(--muted);font-style:italic;font-size:14px}
.tn-l{stroke:var(--muted);stroke-width:1.3;fill:none}
.fa-c{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.fa-c.cur{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
.fa-e{stroke:var(--ink);stroke-width:1.5;fill:none}
.fa-a{fill:var(--ink)}
.fa-t{fill:var(--ink);font-size:14px}
.fa-l{fill:var(--accent);font-size:14px;font-weight:600}
.ring{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:38px;flex-wrap:wrap}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.big{font-size:2.6rem;font-weight:600;line-height:1;font-family:var(--mono)}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  #side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:30;box-shadow:0 0 24px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .2s;padding:18px 14px 30px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);height:100%}
  body.open #side{transform:none}
  body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
  main{padding:56px 16px 80px}
  .menu{display:inline-block}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
.dot.ready{border-color:var(--accent)}
.pill.ready{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tbl.c td,.tbl.c th{text-align:center}
.tbl .hl{background:var(--accent-soft)}
.tbl td.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.tbl td.x{background:var(--warn-soft);color:var(--warn);font-weight:600}
.tt td:first-child,.tt th:first-child{font-family:var(--mono);font-weight:600;text-align:left;white-space:nowrap}
.tt td{font-family:var(--mono)}
.mx{border-collapse:collapse;font-family:var(--mono);font-size:.9rem}
.mx td,.mx th{border:1px solid var(--line);padding:4px 9px;text-align:center;min-width:2.4rem}
.mx th{background:var(--code);font-weight:600}
.mx td.mark{background:var(--warn-soft);color:var(--warn);font-weight:600}
.mx td.same{background:var(--ok-soft);color:var(--ok);font-weight:600}
.mx td.blank{background:transparent;border-color:transparent}
.steps{counter-reset:s;padding-left:0;list-style:none;display:grid;gap:10px;margin:10px 0}
.steps>li{counter-increment:s;padding-left:36px;position:relative}
.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.stack{display:flex;flex-direction:column-reverse;gap:2px;min-height:34px;border:2px solid var(--ink);border-top:none;padding:4px;width:70px;border-radius:0 0 8px 8px}
.stack b{display:block;text-align:center;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);padding:1px 4px;border-radius:3px}
.tape{display:flex;overflow-x:auto;padding:4px 2px 8px}
.tape span{min-width:36px;height:38px;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:1.05rem;margin-left:-1px;background:var(--surface)}
.tape span.hd{background:var(--accent-soft);outline:2px solid var(--accent);z-index:1}
.fa-e.hot{stroke:var(--accent);stroke-width:2.6}
.fa-l{font-size:13px}
.idl{font-family:var(--mono);font-size:.92rem;line-height:1.9}
.idl .cur{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-weight:600}
.okc{color:var(--ok)} .badc{color:var(--warn)}
table.cyk{border-collapse:separate;border-spacing:3px;font-family:var(--mono);font-size:.92rem;margin:6px 0}
table.cyk th.lab{font-weight:600;color:var(--muted);padding:0 8px;text-align:right}
table.cyk td.cc{border:1.5px solid var(--ink);border-radius:6px;text-align:center;padding:4px 8px;min-width:78px;background:var(--surface);vertical-align:top}
table.cyk td.cc .cs{font-weight:600;color:var(--accent)} table.cyk td.cc .cl{font-size:.72rem;color:var(--muted);margin-top:2px}
table.cyk td.cc.top{background:var(--ok-soft);border-color:var(--ok)}
table.cyk td.base{text-align:center;font-weight:600;color:var(--term);font-size:1.05rem;padding-top:4px}
table.cyk td.pad{padding:0}
.paper{border:1.5px solid var(--line);border-radius:8px;padding:6px 16px;background:var(--surface);margin:8px 0}.paper p{margin:9px 0;line-height:1.6}.paper .box{display:inline-block;border:1.5px solid var(--ink);border-radius:3px;padding:1px 9px;margin:2px 0}.paper .pn{color:var(--muted);font-size:.88rem}
.qimg{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.pyq{border-left:3px solid var(--term);background:var(--warn-soft);border-radius:6px;padding:8px 12px;margin:6px 0 10px;font-size:.95rem;white-space:pre-line}
.steps>li,.practice>li{min-width:0;overflow-wrap:anywhere}
.steps>li .scroll,.card .scroll{max-width:100%}
.card,.w,.callout{min-width:0;max-width:100%}
code{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="shell">
  <nav id="side" aria-label="Chunks"></nav>
  <main id="main"></main>
</div>
<div class="scrim" onclick="document.body.classList.remove('open')"></div>

<script>

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var NS='http://www.w3.org/2000/svg';

/* ---------- parse trees ---------- */
function parseTree(src){
  var toks=src.match(/[^\s\[\]]+|[\[\]]/g),i=0;
  function node(){
    var s=toks[i++],n={s:s,k:[]};
    if(toks[i]==='['){i++;while(toks[i]!==']')n.k.push(node());i++}
    if(s==='ε')n.e=true;
    return n;
  }
  return node();
}
function isVarName(s){return /^[A-Z]/.test(s)}
function treeSVG(root,opts){
  opts=opts||{};var x=0,gap=opts.gap||40,dy=52,maxD=0,pad=26;
  (function walk(n,d){
    n.d=d;if(d>maxD)maxD=d;
    if(!n.k.length){n.x=x;x+=gap;return}
    n.k.forEach(function(c){walk(c,d+1)});
    n.x=(n.k[0].x+n.k[n.k.length-1].x)/2;
  })(root,0);
  var W=Math.max(x-gap+pad*2,80),H=(maxD+1)*dy+pad,out='';
  (function draw(n){
    var cx=n.x+pad,cy=n.d*dy+pad;
    n.k.forEach(function(c){
      out+='<line class="tn-l" x1="'+cx+'" y1="'+(cy+14)+'" x2="'+(c.x+pad)+'" y2="'+(c.d*dy+pad-14)+'"/>';
      draw(c);
    });
    var v=n.pend||(isVarName(n.s)&&!n.e);
    if(v) out+='<circle class="tn-v'+(n.pend?' pend':'')+'" cx="'+cx+'" cy="'+cy+'" r="14"/><text class="tn-vt" x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle">'+esc(n.s)+'</text>';
    else out+='<text class="'+(n.e?'tn-e':'tn-t')+'" x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle">'+esc(n.s)+'</text>';
  })(root);
  return '<svg xmlns="'+NS+'" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="parse tree">'+out+'</svg>';
}
function yieldOf(n,out){
  out=out||[];
  if(!n.k.length){if(!n.e&&!n.pend&&!(n.v))out.push(n.s)}
  else n.k.forEach(function(c){yieldOf(c,out)});
  return out;
}
function hydrateTrees(root){
  $$('.tree',root).forEach(function(el){
    var t=parseTree(el.dataset.t);
    el.innerHTML='<div class="scroll">'+treeSVG(t)+'</div>'+(el.dataset.noyield?'':'<div class="log">yield: <b>'+esc(yieldOf(t).join(''))+'</b></div>');
  });
}

/* ---------- derivation stepper ---------- */
function mkDeriv(el){
  var G=JSON.parse(el.dataset.g),start=el.dataset.start||Object.keys(G)[0],goal=(el.dataset.goal||'').replace(/\s/g,'');
  var ops=[],mode='L',selIdx=null;
  function isVar(s){return Object.prototype.hasOwnProperty.call(G,s)}
  function build(){
    var root={s:start,k:[],pend:true,v:true};
    ops.forEach(function(o){
      var pv=pending(root),n=pv[o.i];
      n.pend=false;
      n.k=o.rhs.split(' ').map(function(t){return isVar(t)?{s:t,k:[],pend:true,v:true}:{s:t,k:[],e:t==='ε'}});
    });
    return root;
  }
  function front(n,o){o=o||[];if(n.e)return o;if(!n.k.length){o.push(n);return o}n.k.forEach(function(c){front(c,o)});return o}
  function pending(r){return front(r).filter(function(n){return n.v&&n.pend})}
  function draw(){
    var root=build(),fr=front(root),pv=pending(root);
    if(mode==='L')selIdx=pv.length?0:null; else if(mode==='R')selIdx=pv.length?pv.length-1:null;
    else if(selIdx!==null&&selIdx>=pv.length)selIdx=null;
    var form=fr.map(function(n){return n.s}).join('');
    var h='<div class="row" role="group" aria-label="mode"><span class="mono" style="font-size:.85rem;color:var(--muted)">replace:</span>'+
      [['L','leftmost'],['R','rightmost'],['A','my choice']].map(function(m){return '<button data-mode="'+m[0]+'" class="'+(mode===m[0]?'sel':'')+'">'+m[1]+'</button>'}).join('')+'</div>';
    h+='<div class="form" aria-live="polite">';
    var vi=0;
    fr.forEach(function(n){
      if(n.v&&n.pend){
        var idx=vi++,sel=idx===selIdx;
        var can=mode==='A';
        h+= can ? '<button class="tok var'+(sel?' sel':'')+'" data-pick="'+idx+'">'+esc(n.s)+'</button>' : '<span class="tok var'+(sel?' sel':' dis')+'">'+esc(n.s)+'</span>';
      } else h+='<span class="tok term">'+esc(n.s)+'</span>';
    });
    if(!fr.length)h+='<span class="tok">ε</span>';
    h+='</div>';
    if(pv.length){
      if(selIdx===null) h+='<div class="msg">Click a variable to choose where to apply a rule.</div>';
      else{
        var sym=pv[selIdx].s;
        h+='<div class="row"><span class="mono" style="font-size:.85rem;color:var(--muted)">apply:</span>'+G[sym].map(function(r,ri){return '<button data-rule="'+ri+'" class="mono">'+esc(sym)+' → '+esc(r)+'</button>'}).join('')+'</div>';
      }
    }else{
      h+= goal ? (form===goal?'<div class="msg ok">Done. All terminals, and the yield is <b>'+esc(form)+'</b>, which is the target.</div>':'<div class="msg bad">Done, but the yield is <b>'+esc(form||'ε')+'</b>, not '+esc(goal)+'. Undo and take a different path.</div>')
                    : '<div class="msg ok">Done. The yield is <b>'+esc(form||'ε')+'</b>.</div>';
    }
    var steps=[],cur=start,r2={s:start,k:[],pend:true,v:true};
    var tmp=[];ops.forEach(function(o,i){var sub=ops.slice(0,i+1);
      var rt={s:start,k:[],pend:true,v:true};
      sub.forEach(function(oo){var p=pending(rt)[oo.i];p.pend=false;p.k=oo.rhs.split(' ').map(function(t){return isVar(t)?{s:t,k:[],pend:true,v:true}:{s:t,k:[],e:t==='ε'}})});
      tmp.push('<div>⇒ <b>'+esc(front(rt).map(function(n){return n.s}).join('')||'ε')+'</b>  <span>('+esc(o.lhs)+' → '+esc(o.rhs)+')</span></div>');
    });
    h+='<div class="log"><div>'+esc(start)+'</div>'+tmp.join('')+'</div>';
    h+='<div class="row"><button data-undo '+(ops.length?'':'disabled')+'>Undo</button><button data-reset '+(ops.length?'':'disabled')+'>Reset</button></div>';
    var left=h;
    el.innerHTML='<div class="split"><div style="flex:1 1 300px">'+left+'</div><div style="flex:1 1 240px"><div class="cap" style="font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:6px">Parse tree so far</div><div class="scroll">'+treeSVG(root)+'</div></div></div>';
    $$('[data-mode]',el).forEach(function(b){b.onclick=function(){mode=b.dataset.mode;if(mode==='A')selIdx=null;draw()}});
    $$('[data-pick]',el).forEach(function(b){b.onclick=function(){selIdx=+b.dataset.pick;draw()}});
    $$('[data-rule]',el).forEach(function(b){b.onclick=function(){
      var sym=pv[selIdx].s,rhs=G[sym][+b.dataset.rule];
      ops.push({i:selIdx,lhs:sym,rhs:rhs});if(mode==='A')selIdx=null;draw();
    }});
    var u=$('[data-undo]',el);if(u)u.onclick=function(){ops.pop();draw()};
    var rs=$('[data-reset]',el);if(rs)rs.onclick=function(){ops=[];selIdx=null;draw()};
  }
  draw();
}

function setStr(S){return S.length?'{'+S.join(',')+'}':'∅'}

function nfaInfo(spec){
  var ids=spec.states.map(function(s){return s.id}),idx={},alpha=[],hasEps=false;
  ids.forEach(function(i,k){idx[i]=k});
  var start=spec.states.filter(function(s){return s.start}).map(function(s){return s.id});

  spec.edges.forEach(function(e){faLabs(e).forEach(function(x){if(x==='ε')hasEps=true;else if(alpha.indexOf(x)<0)alpha.push(x)})});
  alpha.sort();

/* ---------- regular expressions (teacher syntax: + is union, juxtaposition is concatenation, * is star) ---------- */
function reParse(src){
  var s=src.replace(/\s+/g,''),i=0;
  function peek(){return s[i]}
  function union(){var a=cat();while(peek()==='+'||peek()==='|'){i++;var b=cat();a={t:'alt',a:a,b:b}}return a}
  function cat(){var it=[];while(i<s.length&&peek()!==')'&&peek()!=='+'&&peek()!=='|')it.push(star());
    if(!it.length)return {t:'eps'};var a=it[0];for(var k=1;k<it.length;k++)a={t:'cat',a:a,b:it[k]};return a}
  function star(){var a=atom();while(peek()==='*'){i++;a={t:'star',a:a}}return a}
  function atom(){var c=s[i++];
    if(c==='('){var a=union();if(s[i++]!==')')throw new Error('missing )');return a}
    if(c==='ε')return {t:'eps'};
    if(c==='Ø'||c==='∅')return {t:'empty'};
    if(c===undefined||c==='*'||c===')')throw new Error('unexpected '+c);
    return {t:'sym',v:c}}
  var t=union();if(i<s.length)throw new Error('extra text');return t;
}
function reStr(t){
  switch(t.t){
    case 'sym':return t.v;case 'eps':return 'ε';case 'empty':return 'Ø';
    case 'alt':return reStr(t.a)+'+'+reStr(t.b);
    case 'cat':return (t.a.t==='alt'?'('+reStr(t.a)+')':reStr(t.a))+(t.b.t==='alt'?'('+reStr(t.b)+')':reStr(t.b));
    case 'star':return (t.a.t==='sym'||t.a.t==='eps'?reStr(t.a):'('+reStr(t.a)+')')+'*';
  }
}
function reToJS(src){return new RegExp('^(?:'+src.replace(/\s+/g,'').replace(/\+/g,'|').replace(/ε/g,'(?:)').replace(/[Ø∅]/g,'(?!)')+')$')}
function reMatch(src,w){return reToJS(src).test(w)}
function reList(src,alpha,maxLen,cap){
  var re=reToJS(src),out=[],level=[''];cap=cap||24;
  for(var n=0;n<=maxLen&&out.length<cap;n++){
    for(var k=0;k<level.length&&out.length<cap;k++)if(re.test(level[k]))out.push(level[k]);
    var nx=[];level.forEach(function(w){alpha.forEach(function(c){nx.push(w+c)})});level=nx;if(level.length>4096)break;
  }

}

/* ---------- Thompson construction (teacher version with explicit epsilon links) ---------- */
function thompsonTree(tree){

/* ---------- running two machines in parallel (dovetailing) ---------- */
function parRun(A,B,w,maxR){
  maxR=maxR||40;var rows=[];
  for(var r=1;r<=maxR;r++){
    var a=tmRun(A,w,{cap:r,keep:0}),b=tmRun(B,w,{cap:r,keep:0});
    function st(x){return x.halted?(x.accepted?'accepted':'halted, rejected'):'running'}
    rows.push([r,st(a),st(b)]);
    if(a.accepted)return {who:'A',round:r,rows:rows};
    if(b.accepted)return {who:'B',round:r,rows:rows};
    if(a.halted&&b.halted)return {who:null,round:r,rows:rows};
  }

}

/* ---------- Post correspondence problem ---------- */
function pcpSolve(tiles,opt){
  opt=opt||{};var maxD=opt.maxDepth||14,cap=opt.cap||200000,mp=!!opt.mpcp,seen={},q=[],n=0;
  function key(t,b){return t.length>=b.length?'T'+t.slice(b.length):'B'+b.slice(t.length)}

    if(!(t.startsWith(b)||b.startsWith(t)))return;
    var k=key(t,b)+'|'+(seq.length<=maxD?'':'x');
    if(seen[k]!==undefined&&seen[k]<=seq.length)return;
    seen[k]=seq.length;q.push({seq:seq,t:t,b:b});
  }
  if(mp)push([0],tiles[0][0],tiles[0][1]);else tiles.forEach(function(x,i){push([i],x[0],x[1])});
  for(var h=0;h<q.length&&n++<cap;h++){
    var c=q[h];if(c.t===c.b&&c.seq.length)return {seq:c.seq,top:c.t,bottom:c.b};
    if(c.seq.length>=maxD)continue;
    tiles.forEach(function(x,i){push(c.seq.concat([i]),c.t+x[0],c.b+x[1])});
  }
  return null;
}

var CLS=[
 {g:'S → aS | bA\nA → bA | ε',a:3,why:'Every left side is one variable, and every right side is terminals followed by at most one variable at the END (aS, bA, ε). That is right-linear, so Type 3. Language: aⁿ b⁺, i.e. any number of a, then one or more b.'},
 {g:'S → aSb | ab',a:2,why:'One variable on the left, so context-free. But the variable sits in the MIDDLE (aSb), so it is not linear, so not Type 3. Type 2. Language: aⁿbⁿ, n ≥ 1.'},
 {g:'S → aSBC | aBC\nCB → BC\naB → ab\nbB → bb\nbC → bc\ncC → cc',a:1,why:'Rules like CB → BC have two symbols on the left, so it is not context-free. But no rule shrinks (|left| ≤ |right| everywhere), so Type 1. Language: aⁿbⁿcⁿ, n ≥ 1.'},

var ANS_Q22A='<div class="paper"><p><b>Theorem.</b> If L₁ and L₂ are regular languages, then L₁ ∪ L₂, L₁ ∩ L₂ and Lᴿ are regular.</p><p><b>Proof.</b> L₁ and L₂ are regular, so there are DFAs M₁ = (Q₁, Σ, δ₁, q₁, F₁) and M₂ = (Q₂, Σ, δ₂, q₂, F₂) with L(M₁) = L₁ and L(M₂) = L₂.</p><p><b>(i) Union.</b> Construct an ε-NFA M: add a <b>new start state s</b> with ε-arrows s → q₁ and s → q₂, and a <b>new final state f</b> with an ε-arrow from every state of F₁ and of F₂ to f. The old final states stop being final.</p><p>If w ∈ L₁ then s —ε→ q₁ —w→ (a state of F₁) —ε→ f, so M accepts w; likewise for w ∈ L₂. Conversely, an accepting path of M starts with s → q₁ or s → q₂, stays inside that one machine and leaves through its final state, so w ∈ L₁ or w ∈ L₂. Hence <span class="box">L(M) = L₁ ∪ L₂</span>. An ε-NFA accepts only regular languages, so L₁ ∪ L₂ is regular.</p><p><b>(ii) Intersection (product construction).</b> M = (Q₁ × Q₂, Σ, δ, (q₁, q₂), F₁ × F₂) where δ((p, q), a) = (δ₁(p, a), δ₂(q, a)).</p><p><i>Claim:</i> δ̂((p, q), w) = (δ̂₁(p, w), δ̂₂(q, w)) for every string w. Basis w = ε: both sides are (p, q). Step w = xa: δ̂((p, q), xa) = δ((δ̂₁(p, x), δ̂₂(q, x)), a) = (δ̂₁(p, xa), δ̂₂(q, xa)).</p><p>So M accepts w ⇔ δ̂₁(q₁, w) ∈ F₁ and δ̂₂(q₂, w) ∈ F₂ ⇔ w ∈ L₁ ∩ L₂. M is a DFA, so <span class="box">L₁ ∩ L₂ is regular</span>.</p><p><b>(iii) Reverse.</b> Take an NFA M for L. Build M′: reverse the direction of every arrow; the old start state becomes the only final state; add a new start state with ε-arrows to every old final state.</p><p>A path q₀ —a₁→ … —aₙ→ q_f exists in M exactly when the path q_f —aₙ→ … —a₁→ q₀ exists in M′. So M′ accepts aₙ…a₁ ⇔ M accepts a₁…aₙ, i.e. <span class="box">L(M′) = Lᴿ</span>, which is regular. ∎</p><p class="pn">Draw the three pictures: union (new start s, new final f), product (states are pairs), reverse (arrows flipped). The construction with its picture and the correctness line is about 2 marks for each part.</p></div>';
var ANS_CFLCL='<div class="paper"><p><b>Theorem.</b> The context-free languages are closed under union, concatenation and star.</p><p><b>Proof.</b> Let G₁ = (V₁, T, P₁, S₁) and G₂ = (V₂, T, P₂, S₂) be context-free grammars with L(G₁) = L₁ and L(G₂) = L₂. Rename variables so that V₁ ∩ V₂ = ∅, and let S be a new variable not in V₁ ∪ V₂.</p><p><b>(i) Union.</b> G = (V₁ ∪ V₂ ∪ {S}, T, P₁ ∪ P₂ ∪ {S → S₁ | S₂}, S). Every derivation from S begins S ⇒ S₁ or S ⇒ S₂. After that only variables of one grammar occur, so S ⇒* w exactly when S₁ ⇒* w in G₁ or S₂ ⇒* w in G₂. Hence <span class="box">L(G) = L₁ ∪ L₂</span>.</p><p><b>(ii) Concatenation.</b> G = (V₁ ∪ V₂ ∪ {S}, T, P₁ ∪ P₂ ∪ {S → S₁S₂}, S). Every derivation starts S ⇒ S₁S₂. The two parts are rewritten independently (the variables are disjoint), so S ⇒* xy exactly when S₁ ⇒* x and S₂ ⇒* y. Hence <span class="box">L(G) = L₁L₂</span>.</p><p><b>(iii) Star.</b> G = (V₁ ∪ {S}, T, P₁ ∪ {S → SS₁ | ε}, S). Then S ⇒ SS₁ ⇒ SS₁S₁ ⇒ … ⇒ SS₁ᵏ⁻¹… ⇒ S₁ᵏ using S → ε at the end, and S₁ᵏ derives every string x₁x₂…xₖ with each xᵢ ∈ L₁ (k = 0 gives ε). Every derivation has this form. Hence <span class="box">L(G) = L₁*</span>.</p><p>In each case G has only rules of the form (variable) → (string), so G is context-free and the new language is context-free. ∎</p><p class="pn">For the 2-mark IA2 2c question write only the union part (i), with the sentence "S ⇒ S₁ or S ⇒ S₂".</p></div>';
var ANS_IA2C='<div class="paper"><p>Let G₁ = (V₁, T, P₁, S₁) and G₂ = (V₂, T, P₂, S₂) generate L₁ and L₂, with V₁ ∩ V₂ = ∅. Take a new start symbol S and G = (V₁ ∪ V₂ ∪ {S}, T, P₁ ∪ P₂ ∪ {S → S₁ | S₂}, S).</p><p>Every derivation begins S ⇒ S₁ (then it is a derivation of G₁) or S ⇒ S₂ (a derivation of G₂), so <span class="box">L(G) = L₁ ∪ L₂</span>. G is context-free, so L₁ ∪ L₂ is context-free. ∎</p></div>';
var ANS_Q24A='<div class="paper"><p><b>To prove.</b> If L and its complement L̄ are both recursively enumerable, then L (and L̄) is recursive.</p><p><b>Proof.</b></p><p>1. L is RE, so some TM M₁ accepts L: it halts in a final state for every w ∈ L, and may loop for w ∉ L. L̄ is RE, so some TM M₂ accepts L̄ in the same way.</p><p>2. Construct a two-tape TM M. On input w, copy w to both tapes. Simulate M₁ on tape 1 and M₂ on tape 2 <b>alternately, one step each</b>.</p><p>3. Every string w is in exactly one of L and L̄. If w ∈ L, then M₁ accepts after finitely many steps (and M₂ never accepts). If w ∈ L̄, then M₂ accepts after finitely many steps.</p><p>4. So after finitely many steps exactly one of the two simulations accepts. If M₁ accepts, M <b>accepts</b>. If M₂ accepts, M <b>rejects</b>.</p><p>5. M halts on every input, and it accepts exactly the strings of L. So <span class="box">L is recursive</span>. L̄ is recursive too (swap accept and reject in M). ∎</p><p class="pn">Why run both in parallel: running M₁ first and then M₂ fails, because M₁ may loop on w ∈ L̄ and M₂ would never get its turn. Consequence: L_u is RE but not recursive, so the complement of L_u is not RE.</p></div>';
var ANS_Q16='<div class="paper"><p><b>To prove.</b> The RE languages are closed under union.</p><p>Let M₁ accept L₁ and M₂ accept L₂ (each halts and accepts the strings of its language and may loop on the others). Construct M with two tapes: on input w, copy w to both tapes and simulate M₁ and M₂ <b>alternately, one step each</b>. M accepts as soon as either simulation accepts.</p><p>If w ∈ L₁ ∪ L₂, then w is in L₁ or L₂, so one simulation accepts after finitely many steps and M accepts. If w is in neither, no simulation accepts, so M does not accept. Hence <span class="box">L(M) = L₁ ∪ L₂</span> and L₁ ∪ L₂ is RE. ∎</p><p class="pn">Do not run M₁ first and then M₂: M₁ may loop on w while M₂ would accept it.</p></div>';
var ANS_REC='<div class="paper"><p><b>(i) Recursive language (Turing-decidable).</b> A language L is recursive if there is a Turing machine M that accepts L and <b>halts on every input</b>:</p><p>if w ∈ L, M halts in a final state (accepts); if w ∉ L, M halts in a non-final state (rejects). M never loops, so it is an algorithm that decides membership. Example: L = { aⁿbⁿcⁿ | n ≥ 1 } is recursive, because a TM can check the form and always stops. Recursive languages are closed under union, intersection, concatenation, star and <b>complement</b> (swap accept and reject).</p><p><b>(ii) Recursively enumerable language (Turing-recognizable, semi-decidable).</b> A language L is RE if there is a TM M that halts in a final state for every w ∈ L; for w ∉ L it may halt in a non-final state <b>or loop forever</b>. RE languages are exactly the languages generated by type-0 (unrestricted) grammars. Example: L_u = { ⟨M, w⟩ | M accepts w }. RE languages are closed under union, intersection, concatenation and star, but <b>not under complement</b>.</p><p><b>Comparison.</b></p><p>On w ∈ L: recursive (accept), RE (accept). On w ∉ L: recursive (reject), RE (reject <i>or loop</i>).</p><p>Every recursive language is RE; the converse is false (L_u is RE but not recursive). So <span class="box">Regular ⊂ CFL ⊂ CSL ⊂ Recursive ⊂ RE ⊂ all languages</span>, and L is recursive ⇔ both L and L̄ are RE.</p><p class="pn">Draw the nested-circles picture of the classes above; it is worth a mark.</p></div>';
var ANS_Q23='<div class="paper"><p><b>Standard TM.</b> M = (Q, Σ, Γ, δ, q₀, B, F) with δ : Q × Γ → Q × Γ × {L, R}: one tape, infinite in both directions, one head, deterministic. Each variant below changes one feature, but <b>every variant can be simulated by a standard TM, so none is more powerful</b>: all accept exactly the recursively enumerable languages.</p><p><b>1. Stay option.</b> δ : Q × Γ → Q × Γ × {L, R, <b>S</b>}; the head may stay on the cell. <i>Simulation:</i> replace δ(q, a) = (p, b, S) by δ(q, a) = (r, b, R) and δ(r, Z) = (p, Z, L) for every Z, with r a new state. Same power. <i>Diagram:</i> a transition arrow labelled a/b, S.</p><p><b>2. Semi-infinite tape.</b> The tape has a left end (end marker) but no right end. <i>Simulation:</i> fold the two-way tape at the start cell into <b>two tracks</b>: the upper track holds the cells to the right, the lower track the cells to the left in reverse order. Each state q is doubled into q_U and q_L, and the move directions are swapped on the lower track. Same power. <i>Diagram:</i> the tape folded into two tracks.</p><p><b>3. Multi-track TM.</b> One tape and one head, but each cell holds a k-tuple: δ(q, [a₁, …, aₖ]) = (p, [b₁, …, bₖ], D). <i>Simulation:</i> it is just a standard TM whose tape alphabet is Γᵏ. Same power. <i>Diagram:</i> one head over a stack of k tracks.</p><p><b>4. Multitape TM.</b> k tapes and k independent heads; δ : Q × Γᵏ → Q × (Γ × {L, R, S})ᵏ. The input is on tape 1, the others are blank. <i>Simulation:</i> one tape with 2k tracks: a track for the contents of each tape and a track with a marker ↑ under the head position of each tape. To simulate one move, sweep over the tape to read the k scanned symbols, then sweep back writing the new symbols, moving the markers and changing state. A computation of t steps takes O(t²) steps. Same power, slower. <i>Diagram:</i> two tapes with heads, and the same on one tape with 4 tracks.</p><p><b>5. Offline TM.</b> The input is on a read-only input tape and a separate work tape is used. <i>Simulation:</i> copy the input onto the work tape and continue as a standard TM. Same power.</p><p><b>6. Multidimensional TM.</b> The tape is a grid, moves are L, R, U, D. <i>Simulation:</i> write the rows one after another on one tape separated by markers; an up or down move jumps by one row length. Same power.</p><p><b>7. Non-deterministic TM.</b> δ : Q × Γ → P(Q × Γ × {L, R}): several moves are possible for (q, a). The computation is a <b>tree</b> of configurations; the input is accepted if some branch reaches a final state. <i>Simulation:</i> a deterministic TM with <b>three tapes</b>: tape 1 holds the input (never changed), tape 2 is a work tape on which one path is simulated, tape 3 lists the choices (an address such as 1, 2, 11, 12, … generated in shortlex order). It tries the paths <b>breadth first</b>, so a path that accepts is eventually found even if another branch is infinite. Same languages, but exponentially slower. <i>Diagram:</i> the computation tree.</p><p><b>Comparison.</b></p><p>Stay, semi-infinite, multi-track, multitape, offline, multidimensional and non-deterministic TMs: <span class="box">all accept exactly the RE languages</span>. They differ only in convenience and speed (multitape: quadratic slowdown, non-deterministic: exponential).</p><p><b>Conclusion.</b> Every reasonable extension of the Turing machine adds convenience, not power. This supports the <b>Church–Turing thesis</b>: whatever can be computed can be computed by a standard Turing machine.</p></div>';
var ANS_UTM='<div class="paper"><p><b>Definition.</b> A Universal Turing Machine (UTM) is a TM that, given the description of any TM M and an input w, simulates the computation of M on w. It halts exactly when M halts on w and accepts exactly when M accepts w. It is the model of a stored-program computer: the program (the code of M) is part of the input.</p><p><b>Encoding of M (your teacher&rsquo;s scheme).</b> Assume M has start state q₁ and one final state q₂. Write q₁ = 1, q₂ = 11, and in general qᵢ = 1ⁱ. Write the tape symbols σⱼ = 1ʲ (the blank is 1). Write the head moves L = 1 and R = 11. The symbol 0 separates the 1s.</p><p>The transition δ(qᵢ, σⱼ) = (qₖ, σₗ, D) is written 1ⁱ 0 1ʲ 0 1ᵏ 0 1ˡ 0 1ᴰ. The machine is the list of its transitions separated by 00. The machine and the input w (encoded the same way) are separated by 000.</p><p><b>Working (three tapes).</b></p><p>1. Tape 1 holds the encoding of M and never changes. Tape 2 holds the tape contents of M (the encoded w at the start). Tape 3 holds the current state of M (as 1ᵏ).</p><p>2. Look at tape 3 (the state) and at the symbol under the head on tape 2: this is the current ID of M.</p><p>3. Search tape 1 for the transition whose first two fields equal this (state, symbol).</p><p>4. Update tape 2 (write the new symbol, move the head) and tape 3 (the new state).</p><p>5. Repeat. If tape 1 has no matching transition, M halts, so the UTM halts. If tape 3 then holds 11 (the final state), the UTM accepts.</p><p>So the UTM accepts ⟨M, w⟩ exactly when M accepts w. This shows <span class="box">L_u = { ⟨M, w⟩ | M accepts w } is recursively enumerable</span>, and it is the machine used in the halting-problem proof.</p><p class="pn">Draw: three tapes with one finite control, labelled tape 1 (M), tape 2 (tape of M), tape 3 (state of M).</p></div>';
var ANS_Q21B='<div class="paper"><p><b>Integers on the tape.</b> A non-negative integer i is written in <b>unary</b> as 1ⁱ. A tuple (i₁, …, iₖ) is written 1ⁱ¹ 0 1ⁱ² 0 … 0 1ⁱᵏ, with a 0 separating the arguments.</p><p><b>Computing a function.</b> A TM M <b>computes</b> f(i₁, …, iₖ) = m if, started in q₀ with the head on the first symbol of that string and the rest of the tape blank, it halts with 1ᵐ on the tape. If f is defined for all arguments, M halts on all of them (a total function); if f is a partial function, M need not halt where f is undefined. A function is <b>Turing-computable</b> if some TM computes it; these are exactly the partial recursive functions.</p><p><b>Example: addition m + n.</b> Input 1ᵐ 0 1ⁿ, output 1ᵐ⁺ⁿ. Replace the 0 by a 1, go to the end of the 1s and erase the last 1.</p><p>δ(q₀, 1) = (q₀, 1, R) &nbsp; δ(q₀, 0) = (q₁, 1, R) &nbsp; δ(q₁, 1) = (q₁, 1, R) &nbsp; δ(q₁, B) = (q₂, B, L) &nbsp; δ(q₂, 1) = (q₃, B, R), with q₃ final.</p><p>For 11 0 11: after q₀ passes 11 it replaces 0 by 1 giving 11111, q₁ runs to the blank, q₂ erases the last 1: <span class="box">1111 = 4 = 2 + 2</span>.</p><p class="pn">Other examples: proper subtraction m ∸ n, doubling, n + 2 (see the machines below).</p></div>';
var ANS_Q11='<div class="paper"><p><b>Chomsky hierarchy.</b> Each class contains the one below it: <span class="box">Type 3 ⊂ Type 2 ⊂ Type 1 ⊂ Type 0</span>.</p>'+TBL(['Type','Grammar','Rule form','Language','Machine','Example'],[['3','Regular','A → aB or A → a (right-linear)','Regular','Finite automaton','(a+b)*ab'],['2','Context-free','A → α (one variable on the left)','CFL','Pushdown automaton','aⁿbⁿ'],['1','Context-sensitive','α → β with |α| ≤ |β|','CSL','Linear bounded automaton','aⁿbⁿcⁿ'],['0','Unrestricted','α → β, α contains a variable','RE','Turing machine','L_u']])+'<p>Going up, the grammar rules become less restricted and the machine becomes more powerful (more memory: none, a stack, tape of input length, unbounded tape).</p></div>';
var C11='<p>TOC studies machines that read text and say yes or no. This chunk gives exact words for "text". Nothing else is assumed.</p>'+
'<h2>The vocabulary</h2><div class="scroll"><table class="tbl"><tr><th>Term</th><th>Meaning</th><th>Example</th></tr>'+
'<tr><td>Alphabet <b>Σ</b></td><td>a finite, non-empty set of symbols</td><td><code>{0,1}</code>, <code>{a,b}</code></td></tr>'+
'<tr><td>String</td><td>a finite sequence of symbols from Σ. |w| is its length</td><td>|abba| = 4</td></tr>'+
'<tr><td><b>ε</b></td><td>the empty string, length 0. εw = wε = w</td><td>|ε| = 0</td></tr>'+
'<tr><td>wⁿ</td><td>w written n times, w⁰ = ε</td><td>(ab)² = abab</td></tr>'+
'<tr><td>Σᵏ</td><td>all strings of length exactly k, and |Σᵏ| = |Σ|ᵏ</td><td>{a,b}: Σ² = {aa,ab,ba,bb}</td></tr>'+
'<tr><td>Σ*</td><td>all strings of any length, including ε. Infinite</td><td>Σ⁰∪Σ¹∪Σ²∪…</td></tr>'+
'<tr><td>Σ⁺</td><td>Σ* without ε</td><td>Σ* − {ε}</td></tr>'+
'<tr><td>Language</td><td>any set of strings over Σ, i.e. any subset of Σ*</td><td>strings ending in 01</td></tr></table></div>'+
'<div class="w"><div class="cap">Try it: strings of length k</div><div id="sigma"></div></div>'+
'<h2>ε vs ∅ vs {ε}</h2><div class="scroll"><table class="tbl"><tr><th></th><th>What it is</th><th>Strings inside</th></tr>'+
'<tr><td><b>ε</b></td><td>one string, the empty one</td><td>it is a string</td></tr>'+
'<tr><td><b>∅</b></td><td>a language with no strings (an empty box)</td><td>0</td></tr>'+
'<tr><td><b>{ε}</b></td><td>a language whose only string is ε (a box holding a blank page)</td><td>1</td></tr></table></div>'+
'<h2>Operations on languages</h2><ul><li><b>Union, intersection</b>: strings in either, strings in both.</li>'+
'<li><b>Concatenation</b> L₁L₂ = {xy : x∈L₁, y∈L₂}. {a,b}{c,d} = {ac,ad,bc,bd}.</li>'+
'<li><b>Star</b> L* = zero or more strings of L glued together. <b>Plus</b> L⁺ = one or more.</li>'+
'<li><b>Reverse</b> Lᴿ, <b>complement</b> L̅ = Σ* − L.</li></ul>'+
'<div class="callout"><b>Fact:</b> ε ∈ L* always (L⁰ = {ε}). ε ∈ L⁺ only if ε ∈ L already.</div>'+
'<h2>Prefix, suffix, substring</h2><p>For <code>abba</code>: prefixes ε, a, ab, abb, abba. Suffixes ε, a, ba, bba, abba. Substrings include <code>bb</code>. "Ends with 01" means 01 is a suffix. "Starts with 1" means 1 is a prefix.</p>'+

var C12='<p>A <b>grammar</b> is a set of rewriting rules that <i>generates</i> the strings of a language. A machine accepts strings; a grammar produces them.</p>'+
'<h2>The four parts: G = (V, T, P, S)</h2><div class="scroll"><table class="tbl"><tr><th></th><th>Name</th><th>Meaning</th><th>Example</th></tr>'+
'<tr><td><b>V</b></td><td>variables</td><td>placeholders that get replaced, written in capitals</td><td><span class="v">S, A, B</span></td></tr>'+
'<tr><td><b>T</b></td><td>terminals</td><td>the real symbols, never replaced</td><td><span class="t">a, b, 0, 1</span></td></tr>'+
'<tr><td><b>P</b></td><td>productions</td><td>rewriting rules <code>A → α</code>. The bar <code>|</code> means "or"</td><td class="g">S → aSb | ε</td></tr>'+
'<tr><td><b>S</b></td><td>start symbol</td><td>where every derivation begins</td><td><span class="v">S</span></td></tr></table></div>'+
'<h2>Derivation</h2><p><b>⇒</b> is one step, <b>⇒*</b> is zero or more. A string that still has variables is a <i>sentential form</i>; one with only terminals is a <i>sentence</i>. The language is <code>L(G) = { w ∈ T* : S ⇒* w }</code>.</p>'+
'<h2>Leftmost and rightmost</h2><p>With several variables in the string you must choose one. <b>Leftmost derivation (LMD)</b> always replaces the leftmost variable. <b>Rightmost (RMD)</b> always the rightmost.</p>'+
'<h2>Parse tree</h2><p>Root = <span class="v">S</span>. Each internal node is a variable, and its children (left to right) are the right side of the rule used. Leaves are terminals or ε. The <b>yield</b> is the leaves read left to right. A tree records <i>which rules</i> were used, not the order.</p>'+
'<div class="callout ok">Play with the steppers. Switch between leftmost and rightmost on the second one: the steps change order, the tree does not.</div>'+
'<h2>Solved models</h2>'+
'<div class="card model"><h3>1. Derive a string <span class="src">IA2 2d</span><span class="src">Supp Q5</span></h3><p>Grammar <span class="g">S → aSb | ε</span>. Derive <code>aabb</code>: <span class="g">S ⇒ aSb ⇒ aaSbb ⇒ aabb</span>. Language: aⁿbⁿ, n ≥ 0.</p></div>'+
DER('{"S":["a S b","ε"]}','aabb','Stepper: S → aSb | ε, target aabb')+
'<div class="card model"><h3>2. Two variables: LMD vs RMD</h3><p>Grammar <span class="g">S → AB, A → aA | a, B → bB | b</span>, string <code>aabb</code>.</p><p><b>LMD:</b> <span class="g">S ⇒ AB ⇒ aAB ⇒ aaB ⇒ aabB ⇒ aabb</span><br><b>RMD:</b> <span class="g">S ⇒ AB ⇒ AbB ⇒ Abb ⇒ aAbb ⇒ aabb</span></p><p>Same five rules, different order, same tree. Language a⁺b⁺.</p></div>'+
DER('{"S":["A B"],"A":["a A","a"],"B":["b B","b"]}','aabb','Stepper: try leftmost, then reset and try rightmost')+

'<div class="card model"><h3>4. Read the yield of a tree <span class="src">IA2 2a</span></h3><p>Read the leaves left to right. Do not read the variables.</p></div>'+
TR('S[A[a A[a]] c B[b]]','Yield of this tree')+
'<h2>Practice</h2><ol class="practice">'+
P('<span class="src">IA2 2d</span>Derive <b>aaabbb</b> from <span class="g">S → aSb | ε</span>, showing every step.','<span class="g">S ⇒ aSb ⇒ aaSbb ⇒ aaaSbbb ⇒ aaabbb</span>')+
P('<span class="src">Supp Q5</span>Derive <b>000111</b> from <span class="g">S → 0S1 | ε</span>.','<span class="g">S ⇒ 0S1 ⇒ 00S11 ⇒ 000S111 ⇒ 000111</span>')+

P('<span class="src">IA2 2a</span>Yield of the tree: S has children (S, a, B). That S has children (S, a, B), and its inner S has one child, c. Both B nodes have children (a, b).','Leaves left to right: <code>c</code>, then <code>a a b</code>, then <code>a</code>, then <code>a b</code>. Yield = <b>caabaab</b>.')+
P('Grammar <span class="g">S → AB, A → aA | a, B → bB | b</span>. LMD and RMD of <b>aaabb</b>, and the tree.','<b>LMD:</b> <span class="g">S ⇒ AB ⇒ aAB ⇒ aaAB ⇒ aaaB ⇒ aaabB ⇒ aaabb</span><br><b>RMD:</b> <span class="g">S ⇒ AB ⇒ AbB ⇒ Abb ⇒ aAbb ⇒ aaAbb ⇒ aaabb</span><br>Tree: S → A B; A → a A, twice, then A → a; B → b B then B → b.')+

'</ol>';

var C13='<p>Now you get a language and must write the grammar. Questions Q1–Q3 of the question bank are built on this.</p>'+
'<h2>The method</h2><div class="card"><p><b>Rule 1. Dependent counts get nested.</b> If the number of b\'s depends on the number of a\'s, use a rule that adds both at once around the middle: <span class="g">S → aSb</span>. The counts can never drift apart.</p><p><b>Rule 2. Independent parts get their own variable</b> and are joined: <span class="g">S → AB, A → aA | a, B → bB | b</span> gives a⁺b⁺.</p><p><b>Rule 3. Always add a stopping rule</b> (<span class="g">S → ab</span> or <span class="g">S → ε</span>).</p><p><b>Test it:</b> derive n=1 and n=2. If both are right and nothing else appears, you are almost certainly right.</p></div>'+
'<h2>Solved models</h2>'+
'<div class="card model"><h3>1. L = { aⁿb²ⁿ : n ≥ 1 } <span class="src">QB Q1</span></h3><p>Each a needs two b\'s: <span class="g">S → aSbb | abb</span>. Derive <code>aabbbb</code>: <span class="g">S ⇒ aSbb ⇒ aabbbb</span>. One variable per step, so LMD = RMD.</p></div>'+
DER('{"S":["a S b b","a b b"]}','aabbbb','Stepper: aabbbb')+
'<div class="card model"><h3>2. Even palindromes over {0,1} <span class="src">QB Q2</span></h3><p>Match the outer pair, then the next pair inward: <span class="g">S → 0S0 | 1S1 | ε</span>. For odd palindromes add <span class="g">| 0 | 1</span>.</p><p><b>Is it regular?</b> No. A finite machine would have to remember the entire first half, which can be any length. The proof is the pumping lemma, chunk 2.10.</p></div>'+
DER('{"S":["0 S 0","1 S 1","ε"]}','011110','Stepper: 011110')+
'<div class="card model"><h3>3. L = { aⁿbᵐcⁿ : n ≥ 1, m ≥ 0 } <span class="src">QB Q3</span></h3><p>a and c depend on each other (nest). The b\'s in the middle are independent (own variable): <span class="g">S → aSc | aBc, B → bB | ε</span>.</p></div>'+
DER('{"S":["a S c","a B c"],"B":["b B","ε"]}','aabcc','Stepper: aabcc')+
'<div class="card model"><h3>4. L = { aⁿbᵐcⁿ⁺ᵐ : n, m ≥ 1 } <span class="src">Nov25 Q20a language</span></h3><p>cⁿ⁺ᵐ = cᵐcⁿ, so the shape is aⁿ [ bᵐcᵐ ] cⁿ, which is nesting inside nesting: <span class="g">S → aSc | aBc, B → bBc | bc</span>. You will build the PDA for this language in Module 4.</p></div>'+
DER('{"S":["a S c","a B c"],"B":["b B c","b c"]}','aabccc','Stepper: aabccc (n=2, m=1, so 3 c\'s)')+
'<h2>Practice</h2><ol class="practice">'+
P('L = { a²ⁿbⁿ : n ≥ 1 }. Grammar, then derive <b>aaaabb</b>.','<span class="g">S → aaSb | aab</span>. <span class="g">S ⇒ aaSb ⇒ aaaabb</span>.')+
P('<span class="src">QB Q20</span>L = { aⁿbᵐcᵐdⁿ : n, m ≥ 1 }. Grammar, then derive <b>aabcdd</b>.','<span class="g">S → aSd | aBd, B → bBc | bc</span>. <span class="g">S ⇒ aSd ⇒ aaBdd ⇒ aabcdd</span>.')+
P('<span class="src">Class assignment</span>Strings over {0,1} that start with 1 and end with 0. Write a grammar.','<span class="g">S → 1A, A → 0A | 1A | 0</span>. Smallest string: S ⇒ 1A ⇒ 10.')+
'</ol>';

var C14='<h2>Definition</h2><p>A grammar is <b>ambiguous</b> if at least one string it generates has <b>two or more different parse trees</b>. Equivalent: two different leftmost derivations, or two different rightmost derivations.</p>'+
'<div class="callout"><b>Common trap:</b> an LMD and an RMD of the <i>same tree</i> are not ambiguity. You need two different <i>trees</i>.</div>'+
'<p><b>Why it matters:</b> a tree is the meaning. For 2+3*4, one tree gives 2+(3·4)=14 and another gives (2+3)·4=20.</p>'+
'<h2>How to prove ambiguity</h2><ol><li>Pick one short string the grammar generates.</li><li>Show two different parse trees (or two different LMDs).</li><li>Conclude: "two distinct trees for the same string, so the grammar is ambiguous."</li></ol>'+
'<p>Ambiguity belongs to the grammar, not the language. The same language can have an ambiguous and an unambiguous grammar. (Some languages are <i>inherently ambiguous</i>: every grammar for them is. Know the term.)</p>'+
'<h2>Solved models</h2>'+
'<div class="card model"><h3>1. The aab grammar <span class="src">Nov25 Q13</span><span class="src">Supp Q13</span></h3><p>The same question in both papers. <span class="g">S → AB | aaB, A → a | aA, B → b</span>, string <code>aab</code>.</p><p><b>Tree 1:</b> <span class="g">S ⇒ AB ⇒ aAB ⇒ aaB ⇒ aab</span><br><b>Tree 2:</b> <span class="g">S ⇒ aaB ⇒ aab</span></p></div>'+
'<div class="split"><div style="flex:1 1 220px">'+TR('S[A[a A[a]] B[b]]','Tree 1: S → AB')+'</div><div style="flex:1 1 220px">'+TR('S[a a B[b]]','Tree 2: S → aaB')+'</div></div>'+
'<div class="card model"><h3>2. The expression grammar <span class="src">QB Q4</span><span class="src">Remedial 1</span></h3><p><span class="g">E → E+E | E*E | id</span>, string <code>id+id*id</code>. Start with E → E+E for one tree, E → E*E for the other.</p></div>'+
'<div class="split"><div style="flex:1 1 280px">'+TR('E[E[id] + E[E[id] * E[id]]]','Tree A: + at the root, id + (id*id)')+'</div><div style="flex:1 1 280px">'+TR('E[E[E[id] + E[id]] * E[id]]','Tree B: * at the root, (id+id) * id')+'</div></div>'+
DER('{"E":["E + E","E * E","id"]}','id+id*id','Try it: build id+id*id twice with a different first rule')+
'<div class="card model"><h3>3. Remove the ambiguity <span class="src">QB Q4b</span></h3><p>One variable per priority level: E for sums, T for products, F for the smallest units.</p><div class="gbox">E → E + T | T\nT → T * F | F\nF → ( E ) | id</div><p>A <code>+</code> can only be created at the E level, above the T level where <code>*</code> lives. So a product is always finished before a sum can use it: <code>*</code> binds tighter. <code>E → E+T</code> is left-recursive, so a+b+c groups as (a+b)+c.</p></div>'+
DER('{"E":["E + T","T"],"T":["T * F","F"],"F":["( E )","id"]}','id+id*id','Try to make a tree with * at the top. You cannot.')+
'<h2>Practice</h2><ol class="practice">'+
P('Define an ambiguous grammar. Is ambiguity a property of the grammar or the language?','A grammar where some string has two or more parse trees (or two LMDs / two RMDs). A property of the <b>grammar</b>: the same language can have an ambiguous and an unambiguous grammar.')+
P('<span class="src">Supp Q12 grammar</span>Show <span class="g">T → T+T | T−T | T*T | b</span> is ambiguous for <b>b−b*b</b>.','Tree A: T → T−T with the right T → T*T, meaning b−(b*b). Tree B: T → T*T with the left T → T−T, meaning (b−b)*b. <br><b>LMD A:</b> <span class="g">T ⇒ T−T ⇒ b−T ⇒ b−T*T ⇒ b−b*T ⇒ b−b*b</span><br><b>LMD B:</b> <span class="g">T ⇒ T*T ⇒ T−T*T ⇒ b−T*T ⇒ b−b*T ⇒ b−b*b</span>')+
P('Show <span class="g">S → aS | Sa | a</span> is ambiguous for <b>aa</b>.','Tree 1: S ⇒ aS ⇒ aa (first a comes from the rule S → aS). Tree 2: S ⇒ Sa ⇒ aa (the first a comes from S → a, the second from S → Sa). Different trees, same string.')+
P('Show <span class="g">S → SS | (S) | ε</span> is ambiguous for <b>()()()</b>.','S → SS can group it as [()] [()()] or as [()()] [()]. Two different trees for the same string.')+
P('<span class="src">QB Q4b</span>Unambiguous grammar for <span class="g">E → E+E | E−E | E*E | E/E | id</span> with * and / above + and −. Unique tree for <b>id−id*id</b>.','<span class="g">E → E+T | E−T | T\nT → T*F | T/F | F\nF → id</span>Derivation: <span class="g">E ⇒ E−T ⇒ T−T ⇒ F−T ⇒ id−T ⇒ id−T*F ⇒ id−F*F ⇒ id−id*F ⇒ id−id*id</span>. The subtraction is at the top, the product is below it.')+
'</ol>';

var C15='<p>Noam Chomsky sorted grammars into four types by how restricted the rules are. Each type matches a kind of machine. This closes Module 1.</p>'+
'<h2>The four types</h2><div class="scroll"><table class="tbl"><tr><th>Type</th><th>Grammar</th><th>Rule form (α → β)</th><th>Language</th><th>Machine</th><th>Example</th></tr>'+
'<tr><td><b>3</b></td><td>Regular</td><td class="g">A → aB | a | ε (right-linear)<br>or A → Ba | a (left-linear)</td><td>regular</td><td>finite automaton (DFA/NFA)</td><td class="g">S → aS | b</td></tr>'+
'<tr><td><b>2</b></td><td>Context-free</td><td class="g">A → α<br>one variable on the left</td><td>context-free (CFL)</td><td>pushdown automaton (PDA)</td><td class="g">S → aSb | ab</td></tr>'+
'<tr><td><b>1</b></td><td>Context-sensitive</td><td class="g">α → β with |α| ≤ |β|<br>(never shrinks)</td><td>context-sensitive (CSL)</td><td>linear bounded automaton (LBA)</td><td>aⁿbⁿcⁿ</td></tr>'+
'<tr><td><b>0</b></td><td>Unrestricted</td><td class="g">α → β<br>α has at least one variable</td><td>recursively enumerable (RE)</td><td>Turing machine</td><td>a^(2ⁿ)</td></tr></table></div>'+
'<div class="w"><div class="cap">Regular ⊂ context-free ⊂ context-sensitive ⊂ recursively enumerable</div><div class="scroll"><svg xmlns="'+NS+'" viewBox="0 0 560 350" width="560" height="350" role="img" aria-label="nested language classes">'+
'<ellipse class="ring" cx="280" cy="180" rx="265" ry="160"/><ellipse class="ring" cx="280" cy="180" rx="220" ry="128"/><ellipse class="ring" cx="280" cy="180" rx="170" ry="96"/><ellipse class="ring" cx="280" cy="180" rx="112" ry="56"/>'+
'<g text-anchor="middle" style="fill:var(--ink);font-size:12px"><text x="280" y="40">Type 0 · RE · Turing machine</text><text x="280" y="72">Type 1 · context-sensitive · LBA</text><text x="280" y="104">Type 2 · context-free · PDA</text><text x="280" y="176" style="font-weight:600">Type 3</text><text x="280" y="194">regular · finite automaton</text></g></svg></div></div>'+
'<p>Every Type 3 grammar is also Type 2, 1 and 0. The inclusions are proper, and each ring has a language that the ring inside it cannot handle:</p>'+
'<div class="scroll"><table class="tbl"><tr><th>Language</th><th>Lives in</th><th>Not in</th></tr><tr><td>strings ending in 01</td><td>regular</td><td>-</td></tr><tr><td>aⁿbⁿ</td><td>context-free</td><td>regular</td></tr><tr><td>aⁿbⁿcⁿ</td><td>context-sensitive</td><td>context-free</td></tr><tr><td>language of a universal TM (Module 6)</td><td>recursively enumerable</td><td>context-sensitive/decidable</td></tr></table></div>'+
'<h2>Definitions you must write in one line</h2><ul>'+
'<li><b>Right-linear grammar</b> <span class="src">Supp Q4</span>: every rule is <code>A → xB</code> or <code>A → x</code>, where A, B are variables and x is a string of terminals. (Left-linear: <code>A → Bx | x</code>.)</li>'+
'<li><b>Unrestricted grammar</b> <span class="src">Supp Q9</span>: rules <code>α → β</code> with α containing at least one variable and no other restriction. Type 0.</li>'+
'<li><b>Linear bounded automaton</b> <span class="src">Supp Q14</span>: a Turing machine whose tape is limited to the cells holding the input (between two end markers). It accepts the context-sensitive languages.</li>'+
'<li>Machine for context-sensitive grammar: <b>LBA</b>. Machine for recursively enumerable languages: <b>Turing machine</b>.</li></ul>'+
'<h2>How to classify a grammar</h2><div class="card"><ol>'+
'<li>Is the left side always <b>one variable</b>? If not, go to step 4.</li>'+
'<li>Yes, so it is at least Type 2. Are all rules <b>right-linear</b> (variable only at the very end) or all <b>left-linear</b> (variable only at the very start)? Then <b>Type 3</b>. Otherwise <b>Type 2</b>.</li>'+
'<li>(Done.)</li>'+
'<li>Does every rule satisfy |left| ≤ |right|? Then <b>Type 1</b>. If any rule shrinks (like <code>AE → ε</code>), it is <b>Type 0</b>.</li></ol>'+
'<p>Always give the <b>most restrictive</b> type that fits, and say why.</p></div>'+
'<div class="w"><div class="cap">Classify the grammar (question bank Q5 and variations)</div><div id="classify"></div></div>'+
'<h2>Solved models</h2>'+
'<div class="card model"><h3>1. Compare the languages of the Chomsky hierarchy <span class="src">Nov25 Q11</span><span class="src">Supp Q11</span></h3><p>Asked in both papers, 3 marks. Write the four-row table above (type, grammar form, language class, machine), then one line: "Regular ⊂ CFL ⊂ CSL ⊂ RE, each strictly larger than the one before."</p></div>'+
'<div class="card model"><h3>2. Classify with justification <span class="src">QB Q5</span></h3><p><b>(i)</b> <span class="g">S → aS | bA, A → bA | ε</span>: Type 3 (right-linear). Language aⁿb⁺.<br><b>(ii)</b> <span class="g">S → aSb | ab</span>: Type 2 (one variable on the left, variable in the middle so not linear). Language aⁿbⁿ, n≥1.<br><b>(iii)</b> The aSBC grammar: Type 1 (CB → BC has two symbols on the left, but no rule shrinks). Language aⁿbⁿcⁿ, n≥1.</p></div>'+
'<h2>Practice</h2><ol class="practice">'+
P('<span class="src">Nov25 Q11</span>Compare the languages described in the Chomsky hierarchy.',ANS_Q11)+
P('<span class="src">Supp Q4, Q8, Q9, Q10</span>Define a right-linear grammar. Name the automaton for context-sensitive grammars. Define an unrestricted grammar. Name a machine that accepts RE languages.','See "Definitions" above: rules A → xB | x; the LBA; rules α → β with α containing a variable; the Turing machine.')+
P('<span class="src">Supp Q14</span>State the concept of a Linear Bounded Automaton.','A Turing machine that may not use tape beyond the input (tape length is linear in the input). It accepts exactly the context-sensitive languages.')+
P('<span class="src">QB Q5(iv)</span>Classify <span class="g">S → ACaB, Ca → aaC, CB → DB | E, aD → Da, AD → AC, aE → Ea, AE → ε</span> and describe the language.','Type 0, because <span class="g">AE → ε</span> shrinks (2 symbols on the left, 0 on the right). The language is { a^(2ⁿ) : n ≥ 1 }: each pass of C across the a\'s doubles them, and E ends the process.')+
P('Classify <span class="g">S → Sa | b</span> and <span class="g">S → aSb | ε</span>.','<span class="g">S → Sa | b</span>: left-linear, Type 3 (language ba*). <span class="g">S → aSb | ε</span>: Type 2 (variable in the middle). Language aⁿbⁿ, n≥0.')+
'</ol>';

var C21=[
'<p>Module 2 is the biggest module in the exam (36 of the 124 offered marks in Nov 2025). It starts here, with the simplest machine there is.</p>',

'<h2>What a finite automaton is</h2>',
'<p>A <b>finite automaton (FA)</b> is a machine with a tiny, fixed amount of memory. It reads an input string <b>one symbol at a time, left to right</b>. It never goes back, and it never writes anything down. When the string ends it says <b>accept</b> or <b>reject</b>.</p>',
'<p>Everything the machine remembers is <b>which of its finitely many states it is in</b>. A <b>state</b> is a fact about what has been read so far, for example "I have seen an even number of b\'s". A turnstile is a real example: it has two states (locked, unlocked), and the inputs (coin, push) move it between them.</p>',
'<p>The machine is <b>deterministic</b> (a <b>DFA</b>) when, in every state, each symbol has <b>at most one</b> move. No choices, no guessing. (If a state has no arrow for a symbol, the machine simply stops and <b>rejects</b> there.)</p>',

'<h2>The formal definition: five parts</h2>',
TBL(['Part','Name','Meaning'],[
 ['<b>Q</b>','states','a finite, non-empty set of states'],
 ['<b>Σ</b>','alphabet','the symbols the machine can read (from chunk 1.1)'],
 ['<b>δ</b>','transition function','δ : Q × Σ → Q. Given the current state and the symbol just read, it gives the <b>next state</b>. At most one answer, never a choice'],
 ['<b>q₀</b>','start state','the state the machine begins in, q₀ ∈ Q'],
 ['<b>F</b>','final (accepting) states','F ⊆ Q. The string is accepted if the machine ends in one of these']
]),
'<p>So a DFA is written <b>M = (Q, Σ, δ, q₀, F)</b>. This five-tuple is what exam answers must state.</p>',

'<h2>Two ways to draw it</h2>',
'<div class="split"><div class="card" style="flex:1 1 280px;margin:0"><h3>Transition diagram</h3><ul><li>a <b>circle</b> is a state</li><li>an <b>arrow coming from nowhere</b> marks the start state</li><li>a <b>double circle</b> is a final state</li><li>a <b>labelled arrow</b> p →<sup>a</sup> q means δ(p, a) = q</li><li>two symbols with the same move share one arrow, labelled <code>a,b</code></li></ul></div>',
'<div class="card" style="flex:1 1 280px;margin:0"><h3>Transition table</h3><ul><li>one <b>row per state</b>, one <b>column per symbol</b></li><li>the cell holds the next state δ(row, column), or a dash <b>–</b> where there is no arrow</li><li><b>→</b> in front of the start state</li><li><b>*</b> in front of each final state</li></ul><p>The widgets below draw the diagram and the table of the same machine.</p></div></div>',

'<h2>How a DFA runs</h2>',
'<ol class="steps"><li>Put a marker on the start state q₀.</li><li>Read the next symbol and follow the arrow with that label. Move the marker.</li><li>Repeat until the string is used up. If there is <b>no arrow</b> for the symbol, the string is rejected at once.</li><li>If the marker is on a <b>double circle</b> when the string ends, the string is <b>accepted</b>. Otherwise it is <b>rejected</b>.</li></ol>',
MW('oddb','Press Step: a DFA for "odd number of b\'s" over {a,b} (Nov25 Q4). The highlighted state is the marker.'),
'<p>Hand trace of <code>abab</code>: q₀ <sup>a</sup>→ q₀ <sup>b</sup>→ q₁ <sup>a</sup>→ q₁ <sup>b</sup>→ q₀. It ends in q₀, which is not final, so <b>rejected</b> (the string has two b\'s, an even number).</p>',

'<h2>Extended δ and the language of a DFA</h2>',
'<p>To talk about whole strings, extend δ to <b>δ̂</b> (delta-hat): <code>δ̂(q, ε) = q</code> and <code>δ̂(q, wa) = δ( δ̂(q, w), a )</code>. In words: δ̂(q, w) is the state you end in if you start at q and read all of w.</p>',
'<div class="callout ok"><b>L(M) = { w ∈ Σ* : δ̂(q₀, w) ∈ F }</b>. The language of a DFA is the set of strings that end in a final state. A language is called <b>regular</b> if some DFA accepts it.</div>',

'<h2>Missing arrows mean "reject"</h2>',
'<p>Your teacher\'s DFA examples (exactly one "a", starts with "01", the only string 101) leave out arrows that could never lead to acceptance. If the machine is in a state with no arrow for the next symbol, the string is rejected right there. So a design answer has <b>fewer arrows than states × symbols</b>, and that is correct. No dead (trap) state is needed. (A trap state only appears later, when an algorithm such as subset construction produces the empty set ∅.)</p>',

'<h2>How to design a DFA (the recipe)</h2>',
'<ol class="steps"><li><b>Decide what the machine must remember</b>, as a short list of facts. Each fact becomes a state.</li><li>The start state is the fact that is true before anything is read.</li><li>For each state and symbol, ask "what is the fact after reading this symbol?" and draw that arrow. If the string can no longer be accepted, <b>draw no arrow</b>.</li><li>Mark as final the states whose fact means "the string should be accepted".</li><li><b>Test</b> with the shortest accepted string, a near miss that should be rejected, and edge cases (ε, one symbol).</li></ol>',

'<h2>The pattern families</h2>',
TBL(['Language pattern','What to remember','States needed'],[
 ['<b>starts with</b> x','how much of x has been matched so far','|x| + 1; after the last symbol of x the final state loops on every symbol'],
 ['<b>ends with</b> x','the longest end of the input that is also the beginning of x','|x| + 1'],
 ['<b>contains</b> x','same as "ends with", but the final state loops forever once reached','|x| + 1'],
 ['<b>counting</b>: odd / even / divisible by k','the remainder of the count modulo k','k'],
 ['<b>exactly / at least</b> n of a symbol','a counter 0, 1, …, n (the n+1 state is the final one)','n + 1'],
 ['<b>two conditions together</b> (starts with 1 AND ends with 0)','both facts at once, then merge duplicates','a few more']
]),

'<h2>Solved models</h2>',

MODEL('1. Odd number of b\'s over {a,b} <span class="src">Nov25 Q4</span>','<p>Remember only the <b>parity</b> of the b\'s. q₀ = even so far (including zero). q₁ = odd so far. An <code>a</code> changes nothing (loop). A <code>b</code> flips the parity. Final: q₁ (odd).</p><p>M = ({q₀,q₁}, {a,b}, δ, q₀, {q₁}). The widget above already shows this machine and its table.</p>'),

MODEL('2. Strings ending with 01 over {0,1} <span class="src">Nov25 Q1 language</span>','<p>Remember how much of "01" the string currently <b>ends with</b>.</p>'+
 TBL(['State','Meaning (what the string ends with)'],[['q₀','nothing useful: ε, or the last symbol is a 1 not preceded by 0'],['q₁','ends with <code>0</code> (could become 01)'],['q₂','ends with <code>01</code> (final)']])+
 '<p>Check the tricky moves: from q₂ (…01) reading <code>0</code> gives …010, which ends in 0, so q₁. Reading <code>1</code> gives …011, with no useful end, so q₀.</p>'),
MW('end01','Strings ending with 01. Try 1101 (accepted) and 110 (rejected).'),

MODEL('3. L = { 0ⁿ1 : n ≥ 0 } <span class="src">Supp Q2</span>','<p>Any number of 0s, then exactly one 1, then nothing. The question is written "0ⁿ1" without saying whether n can be 0, so <b>state your assumption</b>. For n ≥ 0 the string <code>1</code> is in the language.</p><p>q₀: only 0s so far. q₁: just read the closing 1 (final). q₁ has no arrows: any symbol after the 1 is rejected.</p>'),
MW('zn1','L = { 0ⁿ1 : n ≥ 0 }'),
'<p>If the question means n ≥ 1, the string <code>1</code> must be rejected, so q₀ needs a 0 to move on:</p>',
MW('zn1p','L = { 0ⁿ1 : n ≥ 1 }'),

MODEL('4. Starts with 1 and ends with 0 <span class="src">Class assignment Q1</span>','<p>Two facts are needed: "did it start with 1?" and "does it currently end with 0?". If the first symbol is 0 the string can never be accepted, so q₀ has no arrow on 0.</p>'+
 TBL(['State','Meaning'],[['q₀','nothing read yet'],['q₁','started with 1, last symbol is 1'],['q₂','started with 1, last symbol is 0 (final)']])),
MW('s1e0','Starts with 1, ends with 0. Try 1100 (accepted) and 101 (rejected).'),

MODEL('5. Number of 0s divisible by 3 <span class="src">QA1 Q10</span>','<p>A counting language: remember the number of 0s <b>modulo 3</b>. q₀ = remainder 0 (final, because zero 0s also counts), q₁ = 1, q₂ = 2. A <code>0</code> moves q₀→q₁→q₂→q₀. A <code>1</code> changes nothing.</p>'),
MW('mod3','Number of 0s divisible by 3. Try 010100 (four 0s, rejected) and 000 (accepted).'),

MODEL('6. Ends with 010: the systematic method <span class="src">QA1 Q1</span>','<p>For "ends with <i>pattern</i>", each state remembers the <b>longest end of the input that is also a beginning of the pattern</b>. For 010 the possible beginnings are ε, 0, 01, 010, so there are 4 states. To get each arrow, append the new symbol and find the longest end that is still a beginning of 010:</p>'+
 TBL(['State (longest match)','Read','Input now ends with','Longest end that starts 010','Next state'],[
  ['q₀ (ε)','0','…0','0','q₁'],['q₀ (ε)','1','…1','ε','q₀'],
  ['q₁ (0)','0','…00','0','q₁'],['q₁ (0)','1','…01','01','q₂'],
  ['q₂ (01)','0','…010','010','q₃'],['q₂ (01)','1','…011','ε','q₀'],
  ['q₃ (010)','0','…0100','0','q₁'],['q₃ (010)','1','…0101','01','q₂']])+
 '<p>The same method gives "ends with 101", "ends with 0110", and so on. For "contains", make the last state loop on every symbol.</p>'),
MW('end010','Ends with 010. Try 11010 (accepted).'),

MODEL('7. Contains 11 but never 111 <span class="src">Class assignment Q7</span>','<p>Two facts: "have I seen 11 yet?" and "how many 1s are at the end right now?" A third 1 in a row ends the string\'s chance: there is no arrow for it.</p>'+
 TBL(['State','Meaning'],[['q₀','no 11 seen yet, the last symbol is 0 (or nothing read)'],['q₁','no 11 seen yet, the last symbol is a single 1'],['q₂','11 seen, and the string ends with exactly 11 (final)'],['q₃','11 seen, the string ends with 0 (final)'],['q₄','11 seen, the string ends with a single 1 after a 0 (final)']])+
 '<p>q₂ has no arrow on 1 (that would make 111). Final states: q₂, q₃, q₄.</p>'),
MW('c11n111','Contains 11, never 111. Try 1101 (accepted), 0111 (rejected), 10101 (rejected: no 11).'),

MODEL('8. Password: starts with A, exactly one B, over {A,B} <span class="src">QA1 Q13</span>','<p>q₀ = nothing read. q₁ = started with A, no B yet. q₂ = exactly one B seen (final). q₀ has no arrow on B (must start with A), and q₂ has no arrow on B (a second B).</p>'),
MW('pw','Starts with A and contains exactly one B. Try AAB (accepted), ABB and BA (rejected).'),
MODEL('9. Traffic signal: contains 11 <span class="src">QA1 Q14</span>','<p>q₀ = the last symbol was not a 1 (or nothing yet). q₁ = the last symbol was a single 1. q₂ = 11 has been seen (final), and stays there whatever follows.</p>'),
MW('has11','Contains 11. Try 0110 and 10110 (accepted), 1010 and 0101 (rejected).'),

'<h2>A complete exam-style answer</h2>',
'<p><span class="src">Class assignment Q8</span> "Design a DFA over {0,1} that accepts all binary strings that start with 1, end with 0, and contain exactly one occurrence of the substring 10. Draw the DFA, write the transition table, specify the five-tuple, explain each state, and test with five accepted and five rejected strings."</p>',
'<div class="card"><p><b>Idea.</b> A string that starts with 1, ends with 0 and has only one "10" must look like <b>1⁺0⁺</b> (some 1s, then some 0s). A second "10" would appear if a 1 ever came after a 0, so that is not allowed.</p></div>',
MW('one10','Starts with 1, ends with 0, exactly one "10"'),
'<div class="card"><p><b>Five-tuple.</b> M = (Q, Σ, δ, q₀, F) with Q = {q₀, q₁, q₂}, Σ = {0, 1}, start state q₀, F = {q₂}, and δ as in the table above (– means no move).</p>'+
 TBL(['State','Meaning'],[['q₀','nothing read yet'],['q₁','read only 1s so far (the first symbol was 1)'],['q₂','read 1⁺ then 0⁺, so exactly one "10" and ends with 0 (final)']])+
 '<p><b>Accepted:</b> 10, 100, 110, 1100, 11100 (each is 1⁺0⁺).<br><b>Rejected:</b> ε, 0 (no arrow on 0 from q₀), 1 (ends in q₁, not final), 01, 101 (no arrow on 1 from q₂).</p></div>',

'<h2>Common mistakes</h2>',
'<ul><li><b>"Ends with" patterns that die.</b> After a wrong symbol the machine must fall back to the longest useful end, not stop. Only "starts with", "exactly" and "contains no …" patterns have missing arrows.</li><li><b>Two arrows for the same symbol</b> from one state: that is not a DFA (it is an NFA, chunk 2.2).</li><li><b>Confusing "contains" with "ends with".</b> After "contains", the final state never leaves; after "ends with", it can.</li><li><b>Forgetting that ε is a string.</b> Is the start state final? It is exactly when ε should be accepted (as in "number of 0s divisible by 3").</li><li><b>Not testing.</b> Always run the shortest accepted string and one near-miss.</li></ul>',

'<h2>Practice</h2><p>Each answer shows the machine, its table, and a simulator.</p><ol class="practice">',
P('<span class="src">Nov25 Q4</span> Design a DFA that accepts strings having an odd number of b\'s over {a,b}.','This is Model 1 above: two states, q₀ (even) and q₁ (odd, final). a loops, b flips.'),
P('<span class="src">QA1 Q3</span> Even number of 1s over {0,1}.',MW('evone','Even number of 1s (q₀ is final: zero 1s is even)')),

P('<span class="src">Class assignment Q5</span> Strings over {a,b} with exactly two b\'s.',MW('exactly2b','Exactly two b\'s')),
P('<span class="src">QA1 Q9</span> Every occurrence of a is immediately followed by b (over {a,b}).',MW('aFollowedB','Every a is followed by b. q₀ is final, so ε is accepted. q₁ (just read a) has no arrow on a.')),
P('<span class="src">QA1 Q11</span> Strings over {0,1} that start and end with the same symbol.',MW('sameEnds','q₁ = 0…0, q₂ = 0…1, q₃ = 1…1, q₄ = 1…0. Finals: q₁ and q₃.')),
P('<span class="src">QA1 Q12</span> Strings that start with 1 and end with 00.',MW('s1e00','Starts with 1, ends with 00')),
P('<span class="src">QA1 Q6</span> Strings ending with 101.',MW('end101','Ends with 101')),
P('<span class="src">QA1 Q8</span> Strings with exactly two 1s.',MW('ex2one','Exactly two 1s')),
P('<span class="src">QA1 Q2</span> Strings over {a,b} with at least two a\'s.',MW('atl2a','At least two a\'s')),
P('<span class="src">Class assignment Q6</span> A password over {0,1} starts with 1, ends with 0, and contains at least one 1 between them.',MW('pw2','q₁: started with 1, no middle 1 yet. q₂: a middle 1 seen, last symbol 1. q₃: last symbol 0 after a middle 1 (final).')),
P('<span class="src">QA1 Q15</span> A robot stops as soon as it receives the sequence LRR anywhere in the commands (over {L,R}).',MW('hasLRR','Contains LRR: the last state loops')),
'</ol>',
'<div class="callout ok">Where this appears in the endsem: Part A, 1 mark ("Design a DFA that accepts…", Nov25 Q4, Supp Q2). The bigger marks in this module come from converting and minimizing machines, which the next chunks build up to.</div>'
