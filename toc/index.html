function shortlex(b,n){var out=[],level=[''];while(out.length<n){var nx=[];level.forEach(function(w){for(var c=1;c<=b;c++)nx.push(w+c)});level=nx;level.forEach(function(w){if(out.length<n)out.push(w)})}return out}
function trackTable(rows){return '<div class="scroll"><table class="mx" style="margin:6px 0">'+rows.map(function(r){return '<tr><th>'+r[0]+'</th>'+r[1].map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}

/* ---------------- 5.4 variants ---------------- */
var C54=[
'<p>A <b>standard TM</b> has one deterministic tape that is infinite in both directions. Many <b>variants</b> are more convenient to design with, but every one of them accepts exactly the same languages (the recursively enumerable languages): each can be <b>simulated</b> by a standard TM. This is exactly what the question "Analyze the variants of Turing machine compared to the standard Turing machine with suitable diagrams" asks (Nov 2025 Q23, 12 marks; Supp Q23a, 6 marks; QB Q28; the teacher\'s Edpuzzle).</p>',

'<h2>The variants at a glance</h2>',
TBL(['Variant','What is different','δ','Simulated on a standard TM by','Power'],[
 ['<b>Stay option</b>','the head may also stay put','Q × Γ → Q × Γ × {L, R, <b>S</b>}','replacing a stay by a move right and a move back left','same'],
 ['<b>Semi-infinite tape</b>','the tape has a left end but no right end','no left move at the left end','folding the two-way tape in half: two tracks, the lower one holds the left half in reverse','same'],
 ['<b>Multi-track</b>','each cell holds a k-tuple, one head','Γ is a set of k-tuples','just a bigger tape alphabet Γᵏ','same'],
 ['<b>Multitape</b>','k tapes, k heads that move independently','Q × Γᵏ → Q × Γᵏ × {L,R,S}ᵏ','one tape with 2k tracks: contents and a marker for each head','same (slower: quadratic)'],
 ['<b>Offline</b>','a read-only input tape plus a work tape','','copy the input to the work tape first','same'],
 ['<b>Multidimensional</b>','the tape is a grid, moves U, D, L, R','Q × Γ → Q × Γ × {L,R,U,D}','writing the rows one after another on one tape, separated by markers','same'],
 ['<b>Non-deterministic</b>','several moves possible for (q, X)','Q × Γ → 2^(Q × Γ × {L,R})','a deterministic TM that tries all computation paths breadth first, using 3 tapes','same (exponential slowdown)']]),

'<h2>Each variant, in detail (the QB Q28 answers)</h2>',

MODEL('(iv) Stay option <span class="src">QB Q28</span>','<p>δ(q, a) = (p, b, S) means: write b, stay, go to p. A standard TM replaces it by <b>two moves</b>: δ(q, a) = (p′, b, R), where p′ is a new state, then for every tape symbol Z: δ(p′, Z) = (p, Z, L). The head steps right and comes straight back, so it ends on the same cell. The widget removes the stay moves from a machine that accepts a*.</p>'),
FAS('Original machine with a stay move (accepts a*): q₀ reads B and stays',tmDiagram(MACH.tmStay.spec),{sim:false}),
FAS('The same machine with the stay move removed (q₁′ is the helper state)',tmDiagram(tmRemoveStay(MACH.tmStay.spec)),{sim:false}),

MODEL('(iii) Two-way infinite tape (and the semi-infinite tape) <span class="src">QB Q28</span>','<p>Fold the two-way tape at the starting cell. The upper track holds the cells to the right (cell 0, 1, 2, …), the lower track holds the cells to the left (−1, −2, −3, …) in reverse order, and an end marker ¢ closes the left end. The simulating machine has <b>twice as many states</b>: each original state q appears as q<sub>U</sub> (working on the upper track) and q<sub>L</sub> (working on the lower track). Moving left on the lower track is moving right on the tape, so the directions are swapped in q<sub>L</sub>; at the marker ¢ the state switches between U and L.</p>'),
'<div class="w"><div class="cap">Two-way tape ... c₋₃ c₋₂ c₋₁ [c₀] c₁ c₂ c₃ ... folded into two tracks</div>'+trackTable([['original',['c₋₃','c₋₂','c₋₁','<b>c₀</b>','c₁','c₂','c₃']],['upper track (right half)',['¢','','','<b>c₀</b>','c₁','c₂','c₃']],['lower track (left half, reversed)',['¢','c₋₃','c₋₂','c₋₁','','','']]])+'<div class="log">After folding: the upper track holds c₀ c₁ c₂ … from the marker onward, the lower track holds c₋₁ c₋₂ c₋₃ … from the marker onward.</div></div>',

MODEL('(i) Multitape TM <span class="src">QB Q28</span>','<p><b>Storing k tapes on one tape.</b> Use 2k tracks: for every original tape one track holds its contents and the next track holds a marker (↑) under the cell its head is scanning. <b>One move</b> of the multitape machine is simulated by a sweep: the single head goes from the left end to the right end collecting (in its state) the k symbols under the markers, then sweeps back, writing the new symbols, moving the markers, and changing state.</p><p><b>One move of a 2-tape TM, ID before and after.</b> Take δ(q, b, b) = (p, x, y, R, L): write x on tape 1 and move right, write y on tape 2 and move left.</p>'),
'<div class="w"><div class="cap">Before the move (state q)</div>'+trackTable([['tape 1',['a','<b>b</b>','a']],['head 1',['','↑','']],['tape 2',['b','<b>b</b>','']],['head 2',['','↑','']]])+'<div class="cap" style="margin-top:10px">After the move (state p)</div>'+trackTable([['tape 1',['a','x','<b>a</b>']],['head 1',['','','↑']],['tape 2',['b','<b>y</b>','']],['head 2',['↑','','']]])+'<div class="log">Both tapes are on one tape with 4 tracks. The simulating machine needs two sweeps of the used part of the tape for each move, so a computation of t steps takes O(t²) steps: slower, but the same languages.</div></div>',
MT2W('A real 2-tape machine for aⁿbⁿ: copy the a\'s to tape 2, then each b erases one (press ▶)','mt2AnBn'),

MODEL('(ii) Non-deterministic TM <span class="src">QB Q28</span>','<p>An NTM may have several moves for (q, X); it accepts if <b>some</b> computation path reaches a final state. A deterministic machine simulates it with <b>three tapes</b>: tape 1 holds the input (never changed), tape 2 is the <b>work tape</b> (a copy of the input on which one path is simulated), and tape 3 is the <b>address tape</b> that lists the choices to take (the i-th symbol says which of the available moves to use at step i). The addresses are generated in <b>shortlex order</b> (shorter first, then alphabetical). If a configuration has at most 3 choices, the first 10 computation paths tried are: <b>'+shortlex(3,10).join(', ')+'</b> (after the empty address ε, which is the start). The simulation accepts as soon as some path accepts, and it must go breadth first: a depth-first search could follow one infinite branch forever.</p>'),
NTMW('An NTM for "contains ab": at an a it may guess that this is the start of ab','ntmAb'),

'<h2>What the simulations prove</h2>',
'<div class="callout ok">Every variant can be simulated by a standard Turing machine, so none of them accepts a language that a standard TM cannot. All of them define exactly the <b>recursively enumerable languages</b>. They differ in <b>convenience and speed</b>: multitape machines are quadratically faster at worst, non-deterministic ones are exponentially faster as far as we know. This is evidence for the <b>Church–Turing thesis</b>: whatever can be computed in any reasonable sense can be computed by a Turing machine.</div>',

'<h2>The 12-mark answer (Nov25 Q23, Supp Q23a)</h2>',
MODEL('Analyze the variants compared with the standard TM <span class="src">Nov25 Q23</span>',ANS_Q23),

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">QB Q28 (iv)</span> Replace the transition δ(q, a) = (p, b, S) by standard moves.','δ(q, a) = (r, b, R) for a new state r, and δ(r, Z) = (p, Z, L) for every tape symbol Z. The head moves right and comes back, ending on the same cell in state p.'),
P('<span class="src">QB Q28 (ii)</span> If every configuration has at most 2 choices, give the order in which the first 10 computation paths are tried by the deterministic simulation.','The addresses over {1, 2} in shortlex order: '+shortlex(2,10).join(', ')+'.'),
P('Why does the deterministic simulation of an NTM search breadth first and not depth first?','If one branch of the computation tree is infinite, a depth-first search would follow it forever and never examine a different branch that accepts. Breadth first reaches every finite path after finitely many steps, so if some path accepts it will be found.'),
P('<span class="src">Supp Q23a</span> Describe the variants of the standard Turing machine model.','Stay option, semi-infinite tape, multi-track, multitape, offline, multidimensional and non-deterministic TMs: see the table above. All accept exactly the recursively enumerable languages.'),
'</ol>'
].join('');

/* ---------------- 5.5 type-0 grammars and TMs ---------------- */
var C55=[
'<p>This chunk joins two halves of the course: the <b>grammars</b> of Module 1 and the <b>machines</b> of Module 5. It is QB Q29, and it explains why Type 0 is the largest class in the Chomsky hierarchy. The earlier result you need: <b>unrestricted (Type 0) grammars generate exactly the recursively enumerable languages</b>, and <b>context-sensitive (Type 1) grammars generate exactly the languages of linear bounded automata</b>.</p>',

'<h2>(a) A context-sensitive grammar for { aⁿbⁿcⁿ : n ≥ 1 }</h2>',
'<p>No context-free grammar can generate this language, but a grammar whose rules may have several symbols on the left can. The rules never shrink the string, so this is a Type 1 grammar.</p>',
'<div class="gbox">S → aSBC | aBC\nCB → BC\naB → ab\nbB → bb\nbC → bc\ncC → cc</div>',
'<ul><li><code>S → aSBC | aBC</code> writes n a\'s followed by n B\'s and C\'s mixed up: aⁿ(BC)ⁿ shape.</li><li><code>CB → BC</code> sorts the symbols so that all B\'s come before all C\'s.</li><li>The last four rules turn the sorted symbols into terminals <b>in order</b>: the first B can become b only next to an a (aB → ab); each further b makes the next B a b (bB → bb); the first C becomes c only next to a b (bC → bc); then cC → cc.</li></ul>',
MODEL('Derive aabbcc <span class="src">QB Q29</span>','<p>The widget searches for a derivation in the grammar (rules apply anywhere in the sentential form).</p>'),
G0W('Derivation of aabbcc','S → aSBC | aBC\nCB → BC\naB → ab\nbB → bb\nbC → bc\ncC → cc','aabbcc'),

'<h2>A Type 0 grammar: the powers of 2</h2>',
'<p>This is the grammar of question bank Q5(iv). The rule <code>AE → ε</code> shrinks the string, so it is Type 0, and it generates { a^(2ⁿ) : n ≥ 1 } (aa, aaaa, aaaaaaaa, …). C runs right across the a\'s doubling each one (Ca → aaC), then D runs back left to start another pass, or E ends the process.</p>',
G0W('Derivations of aa and aaaa (try aaa: it has none)','S → ACaB\nCa → aaC\nCB → DB | E\naD → Da\nAD → AC\naE → Ea\nAE → ε','aaaa',14),

'<h2>(b) A TM simulates a Type 0 grammar</h2>',
'<p>Given G, build a (non-deterministic) TM M that accepts L(G). M has the input w on one tape and a second tape holding a <b>sentential form</b>, which starts as S.</p>',
'<ol class="steps"><li>Repeat: <b>non-deterministically</b> choose a position in the sentential form and a production α → β of G.</li><li>If α is at that position, <b>replace α by β</b> (shifting the rest of the string left or right if |α| ≠ |β|).</li><li>Compare the sentential form with w. If they are equal, <b>accept</b>; otherwise go back to step 1.</li></ol>',
'<p>If w ∈ L(G), some sequence of choices produces a derivation of w, so M accepts. If w ∉ L(G), no sequence produces w, so M never accepts (it may run for ever). Hence M accepts exactly L(G), which is therefore recursively enumerable. (A deterministic TM follows by the simulation of 5.4.)</p>',

'<h2>(b) A grammar simulates a TM (outline)</h2>',
'<p>Given a TM M, build a Type 0 grammar G with L(G) = L(M). G works in three phases.</p>',
'<ol class="steps"><li><b>Generate</b> every string w together with a copy of it in a "computation area": the grammar produces w [q₀ w] for an arbitrary w ∈ Σ*, where [q₀ w] is the start ID of M with its head marker.</li><li><b>Simulate M</b> on the copy. For every transition δ(q, X) = (p, Y, R) add a rule <code>q X → Y p</code>, and for every δ(q, X) = (p, Y, L) add <code>Z q X → p Z Y</code> for every tape symbol Z. These rules rewrite one ID into the next, exactly like the ⊢ relation.</li><li>If the simulated M reaches a <b>final state</b>, <b>erase</b> the whole computation area (with rules like q_f X → ε and X ] → ε), leaving only w. If M never accepts, the erasing rules never apply, so no terminal string is produced.</li></ol>',
'<p>So G derives exactly the strings w that M accepts. Together with the previous construction: <b>Type 0 grammars ⇔ Turing machines ⇔ recursively enumerable languages</b>.</p>',

'<h2>Linear bounded automata</h2>',
'<p>A <b>linear bounded automaton (LBA)</b> is a non-deterministic TM whose head may not leave the cells that hold the input (the input is written between two end markers that can never be erased or passed). Its tape is a linear amount of space. LBAs accept exactly the <b>context-sensitive languages</b>. Because the LBA has only finitely many configurations on an input of length n, every context-sensitive language is <b>decidable</b>, but the classes are different: there are decidable languages that are not context-sensitive.</p>',

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">QB Q29(a)</span> Write a context-sensitive grammar for { aⁿbⁿcⁿ : n ≥ 1 } and derive aabbcc.',G0W('Solution','S → aSBC | aBC\nCB → BC\naB → ab\nbB → bb\nbC → bc\ncC → cc','aabbcc')),
P('<span class="src">QB Q29(b)</span> Explain how a TM can simulate a type-0 grammar G to accept L(G).','M keeps the input w on one tape and a sentential form (starting as S) on another. It repeatedly guesses a production α → β and a position where α occurs and replaces α by β, shifting the rest as needed. After each replacement it compares the sentential form with w and accepts if they are equal. If w ∈ L(G) some sequence of guesses derives w, otherwise none accepts.'),
P('<span class="src">QB Q29(b)</span> In outline, how can a grammar simulate a TM?','Phase 1 generates w together with a copy of w in the start ID of M. Phase 2 has a rule for each transition (qX → Yp for right moves, ZqX → pZY for left moves) that rewrites one ID into the next. Phase 3 erases the computation area if M reaches a final state, leaving w. So G generates exactly L(M).'),
P('<span class="src">Supp Q8, Q14</span> Name the automaton for context-sensitive grammars and state the concept of a linear bounded automaton.','The linear bounded automaton (LBA). It is a TM whose head is confined to the cells that hold the input (between two end markers), so its tape length is linear in the input length.'),
'</ol>'
].join('');
CONTENT['5.5']={h:C55,exam:['QB Q29','QB Q5(iv)','Supp Q8, Q14']};

/* ---------------- 6.1 ---------------- */
var C61=[
'<p>Module 6 is the last module, and <b>Q24 is compulsory and has been CO6 in both papers</b>. It starts here with the two language classes at the top of the hierarchy. Both papers asked for them in Q24b / Q20b (6 marks each time): the answer is short, but you must be able to define them, contrast them, and give examples.</p>',

'<h2>Three outcomes of a Turing machine</h2>',
'<p>Run a TM M on an input w. Exactly one of three things happens: M <b>accepts</b> (halts in a final state), M <b>rejects</b> (halts in a non-final state), or M <b>loops</b> (never halts). Looping is what makes the two classes different.</p>',

'<h2>The two classes</h2>',
TBL(['','Recursive language (decidable)','Recursively enumerable language (RE, recognizable, semi-decidable)'],[
 ['definition','L is recursive if some TM <b>halts on every input</b>: it accepts every w ∈ L and rejects every w ∉ L','L is RE if some TM <b>accepts every w ∈ L</b>. On w ∉ L it may reject <b>or loop forever</b>'],
 ['input in L','accept and halt','accept and halt'],
 ['input not in L','reject and halt','reject <b>or loop</b>'],
 ['always halts?','yes (the machine is a <b>decider</b>)','not necessarily'],
 ['gives a final YES/NO?','yes, both','only YES is guaranteed; NO may never come'],
 ['memory tip','recursive = YES and NO both halt','RE = YES halts, NO may loop']]),
'<p><b>Analogy (class slides).</b> Checking a register number against a complete list: if the number is there the answer is YES, and if you reach the end of the list the answer is NO. You always finish: that is a <b>recursive</b> question. Searching an endless register for a name: if the name exists you eventually find it and say YES, but if it is absent you may search for ever without knowing: that is only <b>RE</b>.</p>',

'<h2>How they relate</h2>',
'<div class="callout ok"><b>Theorem.</b> Every recursive language is recursively enumerable, but not every RE language is recursive. A decider already accepts every member, so it is also a recogniser. The reverse fails: L<sub>u</sub> (6.4) is RE but not recursive.</div>',
HIER(),
'<p><b>Languages that are not even RE exist.</b> Every TM has a finite description, so there are only countably many TMs and hence only countably many RE languages, but there are uncountably many languages over {0,1}. An explicit example is the diagonal language L<sub>d</sub> (6.4).</p>',

'<h2>Solved models</h2>',

/* ---------------- 6.2 closure ---------------- */
var C62=[
'<p>The closure properties of the recursive and RE languages are proved by <b>describing Turing machines</b>. They are asked as "Show that recursively enumerable languages are closed under union" (Nov 2025 Q16, 3 marks), "Prove that if L and its complement are both RE then both are recursive" (Supp Q24a, 6 marks), and QB Q30 and Q31.</p>',

'<h2>The summary</h2>',
TBL(['Operation','Recursive languages','RE languages'],[
 ['union','closed','closed'],['intersection','closed','closed'],['concatenation, star','closed','closed'],
 ['<b>complement</b>','<b>closed</b> (swap accept and reject)','<b>NOT closed</b> (unless RE = recursive)']]),

'<h2>Recursive languages (QB Q30)</h2>',
'<p>Let M₁ and M₂ be deciders (they always halt) for L₁ and L₂.</p><ul><li><b>Union.</b> On input w, run M₁ on w, then run M₂ on w. Both halt. Accept if either accepted, otherwise reject. The new machine halts on every input.</li><li><b>Intersection.</b> Same, but accept only if both accepted.</li><li><b>Complement.</b> Run M₁ and swap the answer: accept if M₁ rejects, reject if M₁ accepts. This works because M₁ always halts.</li><li><b>Concatenation.</b> For each of the |w| + 1 ways to split w = xy, run M₁ on x and M₂ on y; accept if some split works.</li></ul>',

'<h2>RE languages (QB Q31)</h2>',
'<p>Let M₁ and M₂ only be <b>recognisers</b>: they accept members but may loop on non-members.</p><ul><li><b>Union (Nov25 Q16).</b> Running M₁ first is not allowed: it may loop on w while M₂ would have accepted. <b>Run both in parallel</b> (dovetailing): do one step of M₁, one step of M₂, another step of M₁, and so on. Accept as soon as either accepts. If w ∈ L₁ ∪ L₂ one of them accepts after finitely many steps, so we accept. If w is in neither, nobody accepts (and we may loop), which is allowed for an RE language.</li><li><b>Intersection.</b> Run M₁ on w; if it accepts, run M₂ on w; accept if that accepts too. If M₁ loops, w ∉ L₁ ∩ L₂ so looping is fine.</li><li><b>Concatenation.</b> Non-deterministically guess a split w = xy, run M₁ on x and M₂ on y, accept if both accept (a non-deterministic TM, which can be simulated by a deterministic one).</li></ul>',
PARW('Union of two RE languages by parallel simulation. A accepts strings starting with a and loops on b-starts; B is the reverse. Try abb, bba, and the empty string.','loopA','loopB','bba'),
'<div class="callout"><b>Why "swap accept and reject" fails for RE.</b> Swapping works only if the machine always halts. If M loops on w, the swapped machine also loops on w, so it does not accept w, yet w ∉ L(M) should have been accepted by a machine for the complement. A machine for the complement would have to decide when M will never accept, which it cannot.</div>',

'<h2>The key theorem: L and its complement both RE ⇒ L recursive</h2>',
MODEL('Prove it <span class="src">Supp Q24a</span> <span class="src">QB Q30</span>',ANS_Q24A),
MODEL('Why RE is not closed under complement <span class="src">QB Q31</span>','<p>Suppose RE were closed under complement. Then for every RE language L, both L and L̄ would be RE, and by the theorem every RE language would be recursive. But L<sub>u</sub> is RE and <b>not</b> recursive (6.4). So RE is not closed under complement: the complement of L<sub>u</sub> is not RE.</p>'),

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">Nov25 Q16 (3 marks)</span> Show that recursively enumerable languages are closed under union.',ANS_Q16),
P('<span class="src">Supp Q24a</span> Prove that if L and L̄ are both recursively enumerable then both are recursive.',ANS_Q24A),
P('<span class="src">QB Q30</span> Prove that recursive languages are closed under intersection.','Let M₁ and M₂ be deciders. Run M₁ on w; if it rejects, reject. Otherwise run M₂ on w and give its answer. Both halt, so the new machine halts on every input and accepts exactly L₁ ∩ L₂.'),
P('<span class="src">QB Q31</span> Prove that RE languages are closed under intersection.','Run M₁ on w. If it accepts, run M₂ on w and accept if it accepts. If either rejects or loops, w is not accepted. So the machine accepts exactly L₁ ∩ L₂ (it may loop on strings outside, which RE allows).'),

/* ---------------- 6.3 universal TM ---------------- */
var C63=[
'<p>An ordinary TM is "hard-wired": it runs one program. A real computer is re-programmable. The <b>universal Turing machine (UTM)</b> is a single TM that can simulate <b>any</b> other TM M, given a description of M and its input w. It is asked as "Explain the working of the Universal Turing Machine" (Nov 2025 Q24a, 6 marks) and QB Q33 (encode a machine and describe the simulation).</p>',

'<h2>Definition</h2>',
'<p>A UTM is a Turing machine which, when supplied with an appropriate description of a TM M and an input string w, simulates the computation of M on w: it halts exactly when M halts on w, and accepts exactly when M accepts w. This is the model of a stored-program computer, and it supports the Church–Turing thesis.</p>',

'<h2>Encoding a TM as a binary string (your teacher\'s scheme)</h2>',
'<p>Assume M has a single final state, and number everything:</p><ul><li><b>States:</b> q₁ = the start state is coded 1, q₂ = the final state is coded 11, the other states 111, 1111, … (qᵢ is 1ⁱ).</li><li><b>Tape symbols:</b> the blank B is σ₁ = 1, the next symbol is 11, then 111, … (σⱼ is 1ʲ).</li><li><b>Moves:</b> L = 1, R = 11.</li><li>The symbol <b>0 separates the 1\'s</b>.</li></ul>',
'<div class="callout ok">A transition <b>δ(qᵢ, σⱼ) = (qₖ, σₗ, D)</b> is written <b>1ⁱ 0 1ʲ 0 1ᵏ 0 1ˡ 0 1ᴰ</b>. The whole machine is the list of its transitions <b>separated by 00</b>. The input w is written with each symbol as 1ʲ separated by 0, and a longer separator (000) divides the machine from its input.</div>',

'<h2>The machine that simulates: three tapes</h2>',
'<ol class="steps"><li><b>Tape 1</b> holds the encoding of M (it never changes). <b>Tape 2</b> holds the contents of M\'s tape (the encoded w at the start). <b>Tape 3</b> holds M\'s current state (as 1ᵏ).</li><li>The UTM looks at tape 3 (the state) and at the symbol under the head on tape 2: this is the current configuration of M.</li><li>It consults tape 1: it searches for the transition whose first two fields match (state, symbol).</li><li>It updates tape 2 (write the new symbol, move the head) and tape 3 (the new state).</li><li>Repeat. If tape 1 has <b>no matching transition</b>, M halts, so the UTM halts; it accepts if tape 3 holds 11 (the final state q₂).</li></ol>',

'<h2>Solved model: question bank Q33</h2>',
MODEL('Encode M and w = 01, and simulate <span class="src">QB Q33</span>','<p>M accepts binary strings starting with 0. Numbering: <b>q₀ = start = 1, q₂ = final = 11, q₁ = 111</b>; <b>B = 1, 0 = 11, 1 = 111</b>. The widget gives the code of every transition, the code of M, the encoded input, and the simulation on the three tapes for w = 01.</p>'),
UTMW('QB Q33: encoding of M and the simulation on w = 01','qb33','01'),
'<div class="callout"><b>Why the UTM matters for Module 6.</b> The UTM shows that L<sub>u</sub> = { ⟨M, w⟩ : M accepts w } is <b>recursively enumerable</b> (the UTM accepts exactly when M accepts w). It is also the machine behind the halting-problem proof in 6.4.</div>',

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">Nov25 Q24a (6 marks)</span> Explain the working of the Universal Turing Machine.',ANS_UTM),
P('Encode the transition δ(q₁, a) = (q₃, b, R) when q₁ is the start state, a is the symbol numbered 2, q₃ is the state numbered 3 and b is the symbol numbered 3.','Here i = 1, j = 2, k = 3, l = 3, m = 2 (R): 1 0 11 0 111 0 111 0 11 = '+[ones(1),ones(2),ones(3),ones(3),ones(2)].join('0')+'.'),
P('Why does the UTM need a separate tape for the state of M?','The UTM\'s own state set is fixed and finite, but the machine M it simulates can be any machine with any number of states. M\'s current state must therefore be stored as data (1ᵏ on tape 3) and looked up on tape 1.'),
'</ol>'
].join('');
CONTENT['6.3']={h:C63,exam:['Nov25 Q24a','QB Q33','teacher UTM notes']};

/* ---------------- 6.4 ---------------- */
var C64=[
'<p>This chunk contains the two most famous proofs in the course: the halting problem is undecidable, and the diagonal language is not RE. QB Q32 asks for both in full, and the questions "List two undecidable problems" (Nov 2025 Q9) and "Differentiate decidable from undecidable" (Supp Q16) rest on them.</p>',

'<h2>The halting problem</h2>',
'<p><b>HALT = { ⟨M, w⟩ : the Turing machine M halts on input w }.</b> Is there an algorithm (a TM that always halts) which, given any machine and input, tells us whether it will halt? No.</p>',
MODEL('Prove that the halting problem is undecidable <span class="src">QB Q32</span>','<p><b>Proof by contradiction (the teacher\'s version).</b> Assume a machine H exists that decides halting: H(P, I) answers "halts" or "does not halt" for every program P and input I, and H always stops.</p><ol class="steps"><li>Build a new machine <b>C(X)</b>: it calls H(X, X) (asking whether program X halts when run on its own code).</li><li>If H says <b>"halts"</b>, then C <b>loops forever</b>. If H says <b>"does not halt"</b>, then C <b>halts</b>.</li><li>Now run C on its own code: <b>C(C)</b>. If C(C) halts, H(C, C) said "halts", so C loops: a contradiction. If C(C) does not halt, H(C, C) said "does not halt", so C halts: a contradiction.</li><li>Both cases are impossible, so the assumed machine H cannot exist. <b>HALT is undecidable.</b> ∎</li></ol><p>HALT <b>is</b> recursively enumerable (run M on w with the UTM and accept if it halts). So HALT is RE but not recursive.</p>'),

'<h2>Diagonalisation and the language L<sub>d</sub></h2>',
'<p>List all Turing machines M₁, M₂, M₃, … (possible, since each has a finite binary code) and all binary strings w₁, w₂, w₃, …. Build the table whose entry (i, j) is <b>1 if Mᵢ accepts wⱼ</b>, 0 otherwise. Row i of the table is the language L(Mᵢ).</p>',
'<div class="w"><div class="cap">The table of acceptance (a 6 × 6 corner) and the diagonal language</div>'+DIAGHTML()+'</div>',
'<div class="callout ok"><b>The diagonal language: L<sub>d</sub> = { wᵢ : Mᵢ does NOT accept wᵢ }.</b> It is the diagonal of the table with every entry flipped.</div>',
MODEL('L<sub>d</sub> is not recursively enumerable <span class="src">QB Q32 (i)</span>','<p>Suppose L<sub>d</sub> = L(M<sub>k</sub>) for some machine M<sub>k</sub> in the list. Ask whether the string w<sub>k</sub> is in L<sub>d</sub>. By the definition of L<sub>d</sub>, w<sub>k</sub> ∈ L<sub>d</sub> exactly when M<sub>k</sub> does not accept w<sub>k</sub>. But M<sub>k</sub> accepts exactly L<sub>d</sub>, so M<sub>k</sub> accepts w<sub>k</sub> exactly when w<sub>k</sub> ∈ L<sub>d</sub>. Together: w<sub>k</sub> ∈ L<sub>d</sub> ⇔ w<sub>k</sub> ∉ L<sub>d</sub>, a contradiction. So no machine accepts L<sub>d</sub>: <b>L<sub>d</sub> is not RE</b>. ∎ (This is the explicit non-RE language promised in 6.1.)</p>'),

'<h2>The universal language L<sub>u</sub></h2>',
'<p><b>L<sub>u</sub> = { ⟨M, w⟩ : M accepts w }</b> (the acceptance problem). Two facts:</p><ul><li><b>L<sub>u</sub> is RE.</b> The universal TM (6.3) simulates M on w and accepts if M accepts.</li><li><b>L<sub>u</sub> is not recursive.</b> Suppose a decider D for L<sub>u</sub> existed. To decide whether a string wᵢ is in L<sub>d</sub>: build ⟨Mᵢ, wᵢ⟩, run D, and <b>flip the answer</b> (wᵢ ∈ L<sub>d</sub> exactly when Mᵢ does not accept wᵢ). That would be a decider for L<sub>d</sub>, so L<sub>d</sub> would be recursive, hence RE: contradicting the previous result. ∎</li></ul>',
MODEL('L<sub>u</sub> is RE but not recursive <span class="src">QB Q32 (ii)</span>','<p>RE: the UTM. Not recursive: a decider for L<sub>u</sub> would give a decider for L<sub>d</sub> (flip its answer), but L<sub>d</sub> is not even RE. Also: if L<sub>u</sub> were recursive its complement would be recursive, hence RE, and then L<sub>u</sub> and its complement would both be RE; the complement of L<sub>u</sub> is not RE (6.2), so L<sub>u</sub> is not recursive.</p>'),

'<h2>Reductions: proving other problems undecidable</h2>',
'<p>A <b>reduction</b> from A to B is an algorithm that converts every instance x of A into an instance y of B such that x ∈ A ⇔ y ∈ B. If B were decidable, so would A be. So <b>if A is undecidable and A reduces to B, then B is undecidable.</b></p>',
MODEL('HALT is undecidable by reducing L<sub>u</sub> to it','<p>Given ⟨M, w⟩, build a machine M′ that runs M on w and, if M <b>accepts</b>, accepts, and if M <b>rejects</b>, <b>loops forever</b>. Then M′ halts on w exactly when M accepts w. A decider for HALT would therefore decide L<sub>u</sub>: contradiction.</p>'),

'<h2>Undecidable problems you should be able to list</h2>',
'<ul><li>The <b>halting problem</b>: does M halt on w?</li><li>The <b>acceptance problem</b> L<sub>u</sub>: does M accept w?</li><li>Is the language of M <b>empty</b>? Is L(M₁) = L(M₂)? Is L(M) regular? (all follow from Rice\'s theorem, 6.5)</li><li>The <b>Post correspondence problem</b> (6.6).</li><li>Is a context-free grammar <b>ambiguous</b>? Do two CFGs generate the same language? (by reduction from PCP)</li></ul>',

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">Nov25 Q9 (1 mark)</span> List two undecidable problems.','The halting problem (does a TM halt on a given input?) and the Post correspondence problem. (Also: the emptiness / equivalence of the languages of Turing machines, by Rice\'s theorem; ambiguity of context-free grammars.)'),
P('<span class="src">QB Q32</span> Define the diagonal language L_d and prove that it is not recursively enumerable.','L_d = { w_i : M_i does not accept w_i }, where M_1, M_2, … and w_1, w_2, … list all machines and strings. If some M_k accepted L_d, then w_k ∈ L_d ⇔ M_k does not accept w_k ⇔ w_k ∉ L(M_k) = L_d, a contradiction. So L_d is not RE.'),
P('<span class="src">QB Q32</span> Define L_u and show it is RE but not recursive.','L_u = { ⟨M, w⟩ : M accepts w }. RE: the universal TM simulates M on w and accepts if M does. Not recursive: a decider for L_u, with its answer flipped, would decide L_d (w_i ∈ L_d ⇔ ⟨M_i, w_i⟩ ∉ L_u), but L_d is not even RE.'),
P('Why is HALT recursively enumerable but not recursive?','RE: simulate M on w (with the universal TM) and accept when the simulation halts. Not recursive: the diagonal proof above shows no always-halting machine can decide it.'),
'</ol>'
].join('');
CONTENT['6.4']={h:C64,exam:['QB Q32','Nov25 Q9','teacher halting-problem notes']};

/* ---------------- 6.5 Rice ---------------- */
var C65=[
'<p>Rice\'s theorem is the sledgehammer of undecidability: it settles a whole family of questions about Turing machines at once. It is asked as "State Rice\'s theorem" (Nov 2025 Q10, 1 mark), and your teacher\'s slides give the statement and the proof.</p>',

'<h2>Properties of languages</h2>',
'<p>A <b>property</b> P of recursively enumerable languages is simply a <b>set of languages</b>. A language L satisfies P if L ∈ P. For a property P let <b>L<sub>P</sub> = { ⟨M⟩ : L(M) ∈ P }</b>: the set of (codes of) machines whose language has the property.</p>',
TBL(['Kind of property','Meaning','Example'],[['<b>trivial</b>','satisfied by <b>all</b> RE languages, or by <b>none</b> of them','"L is recursively enumerable" (all), "L is not RE" (none)'],['<b>non-trivial</b>','satisfied by some RE languages and not by others','"L is empty", "L is finite", "L is regular", "L contains 01"']]),

'<h2>The theorem</h2>',
'<div class="callout ok"><b>Rice\'s theorem.</b> If P is a <b>non-trivial</b> property of recursively enumerable languages, then L<sub>P</sub> = { ⟨M⟩ : L(M) ∈ P } is <b>undecidable</b>. In words: every non-trivial question about the <b>language</b> a Turing machine accepts is undecidable.</div>',
'<p><b>Two things Rice does not cover:</b> trivial properties (always decidable: the answer is always yes, or always no) and questions about the <b>machine itself</b> or a bounded run rather than its language (for example "does M have more than 5 states?" or "does M halt within 100 steps?", which are decidable).</p>',

'<h2>Proof (by reduction from the acceptance problem)</h2>',
'<ol class="steps"><li>Let P be non-trivial. Assume ∅ ∉ P (otherwise prove the same for the complement property, which is also non-trivial; a problem is undecidable exactly when its complement is).</li><li>Since P is non-trivial, some language satisfies it: pick a machine M₀ with L(M₀) ∈ P.</li><li>Reduce L<sub>u</sub> (undecidable) to L<sub>P</sub>. Given ⟨M, w⟩ build a machine <b>N</b> that, on input x: <b>(a)</b> runs M on w; <b>(b)</b> if M does not accept (or loops), N does not accept x (or loops); <b>(c)</b> if M accepts w, N runs M₀ on x and accepts exactly when M₀ accepts x.</li><li>If M accepts w then L(N) = L(M₀) ∈ P. If M does not accept w then L(N) = ∅ ∉ P. So <b>⟨N⟩ ∈ L<sub>P</sub> ⇔ ⟨M, w⟩ ∈ L<sub>u</sub></b>.</li><li>A decider for L<sub>P</sub> would therefore decide L<sub>u</sub>, which is impossible. So L<sub>P</sub> is undecidable. ∎</li></ol>',

'<h2>Applying it</h2><p>Decide for each property whether Rice\'s theorem makes it undecidable, whether it is not covered, or trivial.</p>',
'<div class="w"><div class="cap">Rice\'s theorem quiz</div><div id="ricequiz"></div></div>',
'<p>Standard consequences (all undecidable by Rice): is L(M) empty? finite? regular? context-free? equal to Σ*? does it contain a given string? do two machines accept the same language?</p>',

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">Nov25 Q10 (1 mark)</span> State Rice\'s theorem.','Every non-trivial property of the languages accepted by Turing machines is undecidable: if P is a non-trivial property of RE languages, then the language { ⟨M⟩ : L(M) ∈ P } is undecidable. (A property is trivial if all RE languages have it or none do.)'),
P('Use Rice\'s theorem to show that it is undecidable whether L(M) is empty.','"L(M) = ∅" is a property of the language of M. It is non-trivial: ∅ has it and Σ* does not (and both are RE). So by Rice\'s theorem { ⟨M⟩ : L(M) = ∅ } is undecidable.'),
P('Why is "M has an even number of states" decidable even though it is a property of Turing machines?','It is a property of the machine\'s description, not of its language: two machines accepting the same language can differ in the number of states. Rice\'s theorem is about properties of the language, so it does not apply, and the question is decidable by counting the states of the encoding.'),
'</ol>'
].join('');
CONTENT['6.5']={h:C65,exam:['Nov25 Q10','teacher Rice notes']};

/* ---------------- 6.6 PCP ---------------- */
var C66=[
'<p>The <b>Post correspondence problem (PCP)</b> is a famous undecidable problem about strings that has nothing to do with machines, which makes it useful for proving other problems undecidable (such as ambiguity of grammars). It is asked as "Illustrate PCP with a suitable example" (Supp Q24b, 6 marks) and in QB Q34 (find a match, show there is none, the modified PCP).</p>',

'<h2>The problem</h2>',
'<p>You are given two lists of strings of the same length, <b>A = (w₁, …, wₙ)</b> and <b>B = (v₁, …, vₙ)</b>. Think of n <b>dominoes (tiles)</b>, tile i having wᵢ on top and vᵢ on the bottom. A <b>solution</b> (match) is a sequence of tile numbers i₁, i₂, …, iₖ (repeats allowed, k ≥ 1) such that <b>the top strings joined together equal the bottom strings joined together</b>: w<sub>i₁</sub>w<sub>i₂</sub>…w<sub>iₖ</sub> = v<sub>i₁</sub>v<sub>i₂</sub>…v<sub>iₖ</sub>. PCP asks: is there such a sequence? It is <b>undecidable</b> (in general no algorithm answers it), though it is semi-decidable (a search finds a match if one exists).</p>',
'<h2>How to look for a match by hand</h2>',
'<ol class="steps"><li>Start with a tile whose top and bottom begin with the same symbol.</li><li>The joined strings must stay "compatible": one must be a prefix of the other. Look at the extra symbols that overhang.</li><li>Choose the next tile that matches the overhang, and repeat. Stop when the two strings are equal.</li></ol>',

'<h2>Solved models</h2>',
MODEL('1. The teacher\'s example <span class="src">PCP Notes</span>','<p>A = [aa, bb, abb] and B = [aab, ba, b]. The sequence 1, 2, 1, 3 gives the top string aa·bb·aa·abb = aabbaaabb and the bottom string aab·ba·aab·b = aabbaaabb. They are equal, so 1 2 1 3 is a match. The widget searches for the shortest match.</p>'),
PCPW('A = [aa, bb, abb], B = [aab, ba, b]','aa/aab, bb/ba, abb/b'),
MODEL('2. Find a match <span class="src">QB Q34 (a)</span>','<p>P₁ = (1, 111), P₂ = (10111, 10), P₃ = (10, 0). Step by step (teacher\'s Example 1): start with tile 2 (top 10111, bottom 10); the bottom needs extra 1s, so add tile 1 twice (top 10111·1·1, bottom 10·111·111); now the bottom has an extra 1 at the end... finally add tile 3. <b>The match is 2 1 1 3</b>: top 10111·1·1·10 = 101111110, bottom 10·111·111·0 = 101111110.</p>'),
PCPW('QB Q34(a)','1/111, 10111/10, 10/0'),
MODEL('3. Show that there is no match <span class="src">QB Q34 (b)</span>','<p>P₁ = (0, 00) and P₂ = (1, 11). In <b>every</b> tile the bottom string is longer than the top string (00 is longer than 0 and 11 is longer than 1). So for any sequence of tiles, the bottom string is strictly longer than the top string, and they can never be equal. <b>General rule:</b> if in every tile |top| &lt; |bottom| (or in every tile |top| &gt; |bottom|), the instance has no solution. Another quick test: if no tile has top and bottom beginning with the same symbol, there is no way to start.</p>'),
PCPW('QB Q34(b): the search finds nothing, and the reason is shown','0/00, 1/11'),

'<h2>The modified PCP (MPCP) and the reduction</h2>',
'<p>In the <b>modified PCP</b> a match must <b>start with the first tile</b>: w₁w<sub>i</sub>…w<sub>k</sub> = v₁v<sub>i</sub>…v<sub>k</sub>. To show PCP is undecidable the proof goes in two steps:</p>',
'<ol class="steps"><li><b>L<sub>u</sub> reduces to MPCP.</b> Given a TM M and an input w, build an MPCP instance whose matches correspond to <b>accepting computations</b> of M on w. The first tile is (#, #q₀w#) (the start ID); for every transition there are tiles that copy the tape and carry out the move (a tile like (qX, Yp) for a right move); there are copy tiles (a, a) and (#, #); and when the final state is reached, extra tiles let the top string "catch up" with the bottom, so the two strings can become equal only after an accepting state appears. The bottom string runs one ID ahead of the top, and a match exists exactly when M accepts w.</li><li><b>MPCP reduces to PCP.</b> The tiles are rewritten with a new symbol * so that the first tile is forced to be used first.</li></ol>',
'<p><b>The MPCP → PCP rule (your teacher\'s slides).</b> Use two new symbols * and $. For the first string of each pair, add * <b>after</b> every character. For the second string, add * <b>before</b> every character. Add the pair ($, *$). Make another copy of the first pair, with an extra * in front of the first string; that copy is now the only tile that can start a match.</p>',
MODEL('Example: MPCP to PCP <span class="src">teacher PCP notes</span>','<p>MPCP instance (in order): (110, 10), (0, 01), (100, 001). The first string of each pair gets * after every character and the second gets * before every character: (1*1*0*, *1*0), (0*, *0*1), (1*0*0*, *0*0*1); add the copy of the first pair with an extra * on the first string, (*1*1*0*, *1*0), and the end pair ($, *$).</p>'+TBL(['MPCP pair','PCP pair'],mpcp2pcp(pcpParse('110/10, 0/01, 100/001')).map(function(t,i,a){return [i===0?'(first pair, copy with extra *)':i===a.length-1?'(end pair)':'tile '+i,'<code>('+esc(t[0])+', '+esc(t[1])+')</code>']}),'c')),

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">Supp Q24b</span> Illustrate the Post correspondence problem with a suitable example.','Take the two lists A = (aa, bb, abb) and B = (aab, ba, b), i.e. tiles aa/aab, bb/ba, abb/b. The sequence 1, 2, 1, 3 gives the top string aa·bb·aa·abb = aabbaaabb and the bottom string aab·ba·aab·b = aabbaaabb. They are equal, so the PCP instance has the solution 1 2 1 3. PCP asks whether such a sequence exists for a given pair of lists; it is undecidable in general.'),
P('Does the PCP instance (10, 101), (011, 11), (101, 011) have a match? Search first.',PCPW('Search','10/101, 011/11, 101/011')),
P('<span class="src">QB Q34</span> State the general rule that shows an instance has no solution.','If in every tile the bottom string is longer than the top string (or in every tile the top is longer than the bottom), the joined bottom string is always longer than the joined top string, so no sequence can make them equal.'),
'</ol>'
].join('');
CONTENT['6.6']={h:C66,exam:['Supp Q24b','QB Q34','teacher PCP notes']};

/* ---------------- 6.7 decidable vs undecidable ---------------- */
var C67=[
'<p>The last chunk collects what you have learnt into the classification the exam asks for: "Differentiate decidable from undecidable problems" (Supp Q16, 3 marks) and "List two undecidable problems" (Nov 2025 Q9).</p>',

'<h2>Definitions</h2>',
TBL(['Term','Meaning'],[
 ['<b>decidable problem</b>','some Turing machine <b>halts on every input</b> with the correct yes/no answer (a decider, i.e. an algorithm). The language of yes-instances is <b>recursive</b>'],
 ['<b>semi-decidable problem</b>','some TM halts and says yes on the yes-instances, but may loop on the no-instances. The language is <b>RE</b>'],
 ['<b>undecidable problem</b>','no Turing machine decides it, i.e. no algorithm can solve all instances']]),
'<div class="callout ok"><b>Differentiate decidable from undecidable (3 marks).</b> A decidable problem has an algorithm (a TM that always halts) giving the right yes/no answer on every instance, for example "is w in the regular language L?" An undecidable problem has no such algorithm, for example the halting problem: no machine can decide, for every M and w, whether M halts on w. A decidable problem\'s language is recursive; an undecidable problem\'s language is not recursive (it may be RE, like L<sub>u</sub>, or not even RE).</div>',

'<h2>Which problems are decidable?</h2>',

  if(!c.h)h+='<div class="card"><p>This chunk is still being built. It will appear here.</p></div>';
  else h+=c.h;
  h+='<div class="card" style="margin-top:28px"><div class="row" style="justify-content:space-between"><span>'+(c.s==='done'?'You marked this chunk as done.':'Finished this chunk?')+'</span><button data-mark class="'+(c.s==='done'?'':'primary')+'">'+(c.s==='done'?'Mark as not done':'Mark as done')+'</button></div></div>';
  var p=ALL[i-1],n=ALL[i+1];
  h+='<div class="nav">'+(p?'<a class="btn" href="#'+p.id+'">← '+p.no+' '+esc(p.t)+'</a>':'<span></span>')+(n?'<a class="btn" href="#'+n.id+'">'+n.no+' '+esc(n.t)+' →</a>':'')+'</div>';
  return h;
}
function hydrate(root){
  /* a question that comes with a diagram: show that diagram inside the question block, as on the paper */
  $$('.card.model > .pyq[data-dia]',root).forEach(function(q){
    var nx=q.parentNode.nextElementSibling,src=nx&&nx.querySelector('[data-fa]');
    if(!src||q.querySelector('.fa'))return;
    var w=document.createElement('div');w.className='w';
    w.innerHTML='<div class="cap">Diagram given with the question</div><div class="fa" data-sim="0"></div>';
    w.lastChild.setAttribute('data-fa',src.getAttribute('data-fa'));
    var note=q.querySelector('.pdia');q.insertBefore(w,note);
  });
  hydrateTrees(root);
  Object.keys(WIDGETS).forEach(function(sel){$$(sel,root).forEach(function(el){if(!el.dataset.hyd){el.dataset.hyd=1;WIDGETS[sel](el)}})});
  $$('.g',root).forEach(function(el){
    if(el.dataset.done)return;el.dataset.done=1;
    el.innerHTML=el.innerHTML.replace(/(<[^>]*>)|([A-Z])/g,function(m,tag,cap){return tag?tag:'<span class="v">'+cap+'</span>'});
  });
  $$('.gbox',root).forEach(function(el){
    if(el.dataset.done)return;el.dataset.done=1;
    el.innerHTML=el.innerHTML.replace(/[A-Z]/g,function(m){return '<span class="v">'+m+'</span>'});
  });
}
function route(){
  var id=(location.hash||'#home').slice(1),main=$('#main');
  document.body.classList.remove('open');recalc();
  var SS=SECS.filter(function(S){return S.id===id})[0];
  if(SS){side(id);main.innerHTML=srcPage(SS)}
  else if(id==='home'||!ALL.some(function(c){return c.id===id})){side('home');main.innerHTML=home()}
  else{var i=ALL.map(function(c){return c.id}).indexOf(id);side(id);main.innerHTML=chunk(ALL[i],i)}
  hydrate(main);
  var mk=$('[data-mark]',main);if(mk)mk.onclick=function(){if(PROG[id])delete PROG[id];else PROG[id]=1;saveProg();var y=window.scrollY;route();window.scrollTo(0,y)};
  var rp=$('[data-resetprog]',main);if(rp)rp.onclick=function(){if(confirm('Reset all TOC progress in this browser?')){PROG={};saveProg();route()}};
  var mb=$('.menu',main);if(mb)mb.onclick=function(){document.body.classList.toggle('open')};
  var a=$('#side a.on');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'});
  window.scrollTo(0,0);
  if(PEND){var PP=PEND;PEND=null;setTimeout(function(){pend(PP)},80)}
}
if(typeof document!=='undefined'&&document.getElementById('main')){window.addEventListener('hashchange',route);route()}

</script>
