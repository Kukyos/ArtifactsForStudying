/* ---------------- 2.2 NFA ---------------- */
var C22=[
'<p>In a DFA every state has at most one arrow for each symbol. An <b>NFA</b> (non-deterministic finite automaton) drops that rule: a state may have <b>several</b> arrows with the same symbol, or none.</p>',

'<h2>Why NFAs exist</h2>',
'<p>Some languages are much easier to describe by <i>guessing</i>. "The third symbol from the right is 1" needs only <b>4</b> states as an NFA, but the smallest DFA needs <b>8</b>. Every NFA can be converted to a DFA (chunk 2.4), so NFAs add convenience, not power.</p>',

'<h2>Formal definition</h2>',
TBL(['Part','Meaning'],[
 ['<b>Q</b>','finite set of states'],['<b>Σ</b>','alphabet'],
 ['<b>δ</b>','δ : Q × Σ → 2<sup>Q</sup>. The answer is a <b>set</b> of states, possibly empty, possibly several'],
 ['<b>q₀</b>','start state'],['<b>F</b>','final states']]),
'<h3>DFA vs NFA</h3>',
TBL(['','DFA','NFA'],[
 ['moves for one (state, symbol)','at most one','zero, one, or many'],
 ['δ returns','one state','a set of states'],
 ['string accepted when','the single path ends in F','<b>at least one</b> path ends in F'],
 ['string rejected when','the path ends outside F or gets stuck','<b>every</b> path ends outside F or gets stuck'],
 ['number of states','may need many','often far fewer'],
 ['languages recognised','regular languages','the same regular languages']]),

'<h2>How an NFA computes</h2>',
'<p><b>Picture 1 (clones).</b> When a state has two arrows for the symbol just read, the machine splits into two copies, one per arrow. A copy with no arrow for the next symbol disappears. At the end the string is accepted if <b>any</b> copy is in a final state.</p>',
'<p><b>Picture 2 (a lucky guess).</b> The string is accepted if there <b>exists</b> some sequence of choices that leads to a final state.</p>',
'<div class="callout ok"><b>What you actually do on paper:</b> keep the <b>set of states</b> the machine could be in. Start with {q₀}. To read a symbol, take the union of the moves of every state in the set. The string is accepted if the final set contains a final state.</div>',
'<p>Formally, <code>δ̂(q, ε) = {q}</code> and <code>δ̂(q, wa) = ∪ δ(p, a) for every p in δ̂(q, w)</code>. The language is <code>L(M) = { w : δ̂(q₀, w) ∩ F ≠ ∅ }</code>.</p>',

'<h2>Designing an NFA: the guessing patterns</h2>',
TBL(['Language','Shape of the NFA'],[
 ['<b>ends with</b> x','a start state that loops on every symbol, then a chain that spells x (the NFA "guesses" where x starts)'],
 ['<b>contains</b> x','loop at the start, a chain spelling x, and a final state that loops on every symbol'],
 ['<b>k-th symbol from the right is c</b>','loop at the start, an arrow on c, then k − 1 arrows on any symbol, the last state is final'],
 ['<b>L₁ or L₂</b> (union)','two separate branches leaving the start state, one for each case']]),

'<h2>Solved models</h2>',

MODEL('1. Which strings does the NFA accept? <span class="src">Nov25 Q3 (1 mark)</span>','<p>This NFA accepts every string that contains <b>00 or 11</b> (the upper branch finds 00, the lower branch finds 11). For each given string, track the set of states:</p>'+TRACE('nfaQ3','01')+TRACE('nfaQ3','001')+TRACE('nfaQ3','110')+TRACE('nfaQ3','101')+'<p>A string is accepted when the last set contains q₂ or q₄. <b>Accepted: 001 and 110.</b> Rejected: 01 and 101.</p>'),
MW('nfaQ3','The NFA of the Nov 2025 question. Step through 001 and watch the highlighted set.'),

MODEL('2. Trace a string and give the resulting set <span class="src">IA2 1d (2 marks)</span>','<p>The NFA accepts strings containing <b>01</b>. Determine the sequence of state sets for <code>0110</code> starting from q₀:</p>'+STEPTBL('nfaIA2d','0110')+'<p>Write your answer as the chain <code>{q₀} →<sup>0</sup> {q₀,q₁} →<sup>1</sup> {q₀,q₂} →<sup>1</sup> {q₀,q₂} →<sup>0</sup> {q₀,q₁,q₂}</code> and the resulting set <b>{q₀, q₁, q₂}</b>, which contains the final state q₂.</p>'),
MW('nfaIA2d','Contains 01'),

MODEL('3. Ends with 01','<p>Loop on every symbol at q₀, then spell 01. The NFA "guesses" that the last two symbols have started.</p>'),
MW('nfaEnd01','Ends with 01 (3 states, the same size as the DFA from 2.1)'),

MODEL('4. The third symbol from the right is 1 <span class="src">QB Q8</span>','<p>Loop at q₀, read the 1 (the guess), then <b>two</b> more symbols of any kind, then stop. 4 states.</p><p>A DFA for this language must remember the last 3 symbols, which is 2³ = <b>8</b> states. Chunk 2.4 converts this NFA and you will get exactly 8.</p>'),
MW('third1','Third symbol from the right is 1'),

MODEL('5. Contains 010 or 101 (a union of two cases)','<p>Two branches from q₀: the upper chain spells 010, the lower chain spells 101. Both end in a final state that loops on every symbol. 7 states.</p>'),
MW('has010or101','Contains 010 or 101'),

'<div class="callout ok"><b>Two facts to remember.</b> Every DFA is also an NFA (it just never has a choice). Every NFA has an equivalent DFA (subset construction, 2.4). So DFA and NFA accept exactly the <b>regular languages</b>.</div>',

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">Nov25 Q3 style</span> Which of <code>abab</code>, <code>bba</code>, <code>aab</code>, <code>bbb</code> are accepted by this NFA?'+MW('nfaP2','This NFA accepts strings containing ab',{sim:false,table:false}),TRACE('nfaP2','abab')+TRACE('nfaP2','bba')+TRACE('nfaP2','aab')+TRACE('nfaP2','bbb')+'Accepted: abab and aab (they contain ab).'),
P('<span class="src">IA2 1d style</span> Trace <code>1010</code> on this NFA starting from q₀ and give the resulting set.'+MW('nfaP1','This NFA accepts strings ending with 10',{sim:false,table:false}),STEPTBL('nfaP1','1010')),
P('<span class="src">QB Q8 style</span> Design an NFA over {0,1} in which the <b>fourth</b> symbol from the right is 0.',MW('fourth0','Loop, one 0, then three symbols of any kind: 5 states (a DFA would need 16)')),
P('Design an NFA over {0,1} for strings that end with 010.',MW('nfaP3','Loop at q₀, then spell 010')),
P('Design an NFA for 0⁺1⁺ (one or more 0s followed by one or more 1s).',MW('nfaP4','q₀ loops on 0 and also guesses the last 0 by moving to q₁; q₂ loops on 1')),
P('<span class="src">Part A style</span> Differentiate DFA and NFA.','Use the comparison table above: at most one move vs zero/one/many moves; δ returns a state vs a set of states; accept = the one path ends in F vs some path ends in F; both accept exactly the regular languages.'),
'</ol>'
].join('');

/* ---------------- 2.3 epsilon-NFA ---------------- */
var C23=[
'<p>An <b>ε-NFA</b> is an NFA that may also move <b>without reading any symbol</b>. These free moves are written with the label ε. They make some constructions (union, star, Thompson in 2.6) very simple.</p>',

'<h2>Definition</h2>',
'<p>Same five parts as an NFA, but <code>δ : Q × (Σ ∪ {ε}) → 2<sup>Q</sup></code>. An arrow labelled ε can be followed at any time, without consuming input.</p>',

'<h2>ε-closure</h2>',
'<p>The <b>ε-closure of a state q</b>, written <code>ε-closure(q)</code>, is the set of all states you can reach from q using <b>only ε-arrows</b> (zero or more of them). It <b>always contains q itself</b>. For a set of states it is the union of the closures.</p>',
'<ol class="steps"><li>Write q in the set.</li><li>For every state in the set, add every state reached by an ε-arrow from it.</li><li>Repeat step 2 until nothing new is added. (Chains count: if p →ε q and q →ε r, then r is in the closure of p.)</li></ol>',

'<h2>Running an ε-NFA</h2>',
'<p>Start with <code>ε-closure(q₀)</code>. To read a symbol a: take every state in the current set, follow all <b>a</b>-arrows, collect the targets, then take the ε-closure of that collection. Formally <code>δ̂(q, wa) = ε-closure( ∪ δ(p, a) for p in δ̂(q, w) )</code>. The string is accepted if the final set contains a final state.</p>',

'<h2>Solved models</h2>',

MODEL('1. ε-closures of every state <span class="src">QB Q7</span>','<p>The ε-NFA has start state p and final state s, with δ(p,0)={p}, δ(p,ε)={q}, δ(q,1)={q,r}, δ(r,0)={s}, δ(r,ε)={p}, δ(s,1)={s}. Its ε-arrows are p → q and r → p.</p>'+closureTableHTML(JSON.parse(FAJ(MACH.epsQB7.sts,MACH.epsQB7.start,MACH.epsQB7.fin,MACH.epsQB7.tr)))+'<p><b>Why ε-closure(r) = {r, p, q}:</b> r has an ε-arrow to p, and p has an ε-arrow to q. Chains count.</p>'),
MW('epsQB7','The ε-NFA of question bank Q7. Step through 1101: the sets shown already include the ε-closure.'),

MODEL('2. The ε-NFA of the Nov 2025 paper <span class="src">Nov25 Q12 (3 marks)</span>','<p>q₀ loops on a and has an ε-arrow to q₁ (final). ε-closure(q₀) = {q₀, q₁} and ε-closure(q₁) = {q₁}. Since the start closure already contains the final state q₁, the empty string is accepted, and the language is <b>a*</b>.</p>'),
MW('epsE1','Nov 2025 Q12: ε-NFA for a*'),

MODEL('3. Tracing strings on an ε-NFA','<p>For the QB Q7 machine:</p>'+TRACE('epsQB7','1')+TRACE('epsQB7','101')+TRACE('epsQB7','1101')+TRACE('epsQB7','0')+'<p>Each set is shown after the ε-closure. The machine accepts when s is in the last set. The language is strings of the form (0*1⁺)⁺ 0 1*.</p>'),

MODEL('4. Removing the ε-moves (ε-NFA → NFA)','<p>Rule: <code>δ′(q, a) = ε-closure( δ( ε-closure(q), a ) )</code>. A state becomes final if its ε-closure contains an old final state. The start state stays the same. The widget below does this for an ε-NFA that accepts a*b*.</p>'),
EPS('ε-NFA for a*b* turned into an NFA without ε','epsB'),

'<div class="callout ok"><b>Equivalence.</b> ε-NFA, NFA and DFA all accept exactly the regular languages. To go from an ε-NFA to a DFA you do not need to remove ε first: the subset construction in the next chunk takes the ε-closure at every step.</div>',

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">QB Q7 style</span> Find the ε-closure of every state of this ε-NFA.'+MW('epsIA2','Start q₀, finals q₃ and q₄',{sim:false,table:true}),closureTableHTML(JSON.parse(FAJ(MACH.epsIA2.sts,MACH.epsIA2.start,MACH.epsIA2.fin,MACH.epsIA2.tr)))+'The ε-arrows are q₁→q₃ and q₂→q₁, so ε-closure(q₂) = {q₂, q₁, q₃}.'),
P('Trace <code>ab</code> on the same ε-NFA.',TRACE('epsIA2','ab')+'The set after each symbol already includes the ε-closure.'),
P('<span class="src">Nov25 Q12 style</span> Remove the ε-moves from the ε-NFA for a*.',EPS('ε-NFA for a* turned into an NFA without ε','epsE1')),
P('Is the empty string accepted by the ε-NFA for a*b*? Why?','Yes. ε-closure(q₀) = {q₀, q₁} and q₁ is final, so the start closure contains a final state.'),
'</ol>'
].join('');

/* ---------------- 2.4 subset construction ---------------- */
var C24=[
'<p>This is the algorithm behind "<b>Convert the given NFA to DFA</b>" (Nov 2025 Q12 for 3 marks and Q17b for 6 marks, Supp Q17a, IA2 1e(i) for 7 marks, QB Q7 and Q8). It is one of the most reliably asked questions in the whole paper.</p>',

'<h2>The idea</h2>',
'<p>After reading some input, an NFA could be in several states at once. A DFA cannot be in several states, so let the DFA have <b>one state for each set of NFA states</b>. The set tells you exactly where the NFA could be. Because the DFA state is the whole set, the DFA never has to guess.</p>',

'<h2>The algorithm (the way your teacher writes it)</h2>',
'<ol class="steps"><li><b>(ε-NFA only)</b> Write the ε-closure of every state.</li><li><b>Start state of the DFA</b> = the NFA start state (for an ε-NFA: its ε-closure).</li><li>Take the start state. For each input symbol a, work out <code>δ(set, a)</code> as the union of <code>δ(q, a)</code> over the states q in the set (for an ε-NFA take the ε-closure of that union). The result is a set.</li><li>If the set is <b>new</b>, call it <b>N.S.</b> (new state) and work it out later too. If it has appeared before it is an <b>O.S.</b> (old state).</li><li>Repeat until every result is an old state. Only <b>reachable</b> sets are ever built.</li><li><b>Final states:</b> every subset that contains at least one final state of the NFA.</li><li>Draw the DFA, naming each state by its subset.</li></ol>',
'<div class="callout"><b>If the empty set ∅ appears</b> (a move with no target), it is a real DFA state: a trap state with arrows to itself on every symbol. Teacher: "the DFA must be total, so add a trap state for any missing transition."</div>',
'<p><b>Size.</b> An NFA with n states gives a DFA with at most 2ⁿ states. Usually far fewer are reachable, but some NFAs really need all of them (Model 4).</p>',
'<p><b>Why it is correct (proof idea).</b> By induction on the length of the string: after reading w, the DFA is in exactly the set of states the NFA could be in. So the DFA accepts w exactly when that set contains a final state, which is exactly when the NFA accepts w.</p>',

'<h2>Solved models</h2><p>Each widget below computes the whole working: closures, every δ line with N.S./O.S., the transition table, the final states, and the DFA diagram. Write your answer in the same order.</p>',

MODEL('1. A plain NFA, ends with 01','<p>Every step is a union of the single-state moves.</p>'),
SUB('NFA for strings ending with 01','nfaEnd01',{input:'1101'}),

MODEL('2. The ε-NFA of Nov 2025 Q12 <span class="src">Nov25 Q12 (3 marks)</span>','<p>The closure of the start state is {q₀, q₁}. It loops on a to itself, so the DFA has one state.</p>'),
SUB('ε-NFA with q₀ looping on a and ε to q₁','epsE1',{input:'aaa'}),

MODEL('3. The ε-NFA of question bank Q7 (12-mark style) <span class="src">QB Q7</span>','<p>Start state p, final state s. Follow the algorithm: write the closures, then the start state ε-closure(p) = {p,q}, then every move. This has '+SUBCOUNT('epsQB7')+' reachable DFA states.</p>'),
SUB('ε-NFA of QB Q7','epsQB7',{input:'1101'}),

MODEL('4. "How many states does the DFA have, and why?" <span class="src">QB Q8</span>','<p>The NFA for "third symbol from the right is 1" has 4 states. The reachable DFA has <b>'+SUBCOUNT('third1')+'</b> states, which is all 2³ combinations of "was the last, second-last, third-last symbol a 1?". The DFA must remember the last three symbols, so it cannot have fewer. This shows that the exponential blow-up of the subset construction is real.</p>'),
SUB('NFA: third symbol from the right is 1','third1',{input:'0100'}),

MODEL('5. A five-state ε-NFA <span class="src">IA2 1e(i) (7 marks)</span>','<p>The IA2 paper had an ε-NFA of this size. Take your time with the closures, since the arrows into a state change the closure of the states before it.</p>'),
SUB('An ε-NFA with 5 states (start q₀, finals q₃ and q₄)','epsIA2',{input:'ab'}),
MODEL('6. An ε-NFA given as a table <span class="src">QA2 Q1 (10 marks)</span>','<p>Write the ε-closure of each state first, then start the DFA at the closure of q₀ and, for each symbol, take the union of the moves of every state in the subset and close the result.</p>'+closureTableHTML(JSON.parse(FAJ(MACH.qa2q1.sts,MACH.qa2q1.start,MACH.qa2q1.fin,MACH.qa2q1.tr)))),
SUB('QA2 Q1 as a diagram (start q0, final q2)','qa2q1',{input:'aab'}),
MODEL('7. An NFA with no ε-moves <span class="src">QA2 Q2 (10 marks)</span>','<p>q₀ loops on 0 and 1 and also goes to q₁ on 0. q₁ goes to q₂ on 0 or 1, and q₂ (final) loops on 0, 1. Start from {q₀} and list only the subsets that are reached.</p>'),
SUB('The NFA of QA2 Q2','qa2q2',{input:'0100'}),
MODEL('8. NFA for strings ending in 01, then the DFA <span class="src">QA2 Q3 (10 marks)</span>','<p>The NFA guesses where the final 01 starts: q₀ loops on 0,1, goes to q₁ on 0, and q₁ goes to q₂ on 1. Below, each set in the trace is exactly one DFA state.</p>'+TRACE('nfaEnd01','1001')+TRACE('nfaEnd01','110')),
SUB('NFA for strings ending with 01','nfaEnd01',{input:'1001'}),
MODEL('9. A four-state ε-NFA <span class="src">QA2 Q4 (10 marks)</span>','<p>Only ε-closure(q₀) = {q₀, q₁} matters at the start. From there only a is possible (to q₂), then only b (to q₃). A move that has no arrow leads to the ∅ state, which is kept. Minimization of this DFA is in chunk 2.7.</p>'),

MODEL('11. The ε-NFA with states 1 to 6 <span class="src">teacher QB Q1</span>','<p>Closures first (3 → 6 and 5 → 3 are ε-arrows, so ε-closure(5) includes 3 and 6). The DFA starts at ε-closure(1).</p>'+closureTableHTML(JSON.parse(FAJ(MACH.tqb1.sts,MACH.tqb1.start,MACH.tqb1.fin,MACH.tqb1.tr)))),
SUB('The ε-NFA of teacher QB Q1 (start 1, final 6)','tqb1',{input:'ba'}),

/* ---------------- 2.5 regular expressions ---------------- */
var C25=[
'<p>A <b>regular expression (RE)</b> is a short formula that describes a whole language. It is the third way to describe a regular language (after DFA and NFA), and it is how patterns are written in tools like grep. Regular expressions, NFAs and DFAs all describe exactly the same languages.</p>',

'<h2>Definition</h2>',
'<p>R is a regular expression if it is built by these rules (the rules are <b>recursive</b>: the pieces are themselves regular expressions):</p>',
TBL(['Rule','Expression','Language it stands for'],[
 ['basis','<code>a</code> (a symbol of Σ)','{a}'],
 ['basis','<code>ε</code>','{ε}'],
 ['basis','<code>Ø</code>','Ø, the empty language (no strings at all)'],
 ['union','<code>R₁ + R₂</code>','L(R₁) ∪ L(R₂)'],
 ['concatenation','<code>R₁R₂</code>','L(R₁)L(R₂): a string from R₁ followed by a string from R₂'],

'<p><b>Thompson\'s construction</b> turns a regular expression into an ε-NFA. It is the exam question "Construct an NFA for the language L = ((ab)*ab)+(ba*)" (Nov 2025 Q17a, 6 marks) and "…for the regular expression 0(01+1)*(11+0)" (Supp Q17b, 6 marks).</p>',

'<div class="split"><div style="flex:1 1 300px">'+FAS('Union R₁ + R₂ (here a+b): a new start and a new final state, ε-arrows into and out of both branches',thompsonRE('a+b'),{sim:false})+'</div><div style="flex:1 1 300px">'+FAS('Concatenation R₁R₂ (here ab): the final state of R₁ and the start state of R₂ are the same state (no ε-arrow)',thompsonRE('ab'),{sim:false})+'</div></div>',

'<h2>The method</h2>',
'<ol class="steps"><li>Read the expression and decide the order: brackets first, then <code>*</code>, then concatenation, then <code>+</code>.</li><li>Draw the machine for each symbol, then combine them with the rule for each operator, working from the inside out.</li><li>Label the states A, B, C, … in the finished diagram, left to right: for a union the new start, then the upper branch, then the lower branch, then the new final state. The start state gets the incoming arrow and the final state a double circle.</li><li>Read the finished diagram: ε-arrows are free moves. (If the question wants an NFA without ε, remove the ε-moves with the method of chunk 2.3, or draw a smaller NFA directly, as in the shortcut models below.)</li></ol>',

var C27=[
'<p>Different DFAs can accept the same language, and some are bigger than they need to be. <b>Minimization</b> finds the smallest DFA for a language. It is asked as "Construct the minimized DFA for the given diagram" (Nov 2025 Q18a, 6 marks) and "Obtain its minimized equivalent DFA using state minimization" (Supp Q18, 12 marks), and QB Q9 is a full worked table.</p>',

'<h2>The idea: equivalent states</h2>',
'<p>Two states p and q are <b>equivalent</b> if no string can tell them apart: for <b>every</b> string w, reading w from p ends in a final state exactly when reading w from q does. Equivalent states are redundant and can be merged. States that some string separates are called <b>distinguishable</b>.</p>',
'<div class="callout ok"><b>Myhill–Nerode theorem</b> (your teacher\'s slides). Define x ∼ y when, for every z, xz ∈ L ⇔ yz ∈ L. L is regular exactly when ∼ has finitely many classes, and the number of classes is the number of states of the <b>minimal DFA</b>. Each class is one state. The minimal DFA is unique up to renaming of states.</div>',

'<h2>The table-filling method (your teacher\'s steps)</h2>',
'<ol class="steps"><li><b>Remove unreachable states</b> (states you can never get to from the start).</li><li>Draw a table with one cell for every pair of states (the lower triangle).</li><li><b>Round 0:</b> mark every pair in which <b>exactly one</b> state is final. They are certainly different (the empty string tells them apart).</li><li><b>Propagate:</b> mark a pair (p, q) if, for some symbol a, the pair (δ(p,a), δ(q,a)) is <b>already marked</b>. Repeat rounds until a full round adds no new mark.</li><li>Every pair <b>left unmarked</b> is equivalent. <b>Merge</b> them into one state.</li><li>Redraw the DFA with the merged states.</li></ol>',
'<p><b>Partition refinement</b> is the same idea written as groups: start with {final states} and {non-final states}. Split a group whenever two of its states send some symbol to different groups. Stop when no group splits. Both methods give the same answer, so use whichever you like.</p>',
'<div class="callout">A <b>trap state</b> (a non-final state that loops on every symbol) takes part like any other state. If the DFA is given with missing arrows, add the trap state first, because minimization needs a complete DFA.</div>',

'<h2>Solved models</h2><p>The widgets do the whole working: the X<sub>k</sub> table, the reason for every mark, the partitions, the merge and the minimized DFA.</p>',

/* ---------------- 2.8 DFA to RE ---------------- */
var C28=[
'<p>The reverse of Thompson: given a DFA, find a regular expression for its language. Together the two prove that finite automata and regular expressions are equally powerful (Kleene\'s theorem). QB Q10 and IA2 1e(ii, 7 marks) ask exactly this.</p>',

'<h2>Method 1: state elimination (your teacher\'s method)</h2>',
'<p>Think of the DFA as a graph whose arrows can carry any regular expression. Remove the states one at a time, and fold every removed state into the labels of the arrows that went through it. When only the start and final state remain, the label on the single arrow is the answer.</p>',
'<ol class="steps"><li><b>Clean the ends.</b> If the start state has an incoming arrow, add a new start state <b>qi</b> with an ε-arrow to the old start. If there are several final states, or the final state has an outgoing arrow, add a new single final state <b>qf</b> with ε-arrows from the old final states.</li><li><b>Eliminate each intermediate state</b> (in any order). For every path <b>p → s → t</b> through the removed state s, draw a direct arrow p → t labelled <code>(label p→s)(loop on s)*(label s→t)</code>. If an arrow p → t already exists, join the two labels with +.</li><li>When only qi (or the start) and qf (or the final) remain, the label between them is the regular expression.</li></ol>',
'<div class="callout"><b>Useful tips.</b> Anything glued to ε stays unchanged (ε·a = a). A state with no loop contributes nothing for the loop part. Different elimination orders give different-looking but equal expressions.</div>',

'<h2>Method 2: Arden\'s theorem (equations)</h2>',
'<p><b>Arden\'s theorem.</b> If P does not contain ε, the equation <b>R = Q + RP</b> has the unique solution <b>R = QP*</b>.</p>',
'<ol class="steps"><li>Write one equation per state: the state\'s expression is the union of (the predecessor\'s expression followed by the arrow label). The start state also gets <code>+ ε</code>.</li><li>Solve by substituting one equation into the others, using Arden\'s theorem to remove each self-reference.</li><li>The answer is the union of the expressions of the final states.</li></ol>',

'<h2>Solved models</h2>',

MODEL('1. The teacher\'s first problem','<p>A DFA with start A and final state B, A →<sup>0</sup> B and B →<sup>1</sup> A. A has an incoming arrow and B has an outgoing arrow, so both qi and qf are added. Removing A gives qi →<sup>0</sup> B and a loop <code>10</code> on B. Removing B gives <code>0(10)*</code>. (If you remove B first you get (01)*0, which is the same language.)</p>'),
ELIM('Eliminate A, then B','elimT1'),

var PLPROOF='<div class="paper"><p><b>Statement.</b> Let L be a regular language. Then there exists a constant n such that if z is any word in L with |z| ≥ n, then z can be written z = uvw with</p><p>(i) |uv| ≤ n &nbsp;&nbsp; (ii) |v| ≥ 1 &nbsp;&nbsp; (iii) uvⁱw ∈ L for all i ≥ 0.</p><p><b>Proof.</b></p><p>1. L is regular, so there is a DFA M = (Q, Σ, δ, q₀, F) with <b>n states</b> that accepts L.</p><p>2. Let z = a₁a₂…aₘ ∈ L with m ≥ n. Let the states visited on reading z be q₀, q₁, …, qₘ, where qᵢ = δ̂(q₀, a₁a₂…aᵢ). The last one, qₘ, is a final state.</p><p>3. Look at the first n + 1 states q₀, q₁, …, qₙ. M has only n states, so by the <b>pigeonhole principle</b> two of them are equal: qᵢ = qⱼ with 0 ≤ i &lt; j ≤ n.</p><p>4. Split z: <b>u</b> = a₁…aᵢ (takes q₀ to qᵢ), <b>v</b> = aᵢ₊₁…aⱼ (a loop from qᵢ back to qᵢ), <b>w</b> = aⱼ₊₁…aₘ (takes qⱼ = qᵢ to qₘ).</p><p>5. Then |uv| = j ≤ n, and |v| = j − i ≥ 1. So (i) and (ii) hold.</p><p>6. Going round the loop v zero times (i = 0) or any number i of times ends in the same state qᵢ, and then w leads to the final state qₘ. So <span class="box">uvⁱw ∈ L for all i ≥ 0</span>. ∎</p><p class="pn">Draw this picture: q₀ —u→ qᵢ (loop v on qᵢ) —w→ qₘ. A picture with the loop on v earns the marks for the idea.</p></div>';
/* ---------------- 2.10 pumping lemma ---------------- */
var C210=[
'<p>The <b>pumping lemma</b> is how you prove a language is <b>not</b> regular. It is asked as "State and prove the pumping lemma for regular languages" (Nov 2025 Q18b, 6 marks; IA2 1c for 2 marks), and the question bank adds using it on {aⁿ²}, {0ⁿ1ᵐ | n &gt; m}, and equal numbers of a\'s and b\'s.</p>',

'<h2>Why it is true (one picture)</h2>',
'<p>A DFA has a fixed, finite number of states, say <b>n</b>. Read a long string and the machine must visit a state twice, so the string drives it around a <b>loop</b>. That loop can be repeated any number of times (or skipped), and the machine still ends in the same state. So some part of the string can be "pumped".</p>',

'<h2>Statement (your teacher\'s version)</h2>',
'<div class="callout ok"><p style="margin:0">Let L be a regular language. Then there is a constant <b>n</b> (the number of states of a DFA for L) such that every string <b>z ∈ L with |z| ≥ n</b> can be written <b>z = uvw</b> with</p><ol style="margin:6px 0 0"><li><b>|uv| ≤ n</b></li><li><b>|v| ≥ 1</b></li><li><b>uvⁱw ∈ L for every i ≥ 0</b></li></ol></div>',
'<p>(Many books write xyz instead of uvw. It is the same statement.)</p>',

'<h2>Proof of the pumping lemma (state it and prove it)</h2>',
'<ol class="steps"><li>Since L is regular, take a DFA M with n states that accepts it.</li><li>Take any z = a₁a₂…aₘ in L with m ≥ n. Let the states visited be q₀, q₁, …, qₘ, where qᵢ = δ̂(q₀, a₁…aᵢ). That is m + 1 ≥ n + 1 states.</li><li><b>Pigeonhole principle:</b> among the first n + 1 states q₀, …, qₙ, two are equal, because M only has n states. Say qᵢ = qⱼ with 0 ≤ i &lt; j ≤ n.</li><li>Split: <b>u</b> = a₁…aᵢ (reaches qᵢ), <b>v</b> = aᵢ₊₁…aⱼ (a loop from qᵢ back to qᵢ), <b>w</b> = aⱼ₊₁…aₘ (the rest).</li><li>Then |uv| = j ≤ n and |v| = j − i ≥ 1. Going around the loop zero times, once or many times leaves M in the same state, so uvⁱw leads to the same final state as uvw, which is accepting. Hence uvⁱw ∈ L for all i ≥ 0. ∎</li></ol>',

'<h2>How to use it: proving a language is NOT regular</h2>',
'<ol class="steps"><li><b>Assume</b> L is regular. Let n be its pumping constant.</li><li><b>Choose</b> a string z ∈ L with |z| ≥ n. (The choice is yours, so choose cleverly, usually with a block of n symbols at the start.)</li><li>The lemma says z = uvw with |uv| ≤ n and |v| ≥ 1. Because |uv| ≤ n, <b>v lies inside the first n symbols</b>. Work out what v can contain (<b>all cases</b>).</li><li><b>Pick i</b> (usually 0 or 2) and show uvⁱw ∉ L in every case.</li><li>This contradicts the lemma, so L is <b>not regular</b>. ∎</li></ol>',
'<div class="callout"><b>The pumping lemma can never prove a language IS regular.</b> It only says "every regular language has this property". Some non-regular languages also satisfy it, so passing the test proves nothing. To prove a language is regular, build a DFA, NFA or regular expression.</div>',

'<h2>Try it</h2><p>Pick a language, then choose the split yourself and watch the pumped string. Then press "Try every legal split" to see that all of them fail.</p>',

/* ---------------- 3.1 simplification ---------------- */
var C31=[
'<p>A grammar often contains junk: symbols that can never be used, rules that do nothing, and ε-rules that complicate things. <b>Simplifying</b> removes the junk without changing the language. You must simplify before converting to CNF or GNF or building a PDA. It is asked directly as "Eliminate useless symbols and productions" (Nov 2025 Q6, 1 mark), "Eliminate ε-production" (Supp Q3, 1 mark), "Simplify the grammar" (IA2 2e(ii), 7 marks together with CNF; QB Q13).</p>',

'<h2>The three kinds of junk</h2>',
TBL(['Kind','What it is','How to remove it'],[
 ['<b>Useless symbols</b>','a variable that cannot derive any string of terminals (<b>non-generating</b>), or that cannot be reached from the start symbol (<b>unreachable</b>)','(a) find the <b>generating</b> variables and delete the others with every rule that uses them; (b) from what is left, find the variables <b>reachable from S</b> and delete the rest'],
 ['<b>ε-productions</b>','rules A → ε','find the <b>nullable</b> variables (those that can derive ε); for every rule, add all versions with some nullable variables deleted; then delete the ε-rules'],
 ['<b>Unit productions</b>','rules A → B with one variable on the right','for every <b>unit pair</b> (A, B) with A ⇒* B, give A all the non-unit rules of B; then delete the unit rules']]),

'<h2>Useless symbols: two phases, in this order</h2>',
'<ol class="steps"><li><b>Generating symbols.</b> Start with every variable that has a rule made only of terminals. Repeatedly add a variable that has a rule whose symbols are all terminals or already-generating variables. Variables never added are non-generating: delete them and every rule that mentions them.</li><li><b>Reachable symbols.</b> Start with S. Repeatedly add every variable that appears on the right of a rule of a reachable variable. Variables never added are unreachable: delete them.</li></ol>',
'<div class="callout">The order matters. Find the generating symbols <b>first</b>; if you test reachability first, a symbol that is only reachable through a non-generating rule would wrongly survive.</div>',

'<h2>ε-productions</h2>',
'<p>A variable is <b>nullable</b> if A ⇒* ε. Rule: A is nullable if A → ε, or A → X₁X₂…Xₖ with every Xᵢ nullable. For a rule such as S → XYX where X and Y are nullable, you must add <b>every</b> way of dropping nullable symbols: XYX, YX, XX, XY, X, Y (and not the empty one). After that, delete all A → ε.</p>',
'<p>If the <b>start symbol is nullable</b> then ε ∈ L. The simplified grammar generates L − {ε} (an ε-production on the start symbol can only be kept by adding a new start symbol S′ → S | ε; your teacher says ε-productions can be removed from grammars that do not generate ε).</p>',

'<h2>Unit productions</h2>',
'<p>For A → B, replace the rule by every non-unit rule of B. Chains count: if A → B and B → C, then (A, C) is also a unit pair. Unit pairs make this systematic: for every pair (A, B), A gets all the non-unit rules of B.</p>',

'<h2>Which order?</h2>',
'<div class="callout ok"><b>Safe order: ε-productions, then unit productions, then useless symbols.</b> Removing ε-rules can create new unit rules (S → AB with B nullable gives S → A), and removing unit rules can leave useless symbols behind, so this order never needs repeating. The question bank (Q13) asks for exactly this order. Your teacher\'s CNF notes list useless → unit → ε instead; that also works, but then you must re-check for new unit rules and useless symbols at the end (the widgets below do this automatically and print an "extra pass" if one was needed).</div>',

'<h2>Solved models</h2><p>Each widget does the whole working. Write your exam answer in the same sequence.</p>',

MODEL('1. Useless symbols <span class="src">Nov25 Q6 (1 mark)</span>','<p>G = (V, T, P, S) with V = {S, A, B, C}, T = {a, b}. C only derives strings that still contain C (C → aCb), so it is non-generating; B is generating but never reached from S.</p>'),
SIMP('Nov 2025 Q6 (the teacher\'s order: useless first)',GR.nov25q6,'teacher'),

MODEL('2. ε-production <span class="src">Supp Q3 (1 mark)</span>','<p>S → 00S | 0S | ε and B → 1B | ε. S is nullable (S → ε). Replace each rule with and without S, then drop S → ε. Note that B can never be reached from S.</p>'),
SIMP('Supp Q3: eliminate the ε-production',GR.suppq3,'standard'),

MODEL('3. Simplify <span class="src">IA2 2e(ii)</span>','<p>S → AB | a, A → aA | ε, B → bBb | b. A is nullable, so S → AB also gives S → B (a new unit production!), which is why the order ε → unit matters.</p>'),

MODEL('4. All three at once <span class="src">QB Q13</span>','<p>The question bank\'s grammar needs every step: nullable X and Z, a unit rule T → Y, a non-generating W (W → Wb never ends), and an unreachable V.</p>'),

'<h2>Practice</h2><ol class="practice">',

/* ---------------- 3.3 GNF ---------------- */
var C33=[
'<p>A grammar is in <b>Greibach normal form (GNF)</b> if every production has the shape <b>A → a α</b>, where <b>a is a terminal</b> and <b>α is a (possibly empty) string of variables</b>. Every rule starts by writing a terminal, so every derivation step produces one symbol of the string: that is exactly what a pushdown automaton without ε-moves needs. It is asked in Nov 2025 Q19 (CNF and GNF together, 12 marks) and QB Q15.</p>',

'<h2>The easy cases (your teacher\'s method)</h2>',
'<p>If no rule begins with a variable:</p><ol class="steps"><li>Simplify (remove unit, ε and useless).</li><li>Wherever a <b>terminal appears after the first symbol</b>, replace it by a new variable and add the rule for it: A → aBb becomes A → aBB₁ with B₁ → b.</li></ol>',
'<p>If a rule begins with a variable (A → Bγ), <b>substitute</b> B\'s productions for B until the rule begins with a terminal, then do step 2.</p>',
GNFW('Teacher: S → AB, A → aA | bB | b, B → b',GR.gn1),
GNFW('Teacher: S → abSb | aa',GR.gn2),
GNFW('Teacher: S → ABb | a, A → aaA | B, B → bAb (a unit rule first)',GR.gn3),
GNFW('Teacher: S → aSb | ab',GR.gn4),
GNFW('Teacher: S → ab | aS | aaS',GR.gn5),

'<h2>The general method: variable ordering and left recursion</h2>',
'<p>Problems appear when a rule starts with a variable in a loop: <b>A → Aα</b> is <b>left-recursive</b> and can never become "terminal first" by substitution alone (the substitution would just reproduce the same rule). The general algorithm handles it.</p>',
'<ol class="steps"><li><b>Order the variables</b> A₁, A₂, …, Aₙ (the question may give the order; otherwise use the order they appear).</li><li>For i = 1, 2, …, n: if a rule Aᵢ → Aⱼγ has <b>j &lt; i</b>, replace Aⱼ by the right sides of Aⱼ. Repeat until every rule of Aᵢ starts with a terminal or with Aⱼ for <b>j ≥ i</b>.</li><li><b>Remove immediate left recursion.</b> If Aᵢ → Aᵢα₁ | … | Aᵢαᵣ | β₁ | … | βₛ (the β\'s do not start with Aᵢ), replace by <b>Aᵢ → β | βZ</b> for each β, and a new variable <b>Z → α | αZ</b> for each α.</li><li>Now every rule starts with a terminal or a variable with a <b>larger</b> index. Work <b>backwards</b> from Aₙ to A₁: substitute for the leading variable so that every rule starts with a terminal. Then do the same for the new Z variables.</li><li>Replace terminals after the first symbol by new variables (as in the easy case).</li></ol>',

/* ---------------- 3.5 closure properties of CFLs ---------------- */
var C35=[
'<p>The context-free languages are closed under some operations and <b>not</b> closed under others. The exam asks for the proofs of the closed ones (Supp Q23b: union, concatenation, star for 6 marks; IA2 2c: union for 2 marks) and for the reason intersection fails (QB Q17; teacher QB Q9).</p>',

'<h2>The summary</h2>',
TBL(['Operation','Closed?','Why'],[
 ['<b>Union</b>','Yes','new start symbol S → S₁ | S₂'],
 ['<b>Concatenation</b>','Yes','new start symbol S → S₁S₂'],
 ['<b>Star</b>','Yes','new start symbol S → SS₁ | ε (your teacher\'s rule)'],
 ['<b>Reversal</b>','Yes','reverse every right side: A → α becomes A → αᴿ'],
 ['<b>Homomorphism, substitution</b>','Yes','replace each terminal by the grammar of its image'],
 ['<b>Intersection with a regular language</b>','Yes','run a PDA and a DFA together (product construction)'],
 ['<b>Intersection</b>','<b>No</b>','{aⁿbⁿcᵐ} ∩ {aᵐbⁿcⁿ} = {aⁿbⁿcⁿ}, which is not context-free'],
 ['<b>Complement</b>','<b>No</b>','L₁ ∩ L₂ = complement of (L̄₁ ∪ L̄₂); if complement were closed, so would intersection be'],
 ['<b>Difference</b>','<b>No</b>','Σ* is context-free, and Σ* − L is the complement; but L − R is context-free for regular R']]),

'<h2>The grammar constructions (proofs)</h2>',
'<p>Let G₁ = (V₁, T, P₁, S₁) and G₂ = (V₂, T, P₂, S₂) generate L₁ and L₂. <b>Rename variables if necessary so that V₁ and V₂ are disjoint</b>, and let S be a new variable not in either.</p>',
'<div class="split"><div class="card" style="flex:1 1 260px;margin:0"><h3>Union</h3><p><b>G = (V₁ ∪ V₂ ∪ {S}, T, P₁ ∪ P₂ ∪ {S → S₁ | S₂}, S)</b></p><p>A derivation must begin with S → S₁ (then it is a G₁ derivation) or S → S₂. So L(G) = L₁ ∪ L₂.</p></div>',
'<div class="card" style="flex:1 1 260px;margin:0"><h3>Concatenation</h3><p><b>P = P₁ ∪ P₂ ∪ {S → S₁S₂}</b></p><p>Every derivation starts S ⇒ S₁S₂ and then derives a string of L₁ from S₁ and a string of L₂ from S₂. So L(G) = L₁L₂.</p></div>',
'<div class="card" style="flex:1 1 260px;margin:0"><h3>Star</h3><p><b>P = P₁ ∪ {S → SS₁ | ε}</b></p><p>S ⇒ SS₁ ⇒ SS₁S₁ ⇒ … ⇒ S₁S₁…S₁ (k copies) or ε (k = 0). So L(G) = L₁*.</p></div></div>',
'<p><b>Reversal:</b> L ᴿ = {wᴿ : w ∈ L}. Reverse the right side of every rule. Then every derivation produces the reverse of what it produced before.</p>',

'<h3>The constructions computed for your teacher\'s examples</h3>',
GOPS('Union: L₁ = {aⁿbⁿ}, L₂ = {bⁿaⁿ}','union','S₁ → aS₁b | ε','S₂ → bS₂a | ε'),
GOPS('Concatenation of the same two languages: L₁L₂ = {aⁿbⁿ⁺ᵐaᵐ}','concat','S₁ → aS₁b | ε','S₂ → bS₂a | ε'),
GOPS('Star: (L₁)* for L₁ = {aⁿbⁿ} (strings of balanced blocks like aabbab)','star','S₁ → aS₁b | ε'),
GOPS('Reversal: L = {aⁿbⁿ} becomes {bⁿaⁿ}','reverse','S → aSb | ε'),

'<h2>Why intersection fails</h2>',
'<p>Take <b>L₁ = {aⁿbⁿcᵐ : n, m ≥ 1}</b> with grammar S → XY, X → aXb | ab, Y → cY | c, and <b>L₂ = {aᵐbⁿcⁿ : n, m ≥ 1}</b> with grammar S → XY, X → aX | a, Y → bYc | bc. Both are context-free. But L₁ ∩ L₂ = {aⁿbⁿcⁿ : n ≥ 1}: the first needs equal a\'s and b\'s, the second equal b\'s and c\'s, so a string in both has all three equal. This language is <b>not</b> context-free (proved with the pumping lemma in 3.6).</p>',
'<div class="callout"><b>Complement.</b> If CFLs were closed under complement, then since they are closed under union, L₁ ∩ L₂ = (L̄₁ ∪ L̄₂)ᶜ would be a CFL for all CFLs L₁, L₂, which we just showed false. So CFLs are not closed under complement. (A regular language\'s complement is regular, but a CFL\'s need not be a CFL.)</div>',
'<p><b>But:</b> if L is a CFL and R is <b>regular</b>, then L ∩ R is a CFL. Build a PDA whose states are pairs (PDA state, DFA state); on each input symbol it moves both machines at once and accepts when both accept. This is why L − R = L ∩ R̄ is context-free when R is regular (R̄ is regular).</p>',

MODEL('0. Write this: closure of CFLs <span class="src">Supp Q23b</span>',ANS_CFLCL),
'<h2>Solved model: teacher QB Q9</h2>',
MODEL('L₁ = {aⁿbⁿ : n ≥ 0}, L₂ = {aᵐ : m ≥ 0}. Are these necessarily context-free? <span class="src">teacher QB Q9</span>','<p>L₁ is context-free (S → aSb | ε), L₂ is regular, hence context-free.</p>'+TBL(['Language','Context-free?','Reason'],[

/* ---------------- 3.6 pumping lemma for CFL ---------------- */
var C36=[
'<p>The pumping lemma for CFLs is the tool for proving a language is <b>not context-free</b> (like the regular one in 2.10, but with <b>two</b> pumped parts). The exam asks you to state it (Nov 2025 Q5, 1 mark) and the question bank uses it to show {aⁿbⁿcⁿ} and {ww} are not context-free (QB Q17).</p>',

'<h2>Statement (your teacher\'s version)</h2>',
'<div class="callout ok"><p style="margin:0">If L is a context-free language, there is a constant <b>n</b> (the pumping length) such that every string <b>z ∈ L with |z| ≥ n</b> can be written <b>z = uvwxy</b> with</p><ol style="margin:6px 0 0"><li><b>|vwx| ≤ n</b></li><li><b>|vx| ≥ 1</b> (v and x are not both empty)</li><li><b>uvⁱwxⁱy ∈ L for every i ≥ 0</b></li></ol></div>',
'<p>v and x are pumped <b>together</b>, the same number of times. Compare the regular lemma (z = uvw, |uv| ≤ n, one pumped part).</p>',

'<h2>Why it is true (idea of the proof)</h2>',
'<p>Take a grammar in CNF with k variables, and set n = 2ᵏ. A parse tree of a string of length ≥ n is binary and has a path longer than k, so some variable A appears <b>twice</b> on that path. The lower A derives w; the upper A derives v A x (with the lower A inside). So A ⇒* vAx and A ⇒* w, and we can repeat the first step any number of times: uvⁱwxⁱy is derived for every i ≥ 0. Choosing the two A\'s near the bottom of the path makes |vwx| ≤ 2ᵏ, and since the grammar is in CNF (no ε, no unit rules), v and x cannot both be empty.</p>',

'<h2>How to use it</h2>',
'<ol class="steps"><li><b>Assume</b> L is context-free with pumping length n.</li><li><b>Choose</b> a string z ∈ L with |z| ≥ n (usually a block of n of each symbol).</li><li>Because |vwx| ≤ n, the window vwx is short: it <b>cannot touch all the blocks of z</b>. List <b>every way</b> the window can sit (inside one block, or across two neighbouring blocks).</li><li>For each case, pump (i = 0 or 2) and show uvⁱwxⁱy ∉ L.</li><li>Contradiction, so L is <b>not context-free</b>.</li></ol>',
'<div class="callout"><b>Like the regular lemma, it can never prove a language IS context-free.</b> To show that, give a grammar or a PDA.</div>',

'<h2>Try it</h2><p>Choose the five parts yourself (the rule |vwx| ≤ n, |vx| ≥ 1 is checked for you), or let the page check every legal split.</p>',
PUMPCW('Interactive: { aⁿbⁿcⁿ }','anbncn',3),

'<h2>Solved models (written in full, the way you would write them on paper)</h2>',
'<div class="callout"><b>Skeleton:</b> (1) Assume L is context-free, pumping length n. (2) Let z = …, |z| ≥ n. (3) By the lemma z = uvwxy, |vwx| ≤ n, |vx| ≥ 1. (4) Say where the window vwx can sit, then <b>Case (i), (ii), …</b> each with its pumped string uvⁱwxⁱy and "∉ L ⇒ contradiction". (5) "Hence L is not context-free." Your teacher\'s own worked example stops after the window argument; writing the cases out is what earns full marks.</div>',

MODEL('1. L = { aⁿbⁿcⁿ | n ≥ 1 } <span class="src">teacher example, QB Q17</span>',PLSOL({cfl:1,L:'L = { aⁿbⁿcⁿ | n ≥ 1 }',z:'aⁿbⁿcⁿ',zl:'3n',
 note:'|vwx| ≤ n, so vwx cannot contain both an a and a c (the last a and the first c are n + 1 positions apart). So vwx lies inside one block, or across two neighbouring blocks. (Your teacher then takes n = 3, z = 0³1³2³ to illustrate.)',
 cases:[['vx has only a\'s (vx = aᵏ, k ≥ 1)','2','uv²wx²y = aⁿ⁺ᵏbⁿcⁿ','aⁿ⁺ᵏbⁿcⁿ ∉ L'],
        ['vx has only b\'s','2','uv²wx²y = aⁿbⁿ⁺ᵏcⁿ','aⁿbⁿ⁺ᵏcⁿ ∉ L'],
        ['vx has only c\'s','2','uv²wx²y = aⁿbⁿcⁿ⁺ᵏ','aⁿbⁿcⁿ⁺ᵏ ∉ L'],
        ['vx has a\'s and b\'s (the window sits across the a-block and b-block)','2','uv²wx²y = aⁿ⁺ᵖbⁿ⁺ʳcⁿ with p + r ≥ 1','aⁿ⁺ᵖbⁿ⁺ʳcⁿ ∉ L (the c\'s are still n, but a\'s or b\'s increased)'],
        ['vx has b\'s and c\'s (the window sits across the b-block and c-block)','2','uv²wx²y = aⁿbⁿ⁺ᵖcⁿ⁺ʳ with p + r ≥ 1','aⁿbⁿ⁺ᵖcⁿ⁺ʳ ∉ L (the a\'s are still n, but b\'s or c\'s increased)']]})),

MODEL('2. L = { ww | w ∈ {a,b}* } <span class="src">QB Q17</span>',PLSOL({cfl:1,L:'L = { ww | w ∈ {a,b}* }',z:'aⁿbⁿaⁿbⁿ  (= ww with w = aⁿbⁿ)',zl:'4n',
 note:'z has four blocks of length n: block 1 = aⁿ, block 2 = bⁿ, block 3 = aⁿ, block 4 = bⁿ. A string a^p b^q a^r b^s with all four blocks non-empty is of the form tt only if p = r and q = s. |vwx| ≤ n, so the window lies inside one block or across two neighbouring blocks.',
 cases:[['vwx lies inside one block, so vx is made of one letter (vx has k ≥ 1 symbols)','2','uv²wx²y: that one block has grown by k, the other three blocks are unchanged','Block j ≠ its partner (block j ± 2), so the string is not of the form tt: uv²wx²y ∉ L'],
        ['vwx lies across two neighbouring blocks (j and j + 1)','2','uv²wx²y: at least one of these two blocks has grown, and neither partner (block j ± 2) has changed','p ≠ r or q ≠ s, so uv²wx²y ∉ L']]})),
PUMPCW('Try it: { ww }','ww',3),

MODEL('3. L = { aⁿ² | n ≥ 1 }',PLSOL({cfl:1,L:'L = { aⁿ² | n ≥ 1 }',z:'aⁿ²',zl:'n²',

var C41=[
'<p>A finite automaton cannot recognise { aⁿbⁿ }: it would have to count the a\'s, and a DFA only has finitely many states. A <b>pushdown automaton (PDA)</b> is a finite automaton with an extra memory, a <b>stack</b>, which is exactly what is needed for context-free languages (Nov 2025 Q7 asks you to define a PDA; IA3 Part A asks for DPDA, acceptance and ID analysis).</p>',

'<h2>The stack</h2>',
'<p>A <b>stack</b> is a pile you can only touch at the top: <b>push</b> puts a symbol on top, <b>pop</b> removes the top symbol. The PDA reads the input left to right (like an NFA), but at every move it also looks at the <b>top of the stack</b>, and it may change that top. The stack can grow without limit, which is the unbounded memory.</p>',

'<h2>Formal definition: seven parts</h2>',
TBL(['Part','Meaning'],[
 ['<b>Q</b>','finite set of states'],['<b>Σ</b>','input alphabet'],['<b>Γ</b>','stack alphabet (the symbols that may be on the stack)'],
 ['<b>δ</b>','transition function δ : Q × (Σ ∪ {ε}) × Γ → finite subsets of Q × Γ*. It takes a <b>triple (state, input symbol or ε, stack top)</b> and returns a set of pairs (new state, string to put on the stack)'],
 ['<b>q₀</b>','start state'],['<b>Z₀</b>','the initial stack symbol (the stack starts holding just Z₀)'],['<b>F</b>','set of final states']]),
'<p>So <b>P = (Q, Σ, Γ, δ, q₀, Z₀, F)</b>. Here Z stands for Z₀ in the widgets.</p>',
'<h3>What a transition does</h3>',
'<p><code>δ(q, a, X) = (p, γ)</code> means: in state <b>q</b>, reading input <b>a</b>, with <b>X</b> on top of the stack, go to state <b>p</b> and <b>replace X by the string γ</b> (the left end of γ becomes the new top). If a is ε, the move reads no input.</p>',
TBL(['γ','Effect on the stack','Example (top on the left)'],[
 ['ε','<b>pop</b> X (the stack shrinks)','X Z₀ → Z₀'],['X','the stack is <b>unchanged</b>','X Z₀ → X Z₀'],['YX','<b>push</b> Y on top of X','X Z₀ → Y X Z₀'],['Y','<b>replace</b> X by Y','X Z₀ → Y Z₀'],['YZ','replace X by Z and push Y on top','X W → Y Z W']]),
'<p>The PDA is <b>non-deterministic</b> in general: δ can return several pairs, and an ε-move can compete with an input move. It accepts if <b>some</b> sequence of choices works.</p>',

'<h2>Instantaneous description (ID) and the move relation</h2>',
'<p>A snapshot of the machine is an <b>ID (q, w, γ)</b>: the current state q, the <b>unread</b> part of the input w, and the stack γ written <b>top first</b>. One move is written <b>⊢</b> and many moves <b>⊢*</b>. If δ(q, a, X) contains (p, β), then <code>(q, aw, Xα) ⊢ (p, w, βα)</code>.</p>',

'<h2>Two ways to accept</h2>',
TBL(['','Acceptance by final state','Acceptance by empty stack'],[
 ['language','L(P) = { w : (q₀, w, Z₀) ⊢* (q, ε, γ) with q ∈ F }','N(P) = { w : (q₀, w, Z₀) ⊢* (q, ε, ε) }'],
 ['meaning','all the input is read and the state is final (the stack can hold anything)','all the input is read and the stack is empty (F is not used)'],
 ['power','both accept exactly the <b>context-free languages</b>; any PDA of one kind can be converted into the other (chunk 4.5)','']]),
'<div class="callout">Draw the diagram with labels <b>a, X / γ</b> on each arrow: "read a, top is X, replace X by γ". A double circle marks a final state (final-state acceptance only).</div>',

'<h2>Solved models</h2>',

MODEL('4. Definitions asked directly','<p><b>Define a PDA</b> <span class="src">Nov25 Q7 (1 mark)</span>: a PDA is a seven-tuple (Q, Σ, Γ, δ, q₀, Z₀, F): a finite automaton with a stack. δ maps (state, input symbol or ε, stack top) to a finite set of (state, stack string) pairs.</p><p><b>Define a DPDA</b> <span class="src">IA3 1a (1 mark)</span>: a PDA in which, for every state and stack top, there is <b>at most one</b> move for each input symbol, and if an ε-move is possible no input move is: δ(q, a, X) has at most one element, and if δ(q, ε, X) ≠ ∅ then δ(q, a, X) = ∅ for every a.</p><p><b>Acceptance by final state</b> <span class="src">IA3 1b (1 mark)</span>: the whole input has been read and the PDA is in a final state.</p>'),

P('What is the difference between acceptance by final state and by empty stack?','Final state: the input is consumed and the state is in F (the stack is arbitrary). Empty stack: the input is consumed and the stack is empty (F is ignored). For nondeterministic PDAs both accept exactly the context-free languages.'),

 ['<b>guess the middle</b>','an ε-move that the machine can take at any time; one guess is right (non-determinism)','wwᴿ'],

var C43=[
'<p>Every context-free grammar has an equivalent PDA. The conversion is short and mechanical, and it is asked in every paper: Nov 2025 Q14 (3 marks), Supp Q20a (6 marks), the CFG→PDA assignment, QB Q21 (with a stack trace) and the remedial classes.</p>',

'<h2>The idea</h2>',
'<p>A PDA can <b>replay a leftmost derivation</b>. The stack holds what is still to be derived (the sentential form with the already-matched prefix removed). If the top of the stack is a <b>variable</b>, the PDA guesses a production and replaces the variable by its right side (without reading input). If the top is a <b>terminal</b>, it must equal the next input symbol: read it and pop it. When everything is matched, the stack is empty.</p>',

'<h2>The construction (your teacher\'s)</h2>',
'<div class="callout ok">Given G = (V, T, R, S), the PDA is <b>P = ({q}, T, V ∪ T, δ, q, S)</b> and it accepts by <b>empty stack</b>: one state q, the <b>stack starts with the start symbol S</b> (the initial stack symbol is S itself, there is no separate Z₀).</div>',

var C44=[
'<p>The reverse conversion is longer and is asked as a 6- or 7-mark question: Nov 2025 Q20b, IA3 2e(ii), QB Q22 (the full question), teacher assignment Q3 and the remedial class. It builds a grammar whose variables are <b>triples [p X q]</b>.</p>',

'<h2>The idea</h2>',
'<p>The variable <b>[p X q]</b> stands for: "the strings that take the PDA from state p with X on top of the stack to state q, with X <b>popped</b> (and nothing below X touched)". The start variable is S, with <b>S → [q₀ Z₀ p]</b> for every state p (the whole computation pops the initial Z₀).</p>',
'<div class="callout">The construction works for PDAs that accept by <b>empty stack</b>. If the PDA accepts by final state, first convert it (chunk 4.5). The questions below already empty the stack.</div>',

'<h2>The construction</h2>',
'<ol class="steps"><li><b>Variables:</b> S, and one [p X q] for every pair of states p, q and every stack symbol X.</li><li><b>Start rules:</b> S → [q₀ Z₀ p] for every state p.</li><li><b>For each transition</b> <code>δ(p, a, X) = (r, Y₁Y₂…Yₖ)</code>:<ul><li>if the transition <b>pops</b> (k = 0, i.e. the result is ε): <code>[p X r] → a</code>;</li><li>otherwise, for <b>every</b> choice of states s₁, …, sₖ: <code>[p X sₖ] → a [r Y₁ s₁] [s₁ Y₂ s₂] … [sₖ₋₁ Yₖ sₖ]</code>.</li></ul>(If a = ε the rule just has no terminal in front.)</li><li><b>Remove the useless variables</b> (3.1), <b>rename</b> the rest with letters, and use the grammar. The language of the grammar is the language accepted by empty stack.</li></ol>',
'<p>Why the shape: to pop X while pushing Y₁…Yₖ, the machine must eventually pop Y₁ (ending in some state s₁), then Y₂ (ending in s₂), and so on, ending in sₖ. The product of those triples is exactly [r Y₁ s₁][s₁ Y₂ s₂]…[sₖ₋₁ Yₖ sₖ].</p>',

MODEL('4. The teacher\'s PDA_to_CFG slides','<p>M = ({p, q}, {a, b}, {A, Z}, δ, p, Z, ·) with δ(p,a,Z) = (p,AZ), δ(p,a,A) = (p,AA), δ(p,b,A) = (q,A), δ(q,b,A) = (q,A), δ(q,a,A) = (q,ε), δ(q,ε,Z) = (q,ε). (The slide lists q as the start state, which cannot read anything from Z; the start state p makes the example meaningful.) The variables are [pZp], [pZq], [qZp], [qZq], [pAp], [pAq], [qAp], [qAq] and the rules S → [pZp] | [pZq].</p>'),

/* ---------------- 4.5 DPDA vs NPDA, acceptance modes ---------------- */
function dpdaRow(k,label){var r=isDPDA(MACH[k].spec);return [label,r.det?'<b class="okc">deterministic</b>':'<b class="badc">non-deterministic</b>',esc(r.det?'at most one move for every (state, symbol or ε, stack top), and no ε-move competes with an input move':r.why)]}
var C45=[
'<p>The last PDA topic is a classification (Part A questions in IA3), the two acceptance modes, and how to convert between them (teacher assignment Q4).</p>',

'<h2>Deterministic vs non-deterministic PDA</h2>',
'<p>A <b>deterministic PDA (DPDA)</b> never has a choice: for every state q and stack top X,</p><ul><li><b>δ(q, a, X) has at most one element</b> for every a ∈ Σ ∪ {ε}, and</li><li><b>if δ(q, ε, X) is not empty then δ(q, a, X) is empty for every a ∈ Σ</b> (an ε-move may not compete with an input move).</li></ul>',
TBL(['PDA from 4.2','Class','Reason'],[dpdaRow('anbn','aⁿbⁿ'),dpdaRow('an2bnF','aⁿb²ⁿ'),dpdaRow('wcwr','wcwᴿ'),dpdaRow('anbmcmdn','aⁿbᵐcᵐdⁿ'),dpdaRow('asgQ4','aⁿcbⁿ (teacher assignment Q4)'),dpdaRow('wwr','wwᴿ'),dpdaRow('eqab','equal a and b')]),
'<div class="callout"><b>NPDAs are strictly more powerful.</b> Every DPDA is an NPDA, but { wwᴿ } (even palindromes) is accepted by an NPDA and by <b>no</b> DPDA: the machine cannot know where the middle is, so it must guess, and a deterministic machine cannot guess. With a marker in the middle (wcwᴿ) no guess is needed, so wcwᴿ <b>is</b> deterministic. (Languages accepted by DPDAs are the <i>deterministic CFLs</i>, a proper subset of the CFLs.)</div>',
'<p>For <b>DPDAs the acceptance mode matters</b>: acceptance by final state is more powerful than by empty stack (a DPDA that empties its stack cannot continue, so by empty stack it can only accept languages in which no string is a proper prefix of another). For <b>NPDAs the two modes are equivalent</b>.</p>',

'<h2>Converting between the acceptance modes</h2>',
'<div class="split"><div class="card" style="flex:1 1 300px;margin:0"><h3>Final state → empty stack</h3><ol><li>Add a new bottom marker X₀ (written <code>$</code> below) and a new start state p₀: <code>δ(p₀, ε, $) = (q₀, Z₀$)</code>. The marker stops the stack from emptying by accident.</li><li>From every <b>final</b> state, for every stack symbol, add an ε-move to a new state pₑ: <code>δ(f, ε, Y) = (pₑ, ε)</code>.</li><li>pₑ pops everything: <code>δ(pₑ, ε, Y) = (pₑ, ε)</code> for every Y including $.</li></ol></div>',
'<div class="card" style="flex:1 1 300px;margin:0"><h3>Empty stack → final state</h3><ol><li>Add a new bottom marker $ and a new start state p₀: <code>δ(p₀, ε, $) = (q₀, Z₀$)</code>.</li><li>From <b>every</b> state, when $ is the only symbol left (the old stack is empty): <code>δ(q, ε, $) = (p_f, ε)</code>, where p_f is a new <b>final</b> state.</li></ol></div></div>',

'<h2>Solved model: the teacher\'s assignment Q4 <span class="src">PDA assignment Q4</span></h2>',
'<p>M = ({q₀, q₁, q₂}, {a, b, c}, {A, Z}, δ, q₀, Z, {q₂}) accepts L = { aⁿcbⁿ : n ≥ 0 } by final state with δ(q₀,a,Z) = {(q₀,AZ)}, δ(q₀,a,A) = {(q₀,AA)}, δ(q₀,c,Z) = {(q₁,Z)}, δ(q₀,c,A) = {(q₁,A)}, δ(q₁,b,A) = {(q₁,ε)}, δ(q₁,ε,Z) = {(q₂,Z)}.</p>',
PDAW('(i) Trace M on aacbb: accepted by final state','asgQ4',{input:'aacbb'}),
'<p><b>(ii) Convert M into M′ that accepts by empty stack</b> with the construction above, and trace M′ on the same input (the new transitions are in the list; $ is the new bottom marker):</p>',
PDAH('M′ accepts by empty stack',pdaToEmpty(MACH.asgQ4.spec),{input:'aacbb'}),
'<p><b>(iii) Is M deterministic?</b> '+(isDPDA(MACH.asgQ4.spec).det?'Yes. No state has two moves for the same (input, stack top) and the only ε-move is δ(q₁, ε, Z) where no input move uses stack top Z in q₁, so no ε-move competes with an input move.':'No.')+'</p>',

'<h2>The other direction, on aⁿbⁿ</h2>',
'<p>Take the PDA for { aⁿbⁿ } that accepts by <b>empty stack</b> (4.1) and convert it to final-state acceptance:</p>',
PDAH('Converted: accepts by final state',pdaToFinal(MACH.anbn.spec),{input:'aabb'}),

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">IA3 1a</span> Define a deterministic PDA.','A PDA in which, for each state q and stack top X, δ(q, a, X) has at most one element for each a ∈ Σ ∪ {ε}, and if δ(q, ε, X) is not empty then δ(q, a, X) is empty for every input symbol a.'),
P('Is { wwᴿ } accepted by a deterministic PDA? Why or why not?','No. After reading w the machine would have to switch from pushing to popping exactly at the middle, but without a marker it cannot tell where the middle is. A non-deterministic PDA guesses the middle (an ε-move). So NPDAs accept strictly more languages than DPDAs.'),
P('Why does the conversion from final-state to empty-stack acceptance add a new bottom marker?','Without it, the old PDA might empty its own stack by accident (for example by popping Z₀) before the input is finished and then wrongly accept. The marker is at the very bottom, so the stack can only be emptied by the new pₑ state, which is entered only from a final state.'),

'</ol>'

/* ---------------- 5.1 TM basics ---------------- */
var C51=[
'<p>A finite automaton has no memory except its states; a PDA adds one stack; neither can recognise { aⁿbⁿcⁿ }. A <b>Turing machine (TM)</b> has an <b>unlimited tape it can read and write</b>, and it is the model of a general computer. Everything left in the course (Modules 5 and 6) is about what TMs can and cannot do.</p>',

'<h2>The model</h2>',
'<ul><li><b>Tape:</b> a row of cells, infinite in both directions. One symbol per cell. The blank symbol is <b>B</b>.</li><li><b>Head:</b> reads one cell, overwrites it, then moves one cell <b>left (L)</b> or <b>right (R)</b>.</li><li><b>Finite control:</b> the current state and the rules δ.</li><li>The input is written on the tape, with the head on its <b>leftmost symbol</b>; every other cell is blank.</li></ul>',
'<h2>Formal definition: seven parts</h2>',
TBL(['Part','Meaning'],[
 ['<b>Q</b>','finite set of states'],['<b>Σ</b>','input alphabet (does not contain B)'],['<b>Γ</b>','tape alphabet: Σ ⊂ Γ and B ∈ Γ (it also holds markers like X, Y)'],
 ['<b>δ</b>','transition function δ : Q × Γ → Q × Γ × {L, R}. It is <b>partial</b>: where it is undefined the machine halts'],
 ['<b>q₀</b>','start state'],['<b>B</b>','the blank symbol'],['<b>F</b>','set of final states']]),
'<p><b>M = (Q, Σ, Γ, δ, q₀, B, F)</b>. A transition <code>δ(q, X) = (p, Y, D)</code> means: in state q reading X, <b>write Y</b>, <b>move the head D</b> (L or R) and <b>go to state p</b>. Example: δ(q₁, a) = (q₂, X, R) reads a, writes X, moves right, enters q₂.</p>',

'<h2>Drawing a TM</h2>',
'<p><b>Table:</b> rows are states, columns are tape symbols, each entry is (new state, symbol written, move); a dash means no move. → marks the start state, * the final states. <b>Diagram:</b> an arrow is labelled <code>read / write, move</code>, for example <code>a/X,R</code>; a double circle is a final state.</p>',

'<h2>Instantaneous description (ID)</h2>',
'<p>An ID is a snapshot written <b>α q β</b>: α is the tape to the left of the head, <b>q is the current state written just before the scanned symbol</b>, and β is the scanned symbol and the tape to its right. Blanks at the far ends are dropped unless the head is on one. The start ID for input w is <b>q₀w</b>.</p>',
TBL(['Move','If','Then'],[['right','δ(q, X) = (p, Y, R)','α q X β ⊢ α Y p β'],['left','δ(q, X) = (p, Y, L)','α Z q X β ⊢ α p Z Y β'],['examples','δ(q₀, a) = (q₁, X, R)','q₀aabb ⊢ Xq₁abb'],['','δ(q₁, b) = (q₂, Y, L)','Xaq₁bb ⊢ Xq₂aYb']]),
'<p><b>⊢</b> is one move, <b>⊢*</b> is zero or more moves.</p>',

'<h2>Accept, reject or loop</h2>',
TBL(['Outcome','What happens'],[['<b>accept</b>','the machine halts in a final state: L(M) = { w : q₀w ⊢* αpβ with p ∈ F }'],['<b>reject</b>','the machine halts in a non-final state, usually because no move is defined (it "gets stuck")'],['<b>loop</b>','the machine never halts, for example δ(q, B) = (q, B, R) runs right forever']]),
'<p>Reject and loop both mean the input is <b>not accepted</b>. A language is <b>recursively enumerable</b> if some TM accepts it (the TM may loop on strings outside the language); it is <b>recursive (decidable)</b> if some TM halts on <b>every</b> input. This distinction is the heart of Module 6.</p>',

'<h2>Solved models</h2>',
MODEL('1. The aⁿbⁿ machine with a full trace <span class="src">teacher slides Example 1</span>','<p>L = { aⁿbⁿ : n ≥ 1 }. Strategy: change the leftmost a to X (q₀); skip right over a\'s and Y\'s and change the first b to Y (q₁); go back left to the X and step right (q₂); repeat. When q₀ meets a Y, no a\'s remain: q₃ checks that only Y\'s are left and a blank means accept (q₄). The widget shows the table, the diagram, and the whole ID chain; press ▶ to move the head step by step.</p>'),
TMW('aⁿbⁿ, input aabb (13 moves)','tmAnBn',{input:'aabb'}),
'<p>Rejected inputs: <b>aab</b> (extra a: stuck at (q₁, B)), <b>abb</b> (extra b: stuck at (q₃, b)), <b>ba</b> and the empty input (stuck at the start). Try them in the widget above.</p>',

MODEL('2. Write the IDs for a given δ <span class="src">Nov25 Q8 (1 mark)</span>','<p>For the TM with δ(q₀, a) = (q₁, X, R) and δ(q₁, b) = (q₂, X, R), write the ID chain for the input <b>ab</b>. Start: q₀ab. First move reads a: write X, move right: Xq₁b. Second move reads b: write X, move right: XXq₂ (the scanned cell is now blank, written B).</p>'),
TMW('Nov 2025 Q8','nov8',{input:'ab'}),

MODEL('3. Next IDs and the effect of a move <span class="src">IA3 2d (2 marks), teacher practice</span>','<p>A TM starts in the ID q₀0110 (head on the first symbol) and applies δ(q₀, 0) = (q₁, X, R) followed by δ(q₁, 1) = (q₁, 1, R). The IDs are <code>q₀0110 ⊢ Xq₁110 ⊢ X1q₁10</code>.</p><p>Using δ(q₁, b) = (q₂, Y, L), the next ID after <code>Xaq₁bb</code> is <code>Xq₂aYb</code> (b becomes Y, the head moves left onto a, and the state becomes q₂).</p>'),

MODEL('4. Definitions asked directly <span class="src">IA3 2a</span><span class="src">IA3 2b</span><span class="src">IA3 2c</span>','<p><b>Meaning of δ(q, a) = (p, b, L)</b> (IA3 2a): in state q reading a, replace a by b, move the head one cell left, and enter state p.</p><p><b>The blank symbol</b> (IA3 2b) is <b>B</b> (the symbol that fills every unused cell of the tape).</p><p><b>Basic components of a TM</b> (IA3 2c): the finite control with its states, the tape, the read/write head and the transition function δ (formally Q, Σ, Γ, δ, q₀, B, F).</p>'),

'<h2>FA, PDA and TM compared</h2>',
TBL(['','Finite automaton','Pushdown automaton','Turing machine'],[['memory','none (only states)','one stack','infinite tape (read and write)'],['head','reads the input left to right','reads the input left to right, uses the stack top','moves left or right and can overwrite'],['language class','regular','context-free','recursive and recursively enumerable'],['example','even number of a\'s','aⁿbⁿ','aⁿbⁿcⁿ'],['non-determinism','NFA = DFA','NPDA stronger than DPDA','NTM = DTM']]),

'<h2>Practice</h2><ol class="practice">',
P('Name the three possible outcomes of running a TM on an input.','Accept (halts in a final state), reject (halts in a non-final state) or loop (never halts).'),
P('Using δ(q₁, b) = (q₂, Y, L), write the next ID after Xaq₁bb.','Xq₂aYb.'),
P('<span class="src">teacher</span> Trace <b>ab</b> on the aⁿbⁿ machine using IDs.',TMW('Solution','tmAnBn',{input:'ab'})+'The chain q₀ab ⊢ Xq₁b ⊢ q₂XY ⊢ Xq₀Y ⊢ XYq₃B ⊢ XYBq₄ is accepted.'),
P('<span class="src">teacher</span> Is <b>aabbb</b> accepted by the aⁿbⁿ machine? Trace it.',TMW('Solution','tmAnBn',{input:'aabbb'})+'Rejected. After two rounds the ID is XXYYq₃b and (q₃, b) has no move.'),
P('<span class="src">IA3 2a style</span> State the meaning of δ(q, 0) = (p, X, R).','In state q reading 0, write X in place of 0, move the head one cell right and go to state p.'),
'</ol>'
].join('');
CONTENT['5.1']={h:C51,exam:['Nov25 Q8','IA3 2a-2d','teacher slides']};

/* ---------------- 5.2 TM as acceptor ---------------- */
var C52=[
'<p>Designing a TM for a language is the most-asked Module 5 question (Nov 2025 Q15 for 3 marks and Q21a for 8 marks, Supp Q21 for 12 marks, IA3 2e(i) for 7 marks, QB Q26 and Q27, the teacher\'s assignment). The machine halts in a final state exactly on the strings of the language.</p>',

'<h2>Design techniques</h2>',
TBL(['Technique','Idea','Example'],[
 ['<b>mark and match</b>','change a symbol to a marker (X, Y, Z) so it is not counted twice; sweep back and repeat','aⁿbⁿ, aⁿbⁿcⁿ, 0ⁿ21ⁿ'],
 ['<b>erase the ends</b>','erase the first symbol, remember it in the state, erase the matching last symbol','palindromes'],
 ['<b>scan and check</b>','move across the input once, the states track a pattern, check the blank at the end','0 1* 0, ends with 0'],
 ['<b>cancel pairs</b>','delete two different symbols at a time; accept when none are left','equal numbers of 0s and 1s']]),
'<ol class="steps"><li>Describe the <b>strategy in words</b> (one round of marking).</li><li>Choose the <b>states</b>: one for each phase (find, mark, return, check).</li><li>Write the <b>transition table</b> (and the diagram if asked). Every state needs an entry for each symbol it can meet; leave the rest blank (the machine halts and rejects).</li><li><b>Trace</b> a string with IDs.</li></ol>',
'<div class="callout"><b>Remember the blank on the left too.</b> The tape is infinite in both directions, so when a state moves left to find the start of the input it stops at the first <b>B</b>.</div>',

'<h2>Solved models</h2><p>Each widget shows the table, the diagram, and a trace. Type any string and press Run; ▶ steps through the IDs.</p>',

MODEL('1. L(01*0): scan and check <span class="src">Nov25 Q15 (3 marks)</span>','<p>The language is a 0, then any number of 1\'s, then a 0, and nothing else. Read the first 0 (q₁), skip 1\'s in q₁, read the final 0 (q₂), and the blank after it (q₃, final) confirms nothing follows.</p>'),
TMW('L(01*0)','tm01star0',{input:'0110'}),

MODEL('2. L = { 0ⁿ2 1ⁿ : n ≥ 1 }: mark and match <span class="src">Nov25 Q21a (8 marks), Supp Q21 (12 marks)</span>','<p>The same question appeared in both papers. Strategy: mark the leftmost 0 with X (q₀), run right over the remaining 0\'s to the 2 and past the marked 1\'s (q₁, q₂), mark the first unmarked 1 with Y (q₂ → q₃), return left to the X (q₃), step right (q₆) and repeat. When no 0 is left (q₆ sees the 2), q₄ checks that only Y\'s remain, then the blank gives q₅. Show that 00211 is accepted.</p>'),
TMW('0ⁿ2 1ⁿ, input 00211','tmZn21n',{input:'00211'}),

MODEL('3. L = { 0ⁿ1ⁿ : n ≥ 1 } <span class="src">IA3 2e(i) (7 marks)</span>','<p>The same machine as aⁿbⁿ with 0 and 1: mark a 0 with X, find the first 1 and mark it Y, return. Explain the transition strategy and trace 0011.</p>'),
TMW('0ⁿ1ⁿ, input 0011','tm01',{input:'0011'}),

MODEL('4. L = { aⁿbⁿcⁿ : n ≥ 1 } <span class="src">teacher assignment Q5, the language no PDA can accept</span>','<p>Mark an a (X), then the first b (Y), then the first c (Z), return to the X, repeat. When no a is left, q₄ checks that only Y\'s and Z\'s remain. Trace aabbcc.</p>'),
TMW('aⁿbⁿcⁿ, input aabbcc','tmAnBnCn',{input:'aabbcc'}),

MODEL('5. Palindromes over {a,b}: erase the ends <span class="src">QB Q26, teacher slides</span>','<p>q₀ reads and <b>erases</b> the first symbol (writing B), remembering it as q₁ (a) or q₂ (b). The machine moves right to the end, steps back and checks that the last symbol is the same one (q₃ or q₄), erases it, returns (q₅), and repeats. A blank where a symbol is expected means everything was matched: accept (q₆). A different last symbol has no move: reject. The widget gives the teacher\'s trace of aba; also try abba, and abb (rejected).</p>'),
TMW('Palindromes, input aba','tmPal',{input:'aba'}),

MODEL('6. Even palindromes { wwᴿ } <span class="src">remedial IA3 Q4</span>','<p>The same machine with one change: remove the moves that accept when only one symbol is left (q₃ and q₄ reading B), because a palindrome of odd length has a lone middle symbol. Then only even-length palindromes reach q₆. Illustrate 0110.</p>'),
TMW('wwᴿ over {0,1}, input 0110','tmEven',{input:'0110'}),

MODEL('7. Equal numbers of 0s and 1s: cancel pairs <span class="src">QB Q27</span>','<p>Marking strategy: find the leftmost unmarked symbol. If it is a 0, mark it X and look for an unmarked 1 to mark Y; if it is a 1, mark it Y and look for a 0 to mark X. Return to the left end and repeat. If no unmarked symbol is left, accept (q₅); if a partner is missing, the machine halts without accepting. Trace 0110.</p>'),
TMW('Equal 0s and 1s, input 0110','tmEq',{input:'0110'}),

'<h2>Practice</h2><ol class="practice">',
P('Design a TM that accepts the strings over {0,1} that end with 0.',TMW('Solution: skip to the end, step back, check for 0','tmEnd0',{input:'1010'})),
P('Design a TM that accepts { aⁿ : n is even }.',TMW('Solution: erase two a\'s per round','tmEvenA',{input:'aaaa'})),
P('<span class="src">Nov25 Q15 style</span> Design a TM for L(0*10).','q₀ skips 0\'s, reads the 1 (q₁), reads the final 0 (q₂), then accepts on the blank (q₃): δ(q₀,0) = (q₀,0,R), δ(q₀,1) = (q₁,1,R), δ(q₁,0) = (q₂,0,R), δ(q₂,B) = (q₃,B,R), F = {q₃}.'),
P('<span class="src">Supp Q21 style</span> Show that 0211 and 0021 are rejected by the TM of Model 2.',TMW('0211','tmZn21n',{input:'0211'})+TMW('0021','tmZn21n',{input:'0021'})),
'</ol>'
].join('');
CONTENT['5.2']={h:C52,exam:['Nov25 Q15, Q21a','Supp Q21','IA3 2e(i)','QB Q26, Q27','teacher assignment Q5']};

/* ---------------- 5.3 TM computing functions ---------------- */
var C53=[
'<p>A TM can also <b>compute</b> a function: the input is the argument, and what is left on the tape when it halts is the answer. This is how a TM models a computer program. The exam asks "Explain the TM as a computer of integer functions" (Nov 2025 Q21b, 4 marks), and the question bank asks you to design machines for 2x, proper subtraction and binary increment (QB Q23, Q24, Q25).</p>',

'<h2>TM as a computer of integer functions</h2>',
'<div class="callout ok"><p style="margin:0">An integer i is written in <b>unary</b> (i marks in a row). A function f(i₁, …, iₖ) is computed by a TM M if, started with the arguments written on the tape separated by one separator symbol, M <b>halts with the unary value of f(i₁, …, iₖ)</b> on the tape (and nothing else).</p></div>',
'<p><b>Convention A (textbooks):</b> a number n is 0ⁿ and arguments are separated by 1, so the input for (m, n) is 0ᵐ10ⁿ and the output is 0^f(m,n). <b>Convention B (your teacher\'s assignment):</b> a number is a run of 1s and the separator is 0, so the input is 1ᵐ01ⁿ. The machines below use convention B.</p>',
'<p>A function is <b>Turing-computable</b> if some TM computes it. If the TM halts for every argument the function is <b>total</b>; otherwise it is partial. The Turing-computable functions are exactly the <b>partial recursive functions</b>. Addition, multiplication, proper subtraction m ∸ n = max(0, m − n) and everything a computer program can do are computable.</p>',
'<p>A TM can also be a <b>transducer</b> on strings: the non-blank tape at the start is the input, and at halting it is the output (a function y = f(x) with q₀x ⊢* q_f y).</p>',

'<h2>Solved models</h2><p>Each widget shows the table, the trace, and the tape contents when it halts.</p>',
MODEL('1. Unary increment: n becomes n + 1 <span class="src">teacher slides Example 3</span>','<p>q₀ skips right over every 1; on the first blank write 1 and halt in q₁. It works for n = 0 too. Input 111 gives 1111.</p>'),
TMW('f(n) = n + 1','tmInc',{input:'111'}),

MODEL('2. Unary addition 1ᵐ01ⁿ → 1ᵐ⁺ⁿ <span class="src">teacher assignment Q6</span>','<p>Replace the separator 0 by 1 (now there are m + 1 + n ones), then erase the last 1 to get m + n. Formal definition: <b>Q = {q₀, q₁, q₂, q₃}, Σ = {1, 0}, Γ = {1, 0, B}, start q₀, F = {q₃}</b>, with δ as in the table. Trace for the input 11011 (m = 2, n = 2) below.</p>'),
TMW('1ᵐ01ⁿ → 1ᵐ⁺ⁿ, input 11011','tmAdd',{input:'11011'}),
'<p><b>(iii) What happens if the input contains no 0?</b> q₀ skips all the 1\'s, reaches a blank, and there is no move for (q₀, B): the machine halts in q₀, which is not final. The input is rejected and the tape is unchanged (no addition is performed).</p>',
TMW('Input 111 (no 0)','tmAdd',{input:'111'}),

MODEL('3. Doubling f(x) = 2x, x ≥ 1 <span class="src">QB Q23</span>','<p>For each original 1: mark it X, go to the right end and append a Y, return to the X and step right. When all originals are marked, convert every Y and X into 1. The result is x + x = 2x ones. Trace for x = 2 below.</p>'),
TMW('f(x) = 2x, input 11','tmDouble',{input:'11'}),

MODEL('4. Proper subtraction m ∸ n <span class="src">QB Q24</span>','<p>Input 1ᵐ01ⁿ, output 1^(m−n) (or empty if m ≤ n). Strategy: cancel pairs. Mark the leftmost remaining 1 of the right block as Y and mark the rightmost remaining 1 of the left block as X. Repeat. If the right block is used up first, erase the markers and the 0: m − n ones remain. If the left block is used up first (m < n), erase everything: the output is empty. The widget traces m = 3, n = 2 (output 1); then try 11011 reversed as 110111 (m = 2, n = 3, output empty).</p>'),
TMW('3 ∸ 2 = 1','tmSub',{input:'111011'}),
TMW('2 ∸ 3 = 0','tmSub',{input:'110111'}),

MODEL('5. Binary increment <span class="src">QB Q25</span>','<p>The most significant bit is on the left. Move to the right end, then go left: turn every trailing 1 into 0 (carry) until you meet a 0 (turn it into 1, done) or a blank (write a 1 in front). Traces for 1011 → 1100 and 111 → 1000.</p>'),
TMW('1011 + 1','tmBinInc',{input:'1011'}),
TMW('111 + 1','tmBinInc',{input:'111'}),

'<h2>Practice</h2><ol class="practice">',
P('<span class="src">Nov25 Q21b (4 marks)</span> Explain the TM as a computer of integer functions.',ANS_Q21B),
P('Design a TM that computes f(n) = n + 2 in unary.',TMW('Solution: skip the 1\'s, write 1, write another 1','tmInc2',{input:'11'})),
P('<span class="src">QB Q24 style</span> Trace m = 2, n = 2 on the subtraction machine.',TMW('Solution','tmSub',{input:'110 11'.replace(' ','')})),
P('<span class="src">Teacher assignment Q6 style</span> Trace the addition machine for 1101 (m = 2, n = 1).',TMW('Solution','tmAdd',{input:'1101'})),
'</ol>'
].join('');
CONTENT['5.3']={h:C53,exam:['Nov25 Q21b','QB Q23-Q25','teacher assignment Q6']};
