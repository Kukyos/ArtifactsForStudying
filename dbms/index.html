  --bg:#0e161d; --surface:#152029; --ink:#e5ecf2; --muted:#8fa2b1; --line:#26343f;
  --accent:#4cc2e6; --accent-soft:#16323d; --accent-ink:#06222c;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding:0}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.25rem;margin-top:2rem} h3{font-size:1.05rem;margin-top:1.4rem}
p{margin:.6rem 0} a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--code);padding:.08em .35em;border-radius:4px}
.v{color:var(--var);font-weight:600} .t{color:var(--term);font-weight:600}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:20px 12px 30px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
#side h4{margin:20px 0 6px;padding:0 10px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

#side a:hover{background:var(--accent-soft)} #side a.on{background:var(--accent-soft);font-weight:600}

#side a.home{margin-top:12px}

#side .sres{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:62vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#side .sres h5{margin:0;padding:9px 10px 3px;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
#side .sres a{display:block;padding:6px 10px;font-size:.86rem;line-height:1.3;border-radius:0}
#side .sres a.sel,#side .sres a:hover{background:var(--accent-soft)}
#side .sres a .sn{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-right:6px}
#side .sres a small{display:block;color:var(--muted);font-size:.76rem;margin-top:1px;overflow-wrap:anywhere}
#side .sres .none{padding:10px;color:var(--muted);font-size:.85rem}
#side .sres .more{padding:4px 10px 8px;color:var(--muted);font-size:.76rem}
.hit{animation:hit 2.4s ease-out}@keyframes hit{0%{outline:3px solid var(--term);outline-offset:3px}100%{outline:3px solid transparent;outline-offset:3px}}

.nav .btn{text-decoration:none}
.prog{padding:6px 10px 0;font-size:.8rem;color:var(--muted)}
.scrim{display:none}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);flex:none;transform:translateY(1px)}
.dot.done{background:var(--ok);border-color:var(--ok)} .dot.now{border-color:var(--accent);background:var(--accent-soft)}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:600;padding:0 10px;font-size:1.05rem}
.brand small{color:var(--muted);font-weight:400}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
main{padding:24px clamp(20px,4vw,56px) 80px;min-width:0;max-width:1060px;width:100%}
.menu{display:none}
.kicker{font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.pill{display:inline-block;font-size:.74rem;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:8px;vertical-align:middle}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.now{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{font-size:.78rem;font-family:var(--mono);padding:2px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.card.model{border-left:4px solid var(--accent)}
.card h3:first-child{margin-top:0}
.callout{background:var(--warn-soft);border-radius:8px;padding:10px 14px;margin:14px 0;font-size:.95rem}
.callout.ok{background:var(--ok-soft)}
.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--code);font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.g{font-family:var(--mono);font-size:.95rem;white-space:pre-wrap}
.gbox{font-family:var(--mono);background:var(--code);padding:10px 14px;border-radius:8px;white-space:pre;overflow-x:auto;margin:10px 0}
ol.practice{padding-left:0;list-style:none;counter-reset:q;display:grid;gap:12px}
ol.practice>li{counter-increment:q;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
ol.practice>li::before{content:"Q" counter(q);font-family:var(--mono);font-weight:600;color:var(--accent);margin-right:8px}
.src{font-family:var(--mono);font-size:.74rem;background:var(--code);padding:1px 7px;border-radius:4px;color:var(--muted);margin-right:6px}
details.ans{margin-top:8px} details.ans summary{cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:500}
details.ans>div{margin-top:8px;padding:10px 14px;background:var(--ok-soft);border-radius:8px;font-size:.95rem}
button,.btn{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:7px}
button:hover{border-color:var(--accent)} button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number]{font:inherit;font-family:var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;max-width:100%}
.w{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.w .cap{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;font-family:var(--mono);font-size:1.1rem}
.tok{padding:2px 8px;border-radius:6px;border:1px solid var(--line);min-width:1.9rem;text-align:center}
.tok.var{background:var(--var-bg);color:var(--var);border-color:transparent;font-weight:600}
.tok.term{background:var(--term-bg);color:var(--term);font-weight:600;border-color:transparent}
button.tok.var{cursor:pointer;font:inherit;font-family:var(--mono);font-size:1.1rem;font-weight:600}
.tok.var.sel{outline:2px solid var(--var);outline-offset:1px}
.tok.dis{opacity:.4;cursor:default}
.log{font-family:var(--mono);font-size:.88rem;color:var(--muted);margin:8px 0}
.log b{color:var(--ink);font-weight:500}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split>*{min-width:0}
.msg{margin-top:8px;font-size:.93rem}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--warn)}
svg text{font-family:var(--mono)}
.tn-v{fill:var(--var-bg);stroke:var(--var);stroke-width:1.5}
.tn-v.pend{stroke-dasharray:3 3;fill:var(--surface)}
.tn-t{fill:var(--term);font-weight:600;font-size:14px}
.tn-vt{fill:var(--var);font-weight:600;font-size:14px}
.tn-e{fill:var(--muted);font-style:italic;font-size:14px}
.tn-l{stroke:var(--muted);stroke-width:1.3;fill:none}
.fa-c{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.fa-c.cur{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
.fa-e{stroke:var(--ink);stroke-width:1.5;fill:none}
.fa-a{fill:var(--ink)}
.fa-t{fill:var(--ink);font-size:14px}
.fa-l{fill:var(--accent);font-size:14px;font-weight:600}
.ring{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:38px;flex-wrap:wrap}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.big{font-size:2.6rem;font-weight:600;line-height:1;font-family:var(--mono)}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  #side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:30;box-shadow:0 0 24px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .2s;padding:18px 14px 30px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);height:100%}
  body.open #side{transform:none}
  body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
  main{padding:56px 16px 80px}
  .menu{display:inline-block}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
.dot.ready{border-color:var(--accent)}
.pill.ready{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tbl.c td,.tbl.c th{text-align:center}
.tbl .hl{background:var(--accent-soft)}
.tbl td.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.tbl td.x{background:var(--warn-soft);color:var(--warn);font-weight:600}

.tt td{font-family:var(--mono)}

.mx th{background:var(--code);font-weight:600}

.steps{counter-reset:s;padding-left:0;list-style:none;display:grid;gap:10px;margin:10px 0}
.steps>li{counter-increment:s;padding-left:36px;position:relative}
.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.stack{display:flex;flex-direction:column-reverse;gap:2px;min-height:34px;border:2px solid var(--ink);border-top:none;padding:4px;width:70px;border-radius:0 0 8px 8px}
.stack b{display:block;text-align:center;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);padding:1px 4px;border-radius:3px}
.tape{display:flex;overflow-x:auto;padding:4px 2px 8px}
.tape span{min-width:36px;height:38px;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:1.05rem;margin-left:-1px;background:var(--surface)}
.tape span.hd{background:var(--accent-soft);outline:2px solid var(--accent);z-index:1}
.fa-e.hot{stroke:var(--accent);stroke-width:2.6}
.fa-l{font-size:13px}
.idl{font-family:var(--mono);font-size:.92rem;line-height:1.9}
.idl .cur{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-weight:600}
.okc{color:var(--ok)} .badc{color:var(--warn)}
table.cyk{border-collapse:separate;border-spacing:3px;font-family:var(--mono);font-size:.92rem;margin:6px 0}

table.cyk td.cc{border:1.5px solid var(--ink);border-radius:6px;text-align:center;padding:4px 8px;min-width:78px;background:var(--surface);vertical-align:top}
table.cyk td.cc .cs{font-weight:600;color:var(--accent)} table.cyk td.cc .cl{font-size:.72rem;color:var(--muted);margin-top:2px}
table.cyk td.cc.top{background:var(--ok-soft);border-color:var(--ok)}
table.cyk td.base{text-align:center;font-weight:600;color:var(--term);font-size:1.05rem;padding-top:4px}
table.cyk td.pad{padding:0}
.paper{border:1.5px solid var(--line);border-radius:8px;padding:6px 16px;background:var(--surface);margin:8px 0}.paper p{margin:9px 0;line-height:1.6}.paper .box{display:inline-block;border:1.5px solid var(--ink);border-radius:3px;padding:1px 9px;margin:2px 0}.paper .pn{color:var(--muted);font-size:.88rem}
.qimg{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.pyq{border-left:3px solid var(--term);background:var(--warn-soft);border-radius:6px;padding:8px 12px;margin:6px 0 10px;font-size:.95rem;white-space:pre-line}
.steps>li,.practice>li{min-width:0;overflow-wrap:anywhere}
.steps>li .scroll,.card .scroll{max-width:100%}
.card,.w,.callout{min-width:0;max-width:100%}
code{overflow-wrap:anywhere}
pre.sql{font-family:var(--mono);background:var(--code);padding:10px 14px;border-radius:8px;overflow-x:auto;margin:10px 0;font-size:.88rem;line-height:1.5;white-space:pre;max-width:100%}
.bp-leaf{fill:var(--ok-soft);stroke:var(--ink);stroke-width:1.2} .bp-in{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.2} .bp-hi{fill:var(--term-bg);stroke:var(--term);stroke-width:2.2} .bp-t{fill:var(--ink);font-size:13px} .bp-ptr{stroke:var(--muted);stroke-width:1.2}
.mcq.ok{border-color:var(--ok)} .mcq.bad{border-color:var(--warn)} .mcq .row button{text-align:left}
</style>
</head>

/* ===== B+ tree (Silberschatz, as in the Module 4 slides): order n = at most n pointers per node,
   so a leaf holds at most n-1 keys. Leaf split keeps the first ⌈n/2⌉ keys and COPIES the first key of the new leaf up;
   internal split keeps ⌈(n+1)/2⌉ pointers and MOVES the middle key up. Deletion merges if the two nodes fit in one, else borrows. ===== */

      if(N.keys.indexOf(k)>=0){log.push(k+' is already in the tree.');return null}
      N.keys.push(k);N.keys.sort(function(a,b){return a-b});

      return {key:R.keys[0],right:R};
    }
    var i=0;while(i<N.keys.length&&k>=N.keys[i])i++;
    var r=ins(N.kids[i]);if(!r)return null;
    N.keys.splice(i,0,r.key);N.kids.splice(i+1,0,r.right);
    if(N.kids.length<=n){log.push('Parent takes '+r.key+': ['+N.keys.join(', ')+'].');return null}
    var m2=Math.ceil((n+1)/2),up=N.keys[m2-1],R2=bpNew(false);
    R2.keys=N.keys.slice(m2);R2.kids=N.kids.slice(m2);N.keys=N.keys.slice(0,m2-1);N.kids=N.kids.slice(0,m2);
    log.push('Internal node overflows ('+(n+1)+' pointers, max '+n+'). Split: ['+N.keys.join(', ')+'] | ['+R2.keys.join(', ')+']. Move '+up+' up (it is not kept below).');
    return {key:up,right:R2};
  }

  if(r){var T=bpNew(false);T.keys=[r.key];T.kids=[root,r.right];log.push('The root split, so a new root ['+r.key+'] is made. The tree grows one level.');return T}

function bpDelete(root,k,n,log){
  var path=[],N=root;
  while(!N.leaf){var i=0;while(i<N.keys.length&&k>=N.keys[i])i++;path.push([N,i]);N=N.kids[i]}
  var at=N.keys.indexOf(k);if(at<0){log.push(k+' is not in the tree.');return root}
  N.keys.splice(at,1);log.push('Remove '+k+' from its leaf: ['+N.keys.join(', ')+'].');

      return N;
    }
    var under=N.leaf?N.keys.length<minLeaf:N.kids.length<minKids;

function bpSVG(T,hi){

/* ===== functional dependencies: closure, candidate keys, normal form check ===== */
function fdParse(t){return t.split(/[,;\n]+/).map(function(s){var p=s.split(/->|→/);if(p.length!==2)return null;return {l:fdSet(p[0]),r:fdSet(p[1])}}).filter(function(f){return f&&f.l.length&&f.r.length})}
function fdSet(s){s=s.trim();return (/\s/.test(s)?s.split(/\s+/):s.split('')).filter(function(x){return x&&x!=='{'&&x!=='}'}).filter(function(x,i,a){return a.indexOf(x)===i}).sort()}
function fdClosure(X,F,log){
  var C=X.slice(),ch=true;
  while(ch){ch=false;F.forEach(function(f){if(f.l.every(function(a){return C.indexOf(a)>=0})&&f.r.some(function(a){return C.indexOf(a)<0})){f.r.forEach(function(a){if(C.indexOf(a)<0)C.push(a)});if(log)log.push('use '+f.l.join('')+' → '+f.r.join('')+': {'+C.slice().sort().join(', ')+'}');ch=true}})}
  return C.sort();
}
function fdKeys(R,F){
  var keys=[],N=R.length;
  for(var size=1;size<=N;size++){
    (function comb(st,cur){
      if(cur.length===size){if(keys.some(function(k){return k.every(function(a){return cur.indexOf(a)>=0})}))return;if(fdClosure(cur,F).length===N)keys.push(cur.slice());return}
      for(var i=st;i<N;i++){cur.push(R[i]);comb(i+1,cur);cur.pop()}
    })(0,[]);
  }
  return keys;
}

/* ===== conflict serializability: precedence graph from a schedule like "r1(A) w1(A) r2(A) w2(A)" ===== */

  ops.forEach(function(a,i){ops.slice(i+1).forEach(function(b){if(a.t!==b.t&&a.x===b.x&&(a.op==='W'||b.op==='W')){var k=a.t+'>'+b.t;if(!E[k]){E[k]=1;why[k]=a.op+a.t+'('+a.x+') before '+b.op+b.t+'('+b.x+')'}}})});
  var indeg={},order=[],left=T.slice();T.forEach(function(t){indeg[t]=0});Object.keys(E).forEach(function(k){indeg[+k.split('>')[1]]++});

    h+='<p>Conflicting pairs (same item, different transactions, at least one write), each giving an edge:</p><ul>'+(r.E.length?r.E.map(function(k){return '<li>'+r.why[k]+' ⇒ <b>T'+k.replace('>',' → T')+'</b></li>'}).join(''):'<li>none</li>')+'</ul>';
    h+='<div class="scroll">'+serSVG(r)+'</div>';
    h+=r.cyc?'<p class="msg bad"><b>The graph has a cycle, so the schedule is NOT conflict serializable.</b></p>':'<p class="msg ok"><b>No cycle, so the schedule IS conflict serializable</b>. Equivalent serial order (topological sort): '+r.order.map(function(t){return 'T'+t}).join(' → ')+'.</p>';

  }

var C11='<p>A <b>database</b> is a collection of related data. A <b>database management system (DBMS)</b> is that data plus the set of programs that store, retrieve and update it conveniently and efficiently. Before DBMSs, organisations kept data in separate operating-system files, each with its own programs. That is the <b>file-processing system</b>, and every purpose of a DBMS is a fix for one of its problems.</p>'+
'<h2>Why not just files? Seven problems a DBMS solves</h2>'+TBL(['Problem with files','What goes wrong (university example)','How a DBMS fixes it'],[
['<b>Data redundancy and inconsistency</b>','A student’s address is stored in both the Accounts file and the Library file. One copy is updated, the other is not.','One shared copy, normalized design'],
['<b>Difficulty in accessing data</b>','“List students in CSE with CGPA above 8” needs a new program, because nobody wrote one.','A query language (SQL) answers new questions without new programs'],
['<b>Data isolation</b>','Data is scattered in many files in different formats, so writing new programs is hard.','One data model and one catalogue'],
['<b>Integrity problems</b>','“Balance must never go below 0” is buried in program code and hard to change.','Constraints declared once (CHECK, PRIMARY KEY, FOREIGN KEY)'],
['<b>Atomicity problems</b>','The system crashes after ₹50 leaves account A but before it reaches B.','Transactions: all or nothing'],
['<b>Concurrent-access anomalies</b>','Two clerks withdraw from the same account at the same time and one update is lost.','Concurrency control (locking)'],
['<b>Security problems</b>','A payroll clerk can read student marks.','Authorization: GRANT / REVOKE, views']])+
'<h2>Applications of DBMS</h2><p>'+S('Rem Q1')+'Banking (accounts, loans, transactions), airlines and railways (reservations, schedules), universities (students, courses, grades, e.g. Eduserve), e-commerce (products, orders, payments), telecom (call records, billing), human resources (employees, payroll), manufacturing (inventory, supply chain), healthcare (patients, appointments, prescriptions), social media (users, posts, friends).</p>'+
'<h2>Solved models</h2>'+
MODEL('1. Purpose of a database system and drawbacks of file processing '+S('IA2QB M1 C3'),'<div class="paper"><p><b>Purpose.</b> A database system lets many users store, retrieve and update shared data <b>conveniently</b> (through a query language), <b>efficiently</b> (indexes, query optimization), <b>correctly</b> (integrity constraints, transactions) and <b>securely</b> (authorization), while hiding how the data is physically stored.</p><p><b>Drawbacks of file-processing systems</b> (write each with one example):</p><p>1. Data redundancy and inconsistency. 2. Difficulty in accessing data. 3. Data isolation. 4. Integrity problems. 5. Atomicity problems. 6. Concurrent-access anomalies. 7. Security problems.</p><p>(Use the table above for the one-line example of each.)</p><p><b>Conclusion.</b> A DBMS removes these problems by keeping one integrated copy of the data under one system that enforces constraints, transactions, concurrency control and security.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M1 A1')+'Define a database.','A database is an organised collection of logically related data, stored so that it can be accessed, managed and updated easily. Example: a university database of students, courses and marks.')+
P(S('IA2QB M1 A2')+'What is a DBMS?','A Database Management System is a collection of interrelated data together with a set of programs to access that data. It provides a convenient and efficient way to store and retrieve information. Examples: Oracle, MySQL, PostgreSQL.')+
P(S('Rem Q1')+'List the applications of DBMS.','Banking, airlines/railway reservation, universities, e-commerce, telecommunication, human resources, manufacturing, healthcare, social media, finance (stock trading).')+
'</ol>';

var C12='<p>Users should not need to know how data sits on the disk. A DBMS hides that by describing the data at three levels. This is <b>data abstraction</b>.</p>'+

['Also called','Internal level','Conceptual level','External level'],['Position','Lowest','Middle','Highest'],['Describes','<b>How</b> data is stored: files, blocks, indexes, access paths','<b>What</b> data is stored and the relationships among it: tables, attributes, keys, constraints','<b>Part</b> of the database a particular user needs; the rest is hidden'],

'<h2>Schema and instance</h2><p>The <b>schema</b> is the overall design of the database (like a variable’s type); it rarely changes. The <b>instance</b> is the data in the database at a particular moment (like a variable’s value); it changes all the time. There is a physical schema, a logical schema and several subschemas (views).</p>'+
'<h2>Data independence</h2><p>The ability to change the schema at one level without changing the schema at the next higher level.</p>'+TBL(['','Physical data independence','Logical data independence'],[['Meaning','Change the physical schema without changing the logical schema','Change the logical schema without changing the views / application programs'],['Example','Add an index on Register_No, move files to SSD, change file organization','Add a column Email to Student, split a table into two'],['How hard','Easier to achieve','Harder to achieve (programs depend on the logical structure)']])+
'<h2>Solved models</h2>'+
MODEL('1. Three levels of data abstraction with an example '+S('IA2QB M1 B2')+S('Self Q5'),'<div class="paper"><p>Data abstraction hides the complexity of storage from users by describing data at three levels.</p><p><b>1. Physical level (internal).</b> Lowest level. Describes <i>how</i> data is actually stored: file organization, disk blocks, indexes, access methods. <i>Hospital example:</i> patient records stored as fixed-length records in disk blocks with a B+ tree index on Patient_ID.</p><p><b>2. Logical level (conceptual).</b> Describes <i>what</i> data is stored and how it is related: Patient(Patient_ID, Name, Age), Doctor(Doctor_ID, Name, Specialization), Appointment(Appt_ID, Patient_ID, Doctor_ID, Date, Fee) with primary and foreign keys.</p><p><b>3. View level (external).</b> Highest level. Each user sees only the part they need. A receptionist sees patient name and appointment time; a doctor sees diagnosis and history; billing sees fees only.</p><p>Draw the three-schema diagram above, and state that it gives <b>physical and logical data independence</b>, security (each user sees only their view) and reduced complexity.</p></div>')+
MODEL('2. Three-schema architecture '+S('IA2QB M1 C1')+S('Self Q6'),'<div class="paper"><p>The ANSI/SPARC three-schema architecture separates user applications from the physical database.</p><p><b>External schema</b>: many user views. <i>Airline:</i> the passenger view shows flights, seats and their booking; the crew view shows duty rosters; the agent view shows availability and fares.</p><p><b>Conceptual schema</b>: one description of the whole database for all users: entities Passenger, Flight, Booking, Payment, Airport, Aircraft, their attributes, relationships and constraints, without storage details.</p><p><b>Internal schema</b>: physical storage: Booking stored as a heap file with a hash index on PNR, Flight stored sorted on Flight_No with a B+ tree index on (Source, Destination, Date).</p><p><b>Mappings.</b> External/conceptual mapping converts a view request into the conceptual schema; conceptual/internal mapping converts it into storage operations. Because of these mappings we get <b>logical</b> and <b>physical data independence</b>.</p><p>(Draw the three-level diagram with mappings.)</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M1 A3')+'List the three views/levels of data.','Physical (internal) level, logical (conceptual) level, view (external) level.')+
P(S('IA2QB M1 A4')+'What is data abstraction?','Hiding the details of how data is stored and maintained, and showing users only what they need. Done at three levels: physical, logical and view.')+
P(S('IA2QB M1 A7')+'What is the physical level?','The lowest level of abstraction. It describes how data is actually stored: files, blocks, indexes and access methods.')+
P(S('IA2QB M1 A8')+'What is the logical level?','The middle level. It describes what data is stored and the relationships among the data: tables, attributes, keys and constraints.')+
P(S('IA2QB M1 A9')+'What is the view level?','The highest level. It describes only the part of the database a particular user needs and hides the rest. Many views can exist for one database.')+
P(S('IA2QB M1 A10')+'Define schema.','The overall logical design (structure) of the database: the relations, their attributes, keys and constraints. Example: Student(RollNo, Name, Dept).')+
P(S('IA2QB M1 A11')+'What is an instance of a database?','The actual data stored in the database at a particular moment. It changes as data is inserted, deleted or updated; the schema does not.')+
P(S('IA2QB M1 B3')+'What is data independence? Name its types.','The ability to change the schema at one level without having to change the schema at the next higher level. Types: physical data independence and logical data independence.')+
P(S('IA2QB M1 B4')+'Distinguish between physical and logical data independence.','Use the table above: physical = change storage without changing the logical schema (easier); logical = change the logical schema without changing views/programs (harder).')+

'<h2>Two-tier and three-tier architecture</h2><p><b>Two-tier</b>: the application on the client talks directly to the database server (ODBC/JDBC). <b>Three-tier</b>: the client is only a front end (browser); it talks to an <b>application server</b> holding the business logic, which talks to the database server. Large web applications are three-tier. Other system types: <b>centralized</b>, <b>client-server</b>, <b>parallel</b> and <b>distributed</b>.</p>'+

MODEL('1. Architecture and working of a DBMS with a neat sketch '+S('Rem Q11')+S('Rev1 Q13'),'<div class="paper"><p>Draw the structure diagram above. Then explain:</p><p><b>Users and interfaces.</b> Naive users, application programmers, sophisticated users and the DBA reach the system through application interfaces, programs, query tools and admin tools.</p><p><b>Query processor.</b> DDL interpreter (records definitions in the data dictionary), DML compiler (translates a query into an optimized evaluation plan) and query evaluation engine (executes it).</p><p><b>Storage manager.</b> The interface between low-level stored data and the programs and queries. Its parts: authorization and integrity manager, transaction manager, file manager, buffer manager.</p><p><b>Transaction management.</b> Ensures ACID: recovery manager restores consistency after failures; concurrency-control manager controls interaction among concurrent transactions.</p><p><b>Disk storage.</b> Data files, data dictionary (metadata), indices, statistical data.</p><p><b>Working.</b> A query is parsed and translated by the DML compiler, optimized into a plan, executed by the evaluation engine, which asks the storage manager for blocks; the buffer manager brings them into memory; results return to the user.</p></div>')+
MODEL('2. Database system architectures and the role of the DBA '+S('IA2QB M1 C10'),'<div class="paper"><p><b>Centralized:</b> the DBMS runs on one computer; users connect by terminals. Simple but a single point of failure.</p><p><b>Client–server:</b> server machines run the DBMS; client machines run user interfaces/apps. <i>Two-tier</i> (client app talks to DB via ODBC/JDBC) and <i>three-tier</i> (client → application server → database).</p><p><b>Parallel:</b> many processors and disks work on one database to speed up queries.</p><p><b>Distributed:</b> data stored at several sites connected by a network; each site can process local transactions and take part in global ones. Gives availability and local autonomy.</p><p><b>Role of the DBA:</b> schema definition; storage structure and access-method definition; schema and physical-organization modification; granting authorization; routine maintenance: backups, disk space, performance monitoring, recovery.</p></div>')+

P(S('IA2QB M1 B6')+'What are the components of the relational model?','(1) Structure: relations, tuples, attributes, domains. (2) Integrity: keys, entity integrity, referential integrity, domain constraints. (3) Manipulation: relational algebra / SQL operations.')+
'</ol>';

var C16='<p>A <b>key</b> is a set of attributes whose values identify a tuple. Keys are how relations stay free of duplicates and how they refer to each other.</p>'+
TBL(['Key','Definition','Example: Student(RollNo, RegNo, Name, Phone, DeptID)'],[
['<b>Super key</b>','Any set of attributes that uniquely identifies a tuple (extra attributes allowed)','{RollNo}, {RegNo}, {RollNo, Name}, {RegNo, Phone}'],
['<b>Candidate key</b>','A <i>minimal</i> super key: remove any attribute and it stops being unique','{RollNo}, {RegNo}'],
['<b>Primary key</b>','The candidate key chosen by the designer; cannot be NULL or repeat','RollNo'],
['<b>Alternate key</b>','A candidate key not chosen as primary','RegNo'],
['<b>Composite key</b>','A key with two or more attributes','Enrollment(RollNo, CourseID) → {RollNo, CourseID}'],
['<b>Foreign key</b>','Attributes in one relation that refer to the primary key of another','Student.DeptID refers to Department.DeptID'],
['<b>Unique key</b>','Values must be distinct but one NULL is allowed','Phone'],
['<b>Surrogate key</b>','A system-generated identifier with no business meaning','an auto-increment ID']])+
'<p>Every candidate key is a super key, every primary key is a candidate key. A relation can have many candidate keys but only one primary key.</p>'+
'<h2>Integrity constraints</h2>'+TBL(['Constraint','Rule'],[['<b>Domain constraint</b>','Every value of an attribute must come from its domain (type, range, CHECK)'],['<b>Entity integrity</b>','No primary-key attribute may be NULL'],['<b>Referential integrity</b>','A foreign-key value must match an existing primary-key value in the referenced table, or be NULL'],['<b>Key constraint</b>','No two tuples may have the same primary/candidate key value'],['NOT NULL / UNIQUE / CHECK','Column-level rules declared in SQL']])+
'<h2>Solved model</h2>'+
MODEL('1. Types of keys with examples '+S('IA2QB M1 C5')+S('Rev1 Q9'),'<div class="paper"><p>Take Employee(EmpID, Aadhaar, Email, Name, DeptID) and Department(DeptID, DName).</p><p><b>Super key:</b> any attribute set that identifies an employee: {EmpID}, {EmpID, Name}, {Aadhaar, Email}.</p><p><b>Candidate key:</b> a minimal super key: {EmpID}, {Aadhaar}, {Email}.</p><p><b>Primary key:</b> chosen candidate key, EmpID: unique and NOT NULL.</p><p><b>Alternate keys:</b> Aadhaar, Email.</p><p><b>Composite key:</b> in Works_On(EmpID, ProjID, Hours), the key is {EmpID, ProjID}.</p><p><b>Foreign key:</b> Employee.DeptID references Department.DeptID; it can only hold department numbers that exist.</p><p><b>Purpose:</b> keys guarantee uniqueness (no duplicate tuples), enforce entity and referential integrity, link tables for joins and are used for indexing.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M1 A16')+'Define primary key.','A candidate key chosen to uniquely identify each tuple of a relation. It must be unique and cannot be NULL.')+
P(S('IA2QB M1 A17')+'What is a candidate key?','A minimal super key: a set of attributes that uniquely identifies tuples and from which no attribute can be removed.')+
P(S('IA2QB M1 A18')+'What is a foreign key?','An attribute (or set) in one relation whose values must match the primary key of another (or the same) relation, linking the two.')+
P(S('IA2QB M1 A20')+'What is a super key?','Any set of one or more attributes that together uniquely identify a tuple. It may contain extra attributes.')+
P(S('IA2QB M1 B7')+'Explain super key with an example.','In Student(RollNo, Name, Phone), {RollNo} identifies each student, so it is a super key; adding attributes keeps it a super key: {RollNo, Name}, {RollNo, Phone}, {RollNo, Name, Phone}. {Name} alone is not, because names repeat.')+
P(S('IA2QB M1 B8')+'Differentiate candidate key and primary key.','A relation may have several candidate keys (each a minimal super key, may allow NULL in practice); exactly one is chosen as the primary key, which must be NOT NULL. Example: RollNo and RegNo are candidate keys; RollNo is the primary key, RegNo is the alternate key.')+
P(S('IA2QB M1 B9')+'What is a foreign key? Example using two tables.','Department(<u>DeptID</u>, DName) and Employee(<u>EmpID</u>, Name, DeptID). Employee.DeptID is a foreign key referencing Department.DeptID: an employee may only be put in a department that exists.')+
P(S('Rem Q4')+'List any four integrity constraints.','Domain constraint, entity integrity constraint, referential integrity constraint, key (unique) constraint. (Also NOT NULL and CHECK.)')+
'</ol>';

var C17='<p><b>Relational algebra</b> is a procedural query language: each operation takes one or two relations and returns a new relation, so operations can be nested. SQL is built on it.</p>'+
TBL(['Operation','Symbol','Type','Meaning'],[['Select','σ<sub>condition</sub>(R)','unary','rows that satisfy the condition'],['Project','π<sub>attributes</sub>(R)','unary','only the listed columns (duplicates removed)'],['Union','R ∪ S','binary','rows in R or S (or both)'],['Set difference','R − S','binary','rows in R but not in S'],['Cartesian product','R × S','binary','every row of R paired with every row of S'],['Rename','ρ<sub>X</sub>(R)','unary','give the result (or attributes) a new name']])+
'<p>Union and set difference need <b>union-compatible</b> relations: the same number of attributes, with matching domains, in the same order.</p>'+
'<h2>Worked examples on employee(EmpID, Name, Salary, DeptID) and dept(DeptID, DName)</h2>'+TBL(['Query','Relational algebra'],[['Employees earning above 50000','σ<sub>Salary &gt; 50000</sub>(employee)'],['Names of all employees','π<sub>Name</sub>(employee)'],['Names of employees in dept 10 earning above 30000','π<sub>Name</sub>(σ<sub>DeptID = 10 ∧ Salary &gt; 30000</sub>(employee))'],['DeptIDs that have employees or are in dept table','π<sub>DeptID</sub>(employee) ∪ π<sub>DeptID</sub>(dept)'],['Departments with no employees','π<sub>DeptID</sub>(dept) − π<sub>DeptID</sub>(employee)'],['Employee with department name','π<sub>Name, DName</sub>(σ<sub>employee.DeptID = dept.DeptID</sub>(employee × dept))'],['Highest salary (with rename)','π<sub>Salary</sub>(employee) − π<sub>e.Salary</sub>(σ<sub>e.Salary &lt; f.Salary</sub>(ρ<sub>e</sub>(employee) × ρ<sub>f</sub>(employee)))']])+
'<h2>Solved models</h2>'+
MODEL('1. Fundamental operations of relational algebra '+S('IA2QB M1 C7')+S('Rev1 Q5'),'<div class="paper"><p>Use two small tables: <b>Student</b>(RollNo, Name, Dept) = {(1, Asha, CSE), (2, Ravi, ECE), (3, Meena, CSE)} and <b>Club</b>(RollNo, Name, Dept) = {(2, Ravi, ECE), (4, John, MECH)}.</p><p><b>1. Selection σ</b> picks rows. σ<sub>Dept=\'CSE\'</sub>(Student) = {(1, Asha, CSE), (3, Meena, CSE)}.</p><p><b>2. Projection π</b> picks columns and removes duplicates. π<sub>Dept</sub>(Student) = {CSE, ECE}.</p><p><b>3. Union ∪</b> (union-compatible). Student ∪ Club = {(1,Asha,CSE), (2,Ravi,ECE), (3,Meena,CSE), (4,John,MECH)}; the common row appears once.</p><p><b>4. Set difference −</b>. Student − Club = {(1,Asha,CSE), (3,Meena,CSE)}.</p><p><b>5. Cartesian product ×</b>. Student × Course gives 3 × |Course| rows, each student paired with each course; degree = 3 + degree of Course.</p><p><b>6. Rename ρ</b>. ρ<sub>S</sub>(Student) lets us refer to a second copy, e.g. for comparing students with each other.</p><p>Show each result as a small table.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M1 A19')+'Name any two operators of relational algebra.','Selection (σ) and projection (π). Others: union, set difference, Cartesian product, rename, join.')+
P(S('IA2QB M1 B10')+'Explain SELECT (σ) with syntax.','σ<sub>predicate</sub>(R) returns the tuples of R that satisfy the predicate. The predicate uses =, ≠, &lt;, ≤, &gt;, ≥ joined by ∧, ∨, ¬. Example: σ<sub>dept_name=\'Physics\' ∧ salary&gt;90000</sub>(instructor).')+
P(S('IA2QB M1 B11')+'Explain PROJECT (π) with an example.','π<sub>A1,…,Ak</sub>(R) keeps only the listed attributes and removes duplicate rows. π<sub>ID, name, salary</sub>(instructor) lists those three columns for every instructor.')+
P(S('IA2QB M1 B12')+'Relational algebra for employees with salary &gt; 50000 from EMPLOYEE(EmpID, Name, Salary).','σ<sub>Salary &gt; 50000</sub>(EMPLOYEE). For names only: π<sub>Name</sub>(σ<sub>Salary &gt; 50000</sub>(EMPLOYEE)).')+
P(S('IA2QB M1 B13')+'Explain UNION and the conditions required.','R ∪ S contains every tuple in R, in S or in both, with duplicates removed. Conditions: R and S must have the same arity, and the i-th attributes must have the same domain (union-compatible). Example: π<sub>course_id</sub>(σ<sub>semester=\'Fall\'</sub>(section)) ∪ π<sub>course_id</sub>(σ<sub>semester=\'Spring\'</sub>(section)).')+
P(S('IA2QB M1 B14')+'What is SET DIFFERENCE? Example.','R − S gives tuples in R but not in S (union-compatible). Courses offered in Fall but not in Spring: π<sub>course_id</sub>(σ<sub>semester=\'Fall\'</sub>(section)) − π<sub>course_id</sub>(σ<sub>semester=\'Spring\'</sub>(section)).')+
P(S('IA2QB M1 B15')+'Explain Cartesian product with an example.','R × S pairs every tuple of R with every tuple of S. If R has 3 tuples of 2 attributes and S has 2 tuples of 3 attributes, R × S has 3 × 2 = 6 tuples of 5 attributes. Usually followed by σ to keep matching pairs: σ<sub>instructor.ID = teaches.ID</sub>(instructor × teaches).')+
P(S('IA2QB M1 B20')+'Names of students who scored above 90 from STUDENT(RollNo, Name, Marks).','π<sub>Name</sub>(σ<sub>Marks &gt; 90</sub>(STUDENT))')+
'</ol>';

var C18='<p>The additional operations do not add power (each can be written with the fundamental six) but make queries much shorter.</p>'+
TBL(['Operation','Symbol','Equivalent / meaning'],[['Set intersection','R ∩ S','R − (R − S): tuples in both'],['Natural join','R ⋈ S','π over σ<sub>common attributes equal</sub>(R × S), common columns kept once'],['Theta join','R ⋈<sub>θ</sub> S','σ<sub>θ</sub>(R × S) for any condition θ'],['Equi join','R ⋈<sub>R.a = S.b</sub> S','theta join where θ uses only ='],['Outer joins','⟕ ⟖ ⟗','join that keeps unmatched tuples of the left / right / both, padding with NULL'],['Division','R ÷ S','tuples of R related to <b>all</b> tuples of S'],['Assignment','temp ← expr','store a result in a temporary relation'],['Aggregation (generalized projection)','<sub>G</sub>γ<sub>F(A)</sub>(R)','group by G and apply sum, avg, count, min, max']])+
'<h2>Division, step by step</h2><p>Takes(Student, Course) ÷ Required(Course) = students who took <b>every</b> required course. Formula: π<sub>Student</sub>(Takes) − π<sub>Student</sub>((π<sub>Student</sub>(Takes) × Required) − Takes).</p>'+
'<div class="split"><div style="flex:1 1 180px">'+TBL(['Student','Course'],[['Asha','DBMS'],['Asha','OS'],['Ravi','DBMS'],['Meena','DBMS'],['Meena','OS']])+'</div><div style="flex:0 1 120px">'+TBL(['Course'],[['DBMS'],['OS']])+'</div><div style="flex:0 1 140px">'+TBL(['Result'],[['Asha'],['Meena']])+'</div></div>'+

'<p><b>i.</b> π<sub>patient_id, patient_name</sub>(Patient)</p>'+

'<p><b>iii.</b> π<sub>doctor_name, doctor_specialization</sub>(Doctor)</p>'+
'<p><b>iv.</b> C ← <sub>doctor_id</sub>γ<sub>count(appointment_id) as n</sub>(Appointment)<br>M ← γ<sub>max(n) as m</sub>(C)<br>Result ← π<sub>doctor_name</sub>(Doctor ⋈ σ<sub>n = m</sub>(C × M))</p>'+

MODEL('2. STUDENT and DEPT queries '+S('IA2QB M1 C6'),'<div class="paper"><p>STUDENT(RollNo, Name, DeptID), DEPT(DeptID, DeptName).</p><p><b>(a)</b> Students in CSE: σ<sub>DeptName=\'CSE\'</sub>(STUDENT ⋈ DEPT), or names only π<sub>Name</sub>(STUDENT ⋈ σ<sub>DeptName=\'CSE\'</sub>(DEPT)). The join matches DeptID; selection keeps CSE.</p><p><b>(b)</b> Names of all students: π<sub>Name</sub>(STUDENT). Projection keeps one column and removes duplicates.</p><p><b>(c)</b> Student with department details: STUDENT ⋈ DEPT (natural join on DeptID), equivalently σ<sub>STUDENT.DeptID = DEPT.DeptID</sub>(STUDENT × DEPT).</p></div>')+
MODEL('3. Intersection, assignment and rename '+S('IA2QB M1 C8'),'<div class="paper"><p><b>Intersection ∩.</b> R ∩ S = tuples in both (union-compatible). Courses taught in both Fall 2009 and Spring 2010: π<sub>course_id</sub>(σ<sub>semester=\'Fall\' ∧ year=2009</sub>(section)) ∩ π<sub>course_id</sub>(σ<sub>semester=\'Spring\' ∧ year=2010</sub>(section)). It can be written as R − (R − S).</p><p><b>Assignment ←.</b> Stores an intermediate result in a temporary relation to write long queries in steps: temp1 ← σ<sub>dept_name=\'Physics\'</sub>(instructor); result ← π<sub>name</sub>(temp1).</p><p><b>Rename ρ.</b> ρ<sub>x(A1,…,An)</sub>(E) returns E named x with attributes A1..An. Needed to compare a relation with itself: the largest salary is π<sub>salary</sub>(instructor) − π<sub>i.salary</sub>(σ<sub>i.salary &lt; d.salary</sub>(ρ<sub>i</sub>(instructor) × ρ<sub>d</sub>(instructor))).</p></div>')+
MODEL('4. Convert relational algebra into SQL '+S('Rem Q9'),'<div class="paper">'+CODE("-- σ dept_name = 'Physics' (instructor)\nSELECT * FROM instructor WHERE dept_name = 'Physics';\n\n-- σ dept_name = 'Physics' ∧ salary > 90000 (instructor)\nSELECT * FROM instructor WHERE dept_name = 'Physics' AND salary > 90000;\n\n-- π ID, name, salary (instructor)\nSELECT DISTINCT ID, name, salary FROM instructor;\n\n-- π dept_name (σ salary > 80000 (instructor))\nSELECT DISTINCT dept_name FROM instructor WHERE salary > 80000;\n\n-- π course_id (σ Fall 2009 (section)) ∪ π course_id (σ Spring 2010 (section))\nSELECT course_id FROM section WHERE semester = 'Fall' AND year = 2009\nUNION\nSELECT course_id FROM section WHERE semester = 'Spring' AND year = 2010;")+'<p class="pn">π removes duplicates, so DISTINCT is the exact translation; UNION also removes duplicates.</p></div>')+
MODEL('5. Assignment 1: SQL and relational algebra on EMPLOYEES '+S('Asg1 Q1')+S('Asg1 Q2')+S('Asg1 Q3')+S('Asg1 Q4')+S('Asg1 Q5')+S('Asg1 Q6')+S('Asg1 Q7')+S('Asg1 Q8')+S('Asg1 Q9'),'<div class="paper">'+CODE("-- 1\nSELECT employee_id||','||first_name||','||last_name||','||email||','||phone_number||','||hire_date||','||job_id||','||salary||','||commission_pct||','||manager_id||','||department_id AS THE_OUTPUT FROM employees;\n-- 2\nSELECT last_name, job_id FROM employees WHERE manager_id IS NULL;\n-- 3\nSELECT last_name, salary FROM employees WHERE salary NOT BETWEEN 5000 AND 12000;\n-- 4\nSELECT last_name, department_id FROM employees WHERE department_id IN (20, 50) ORDER BY last_name;\n-- 5\nSELECT last_name, salary FROM employees WHERE salary BETWEEN 5000 AND 12000 AND department_id IN (20, 50);\n-- 6\nSELECT last_name, hire_date FROM employees WHERE hire_date LIKE '%94';   -- or EXTRACT(YEAR FROM hire_date) = 1994\n-- 7\nSELECT last_name, LPAD(salary, 15, '$') AS SALARY FROM employees;\n-- 8\nSELECT job_id, MAX(salary) \"Maximum\", MIN(salary) \"Minimum\", SUM(salary) \"Sum\", ROUND(AVG(salary)) \"Average\" FROM employees GROUP BY job_id;\n-- 9\nSELECT MAX(salary) - MIN(salary) AS DIFFERENCE FROM employees;")+
'<p><b>Relational algebra</b> (E = employees):<br>2. π<sub>last_name, job_id</sub>(σ<sub>manager_id = null</sub>(E))<br>3. π<sub>last_name, salary</sub>(σ<sub>salary &lt; 5000 ∨ salary &gt; 12000</sub>(E))<br>4. π<sub>last_name, department_id</sub>(σ<sub>department_id = 20 ∨ department_id = 50</sub>(E)) (algebra has no ordering; ORDER BY is SQL only)<br>5. π<sub>last_name, salary</sub>(σ<sub>salary ≥ 5000 ∧ salary ≤ 12000 ∧ (department_id = 20 ∨ department_id = 50)</sub>(E))<br>6. π<sub>last_name, hire_date</sub>(σ<sub>year(hire_date) = 1994</sub>(E))<br>8. <sub>job_id</sub>γ<sub>max(salary), min(salary), sum(salary), avg(salary)</sub>(E)<br>9. γ<sub>max(salary) − min(salary)</sub>(E)<br>1 and 7 are formatting (string operations), done in SQL only.</p></div>')+

var C21='<p><b>SQL</b> (Structured Query Language) is the standard language for relational databases (ANSI/ISO standard, first built at IBM as SEQUEL). It is <b>declarative</b>: you say <i>what</i> you want, the DBMS decides <i>how</i>. Its parts:</p>'+
TBL(['Part','Purpose','Commands'],[['<b>DDL</b> Data Definition Language','define and change structure','CREATE, ALTER, DROP, TRUNCATE, RENAME'],['<b>DML</b> Data Manipulation Language','query and change data','SELECT, INSERT, UPDATE, DELETE'],['<b>DCL</b> Data Control Language','permissions','GRANT, REVOKE'],['<b>TCL</b> Transaction Control Language','transactions','COMMIT, ROLLBACK, SAVEPOINT']])+
'<h2>Data types (Oracle)</h2>'+TBL(['Type','Use'],[['CHAR(n)','fixed-length string, padded'],['VARCHAR2(n) / VARCHAR(n)','variable-length string up to n'],['NUMBER(p, s)','numbers: p digits, s after the point; NUMBER(8,2) for money'],['INT / INTEGER','whole numbers'],['DATE','date and time; TIMESTAMP for fractions of a second'],['CLOB / BLOB','large text / binary']])+
'<h2>Creating a table with every kind of constraint</h2>'+CODE("CREATE TABLE department (\n  dept_id   NUMBER(4)     PRIMARY KEY,\n  dept_name VARCHAR2(30)  NOT NULL UNIQUE,\n  location  VARCHAR2(30)  DEFAULT 'Main block'\n);\n\nCREATE TABLE employee (\n  emp_id    NUMBER(6)     PRIMARY KEY,                       -- entity integrity\n  name      VARCHAR2(40)  NOT NULL,\n  email     VARCHAR2(50)  UNIQUE,\n  salary    NUMBER(9,2)   CHECK (salary > 0),                -- domain constraint\n  dept_id   NUMBER(4)     REFERENCES department(dept_id)     -- referential integrity\n                          ON DELETE SET NULL\n);")+
CODE("ALTER TABLE employee ADD (phone VARCHAR2(15));\nALTER TABLE employee MODIFY (name VARCHAR2(60));\nALTER TABLE employee DROP COLUMN phone;\nALTER TABLE employee ADD CONSTRAINT chk_sal CHECK (salary < 1000000);\nRENAME employee TO staff;\nTRUNCATE TABLE staff;      -- remove all rows, keep structure\nDROP TABLE staff;          -- remove rows and structure")+
'<h2>DELETE vs TRUNCATE vs DROP</h2>'+TBL(['','DELETE','TRUNCATE','DROP'],[['Type','DML','DDL','DDL'],['Removes','chosen rows (WHERE) or all rows','all rows','rows + table structure + indexes + constraints'],['Rollback','yes, until COMMIT','no (auto-commit)','no (auto-commit; Oracle can FLASHBACK from recycle bin)'],['Triggers fired','yes (DELETE triggers)','no','no'],['Speed','slow (logs each row)','fast','fast'],['Table afterwards','exists','exists, empty','gone']])+
'<h2>Solved models</h2>'+
MODEL('1. Integrity constraints in SQL with CREATE TABLE statements '+S('IA2QB M2 C7')+S('IA2QB M2 B14')+S('Rem Q3'),'<div class="paper"><p>Integrity constraints are rules declared on tables that every change must satisfy, so the data stays correct.</p><p><b>1. PRIMARY KEY</b>: unique and not null; one per table. <b>2. FOREIGN KEY</b> (REFERENCES): value must exist in the parent table or be NULL; ON DELETE CASCADE / SET NULL decides what happens when the parent row is deleted. <b>3. UNIQUE</b>: no two rows share the value (NULL allowed). <b>4. CHECK</b>: a condition each row must satisfy. <b>5. NOT NULL</b>: a value is required. (Also DEFAULT, which supplies a value when none is given.)</p>'+CODE("CREATE TABLE student (\n  roll_no NUMBER(5)    PRIMARY KEY,\n  name    VARCHAR2(30) NOT NULL,\n  email   VARCHAR2(40) UNIQUE,\n  age     NUMBER(3)    CHECK (age BETWEEN 17 AND 30),\n  dept_id NUMBER(3)    REFERENCES department(dept_id)\n);")+'<p>Inserting a second row with roll_no 1, a NULL name, age 45 or dept_id 99 (not in department) is rejected with an error.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M2 A1')+'What is SQL? Expand the term.','Structured Query Language: the standard declarative language to define, query, update and control access to relational databases.')+
P(S('IA2QB M2 A2')+S('IA2QB M2 A3')+'Expand DDL and DML.','DDL: Data Definition Language. DML: Data Manipulation Language.')+
P(S('IA2QB M2 A4')+'Name any two DDL commands.','CREATE, ALTER (also DROP, TRUNCATE, RENAME).')+
P(S('IA2QB M2 A5')+'Name any two DML commands.','INSERT, UPDATE (also SELECT, DELETE).')+

var C23='<h2>Set operations</h2><p>They combine the results of two queries. The two queries must be <b>union-compatible</b>: same number of columns, compatible types, same order.</p>'+
TBL(['Operation','Result','Duplicates'],[['UNION','rows in either query','removed (UNION ALL keeps them)'],['INTERSECT','rows in both queries','removed'],['EXCEPT (Oracle: MINUS)','rows in the first but not the second','removed']])+
CODE("-- courses in Fall 2009 or Spring 2010\nSELECT course_id FROM section WHERE semester = 'Fall' AND year = 2009\nUNION\nSELECT course_id FROM section WHERE semester = 'Spring' AND year = 2010;\n\n-- in both semesters\nSELECT course_id FROM section WHERE semester = 'Fall' AND year = 2009\nINTERSECT\nSELECT course_id FROM section WHERE semester = 'Spring' AND year = 2010;\n\n-- in Fall 2009 but not Spring 2010\nSELECT course_id FROM section WHERE semester = 'Fall' AND year = 2009\nMINUS\nSELECT course_id FROM section WHERE semester = 'Spring' AND year = 2010;")+
'<h2>NULL values</h2><p>NULL means <b>unknown or missing</b>. It is not zero and not an empty string.</p><ul><li>Any arithmetic with NULL gives NULL: 5 + NULL = NULL.</li><li>Any comparison with NULL gives <b>UNKNOWN</b>, the third truth value. WHERE keeps a row only if the condition is TRUE.</li><li>Test with <code>IS NULL</code> / <code>IS NOT NULL</code>, never <code>= NULL</code>.</li><li>Aggregates ignore NULLs, except COUNT(*), which counts rows.</li><li>NVL(commission, 0) or COALESCE replaces NULL with a value.</li></ul>'+
TBL(['AND','TRUE','UNKNOWN','FALSE'],[['<b>TRUE</b>','TRUE','UNKNOWN','FALSE'],['<b>UNKNOWN</b>','UNKNOWN','UNKNOWN','FALSE'],['<b>FALSE</b>','FALSE','FALSE','FALSE']],'c')+

'<h2>Solved models</h2>'+
MODEL('1. Set operations in SQL with syntax and examples '+S('IA2QB M2 C3')+S('Rem Q2'),'<div class="paper"><p>SQL set operators combine the result sets of two SELECT statements. Conditions: same number of columns, compatible data types, same column order. Duplicates are removed unless ALL is written.</p><p><b>1. UNION</b>: all distinct rows from both queries. <b>UNION ALL</b> keeps duplicates.<br><b>2. INTERSECT</b>: only rows common to both.<br><b>3. EXCEPT / MINUS</b>: rows of the first query not in the second.</p><p>Write the three section queries above as examples, with a two-row sample result for each.</p></div>')+

var C24='<p><b>Aggregate functions</b> take a collection of values and return one value: <b>COUNT, SUM, AVG, MIN, MAX</b>. With <b>GROUP BY</b> they return one value per group.</p>'+
'<div class="callout"><b>Rule:</b> every column in the SELECT list that is not inside an aggregate must appear in GROUP BY. <b>WHERE</b> filters rows before grouping and cannot use aggregates; <b>HAVING</b> filters groups after grouping and can.</div>'+
CODE("SELECT COUNT(*) FROM employee;                       -- rows\nSELECT COUNT(DISTINCT dept_id) FROM employee;        -- distinct non-null values\nSELECT dept_id, AVG(salary) AS avg_sal\nFROM employee\nWHERE salary > 10000          -- rows first\nGROUP BY dept_id\nHAVING AVG(salary) > 40000    -- then groups\nORDER BY avg_sal DESC;")+
TBL(['','WHERE','HAVING'],[['Filters','individual rows','groups'],['When','before GROUP BY','after GROUP BY'],['Aggregates allowed','no','yes'],['Needs GROUP BY','no','normally used with it']])+

var C25='<p>A <b>nested query (subquery)</b> is a SELECT inside another SQL statement. It can appear in WHERE, HAVING, FROM (a derived table) or SELECT (a scalar value).</p>'+
TBL(['Form','Meaning'],[['x IN (subquery)','x equals some value returned'],['x NOT IN (subquery)','x equals none of them (careful: a NULL in the list makes it UNKNOWN)'],['x &gt; ALL (subquery)','greater than every value'],['x &gt; ANY / SOME (subquery)','greater than at least one value'],['EXISTS (subquery)','the subquery returns at least one row'],['NOT EXISTS (subquery)','it returns no rows'],['x = (subquery)','scalar subquery: must return exactly one value']])+
'<p>A <b>correlated subquery</b> refers to a column of the outer query, so it is re-evaluated for each outer row (e.g. "employees earning more than their department’s average").</p>'+
CODE("-- uncorrelated\nSELECT name FROM employee WHERE salary > (SELECT AVG(salary) FROM employee);\n-- correlated\nSELECT e.name FROM employee e\nWHERE e.salary > (SELECT AVG(salary) FROM employee x WHERE x.dept_id = e.dept_id);\n-- derived table in FROM\nSELECT dept_id, avg_sal FROM (SELECT dept_id, AVG(salary) avg_sal FROM employee GROUP BY dept_id) WHERE avg_sal > 40000;")+
'<h2>Solved models</h2>'+

var C26='<h2>Joins</h2>'+TBL(['Join','Keeps'],[['INNER JOIN … ON','only rows that match in both tables'],['NATURAL JOIN','matches on all columns with the same name, shows them once'],['LEFT OUTER JOIN','all rows of the left table; NULLs where there is no match'],['RIGHT OUTER JOIN','all rows of the right table'],['FULL OUTER JOIN','all rows of both'],['CROSS JOIN','every pair (Cartesian product)'],['Self join','a table joined with itself using two aliases']])+
CODE("SELECT e.name, d.dept_name\nFROM employee e INNER JOIN department d ON e.dept_id = d.dept_id;\n\nSELECT e.name, d.dept_name                -- employees without a department too\nFROM employee e LEFT OUTER JOIN department d ON e.dept_id = d.dept_id;\n\nSELECT w.name AS worker, m.name AS manager  -- self join\nFROM employee w JOIN employee m ON w.manager_id = m.emp_id;")+
'<h2>Modifying the database</h2>'+CODE("INSERT INTO student VALUES (5, 'Ravi', 72);\nINSERT INTO student (RollNo, Name) VALUES (6, 'Meena');           -- Marks becomes NULL\nINSERT INTO topper SELECT * FROM student WHERE Marks > 90;       -- insert from a query\nUPDATE student SET Marks = Marks + 5 WHERE RollNo = 5;\nUPDATE employee SET salary = CASE WHEN salary <= 100000 THEN salary * 1.05 ELSE salary * 1.03 END;\nDELETE FROM student WHERE RollNo = 10;\nDELETE FROM employee WHERE salary < (SELECT AVG(salary) FROM employee);")+

MODEL('1. Hospital management queries '+S('Self Q1'),'<div class="paper">'+CODE("-- patient names with doctors and appointment dates\nSELECT p.Name AS patient, d.Name AS doctor, a.Appointment_Date\nFROM Patients p JOIN Appointments a ON p.Patient_ID = a.Patient_ID\n                JOIN Doctors d ON a.Doctor_ID = d.Doctor_ID;\n\n-- total fees of a specified patient\nSELECT SUM(Consultation_Fee) FROM Appointments WHERE Patient_ID = 101;\n\n-- doctor(s) charging the highest fee\nSELECT DISTINCT d.Name FROM Doctors d JOIN Appointments a ON d.Doctor_ID = a.Doctor_ID\nWHERE a.Consultation_Fee = (SELECT MAX(Consultation_Fee) FROM Appointments);\n\n-- patients who never booked\nSELECT Name FROM Patients WHERE Patient_ID NOT IN (SELECT Patient_ID FROM Appointments);\n\n-- appointments handled in a specialization\nSELECT COUNT(*) FROM Appointments a JOIN Doctors d ON a.Doctor_ID = d.Doctor_ID\nWHERE d.Specialization = 'Cardiology';\n\n-- average fee per patient\nSELECT p.Name, AVG(a.Consultation_Fee) FROM Patients p JOIN Appointments a ON p.Patient_ID = a.Patient_ID\nGROUP BY p.Patient_ID, p.Name;")+'</div>')+
MODEL('2. University examination queries '+S('Self Q2'),'<div class="paper">'+CODE("-- names with courses and marks\nSELECT s.Name, c.Course_Name, e.Marks\nFROM Students s JOIN Enrollments e ON s.Student_ID = e.Student_ID\n                JOIN Courses c ON e.Course_ID = c.Course_ID;\n\n-- total credits of a specified student\nSELECT SUM(c.Credits) FROM Enrollments e JOIN Courses c ON e.Course_ID = c.Course_ID\nWHERE e.Student_ID = 1001;\n\n-- course(s) with the highest marks\nSELECT DISTINCT c.Course_Name FROM Courses c JOIN Enrollments e ON c.Course_ID = e.Course_ID\nWHERE e.Marks = (SELECT MAX(Marks) FROM Enrollments);\n\n-- students not enrolled in any course\nSELECT Name FROM Students s WHERE NOT EXISTS (SELECT 1 FROM Enrollments e WHERE e.Student_ID = s.Student_ID);\n\n-- number of students in a department\nSELECT COUNT(*) FROM Students WHERE Department = 'CSE';\n\n-- average marks per course\nSELECT c.Course_Name, AVG(e.Marks) FROM Courses c JOIN Enrollments e ON c.Course_ID = e.Course_ID\nGROUP BY c.Course_ID, c.Course_Name;")+'</div>')+

var C27='<h2>Views</h2><p>A <b>view</b> is a virtual table defined by a query. It stores no data of its own (unless materialized); every use runs the query on the base tables. Uses: hide columns for security, simplify complex queries, give each user their own picture (view level of abstraction).</p>'+
CODE("CREATE VIEW cse_students AS\n  SELECT RollNo, Name FROM student WHERE dept = 'CSE';\nSELECT * FROM cse_students;\nCREATE OR REPLACE VIEW toppers AS SELECT Name, Marks FROM student WHERE Marks > 80;\nUPDATE cse_students SET Name = 'Asha R' WHERE RollNo = 1;   -- allowed: simple view on one table\nDROP VIEW toppers;\nCREATE VIEW dept_total AS SELECT dept, SUM(salary) total FROM employee GROUP BY dept;  -- not updatable")+
'<p>A view is <b>updatable</b> only if it is on one table, has no DISTINCT, GROUP BY, aggregates or set operations, and includes every NOT NULL column without a default. A <b>materialized view</b> stores its result and must be refreshed.</p>'+
'<h2>Transactions in SQL</h2><p>A transaction is a sequence of statements that forms one logical unit of work. In Oracle a transaction starts with the first DML statement and ends with <b>COMMIT</b> (make changes permanent) or <b>ROLLBACK</b> (undo them). DDL commits automatically. <b>SAVEPOINT s</b> marks a point you can ROLLBACK TO.</p>'+
CODE("UPDATE account SET balance = balance - 500 WHERE acc_no = 'A101';\nSAVEPOINT after_debit;\nUPDATE account SET balance = balance + 500 WHERE acc_no = 'B202';\nCOMMIT;                       -- both changes become permanent together\n-- ROLLBACK TO after_debit;   would undo only the credit")+
'<h2>Authorization</h2><p>Privileges: SELECT, INSERT, UPDATE, DELETE, REFERENCES, ALL PRIVILEGES on objects; system privileges such as CREATE TABLE. A <b>role</b> groups privileges.</p>'+
CODE("GRANT SELECT, UPDATE (salary) ON employee TO clerk1;\nGRANT SELECT ON employee TO hr_mgr WITH GRANT OPTION;   -- hr_mgr may pass it on\nCREATE ROLE teller; GRANT SELECT, INSERT ON account TO teller; GRANT teller TO amit;\nREVOKE UPDATE ON employee FROM clerk1;\nREVOKE SELECT ON employee FROM hr_mgr CASCADE;          -- also from those hr_mgr granted")+
'<h2>Solved models</h2>'+
MODEL('1. Views: creation, updating and dropping '+S('IA2QB M2 C5'),'<div class="paper"><p><b>Definition.</b> A view is a virtual relation defined by a query, created with CREATE VIEW v AS &lt;query&gt;. It is not stored; it is computed when used.</p><p><b>Creating and using:</b> write the cse_students example above.</p><p><b>Updating through a view:</b> allowed for simple views (one base table, no aggregates, GROUP BY, DISTINCT), and the change goes to the base table. WITH CHECK OPTION stops updates that would make the row disappear from the view.</p><p><b>Dropping:</b> DROP VIEW v; the base tables are not affected.</p><p><b>Advantages:</b> security (hide columns/rows), simplicity (save complex joins), logical data independence (programs use the view even if base tables change), customised views for different users.</p></div>')+
MODEL('2. Transactions: COMMIT, ROLLBACK and ACID '+S('IA2QB M2 C6'),'<div class="paper"><p>A transaction is a unit of program execution that accesses and possibly updates data, e.g. transferring ₹500 from A to B (debit A, credit B).</p><p><b>COMMIT</b> makes all changes permanent and visible. <b>ROLLBACK</b> undoes all changes since the last commit. <b>SAVEPOINT</b> allows a partial rollback.</p><p><b>ACID:</b> <b>Atomicity</b>: all statements happen or none (crash after the debit means the debit is undone). <b>Consistency</b>: the transaction takes the database from one consistent state to another (A + B unchanged). <b>Isolation</b>: concurrent transactions do not see each other’s partial results. <b>Durability</b>: after COMMIT the changes survive crashes.</p><p>Write the account-transfer code block above.</p></div>')+
MODEL('3. Authorization and privileges: GRANT and REVOKE '+S('IA2QB M2 C10')+S('IA2QB M2 B15'),'<div class="paper"><p>Authorization controls who may do what on which object. Forms: read (SELECT), insert, update, delete on data; and index, resource, alteration, drop on schema.</p><p><b>GRANT</b> &lt;privilege list&gt; ON &lt;object&gt; TO &lt;user/role/PUBLIC&gt; [WITH GRANT OPTION].<br><b>REVOKE</b> &lt;privilege list&gt; ON &lt;object&gt; FROM &lt;user/role&gt; [CASCADE | RESTRICT].</p><p>Write the GRANT/REVOKE block above. Explain roles (a named set of privileges), WITH GRANT OPTION (allows passing on) and cascading revoke (revoking also removes privileges that user granted to others).</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M2 A12')+'Define a view.','A virtual table whose contents are defined by a query on one or more base tables. It stores no data itself.')+
P(S('IA2QB M2 A13')+'What is a transaction in a DBMS?','A sequence of operations performed as a single logical unit of work that either completes fully (COMMIT) or not at all (ROLLBACK), preserving ACID properties.')+
P(S('IA2QB M2 A20')+'Purpose of the GRANT command.','To give privileges (SELECT, INSERT, UPDATE, DELETE, …) on database objects to users or roles.')+
P(S('IA2QB M2 B13')+'View showing student names with Marks &gt; 80.',CODE("CREATE VIEW top_students AS\n  SELECT Name FROM STUDENT WHERE Marks > 80;"))+

var C28='<h2>Embedded and dynamic SQL</h2><p><b>Embedded SQL</b>: SQL statements written inside a host language (C, Java, COBOL), marked by EXEC SQL, and translated by a <b>precompiler</b> before compilation. The statements are fixed at compile time. Host variables are prefixed with a colon. <b>Dynamic SQL</b>: the program builds the SQL statement as a string at run time and asks the DBMS to prepare and execute it (JDBC, ODBC, EXECUTE IMMEDIATE in PL/SQL).</p>'+
CODE("/* embedded SQL in C */\nEXEC SQL BEGIN DECLARE SECTION; int roll; char name[30]; EXEC SQL END DECLARE SECTION;\nEXEC SQL SELECT Name INTO :name FROM student WHERE RollNo = :roll;\n\n/* dynamic SQL in PL/SQL */\nEXECUTE IMMEDIATE 'DELETE FROM ' || tbl_name || ' WHERE id = :1' USING v_id;\n\n// dynamic SQL in Java (JDBC)\nPreparedStatement ps = con.prepareStatement(\"SELECT name FROM student WHERE marks > ?\");\nps.setInt(1, 80); ResultSet rs = ps.executeQuery();")+
'<h2>PL/SQL block structure</h2>'+CODE("DECLARE        -- optional: variables, constants, cursors\n  v_total NUMBER := 0;\nBEGIN          -- required: statements\n  ...\nEXCEPTION      -- optional: error handlers\n  WHEN NO_DATA_FOUND THEN ...\n  WHEN OTHERS THEN ...\nEND;\n/")+
'<p>Use <code>SET SERVEROUTPUT ON</code> and <code>DBMS_OUTPUT.PUT_LINE</code> to print; <code>&amp;n</code> reads input in SQL*Plus. Control: IF … THEN … ELSIF … ELSE … END IF; LOOP … EXIT WHEN … END LOOP; WHILE; FOR i IN 1..n. <b>Cursors</b>: implicit (every DML) and explicit (DECLARE, OPEN, FETCH, CLOSE, or a cursor FOR loop).</p>'+
'<h2>Functions vs procedures</h2>'+TBL(['','Function','Procedure'],[['Returns','exactly one value (RETURN)','nothing directly; OUT parameters'],['Used in SQL','yes, in SELECT','no; called with EXEC or from a block'],['Purpose','compute a value','perform an action']])+
'<h2>Solved models</h2>'+
MODEL('1. Embedded SQL and dynamic SQL '+S('IA2QB M2 C8'),'<div class="paper"><p><b>Embedded SQL</b>: SQL statements placed inside a host-language program, written as EXEC SQL … ;. A precompiler replaces them with library calls. Host variables (:name) pass values. Results come back through cursors (DECLARE, OPEN, FETCH, CLOSE). SQLCA/SQLCODE report errors. Statements are known at compile time, so they are checked and optimised early.</p><p><b>Dynamic SQL</b>: the SQL text is built at run time (e.g. from user choices), then prepared and executed: PREPARE / EXECUTE in embedded SQL, JDBC/ODBC in Java/C, EXECUTE IMMEDIATE in PL/SQL.</p>'+TBL(['','Embedded SQL','Dynamic SQL'],[['Statement known','at compile time','at run time'],['Checked','by the precompiler','when prepared'],['Flexibility','fixed queries','any query (report generators, search forms)'],['Speed','faster (pre-optimised)','slower per new statement'],['Use case','payroll, fixed transactions','ad-hoc query tools, admin tools']])+'</div>')+
MODEL('2. User-defined functions '+S('FPT Q3')+S('FPT Q4'),'<div class="paper">'+CODE("CREATE OR REPLACE FUNCTION Calculate_Age(p_dob DATE) RETURN NUMBER IS\nBEGIN\n  RETURN TRUNC(MONTHS_BETWEEN(SYSDATE, p_dob) / 12);\nEND;\n/\nSELECT Calculate_Age(TO_DATE('15-08-2005','DD-MM-YYYY')) FROM dual;\n\nCREATE OR REPLACE FUNCTION Percentage(m1 NUMBER, m2 NUMBER, m3 NUMBER, m4 NUMBER, m5 NUMBER)\nRETURN NUMBER IS\nBEGIN\n  RETURN (m1 + m2 + m3 + m4 + m5) / 500 * 100;\nEND;\n/\nSELECT Percentage(80, 75, 90, 66, 89) FROM dual;     -- 80")+'</div>')+
MODEL('3. Stored procedures '+S('FPT Q5')+S('FPT Q6')+S('FPT Q7')+S('FPT Q8')+S('IA2QB M2 B20'),'<div class="paper">'+CODE("CREATE OR REPLACE PROCEDURE update_salary(p_id NUMBER, p_new NUMBER) IS\nBEGIN\n  UPDATE EMPLOYEE SET Salary = p_new WHERE Emp_ID = p_id;\n  IF SQL%ROWCOUNT = 0 THEN DBMS_OUTPUT.PUT_LINE('No such employee'); END IF;\n  COMMIT;\nEND;\n/\nEXEC update_salary(101, 55000);\n\nCREATE OR REPLACE PROCEDURE net_salary(basic NUMBER, hra NUMBER, allow NUMBER, ded NUMBER, net OUT NUMBER) IS\nBEGIN\n  net := basic + hra + allow - ded;\nEND;\n/\n\nCREATE OR REPLACE PROCEDURE emp_manage(op VARCHAR2, p_id NUMBER, p_name VARCHAR2 DEFAULT NULL, p_sal NUMBER DEFAULT NULL) IS\nBEGIN\n  IF op = 'INSERT' THEN INSERT INTO EMPLOYEE(Emp_ID, Emp_Name, Salary) VALUES (p_id, p_name, p_sal);\n  ELSIF op = 'UPDATE' THEN UPDATE EMPLOYEE SET Emp_Name = p_name, Salary = p_sal WHERE Emp_ID = p_id;\n  ELSIF op = 'DELETE' THEN DELETE FROM EMPLOYEE WHERE Emp_ID = p_id;\n  ELSE DBMS_OUTPUT.PUT_LINE('Unknown operation');\n  END IF;\n  COMMIT;\nEND;\n/\n\nCREATE OR REPLACE PROCEDURE total_bill(price NUMBER, qty NUMBER, disc_pct NUMBER, tax_pct NUMBER, total OUT NUMBER) IS\n  amt NUMBER;\nBEGIN\n  amt   := price * qty;\n  amt   := amt - amt * disc_pct / 100;\n  total := amt + amt * tax_pct / 100;\nEND;\n/\n\n-- IA2QB: procedure returning student details for a RollNo\nCREATE OR REPLACE PROCEDURE get_student(p_roll NUMBER) IS\n  v_name STUDENT.Name%TYPE; v_marks STUDENT.Marks%TYPE;\nBEGIN\n  SELECT Name, Marks INTO v_name, v_marks FROM STUDENT WHERE RollNo = p_roll;\n  DBMS_OUTPUT.PUT_LINE(v_name || ' ' || v_marks);\nEXCEPTION WHEN NO_DATA_FOUND THEN DBMS_OUTPUT.PUT_LINE('Not found');\nEND;\n/")+'</div>')+
MODEL('4. Four-function calculator with IF-THEN-ELSIF '+S('Rem Q24')+S('PLSQL Q8'),'<div class="paper">'+CODE("SET SERVEROUTPUT ON\nDECLARE\n  a  NUMBER := &a;\n  b  NUMBER := &b;\n  op CHAR(1) := '&op';\n  r  NUMBER;\nBEGIN\n  IF op = '+' THEN r := a + b;\n  ELSIF op = '-' THEN r := a - b;\n  ELSIF op = '*' THEN r := a * b;\n  ELSIF op = '/' THEN\n    IF b = 0 THEN DBMS_OUTPUT.PUT_LINE('Division by zero'); RETURN; END IF;\n    r := a / b;\n  ELSE DBMS_OUTPUT.PUT_LINE('Invalid operator'); RETURN;\n  END IF;\n  DBMS_OUTPUT.PUT_LINE(a || ' ' || op || ' ' || b || ' = ' || r);\nEND;\n/")+'</div>')+
MODEL('5. PL/SQL programs '+S('PLSQL Q1')+S('PLSQL Q2')+S('PLSQL Q3')+S('PLSQL Q4'),'<div class="paper">'+CODE("-- Q1 total, average, grade\nDECLARE\n  m1 NUMBER := &m1; m2 NUMBER := &m2; m3 NUMBER := &m3; m4 NUMBER := &m4; m5 NUMBER := &m5;\n  tot NUMBER; av NUMBER; g CHAR(1);\nBEGIN\n  tot := m1 + m2 + m3 + m4 + m5; av := tot / 5;\n  IF av >= 90 THEN g := 'S'; ELSIF av >= 80 THEN g := 'A'; ELSIF av >= 70 THEN g := 'B';\n  ELSIF av >= 60 THEN g := 'C'; ELSIF av >= 50 THEN g := 'D'; ELSE g := 'F'; END IF;\n  DBMS_OUTPUT.PUT_LINE('Total ' || tot || ' Average ' || av || ' Grade ' || g);\nEND;\n/\n-- Q2 gross and net salary\nDECLARE\n  basic NUMBER := &basic; hra NUMBER; da NUMBER; pf NUMBER; gross NUMBER; net NUMBER;\nBEGIN\n  hra := basic * 0.20; da := basic * 0.40; pf := basic * 0.12;\n  gross := basic + hra + da; net := gross - pf;\n  DBMS_OUTPUT.PUT_LINE('Gross ' || gross || ' Net ' || net);\nEND;\n/\n-- Q3 primes from 1 to N\nDECLARE\n  n NUMBER := &n; isp BOOLEAN;\nBEGIN\n  FOR i IN 2..n LOOP\n    isp := TRUE;\n    FOR j IN 2..TRUNC(SQRT(i)) LOOP\n      IF MOD(i, j) = 0 THEN isp := FALSE; EXIT; END IF;\n    END LOOP;\n    IF isp THEN DBMS_OUTPUT.PUT_LINE(i); END IF;\n  END LOOP;\nEND;\n/\n-- Q4 explicit cursor\nDECLARE\n  CURSOR c IS SELECT id, name, marks FROM STUDENT;\n  r c%ROWTYPE; g CHAR(1);\nBEGIN\n  OPEN c;\n  LOOP\n    FETCH c INTO r; EXIT WHEN c%NOTFOUND;\n    g := CASE WHEN r.marks >= 90 THEN 'A' WHEN r.marks >= 75 THEN 'B' WHEN r.marks >= 50 THEN 'C' ELSE 'F' END;\n    DBMS_OUTPUT.PUT_LINE(r.id || ' ' || r.name || ' ' || g);\n  END LOOP;\n  CLOSE c;\nEND;\n/")+'</div>')+
MODEL('6. Larger PL/SQL applications '+S('PLSQL Q5')+S('PLSQL Q6')+S('PLSQL Q7')+S('PLSQL Q9')+S('PLSQL Q10'),'<div class="paper">'+CODE("-- Q5 banking with exception handling\nCREATE OR REPLACE PROCEDURE withdraw(p_acc NUMBER, p_amt NUMBER) IS\n  bal NUMBER; insufficient EXCEPTION;\nBEGIN\n  SELECT balance INTO bal FROM account WHERE acc_no = p_acc FOR UPDATE;\n  IF bal < p_amt THEN RAISE insufficient; END IF;\n  UPDATE account SET balance = balance - p_amt WHERE acc_no = p_acc;\n  COMMIT;\nEXCEPTION\n  WHEN insufficient THEN ROLLBACK; DBMS_OUTPUT.PUT_LINE('Insufficient balance');\n  WHEN NO_DATA_FOUND THEN DBMS_OUTPUT.PUT_LINE('No such account');\nEND;\n/\n-- deposit is the same with +; transfer = withdraw(from) then deposit(to) in ONE transaction;\n-- balance enquiry = SELECT balance INTO ... and print.\n\n-- Q7 bonus function used in a query\nCREATE OR REPLACE FUNCTION bonus(p_sal NUMBER, p_years NUMBER) RETURN NUMBER IS\nBEGIN\n  RETURN CASE WHEN p_years >= 10 THEN p_sal * 0.20 WHEN p_years >= 5 THEN p_sal * 0.10 ELSE p_sal * 0.05 END;\nEND;\n/\nSELECT Emp_Name, Salary, bonus(Salary, TRUNC(MONTHS_BETWEEN(SYSDATE, Join_Date)/12)) AS bonus FROM EMPLOYEE;\n\n-- Q10 library fine function (Rs 2 per day overdue)\nCREATE OR REPLACE FUNCTION fine(p_due DATE, p_ret DATE) RETURN NUMBER IS\nBEGIN\n  RETURN GREATEST(TRUNC(p_ret - p_due), 0) * 2;\nEND;\n/\nSELECT book_id, student_id, return_date, GREATEST(TRUNC(return_date - due_date), 0) overdue_days,\n       fine(due_date, return_date) fine FROM issue;")+'<p><b>Q6 (orders) and Q9 (hospital)</b> combine the same pieces: a procedure to place an order (INSERT into orders and order_items), a trigger AFTER INSERT on order_items that reduces product stock, a function that returns the order total (SUM(qty*price)), and a cursor loop that prints the invoice lines. For the hospital: procedures to book appointments, a function for the bill, a cursor over a doctor’s appointments, and a trigger that reduces medicine stock when a prescription is inserted.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M2 A16')+'What is embedded SQL?','SQL statements embedded inside a host programming language (C, Java), marked with EXEC SQL and translated by a precompiler.')+
P(S('IA2QB M2 A17')+'What is dynamic SQL?','SQL whose statement text is built and executed at run time by the program (e.g. JDBC PreparedStatement, EXECUTE IMMEDIATE), instead of being fixed at compile time.')+
P(S('IA2QB M2 A19')+'What is a stored procedure?','A named PL/SQL block stored in the database that performs a task, can take IN/OUT parameters, and is called with EXEC or from other programs.')+
P(S('IA2QB M2 B18')+'What is embedded SQL? Example scenario.','A C payroll program reads an employee number from the user, then runs EXEC SQL SELECT salary INTO :sal FROM employee WHERE emp_id = :eid; to fetch the salary into a C variable and computes the payslip.')+
'</ol>';

var C29='<p>A <b>trigger</b> is a PL/SQL block that the DBMS runs <b>automatically</b> when a specified event happens on a table. It follows the <b>ECA</b> model: <b>Event</b> (INSERT, UPDATE, DELETE), <b>Condition</b> (optional WHEN), <b>Action</b> (the body).</p>'+
CODE("CREATE [OR REPLACE] TRIGGER trigger_name\n{BEFORE | AFTER} {INSERT | UPDATE [OF col] | DELETE} ON table_name\n[FOR EACH ROW] [WHEN (condition)]\nBEGIN\n  -- :NEW.col = value after the change (INSERT, UPDATE)\n  -- :OLD.col = value before the change (UPDATE, DELETE)\nEND;\n/")+
TBL(['','BEFORE trigger','AFTER trigger'],[['Runs','before the row is changed','after the row is changed'],['Can change :NEW','yes (fix or default values)','no'],['Typical use','validation, rejecting bad data (RAISE_APPLICATION_ERROR), computing derived columns','auditing, logging, updating other tables, cascading changes'],['If it fails','the statement never happens','the statement is rolled back with it']])+
'<p><b>Row-level</b> (FOR EACH ROW) fires once per affected row and can use :OLD/:NEW. <b>Statement-level</b> fires once per statement. Needs for triggers: enforce complex business rules, audit trails, maintain derived data, keep tables in sync, prevent invalid transactions. Avoid them where a constraint will do.</p>'+
'<h2>Solved models</h2>'+
MODEL('1. BEFORE INSERT trigger to block a negative salary '+S('Rem Q10')+S('FPT Q9'),'<div class="paper">'+CODE("CREATE TABLE EMPLOYEE (Emp_ID NUMBER PRIMARY KEY, Emp_Name VARCHAR2(30), Salary NUMBER(9,2));\n\nCREATE OR REPLACE TRIGGER trg_no_negative_salary\nBEFORE INSERT ON EMPLOYEE\nFOR EACH ROW\nBEGIN\n  IF :NEW.Salary < 0 THEN\n    RAISE_APPLICATION_ERROR(-20001, 'Salary cannot be negative');\n  END IF;\nEND;\n/\nINSERT INTO EMPLOYEE VALUES (1, 'Asha', -500);   -- ORA-20001: Salary cannot be negative")+'</div>')+
MODEL('2. AFTER UPDATE trigger for a salary audit '+S('FPT Q10'),'<div class="paper">'+CODE("CREATE TABLE salary_audit (Emp_ID NUMBER, old_sal NUMBER, new_sal NUMBER, changed_on DATE);\n\nCREATE OR REPLACE TRIGGER trg_salary_audit\nAFTER UPDATE OF Salary ON EMPLOYEE\nFOR EACH ROW\nBEGIN\n  INSERT INTO salary_audit VALUES (:OLD.Emp_ID, :OLD.Salary, :NEW.Salary, SYSDATE);\nEND;\n/")+'</div>')+
MODEL('3. Triggers that compute values '+S('FPT Q11')+S('FPT Q12'),'<div class="paper">'+CODE("CREATE OR REPLACE TRIGGER trg_marks_total\nBEFORE INSERT OR UPDATE ON student_marks\nFOR EACH ROW\nBEGIN\n  :NEW.total      := :NEW.m1 + :NEW.m2 + :NEW.m3 + :NEW.m4 + :NEW.m5;\n  :NEW.percentage := :NEW.total / 5;\nEND;\n/\n\nCREATE OR REPLACE TRIGGER trg_library_fine\nBEFORE UPDATE OF return_date ON issue\nFOR EACH ROW\nBEGIN\n  IF :NEW.return_date > :NEW.due_date THEN\n    :NEW.fine := TRUNC(:NEW.return_date - :NEW.due_date) * 2;   -- Rs 2 per day\n  ELSE\n    :NEW.fine := 0;\n  END IF;\nEND;\n/")+'</div>')+
MODEL('4. Triggers: syntax, types and an example '+S('IA2QB M2 C9')+S('Rev1 Q2')+S('IA2QB M2 B19'),'<div class="paper"><p><b>Definition.</b> A trigger is a statement that the system executes automatically as a side effect of a modification to the database (event–condition–action).</p><p><b>Syntax:</b> write the CREATE TRIGGER template above.</p><p><b>Types.</b> By timing: BEFORE and AFTER (and INSTEAD OF on views). By level: ROW-level (FOR EACH ROW, uses :OLD and :NEW) and STATEMENT-level (once per statement). By event: INSERT, UPDATE, DELETE.</p><p><b>BEFORE vs AFTER</b> (write the comparison table above). A BEFORE trigger runs before the change and can validate or modify :NEW, or reject the operation; it prevents bad data from entering. An AFTER trigger runs after the change succeeds and is used to record or propagate it (audit log, updating totals in another table). Both run <b>inside the same transaction</b> as the statement: if a trigger raises an error, the statement (and anything the trigger did) is rolled back, so the transaction stays atomic.</p><p><b>Example:</b> the negative-salary BEFORE trigger and the salary-audit AFTER trigger above.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M2 A18')+'Define a trigger.','A stored PL/SQL block that executes automatically when a specified INSERT, UPDATE or DELETE event occurs on a table.')+
P(S('Rem Q8')+'State the need for triggers in SQL.','To enforce business rules that constraints cannot express, to keep audit trails, to maintain derived or summary data automatically, to synchronise related tables, and to block invalid transactions, all without changing application code.')+
'</ol>';

function sstem(t){return t.length>4?t.replace(/(ing|ed|es|s|e|y)$/,''):t}
function stoks(q){return q.toLowerCase().split(/[\s,;:.()\[\]{}"'“”‘’?!]+/).filter(function(x){return x}).map(sstem)}
var SRX={};
function srx(t){return SRX[t]||(SRX[t]=new RegExp('(^|[^a-z0-9])'+escRe(t)))}
function sall(text,toks){for(var i=0;i<toks.length;i++)if(!srx(toks[i]).test(text))return false;return true}
function sidx(){
  if(SIDX)return SIDX;
  SIDX={chunks:ALL.map(function(c){
    var t=(c.h||'').replace(/<(script|style|svg)[\s\S]*?<\/\1>/g,' ').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/g,' ').replace(/\s+/g,' ');
    return {c:c,head:(c.no+' '+c.t+' '+(c.exam||[]).join(' ')).toLowerCase(),body:t,low:t.toLowerCase()}
  })};
  return SIDX;
}
function ssnip(x,toks){
  var best=-1;for(var i=0;i<toks.length;i++){var m=srx(toks[i]).exec(x.low);if(m&&(best<0||m.index<best))best=m.index+m[1].length}
  if(best<0)return '';
  var a=Math.max(0,best-50),b=Math.min(x.body.length,best+90);
  return (a>0?'… ':'')+x.body.slice(a,b)+(b<x.body.length?' …':'');
}
function runSearch(q){
  var toks=stoks(q);if(!toks.length)return null;
  var X=sidx(),tier1=[],tier2=[],part=[],papers=[],qs=[];
  X.chunks.forEach(function(x){
    if(sall(x.head,toks))tier1.push({x:x});
    else if(toks.length>1&&toks.some(function(t){return srx(t).test(x.head)}))part.push({x:x});
    else if(sall(x.head+' '+x.low,toks))tier2.push({x:x,sn:ssnip(x,toks)});
  });
  SECS.forEach(function(S,i){
    if(sall((S.t+' '+S.d).toLowerCase(),toks))papers.push(S);
    S.q.forEach(function(qq){
      if(sall((qq[0]+' '+qq[1]).toLowerCase(),toks))qs.push({S:S,q:qq});
    });
  });
  return {toks:toks,tier1:tier1,part:part,tier2:tier2,papers:papers,qs:qs};
}
