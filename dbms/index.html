  if(q.length<2){box.hidden=true;box.innerHTML='';return}
  var R=runSearch(q),h='';
  if(!R.tier1.length&&!R.part.length&&!R.tier2.length&&!R.papers.length&&!R.qs.length){box.innerHTML='<div class="none">Nothing found for \u201c'+esc(q)+'\u201d. Try a shorter word, e.g. \u201cclos\u201d.</div>';box.hidden=false;return}
  if(R.tier1.length){
    h+='<h5>Topics (in module order)</h5>';
    R.tier1.forEach(function(r){h+=sline('#'+r.x.c.id,r.x.c.no,r.x.c.t,'Module '+r.x.c.mod.n,{})});
  }
  if(R.part.length){
    h+='<h5>Related topics</h5>';
    R.part.forEach(function(r){h+=sline('#'+r.x.c.id,r.x.c.no,r.x.c.t,'Module '+r.x.c.mod.n,{})});
  }
  if(R.papers.length){
    h+='<h5>Papers and assignments</h5>';
    R.papers.forEach(function(S){h+=sline('#'+S.id,'',S.t,S.q.length+' questions',{})});
  }
  if(R.tier2.length){
    h+='<h5>Also mentioned in</h5>';
    R.tier2.slice(0,10).forEach(function(r){h+=sline('#'+r.x.c.id,r.x.c.no,r.x.c.t,r.sn,{t:R.toks})});
    if(R.tier2.length>10)h+='<div class="more">and '+(R.tier2.length-10)+' more chunks. Add another word to narrow it down.</div>';
  }
  if(R.qs.length){
    h+='<h5>Questions ('+R.qs.length+')</h5>';
    R.qs.slice(0,12).forEach(function(r){h+=sline('#'+r.S.id,r.q[0],r.q[1].replace(/\s+/g,' ').slice(0,90),r.S.t,{id:'q-'+r.q[0].replace(/\W+/g,'-')})});
    if(R.qs.length>12)h+='<div class="more">and '+(R.qs.length-12)+' more questions. Add another word to narrow it down.</div>';
  }
  box.innerHTML=h;box.hidden=false;
}
function pend(P){
  var m=$('#main'),el=null;
  if(P.id){el=document.getElementById(P.id)}
  else if(P.t){
    var cand=$$('h2,h3,h4,p,li,td,.pyq,.callout',m);
    for(var i=0;i<cand.length&&!el;i++)if(sall(cand[i].textContent.toLowerCase(),P.t))el=cand[i];
    for(var j=0;j<cand.length&&!el;j++)if(srx(P.t[0]).test(cand[j].textContent.toLowerCase()))el=cand[j];
  }
  if(el){el.scrollIntoView({block:'center'});el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}
}
if(typeof document!=='undefined'&&document.getElementById('side')){
  var sd=document.getElementById('side');
  sd.addEventListener('input',function(e){if(e.target.id==='qs'){LASTQ=e.target.value;renderRes()}});
  sd.addEventListener('focusin',function(e){if(e.target.id==='qs')renderRes()});
  sd.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('.sres a');if(!a)return;
    try{PEND=JSON.parse(decodeURIComponent(a.getAttribute('data-pend')))}catch(x){PEND=null}
    if(PEND&&!PEND.id&&!PEND.t)PEND=null;
    if(location.hash===a.getAttribute('href')){e.preventDefault();route()}
  });
  sd.addEventListener('keydown',function(e){
    if(e.target.id!=='qs')return;
    var box=$('#qres'),links=box?$$('a',box):[],cur=links.findIndex(function(a){return a.classList.contains('sel')});
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(!links.length)return;e.preventDefault();
      if(cur>=0)links[cur].classList.remove('sel');
      cur=e.key==='ArrowDown'?Math.min(links.length-1,cur+1):Math.max(0,cur-1);
      links[cur].classList.add('sel');links[cur].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){var t=links[cur>=0?cur:0];if(t){e.preventDefault();t.click()}}
    else if(e.key==='Escape'){LASTQ='';e.target.value='';renderRes()}
  });
  document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('.srch')){var b=$('#qres');if(b)b.hidden=true}});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))){var i=$('#qs');if(i){e.preventDefault();document.body.classList.add('open');i.focus()}}
  });
}

  h+='<a href="#home" class="home'+(cur==='home'?' on':'')+'">Overview</a>';
  h+='<div class="srch"><input id="qs" type="search" placeholder="Search topics, questions…  ( / )" autocomplete="off" spellcheck="false" aria-label="Search the whole site" value="'+esc(LASTQ)+'"><div id="qres" class="sres" hidden></div></div>';
  MODS.forEach(function(m){
    h+='<h4>Module '+m.n+'</h4>';

  });

  $('#side').innerHTML=h;
}
var IMPQ=[['Fundamental operations of relational algebra', 'c1-7'], ['Types of keys in a relational database', 'c1-6'], ['SQL queries', 'c2-5'], ['ER diagram for a library management system; query processing', 'c3-8'], ['Functional and transitive dependencies', 'c3-5'], ['B and B+ tree: structure, properties, advantages, disadvantages', 'c4-4'], ['Transaction states with mechanism', 'c5-1'], ['Three levels of abstraction [student example]', 'c1-2'], ['NoSQL: key-value, document, column, graph', 'c6-3'], ['Normalization 1NF to BCNF', 'c3-6'], ['Architecture of DBMS', 'c1-4'], ['Types of anomalies', 'c3-6'], ['Optimistic concurrency control', 'c5-6'], ['Online bookstore: ER model', 'c3-8'], ['Foreign key', 'c1-6'], ['Set operations', 'c2-3'], ['Aggregate functions', 'c2-4'], ['Sparse and dense index', 'c4-3'], ['Atomicity', 'c5-2'], ['Serializability', 'c5-3'], ['Extended ER features', 'c3-3'], ['ACID properties', 'c5-1'], ['CAP theorem', 'c6-1'], ['Types of SQL commands', 'c2-1'], ['Two-phase locking', 'c5-5'], ['Triggers', 'c2-9'], ['Dynamic hashing', 'c4-6']];
function home(){
  var nxt=ALL.filter(function(c){return c.s!=='done'})[0];
  var h='<button class="menu" aria-label="Open chunk list">☰ Chunks</button><div class="kicker" style="margin-top:12px">DATABASE MANAGEMENT SYSTEMS · ENDSEM PLAN</div><h1 style="font-size:1.9rem;margin-top:6px">Where you are</h1>';
  h+='<div class="card"><div class="row" style="gap:22px;align-items:flex-end"><div><div class="big">'+PCT+'%</div><div class="log">'+DONE+' of '+TOTAL+' chunks done'+(BUILT<TOTAL?' · '+BUILT+' built':'')+'</div></div><div style="flex:1 1 220px"><div class="bar" style="margin:0"><i style="width:'+PCT+'%"></i></div><p style="margin:10px 0 0">'+(nxt?'Next: <a href="#'+nxt.id+'"><b>'+nxt.no+' '+esc(nxt.t)+'</b></a>':'All chunks done.')+'</p></div></div></div>';

    return '<div class="card" style="margin:0"><div class="kicker">MODULE '+m.n+'</div><div style="font-weight:600;margin:2px 0 8px">'+esc(m.name)+'</div><div class="bar" style="margin:0"><i style="width:'+p+'%"></i></div><div class="log" style="margin:6px 0 0">'+d+' / '+m.chunks.length+(b<m.chunks.length?' · '+b+' built':'')+'</div></div>'}).join('')+'</div>';
  h+='<h2>What the exam looks like</h2><p>Three past end-sem papers are here: <b>Apr/May 2026</b>, <b>Nov/Dec 2025</b> and <b>May/June 2025</b>. Each is 100 marks: Part A 10 × 1, Part B 6 × 3, Part C any five of Q17–Q23 plus the <b>compulsory Q24 (NoSQL / CAP)</b>, 12 marks each. Every question links to its worked answer. The revision sheets, the IA2 paper and the question banks follow.</p>';
  h+='<div class="mods">'+[['s-apr26','End-sem Apr/May 2026'],['s-nov25','End-sem Nov/Dec 2025'],['s-jun25','End-sem May/June 2025'],['s-rev1','End-sem revision 1'],['s-self','End-sem revision 2'],['mcq','IA1 MCQ drill']].map(function(x){return '<a class="card" style="margin:0;text-decoration:none;color:inherit" href="#'+x[0]+'"><div class="kicker">START HERE</div><div style="font-weight:600">'+x[1]+'</div></a>'}).join('')+'</div>';
  h+='<h2>Important questions (from your class notes)</h2><ol class="idl" style="columns:2 260px;margin:8px 0">'+IMPQ.map(function(x){return '<li><a href="#'+x[1]+'">'+esc(x[0])+'</a></li>'}).join('')+'</ol>';
  h+='<h2>Three habits that earn the marks</h2><ul><li><b>SQL questions:</b> write the query, then the relational algebra if asked. Name the tables exactly as in the question.</li><li><b>ER questions:</b> draw it with the standard symbols (rectangle, diamond, ellipse, double lines) and then convert it to tables with primary and foreign keys underlined or marked.</li><li><b>Normalization:</b> list the functional dependencies first, find the key, then go 1NF → 2NF → 3NF → BCNF, showing the tables at every step, the way the teacher’s Online Bookstore answer does.</li></ul>';
  h+='<p class="log" style="margin-top:24px">Progress is saved in this browser only. <button data-resetprog>Reset progress</button></p>';

function chunk(c,i){
  var h='<button class="menu" aria-label="Open chunk list">☰ Chunks</button><div class="kicker" style="margin-top:12px">MODULE '+c.mod.n+' · '+esc(c.mod.name.toUpperCase())+'</div><h1 style="font-size:1.8rem;margin-top:6px">'+c.no+' '+esc(c.t)+'<span class="pill '+c.s+'">'+PILL[c.s]+'</span></h1>';
  if(c.exam)h+='<div class="chips" aria-label="where this appears">'+c.exam.map(function(e){return '<span class="chip">'+esc(e)+'</span>'}).join('')+'</div>';
  if(!c.h)h+='<div class="card"><p>This chunk is still being built. It will appear here.</p></div>';
  else h+=c.h;
  h+='<div class="card" style="margin-top:28px"><div class="row" style="justify-content:space-between"><span>'+(c.s==='done'?'You marked this chunk as done.':'Finished this chunk?')+'</span><button data-mark class="'+(c.s==='done'?'':'primary')+'">'+(c.s==='done'?'Mark as not done':'Mark as done')+'</button></div></div>';
  var p=ALL[i-1],n=ALL[i+1];
  h+='<div class="nav">'+(p?'<a class="btn" href="#'+p.id+'">← '+p.no+' '+esc(p.t)+'</a>':'<span></span>')+(n?'<a class="btn" href="#'+n.id+'">'+n.no+' '+esc(n.t)+' →</a>':'')+'</div>';
  return h;
}
function hydrate(root){
  Object.keys(WIDGETS).forEach(function(sel){$$(sel,root).forEach(function(el){if(!el.dataset.hyd){el.dataset.hyd=1;WIDGETS[sel](el)}})});
}
function route(){
  var id=(location.hash||'#home').slice(1),main=$('#main');
  document.body.classList.remove('open');recalc();
  var SS=SECS.filter(function(S){return S.id===id})[0];
  if(SS){side(id);main.innerHTML=srcPage(SS)}
  else if(id==='mcq'){side(id);main.innerHTML=mcqPage()}
  else if(id==='home'||!ALL.some(function(c){return c.id===id})){side('home');main.innerHTML=home()}
  else{var i=ALL.map(function(c){return c.id}).indexOf(id);side(id);main.innerHTML=chunk(ALL[i],i)}
  hydrate(main);
  var mk=$('[data-mark]',main);if(mk)mk.onclick=function(){if(PROG[id])delete PROG[id];else PROG[id]=1;saveProg();var y=window.scrollY;route();window.scrollTo(0,y)};
  var rp=$('[data-resetprog]',main);if(rp)rp.onclick=function(){if(confirm('Reset all DBMS progress in this browser?')){PROG={};saveProg();route()}};
  var mw=$('[data-mcqwrong]',main);if(mw)mw.onclick=function(){$$('.mcq',main).forEach(function(w){w.hidden=MST[w.dataset.n]!==0})};
  var mr=$('[data-mcqreset]',main);if(mr)mr.onclick=function(){if(confirm('Clear your MCQ answers?')){MST={};mcqSave();route()}};
  var mb=$('.menu',main);if(mb)mb.onclick=function(){document.body.classList.toggle('open')};
  var a=$('#side a.on');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'});
  window.scrollTo(0,0);
  if(PEND){var PP=PEND;PEND=null;setTimeout(function(){pend(PP)},80)}
}
if(typeof document!=='undefined'&&document.getElementById('main')){window.addEventListener('hashchange',route);route()}
