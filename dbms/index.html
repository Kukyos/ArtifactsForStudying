var C31='<p>The <b>Entity-Relationship (ER) model</b> describes the real world as <b>entities</b>, their <b>attributes</b> and the <b>relationships</b> among them. It is drawn as an ER diagram during conceptual design and then converted to tables.</p>'+
TBL(['Term','Meaning','Example'],[['Entity','a thing or object distinguishable from others','the student Asha'],['Entity set','a set of entities of the same type','all students'],['Attribute','a property of an entity','RollNo, Name'],['Relationship','an association among entities','Asha enrolls in DBMS'],['Relationship set','a set of relationships of the same type','ENROLLS'],['Degree of relationship','number of entity sets taking part','binary (2), ternary (3), unary/recursive (1)']])+
'<h2>Types of attributes</h2>'+TBL(['Type','Meaning','Example','Symbol'],[['Simple','cannot be divided','Age','ellipse'],['Composite','made of sub-parts','Name = First + Last; Address = Street + City + PIN','ellipse with child ellipses'],['Single-valued','one value per entity','DOB','ellipse'],['Multivalued','many values per entity','Phone numbers, Hobbies','double ellipse'],['Derived','computed from another attribute','Age from DOB','dashed ellipse'],['Key','uniquely identifies the entity','RollNo','underlined'],['Partial key (discriminator)','identifies a weak entity within its owner','CopyNo','dashed underline'],['NULL-valued','value unknown or not applicable','Middle name','-']])+
ER_LEGEND+
'<h2>Solved models</h2>'+
MODEL('1. Identify the types of attributes in the figure '+S('Rem Q20'),'<div class="paper"><p>Entity: <b>Person</b>.</p><p><b>SSN</b>: key attribute (underlined): identifies each person.<br><b>Name</b>: composite attribute, made of the simple attributes <b>First</b> and <b>Last</b>.<br><b>Address</b>, <b>Birthdate</b>: simple, single-valued attributes.<br><b>Age</b>: derived attribute (dashed ellipse), computed from Birthdate.<br><b>Hobbies</b>: multivalued attribute (double ellipse): a person can have many hobbies.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M3 A1')+'What is an entity?','A real-world object or thing that is distinguishable from other objects, e.g. a particular student, book or account.')+
P(S('IA2QB M3 A2')+'What is an entity set?','A set of entities of the same type that share the same attributes, e.g. the set of all students.')+
P(S('IA2QB M3 A3')+'Define attribute in the ER model.','A descriptive property of an entity or relationship (drawn as an ellipse), e.g. Name of a student.')+
P(S('IA2QB M3 A4')+'What is a relationship?','An association among two or more entities, e.g. Asha ENROLLS in DBMS; drawn as a diamond.')+
P(S('IA2QB M3 A5')+'Name the types of attributes.','Simple, composite, single-valued, multivalued, derived, key (and null-valued).')+
P(S('Rem Q15')+'Define an entity and represent it with the ER symbol.','An entity is a distinguishable real-world object (a student, a car). An entity set is drawn as a <b>rectangle</b> with its name inside, e.g. a rectangle labelled STUDENT, with its attributes as ellipses joined to it.')+
P(S('IA2QB M3 B1')+'Differentiate between an entity and an entity set.','An entity is one object (student Asha, RollNo 101). An entity set is the collection of all entities of that type (all students). The rectangle in an ER diagram stands for the entity set.')+
P(S('IA2QB M3 B2')+'Simple and composite attributes with an example.','Simple: cannot be split further, e.g. Age, RollNo. Composite: made of smaller parts, e.g. Name (First, Middle, Last) or Address (Street, City, PIN). Draw the composite as an ellipse with sub-ellipses.')+
P(S('IA2QB M3 B3')+'Single-valued and multi-valued attributes.','Single-valued: one value per entity, e.g. DOB. Multivalued: several values for one entity, e.g. PhoneNumbers or Email IDs; drawn as a double ellipse.')+
P(S('IA2QB M3 B4')+'What is a derived attribute? Example.','An attribute whose value is computed from other attributes, not stored, e.g. Age derived from DOB, or Experience from JoinDate; drawn as a dashed ellipse.')+
'</ol>';

var C32='<h2>Mapping cardinality</h2><p>For a binary relationship between A and B, the cardinality ratio is the number of entities of B an entity of A can be related to.</p>'+
TBL(['Ratio','Meaning','Example'],[['One-to-one (1:1)','an A relates to at most one B and vice versa','Department MANAGED_BY one Employee (head)'],['One-to-many (1:N)','an A relates to many B; a B to at most one A','one Department has many Students'],['Many-to-one (N:1)','many A to one B','many Employees WORK_IN one Department'],['Many-to-many (M:N)','both sides many','Students ENROLL in Courses']])+
'<h2>Participation</h2><p><b>Total participation</b> (double line): every entity in the set takes part in at least one relationship, e.g. every Loan has a Borrower. <b>Partial participation</b> (single line): some may not, e.g. not every Customer has a loan.</p>'+
'<h2>Weak entities</h2><p>A <b>weak entity set</b> has no primary key of its own. It is identified by its <b>owner (identifying) entity set</b> plus its own <b>discriminator / partial key</b>. It is drawn as a double rectangle, linked by a double diamond (identifying relationship) with total participation, and the partial key is dashed-underlined. Primary key of the weak entity = owner’s primary key + discriminator.</p>'+ER_COPY+
TBL(['','Strong entity','Weak entity'],[['Own primary key','yes','no; only a partial key'],['Depends on another entity','no','yes, its owner'],['Symbol','single rectangle','double rectangle'],['Relationship to owner','ordinary diamond','identifying (double) diamond, total participation'],['Example','Book (BookID)','Copy (CopyNo) of a Book; Dependent of an Employee; Payment instalment of a Loan']])+
'<h2>Solved models</h2>'+
MODEL('1. Identify the ER notation '+S('Rem Q14'),'<div class="paper"><p>The double ellipse represents a <b>multivalued attribute</b>: an attribute that can hold several values for one entity, e.g. Phone_Numbers of a Customer or Hobbies of a Person.</p></div>')+
MODEL('2. Strong vs weak entity '+S('Rem Q19')+S('IA2QB M3 B5'),'<div class="paper">'+'<p>Write the strong/weak table above and draw the BOOK–HAS_COPY–COPY diagram as the example: BOOK is strong (BookID). COPY is weak: copy number 3 is meaningful only for a given book, so its key is (BookID, CopyNo).</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M3 A6')+'What is a weak entity?','An entity set that does not have enough attributes to form a primary key; it is identified by its relationship with an owner entity plus its partial key. Drawn as a double rectangle.')+
P(S('IA2QB M3 A7')+'What is a strong entity?','An entity set that has its own primary key and does not depend on any other entity for identification. Drawn as a single rectangle.')+
P(S('IA2QB M3 A8')+'Define cardinality ratio.','The maximum number of relationship instances an entity can take part in: the number of entities of one set associated with one entity of the other set.')+
P(S('IA2QB M3 A9')+'Name the types of cardinality ratios.','One-to-one, one-to-many, many-to-one, many-to-many.')+
P(S('IA2QB M3 A10')+'What is a participation constraint?','It states whether every entity must take part in a relationship (total participation, double line) or only some need to (partial participation, single line).')+
P(S('IA2QB M3 B6')+'Discriminator (partial key) in a weak entity.','The set of attributes that distinguishes weak entities belonging to the same owner, e.g. CopyNo distinguishes copies of one book. Full key = owner key + discriminator, e.g. (BookID, CopyNo). Shown with a dashed underline.')+
P(S('IA2QB M3 B7')+'One-to-many with an example.','One entity of A relates to many of B, each B to at most one A. One DEPARTMENT employs many EMPLOYEES; each employee works in one department. Write 1 near DEPARTMENT and N near EMPLOYEE.')+
P(S('IA2QB M3 B8')+'Many-to-many with an example.','Each A relates to many B and each B to many A. STUDENT ENROLLS COURSE: a student takes many courses, a course has many students. Converted to a separate table ENROLLS(RollNo, CourseID).')+
P(S('IA2QB M3 B9')+'Total and partial participation with examples.','Total: every entity participates, e.g. every LOAN must have a BORROWER (double line on LOAN’s side). Partial: some entities may not, e.g. not every CUSTOMER borrows (single line).')+
'</ol>';

var C33='<p>The <b>extended ER (EER)</b> features model class hierarchies and relationships among relationships.</p>'+
TBL(['Feature','Direction','Meaning','Example'],[['<b>Specialization</b>','top-down','split an entity set into sub-groups with their own attributes','PERSON → STUDENT (CGPA), EMPLOYEE (Salary)'],['<b>Generalization</b>','bottom-up','combine entity sets with common features into a higher-level set','CAR, TRUCK → VEHICLE'],['<b>Attribute inheritance</b>','-','lower-level sets inherit the attributes and relationships of the higher-level set','STUDENT has PERSON’s Name, DOB'],['<b>Aggregation</b>','-','treat a relationship set as an entity so it can take part in another relationship','(EMPLOYEE WORKS_ON PROJECT) is MONITORED_BY MANAGER']])+
'<p>The hierarchy is drawn with an <b>ISA</b> triangle. Constraints: <b>disjoint</b> (an entity belongs to at most one subclass) vs <b>overlapping</b>; <b>total</b> (every superclass entity is in some subclass) vs <b>partial</b>.</p>'+
'<div class="w"><div class="cap">Specialization with ISA</div><div class="scroll"><svg xmlns="'+NS+'" viewBox="0 0 520 230" width="520" height="230" role="img" aria-label="ISA hierarchy"><g text-anchor="middle">'+
'<line class="er-l" x1="260" y1="56" x2="260" y2="92"/><line class="er-l" x1="230" y1="140" x2="130" y2="180"/><line class="er-l" x1="290" y1="140" x2="390" y2="180"/>'+

'<rect class="er-s" x="70" y="180" width="120" height="32"/><text class="er-t" style="font-weight:600" x="130" y="201">STUDENT</text><rect class="er-s" x="330" y="180" width="120" height="32"/><text class="er-t" style="font-weight:600" x="390" y="201">EMPLOYEE</text>'+
'<text class="er-c" x="360" y="120">disjoint, partial</text></g></svg></div></div>'+
'<h2>Solved models</h2>'+
MODEL('1. Generalization, specialization and aggregation '+S('IA2QB M3 C3'),'<div class="paper"><p><b>Specialization</b> (top-down): sub-grouping an entity set into subclasses that have extra attributes. PERSON(ID, Name, DOB) is specialized into STUDENT(CGPA) and EMPLOYEE(Salary). Drawn with an ISA triangle.</p><p><b>Generalization</b> (bottom-up): finding the common attributes of several entity sets and making a higher-level set. CAR(Reg_No, Model, Seats) and TRUCK(Reg_No, Model, Load) are generalized to VEHICLE(Reg_No, Model).</p><p>Lower-level entities <b>inherit</b> all attributes and relationships of the higher level. Constraints: disjoint/overlapping and total/partial.</p><p><b>Aggregation</b>: the ER model cannot relate a relationship to another relationship. Aggregation draws a box around a relationship (EMPLOYEE–WORKS_ON–PROJECT) and treats it as an entity, which can then take part in MONITORS with MANAGER.</p><p>Draw the ISA diagram above and a box around WORKS_ON with a line to the MONITORS diamond.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M3 B10')+'Generalization and specialization with an example.','Specialization is top-down (PERSON → STUDENT, EMPLOYEE, each adding attributes); generalization is bottom-up (CAR, TRUCK → VEHICLE, factoring out common attributes). Both use the ISA triangle and attribute inheritance.')+
P(S('IA2QB M3 B11')+'Aggregation with an example.','Aggregation treats a relationship set as a higher-level entity. EMPLOYEE WORKS_ON PROJECT is aggregated and then related to MANAGER through MONITORS, so a manager monitors a particular employee’s work on a particular project.')+
'</ol>';

var C34='<p>Every ER diagram turns into tables with a fixed set of rules. Primary keys are <u>underlined</u>, foreign keys marked FK.</p>'+
TBL(['ER construct','Becomes'],[['Strong entity','a table with all its simple attributes; key = entity key'],['Composite attribute','one column per component (Street, City, PIN); the composite itself is not a column'],['Multivalued attribute','a separate table (entity key, value), key = both'],['Derived attribute','not stored (computed when needed)'],['Weak entity','a table with its attributes + owner’s key as FK; key = owner key + partial key'],['1:1 relationship','add the key of one side as FK (UNIQUE) to the other; prefer the side with total participation'],['1:N relationship','add the key of the "1" side as FK in the "N" side table (plus relationship attributes)'],['M:N relationship','a new table with both keys (key = both) + relationship attributes'],['n-ary relationship','a table with the keys of all participants'],['Specialization','a table per subclass with the superclass key (or one table with a type column)'],['Aggregation','the relationship table’s key acts as the entity key in the outer relationship']])+
'<h2>Solved models</h2>'+
MODEL('1. Rules for converting an ER diagram to tables '+S('IA2QB M3 C2'),'<div class="paper"><p>Write the table above as the rules, with one example each:</p><p><b>Strong entity</b> STUDENT(RollNo, Name, DOB) → STUDENT(<u>RollNo</u>, Name, DOB).<br><b>Weak entity</b> COPY(CopyNo, Status) owned by BOOK → COPY(<u>BookID</u> FK, <u>CopyNo</u>, Status).<br><b>1:1</b> DEPARTMENT MANAGED_BY EMPLOYEE → DEPARTMENT(<u>DeptID</u>, DName, Manager_EmpID FK UNIQUE).<br><b>1:N</b> DEPARTMENT has STUDENTs → STUDENT(<u>RollNo</u>, Name, DeptID FK).<br><b>M:N</b> STUDENT ENROLLS COURSE with Grade → ENROLLS(<u>RollNo</u> FK, <u>CourseID</u> FK, Grade).<br><b>Multivalued</b> Phone of STUDENT → STUDENT_PHONE(<u>RollNo</u> FK, <u>Phone</u>).</p></div>')+
MODEL('2. Convert the given ER diagram (university) into tables '+S('Rem Q23'),'<div class="paper"><p>DEPARTMENT(<u>DeptID</u>, DeptName, Office, HOD, Phone, Location)<br>COURSE(<u>CourseID</u>, CourseName, Credits, Level, Description, DeptID FK) <span class="pn">— OFFERS is 1:N, so DeptID goes into COURSE</span><br>STUDENT(<u>StudentID</u>, StudentName, Email, Phone, DOB, Address, AdmissionDate, DeptID FK) <span class="pn">— HAS (Department 1 : N Student)</span><br>FACULTY(<u>FacultyID</u>, FacultyName, Email, Phone, Qualification, HireDate)<br>SECTION(<u>SectionID</u>, SectionNo, Schedule, Room, CourseID FK) <span class="pn">— HAS (Course 1 : N Section)</span><br>TEACHES(<u>SectionID</u> FK, <u>FacultyID</u> FK, Semester) <span class="pn">— N:N, attribute Semester on the relationship</span><br>ENROLLS(<u>StudentID</u> FK, <u>SectionID</u> FK, EnrollDate) <span class="pn">— M:N with EnrollDate</span><br>GRADE(<u>GradeID</u>, GradeType, GradePoint, StudentID FK, SectionID FK) <span class="pn">— EVALUATES (Section 1 : N Grade); the grade belongs to one enrolment, so (StudentID, SectionID) references ENROLLS</span></p></div>')+
MODEL('3. Convert the factory ER model into tables '+S('ER Q7a'),'<div class="paper"><p>EMPLOYEE(<u>ID</u>, name, position, pay_rate, pay_type, supervisor_ID FK→EMPLOYEE, factory_city FK) <span class="pn">— supervises is a recursive 1:N; works_at is N:1</span><br>FACTORY(<u>city</u>, manager_ID FK→EMPLOYEE UNIQUE) <span class="pn">— manages is 1:1 with factory total; throughput is derived, not stored</span><br>ASSEMBLY_LINE(<u>city</u> FK, <u>number</u>, throughput) <span class="pn">— weak entity via contains</span><br>MODEL(<u>designation_name</u>, <u>designation_number</u>, type, factory_city FK) <span class="pn">— designation is a composite key; builds is 1:N</span><br>MODEL_APPLICATION(<u>designation_name</u>, <u>designation_number</u>, <u>application</u>) <span class="pn">— multivalued</span><br>PART(<u>part_number</u>, description)<br>CAN_USE(<u>designation_name</u>, <u>designation_number</u>, <u>part_number</u>) <span class="pn">— M:N</span><br>VENDOR(<u>name</u>, email, phone) <span class="pn">— composite contact_info flattened</span><br>SUPPLIES(<u>part_number</u> FK, <u>vendor_name</u> FK, price) <span class="pn">— M:N with price</span></p></div>')+
MODEL('4. Convert the game ER model into tables '+S('ER Q7b'),'<div class="paper"><p>ACCOUNT(<u>AcctName</u>, Password, LastSignedOn, SbscrbrName, SbscrbrAddress, SbscrbrEMail, SbscrbrPhone, AcctCreatedOn)<br>REGION(<u>RegionName</u>, Climate, Precipitation) <span class="pn">— PlayersIn is derived</span><br>REGION_FOLIAGE(<u>RegionName</u> FK, <u>Foliage</u>) <span class="pn">— multivalued</span><br>CHARACTER(<u>AcctName</u> FK, <u>CharName</u>, Level, ExpPoints, Type, MaxHitPoints, MaxMana, CurrHitPoints, CurrMana, LastPlayed, CreatedOn, RegionName FK) <span class="pn">— weak entity of ACCOUNT through Has (attributes of Has move here); Contains n:1</span><br>ITEM(<u>ItemName</u>, ItemType, ItemDamage)<br>ITEM_INSTANTIATION(<u>ItemName</u> FK, <u>IDNum</u>, Modifier, WhenCreated, CarrierAcct, CarrierChar FK→CHARACTER, CarrierCreep, CarrierCreepID FK→CREEP_INSTANTIATION) <span class="pn">— weak via IsType; the two Carrying relationships are 1:n</span><br>CREEP(<u>CreepName</u>, HitPoints, Mana, Attack)<br>CREEP_INSTANTIATION(<u>CreepName</u> FK, <u>IDNum</u>, RegionName FK)<br>RAN_INTO(<u>AcctName</u>, <u>CharName</u>, <u>CreepName</u>) <span class="pn">— M:N</span></p></div>')+
MODEL('5. Convert the e-commerce ER model into tables '+S('ER Q7c'),'<div class="paper"><p>ADDRESS(<u>AddressID</u>, Street, City, State, PINCode, Country)<br>CUSTOMER(<u>CustomerID</u>, Name, Email, Password, Phone, AddressID FK) <span class="pn">— has: Address 1 : N Customer</span><br>CATEGORY(<u>CategoryID</u>, CategoryName, Description)<br>PRODUCT(<u>ProductID</u>, ProductName, Price, StockQuantity, ImageURL, CategoryID FK)<br>ORDERS(<u>OrderID</u>, OrderDate, OrderStatus, TotalAmount, ShippingAddressID FK, CustomerID FK, PaymentID FK)<br>ORDER_ITEM(<u>OrderID</u> FK, <u>ProductID</u> FK, Quantity, UnitPrice, Discount) <span class="pn">— resolves the M:N between ORDER and PRODUCT</span><br>PAYMENT(<u>PaymentID</u>, PaymentDate, Amount, PaymentMethod, TransactionID, CustomerID FK)<br>SUPPLIER(<u>SupplierID</u>, SupplierName, Phone, Email)<br>CART(<u>CartID</u>, CartDate, PaymentID FK UNIQUE, SupplierID FK)<br>CART_ITEM(<u>CartID</u> FK, <u>OrderID</u>, <u>ProductID</u>) <span class="pn">— ORDER_ITEM added_to CART (N:1): add CartID to ORDER_ITEM instead if each item is in one cart</span></p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M3 B12')+'Rule for converting a strong entity set into a table.','Create a table with the same name; each simple attribute becomes a column (composite attributes split into their parts, derived attributes dropped, multivalued attributes moved to a separate table); the entity’s key becomes the primary key.')+
P(S('IA2QB M3 B13')+'Rule for converting a weak entity set into a table.','Create a table with the weak entity’s attributes plus the primary key of its owner as a foreign key. Primary key = owner’s key + discriminator. ON DELETE CASCADE from the owner.')+
P(S('IA2QB M3 B14')+'How is a 1:1 relationship mapped?','Put the primary key of one entity as a foreign key (UNIQUE) in the other’s table, preferably on the side with total participation, along with any relationship attributes. (Or merge the two tables if both sides are total.)')+
P(S('IA2QB M3 B15')+'How is an M:N relationship converted?','Create a new table whose columns are the primary keys of both entities (as foreign keys) plus the relationship’s attributes; its primary key is the combination of the two keys.')+
'</ol>';

var C35='<p>A <b>functional dependency (FD)</b> X → Y holds on a relation if any two tuples that agree on X also agree on Y: X <b>determines</b> Y. Example: RollNo → Name. FDs come from the meaning of the data, not from one instance.</p>'+
TBL(['Kind','Definition','Example'],[['Trivial','Y ⊆ X (always true)','{RollNo, Name} → Name'],['Non-trivial','Y ⊄ X','RollNo → Name'],['Completely non-trivial','X ∩ Y = ∅','RollNo → Dept'],['Full','Y depends on all of X, no proper subset of X determines Y','{RollNo, CourseID} → Marks'],['Partial','Y depends on a proper part of a composite key','{RollNo, CourseID} → Name (RollNo alone gives Name)'],['Transitive','X → Y and Y → Z (Y not a key) give X → Z','RollNo → DeptID → DeptName'],['Multivalued','X →→ Y: X determines a set of Y values independent of the other attributes','Course →→ Teacher, Course →→ Book']])+
'<h2>Armstrong’s axioms</h2><p>Sound and complete rules for deriving every FD in F⁺ (the closure of F).</p>'+TBL(['Rule','Statement'],[['Reflexivity','if Y ⊆ X then X → Y'],['Augmentation','if X → Y then XZ → YZ'],['Transitivity','if X → Y and Y → Z then X → Z'],['Union (derived)','if X → Y and X → Z then X → YZ'],['Decomposition (derived)','if X → YZ then X → Y and X → Z'],['Pseudo-transitivity (derived)','if X → Y and WY → Z then WX → Z']])+
'<h2>Attribute closure X⁺</h2><p>Start with X; repeatedly add the right side of any FD whose left side is already inside. X is a <b>superkey</b> if X⁺ contains every attribute; a <b>candidate key</b> if it is a minimal such X.</p>'+
'<div class="callout">Example: R(A, B, C, D, E), F = {A → B, B → C, CD → E}. A⁺ = {A, B, C}. (AD)⁺ = {A, D} → add B → add C → CD gives E = {A, B, C, D, E}, so <b>AD is a candidate key</b>. A and D never appear on a right side, so every key must contain both.</div>'+
FDT('Closure, candidate keys and normal form. Change R, F or the set and press Work it out','A B C D E','A->B, B->C, CD->E','AD')+
'<h2>Solved models</h2>'+
MODEL('1. Functional dependency theory, Armstrong’s axioms and closure '+S('IA2QB M3 C4'),'<div class="paper"><p><b>FD:</b> X → Y if for all tuples t1, t2: t1[X] = t2[X] ⇒ t1[Y] = t2[Y].</p><p><b>F⁺</b>, the closure of F, is every FD implied by F. Armstrong’s axioms (reflexivity, augmentation, transitivity) are <b>sound</b> (they only derive true FDs) and <b>complete</b> (they derive all of F⁺). Derived rules: union, decomposition, pseudo-transitivity.</p><p><b>Algorithm for X⁺:</b> result := X; repeat: for each Y → Z in F, if Y ⊆ result then result := result ∪ Z; until no change.</p><p><b>Example.</b> R(A,B,C,G,H,I), F = {A → B, A → C, CG → H, CG → I, B → H}.<br>(AG)⁺: start {A,G}; A → B gives {A,B,G}; A → C gives {A,B,C,G}; CG → H gives {A,B,C,G,H}; CG → I gives {A,B,C,G,H,I}. So AG is a superkey; A⁺ = {A,B,C,H} and G⁺ = {G}, so neither alone is, hence <b>AG is a candidate key</b>.<br>Deriving A → H: A → B and B → H give A → H by transitivity. Deriving AG → I: A → C, augment with G: AG → CG; CG → I; transitivity: AG → I.</p></div>')+
MODEL('2. Functional dependency and transitive dependency, and their effect on normalization '+S('Rev1 Q6')+S('Nov25 Q19a'),'<div class="paper"><p><b>Functional dependency</b> X → Y: the value of X fixes the value of Y. In Student(RollNo, Name, DeptID, DeptName, HOD): RollNo → Name, RollNo → DeptID, DeptID → DeptName, DeptID → HOD.</p><p><b>Transitive dependency</b>: X → Y and Y → Z where Y is not a key, giving X → Z indirectly. Here RollNo → DeptID → DeptName and RollNo → DeptID → HOD.</p><p><b>Influence on normalization.</b> FDs tell us the keys (RollNo⁺ = all attributes, so RollNo is the key). Partial dependencies on part of a key violate <b>2NF</b>; transitive dependencies of non-key attributes violate <b>3NF</b>, causing redundancy (department name repeated for every student) and update, insertion and deletion anomalies. We remove the transitive dependency by decomposing: Student(<u>RollNo</u>, Name, DeptID) and Department(<u>DeptID</u>, DeptName, HOD), which is in 3NF (and BCNF).</p></div>')+
MODEL('3. Types of functional dependencies '+S('Rev1 Q15'),'<div class="paper"><p>Write the seven-row table above (trivial, non-trivial, completely non-trivial, full, partial, transitive, multivalued) with its examples on Enrollment(RollNo, CourseID, Name, Marks, DeptID, DeptName).</p><p><b>How they help:</b> they reveal candidate keys (via closure), show which attributes belong together, and point to the exact decomposition needed: partial FDs → split for 2NF, transitive FDs → split for 3NF, FDs whose left side is not a superkey → split for BCNF, MVDs → split for 4NF. The result is less redundancy and no anomalies.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M3 A12')+S('Rem Q16')+'Define functional dependency.','A constraint between two sets of attributes: X → Y holds if any two tuples with the same X value must have the same Y value. Example: RollNo → Name.')+
P(S('IA2QB M3 A13')+'Name Armstrong’s axioms.','Reflexivity, augmentation, transitivity (derived: union, decomposition, pseudo-transitivity).')+
P(S('Rem Q17')+'List any two primary Armstrong’s axioms with examples.','<b>Reflexivity:</b> if Y ⊆ X then X → Y; {RollNo, Name} → Name. <b>Transitivity:</b> if X → Y and Y → Z then X → Z; RollNo → DeptID and DeptID → DeptName give RollNo → DeptName. (Augmentation: RollNo → Name gives {RollNo, Course} → {Name, Course}.)')+
P(S('Rem Q13')+'Differentiate trivial and non-trivial FDs.','Trivial: the right side is a subset of the left, so it always holds (AB → A, {RollNo, Name} → RollNo). Non-trivial: the right side has at least one attribute not on the left (RollNo → Name); it carries real information about the data.')+
P(S('IA2QB M3 B16')+'Explain FD with the example StudentID → Name.','StudentID → Name means each StudentID is associated with exactly one Name: two rows with the same StudentID must have the same Name. The reverse need not hold: two students can share a name.')+
P(S('IA2QB M3 B17')+'State Armstrong’s axioms briefly.','Reflexivity: Y ⊆ X ⇒ X → Y. Augmentation: X → Y ⇒ XZ → YZ. Transitivity: X → Y, Y → Z ⇒ X → Z.')+
P(S('IA2QB M3 B19')+'Partial vs full functional dependency.','Full: Y depends on the whole composite key and on no proper part of it ({RollNo, CourseID} → Marks). Partial: Y depends on only part of the key ({RollNo, CourseID} → StudentName, since RollNo → StudentName). Partial dependencies violate 2NF.')+
'</ol>';

var C36='<p><b>Normalization</b> decomposes relations step by step to remove redundancy and the <b>insertion, deletion and update anomalies</b> it causes, using the functional dependencies. The answer layout below follows the teacher’s Online Bookstore solution.</p>'+
TBL(['Normal form','Condition'],[['<b>1NF</b>','every attribute holds atomic values; no repeating groups or multivalued attributes'],['<b>2NF</b>','1NF and no <b>partial dependency</b>: every non-prime attribute fully depends on every candidate key'],['<b>3NF</b>','2NF and no <b>transitive dependency</b>: for every non-trivial X → A, X is a superkey or A is prime'],['<b>BCNF</b>','for every non-trivial X → Y, X is a <b>superkey</b> (every determinant is a candidate key)']])+
'<p>Prime attribute = part of some candidate key. BCNF ⊂ 3NF ⊂ 2NF ⊂ 1NF. Every decomposition must be <b>lossless</b>; 3NF can always also be dependency-preserving, BCNF not always.</p>'+
'<h2>Anomalies, with the unnormalized bookstore table</h2>'+TBL(['Order_ID','Customer','Book_ISBN','Book_Title','Author','Publisher','Quantity'],[['O101','Arun','B101','DBMS','Raj','P01','2'],['O101','Arun','B102','OS','Kumar','P02','1'],['O102','Priya','B101','DBMS','Raj','P01','1']])+
'<ul><li><b>Update anomaly:</b> renaming the book DBMS needs changes in many rows; miss one and data is inconsistent.</li><li><b>Insertion anomaly:</b> a new book cannot be stored until someone orders it.</li><li><b>Deletion anomaly:</b> deleting order O102 may delete the only record of a customer or book.</li></ul>'+
'<h2>Solved models</h2>'+
MODEL('1. Normalization levels 1NF to BCNF with examples '+S('Rev1 Q14')+S('IA2QB M3 C5')+S('Jun25 Q21'),'<div class="paper"><p><b>Unnormalized (UNF).</b> The bookstore table above, where an order with several books and a book with several authors form repeating groups.</p>'+
'<p><b>1NF</b> (atomic values, one book-author-order per row): BOOKSTORE_1NF(Order_ID, ISBN, Author_ID, Customer_Name, Book_Title, Author_Name, Quantity), key (Order_ID, ISBN, Author_ID).<br><i>Limitation:</i> customer, book and author details still repeat.</p>'+
'<p><b>2NF</b> (remove partial dependencies). FDs: Order_ID → Customer_Name; ISBN → Book_Title, Genre, Price; Author_ID → Author_Name; (Order_ID, ISBN) → Quantity. Each depends on part of the key, so split:<br>ORDERS(<u>Order_ID</u>, Customer_Name, Order_Date), BOOK(<u>ISBN</u>, Book_Title, Genre, Price, Publisher_ID, Publisher_Name, Publisher_Address), AUTHOR(<u>Author_ID</u>, Author_Name, Biography), ORDER_ITEM(<u>Order_ID</u>, <u>ISBN</u>, Quantity), BOOK_AUTHOR(<u>ISBN</u>, <u>Author_ID</u>).</p>'+
'<p><b>3NF</b> (remove transitive dependencies). In BOOK: ISBN → Publisher_ID → Publisher_Name, Publisher_Address. Split: BOOK(<u>ISBN</u>, Book_Title, Genre, Price, Publisher_ID FK), PUBLISHER(<u>Publisher_ID</u>, Publisher_Name, Publisher_Address).</p>'+
'<p><b>BCNF</b> (every determinant is a superkey). In every table above the only determinants are the keys (BOOK_AUTHOR has no non-trivial FD besides its key), so all are in BCNF. Final schema: CUSTOMER, ORDERS, BOOK, AUTHOR, PUBLISHER, BOOK_AUTHOR, ORDER_ITEM.</p>'+
'<p><b>Benefits:</b> less redundancy, no anomalies, smaller updates, consistent data. <b>Limitations:</b> more tables means more joins and slower reads; BCNF may lose dependency preservation; over-normalization hurts reporting queries (sometimes we denormalize on purpose).</p></div>')+
MODEL('2. Is this table in 1NF? Decompose it '+S('Rem Q22'),'<div class="paper"><p>The table is <b>not in 1NF</b>: the column Courses holds several values in one cell (“DBMS, DSD”), a multivalued, non-atomic attribute and a repeating group. It also makes queries like “who takes DBMS?” need string matching, and adding or removing one course means editing a list.</p><p><b>1NF:</b> one course per row; key becomes (Student_ID, Course):</p>'+TBL(['Student_ID','Student_Name','Course'],[['101','Arun','DBMS'],['101','Arun','DSD'],['102','Priya','OS'],['102','Priya','Java'],['103','Kumar','DBMS'],['103','Kumar','Python'],['103','Kumar','AI']])+'<p>Now Student_Name repeats (Student_ID → Student_Name is a partial dependency), so for 2NF decompose further: STUDENT(<u>Student_ID</u>, Student_Name) and ENROLLMENT(<u>Student_ID</u>, <u>Course</u>).</p></div>')+
MODEL('3. Normalized schema for e-commerce inventory '+S('Self Q7'),'<div class="paper"><p><b>UNF:</b> INVENTORY(ProductID, PName, Category, Price, SupplierID, SName, SContact, WarehouseID, Location, Capacity, Quantity, PurchaseID, PurchaseDate, PurchaseQty), with repeating suppliers and warehouses per product.</p><p><b>FDs:</b> ProductID → PName, Category, Price; SupplierID → SName, SContact; WarehouseID → Location, Capacity; (ProductID, WarehouseID) → Quantity; PurchaseID → PurchaseDate, SupplierID, WarehouseID; (PurchaseID, ProductID) → PurchaseQty.</p><p><b>1NF:</b> make every value atomic, one row per (product, supplier, warehouse, purchase) combination.</p><p><b>2NF:</b> remove partial dependencies: PRODUCT(<u>ProductID</u>, PName, Category, Price), SUPPLIER(<u>SupplierID</u>, SName, SContact), WAREHOUSE(<u>WarehouseID</u>, Location, Capacity), STOCK(<u>ProductID</u>, <u>WarehouseID</u>, Quantity), SUPPLIES(<u>SupplierID</u>, <u>ProductID</u>), PURCHASE(<u>PurchaseID</u>, PurchaseDate, SupplierID, WarehouseID), PURCHASE_ITEM(<u>PurchaseID</u>, <u>ProductID</u>, PurchaseQty).</p><p><b>3NF:</b> no non-key attribute depends on another non-key attribute in any table (e.g. Location depends only on WarehouseID), so no transitive dependency remains.</p><p><b>BCNF:</b> in each table the only determinant is the primary key, so all tables are in BCNF.</p></div>')+
MODEL('4. Hotel reservation schema, 1NF to BCNF '+S('Self Q8'),'<div class="paper"><p><b>UNF:</b> BOOKING(BookingID, GuestID, GName, GContact, HotelID, HName, HLocation, {RoomID, RType, Tariff, CheckIn, CheckOut}): a booking with several rooms is a repeating group.</p><p><b>FDs:</b> GuestID → GName, GContact; HotelID → HName, HLocation; RoomID → RType, Tariff, HotelID; BookingID → GuestID, BookingDate; (BookingID, RoomID) → CheckIn, CheckOut.</p><p><b>1NF:</b> one row per (booking, room); key (BookingID, RoomID).<br><b>2NF:</b> remove partial dependencies: BOOKING(<u>BookingID</u>, GuestID, BookingDate), BOOKING_ROOM(<u>BookingID</u>, <u>RoomID</u>, CheckIn, CheckOut), ROOM(<u>RoomID</u>, RType, Tariff, HotelID, HName, HLocation), GUEST(<u>GuestID</u>, GName, GContact).<br><b>3NF:</b> RoomID → HotelID → HName is transitive, so ROOM(<u>RoomID</u>, RType, Tariff, HotelID FK) and HOTEL(<u>HotelID</u>, HName, HLocation).<br><b>BCNF:</b> every determinant (GuestID, HotelID, RoomID, BookingID, (BookingID, RoomID)) is the key of its table. (If tariff depended only on room type, RType → Tariff would violate 3NF and give ROOM_TYPE(<u>RType</u>, Tariff).)</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M3 A14')+S('Rem Q18')+'Define normalization.','The process of organising relations using functional dependencies and decomposition so that redundancy is minimised and insertion, update and deletion anomalies are removed.')+
P(S('IA2QB M3 A11')+'What is meant by redundancy in ER modelling?','Storing the same fact more than once, e.g. keeping DeptName both in STUDENT and DEPARTMENT, or an attribute that is really the key of another entity. It wastes space and causes inconsistent updates.')+
P(S('IA2QB M3 A15')+'What is 1NF?','A relation is in First Normal Form if every attribute holds only atomic (indivisible) values and there are no repeating groups.')+
P(S('IA2QB M3 A16')+'What is 2NF?','In 1NF and every non-prime attribute is fully functionally dependent on every candidate key (no partial dependency).')+
P(S('IA2QB M3 A17')+'What is 3NF?','In 2NF and no non-prime attribute is transitively dependent on a candidate key: for every X → A, X is a superkey or A is prime.')+
P(S('IA2QB M3 A18')+'What is BCNF?','Boyce-Codd Normal Form: for every non-trivial FD X → Y, X is a superkey. A stricter form of 3NF.')+
P(S('IA2QB M3 B18')+'Role of a candidate key in normalization.','Normal forms are defined relative to candidate keys: prime vs non-prime attributes, partial dependency (on part of a key), transitive dependency (not through a key), BCNF (every determinant a superkey). So we first find all candidate keys using attribute closure.')+
'</ol>';

var C37='<h2>Lossless-join decomposition</h2><p>Decomposing R into R1 and R2 is <b>lossless</b> if joining them gives back exactly R (no spurious tuples). Test: the common attributes must be a superkey of at least one side: (R1 ∩ R2) → R1 or (R1 ∩ R2) → R2.</p><p>Student(RollNo, Name, DeptID, DeptName) → (RollNo, Name, DeptID) and (DeptID, DeptName): common = DeptID, and DeptID → DeptName, so it is lossless. Splitting into (RollNo, Name) and (Name, DeptID) is lossy when two students share a name.</p>'+
'<h2>Dependency preservation</h2><p>A decomposition is <b>dependency-preserving</b> if every FD in F can be checked within a single decomposed table, i.e. (F1 ∪ F2 ∪ …)⁺ = F⁺. Otherwise checking an FD needs a join on every update.</p>'+
'<h2>4NF and multivalued dependencies</h2><p>X →→ Y (multivalued dependency) holds when, for a given X, the set of Y values is independent of the other attributes. A relation is in <b>4NF</b> if for every non-trivial MVD X →→ Y, X is a superkey.</p>'+TBL(['Course','Teacher','Book'],[['DBMS','Ravi','Korth'],['DBMS','Ravi','Navathe'],['DBMS','Meena','Korth'],['DBMS','Meena','Navathe']])+'<p>Course →→ Teacher and Course →→ Book: every teacher is paired with every book. It is in BCNF (no FDs at all) but redundant. 4NF: COURSE_TEACHER(<u>Course</u>, <u>Teacher</u>) and COURSE_BOOK(<u>Course</u>, <u>Book</u>).</p>'+
'<h2>5NF and join dependencies</h2><p>A <b>join dependency</b> *(R1, R2, …, Rn) holds if R is always the natural join of its projections on R1..Rn. <b>5NF (project-join normal form)</b>: every join dependency is implied by the candidate keys. Example: SUPPLY(Agent, Company, Product) where an agent sells a product for a company <i>whenever</i> the agent works for the company, the company makes the product and the agent sells that product: then SUPPLY = AC ⋈ CP ⋈ AP and it is split into those three tables, though no two of them alone recover it.</p>'+
'<h2>Solved models</h2>'+
MODEL('1. Multivalued dependency and 4NF '+S('IA2QB M3 C6'),'<div class="paper"><p><b>MVD:</b> X →→ Y holds on R if, whenever two tuples agree on X, swapping their Y values gives tuples that are also in R. It means Y-values for an X are independent of the rest (Z = R − X − Y). Every FD is also an MVD.</p><p><b>4NF:</b> R is in 4NF if for every non-trivial MVD X →→ Y (Y ⊄ X, XY ≠ R), X is a superkey.</p><p><b>Example:</b> the Course–Teacher–Book table above has Course →→ Teacher | Book. Course is not a superkey (key is all three), so it is not in 4NF; adding a new book for DBMS needs one row per teacher. Decompose into COURSE_TEACHER and COURSE_BOOK: both are in 4NF and the join gives back the original (lossless because Course →→ Teacher).</p></div>')+
MODEL('2. Join dependency and 5NF '+S('IA2QB M3 C7'),'<div class="paper"><p><b>Join dependency</b> *(R1, …, Rn) on R: every legal instance of R equals π<sub>R1</sub>(R) ⋈ … ⋈ π<sub>Rn</sub>(R). An MVD is a join dependency with n = 2.</p><p><b>5NF / PJNF:</b> R is in 5NF if every join dependency on it is implied by its candidate keys. Such a relation cannot be decomposed further without loss.</p><p><b>Example:</b> SUPPLY(Agent, Company, Product) with the business rule given above. Rows: (Ravi, ABC, Pen), (Ravi, XYZ, Pencil), (Meena, ABC, Pencil), (Ravi, ABC, Pencil). The relation satisfies *(AC, CP, AP), so it is decomposed into AGENT_COMPANY, COMPANY_PRODUCT, AGENT_PRODUCT; their three-way join gives back exactly SUPPLY, while any two-way join gives spurious rows.</p></div>')+
MODEL('3. Dependency preservation with examples '+S('IA2QB M3 C8'),'<div class="paper"><p>Let F be the FDs on R and R1..Rn a decomposition. Fi = FDs of F⁺ using only attributes of Ri. The decomposition is dependency-preserving if (F1 ∪ … ∪ Fn)⁺ = F⁺, so every FD can be checked in one table without a join.</p><p><b>Preserving:</b> R(A, B, C), F = {A → B, B → C}. Decompose into R1(A, B), R2(B, C). A → B is in R1, B → C in R2: preserved (and lossless, since B → C).</p><p><b>Not preserving:</b> R(Student, Course, Teacher), F = {(Student, Course) → Teacher, Teacher → Course}. Teacher → Course violates BCNF (Teacher is not a key). BCNF decomposition: R1(Teacher, Course), R2(Student, Teacher). It is lossless (Teacher → Course), but (Student, Course) → Teacher cannot be checked in either table. This is why 3NF is sometimes chosen over BCNF.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P(S('IA2QB M3 A19')+'Define multivalued dependency.','X →→ Y holds if each X value is associated with a set of Y values that is independent of the other attributes of the relation.')+
P(S('IA2QB M3 A20')+'What is 4NF?','A relation in BCNF in which, for every non-trivial multivalued dependency X →→ Y, X is a superkey.')+
P(S('IA2QB M3 B20')+'Lossless join decomposition and why it matters.','A decomposition of R into R1, R2 is lossless if R1 ⋈ R2 = R exactly; guaranteed when R1 ∩ R2 is a key of R1 or of R2. It matters because a lossy decomposition creates spurious tuples on joining, so the original information is lost.')+
'</ol>';

var C38='<p>The long ER questions all follow one recipe, and the examiner marks each step:</p><ol class="steps"><li>List the <b>entities</b> with their attributes; underline the key; mark composite, multivalued, derived attributes.</li><li>List the <b>relationships</b> with cardinality (1:1, 1:N, M:N) and participation (total/partial), and relationship attributes.</li><li>Spot <b>weak entities</b> (no key of their own) and any generalization.</li><li>Draw the diagram with correct symbols.</li><li>Convert to tables with the rules from 3.4, keys underlined, FKs marked.</li><li>Check the tables are in 3NF/BCNF.</li></ol>'+
'<h2>Solved models</h2>'+
MODEL('1. Employee Management System ER diagram '+S('Rem Q21')+S('ER Q5'),ER_EMP+'<div class="paper"><p><b>Entities:</b> EMPLOYEE(<u>EmpID</u>, Name, Designation, Salary, {Phone}); DEPARTMENT(<u>DeptID</u>, DName, Location); PROJECT(<u>ProjID</u>, PName, Budget); DEPENDENT (weak; partial key DepName; Relationship, DOB).</p><p><b>Relationships:</b> WORKS_IN EMPLOYEE N : 1 DEPARTMENT (every employee works in one department: total). MANAGES EMPLOYEE 1 : 1 DEPARTMENT (every department has a manager: total on DEPARTMENT). WORKS_ON EMPLOYEE M : N PROJECT with attribute Hours. DEPENDENT_OF EMPLOYEE 1 : N DEPENDENT (identifying).</p><p><b>Tables:</b> DEPARTMENT(<u>DeptID</u>, DName, Location, Mgr_EmpID FK), EMPLOYEE(<u>EmpID</u>, Name, Designation, Salary, DeptID FK), EMP_PHONE(<u>EmpID</u>, <u>Phone</u>), PROJECT(<u>ProjID</u>, PName, Budget), WORKS_ON(<u>EmpID</u>, <u>ProjID</u>, Hours), DEPENDENT(<u>EmpID</u>, <u>DepName</u>, Relationship, DOB).</p></div>')+
MODEL('2. College Management System ER diagram and schema '+S('IA2QB M3 C1'),ER_COLLEGE+'<div class="paper"><p>STUDENT N : 1 DEPARTMENT (BELONGS_TO, total on STUDENT); DEPARTMENT 1 : N COURSE (OFFERS, total on COURSE); STUDENT M : N COURSE (ENROLLS, with Grade).</p><p><b>Relational schema:</b> DEPARTMENT(<u>DeptID</u>, DName), STUDENT(<u>RollNo</u>, SName, DOB, DeptID FK NOT NULL), COURSE(<u>CourseID</u>, Title, Credits, DeptID FK NOT NULL), ENROLLS(<u>RollNo</u> FK, <u>CourseID</u> FK, Grade).</p></div>')+
MODEL('3. Online Banking System: ER diagram and normalized schema '+S('IA2QB M3 C9'),ER_BANK+'<div class="paper"><p><b>Entities:</b> CUSTOMER(<u>CustID</u>, CName, Phone), ACCOUNT(<u>AccNo</u>, Balance, Type), BRANCH(<u>BranchID</u>, BName, City), LOAN(<u>LoanNo</u>, LAmount), TRANSACTION (weak: TransNo, Date, Amount).</p><p><b>Relationships:</b> DEPOSITOR CUSTOMER M : N ACCOUNT (joint accounts; every account has an owner: total). HELD_AT ACCOUNT N : 1 BRANCH (total). LOGS ACCOUNT 1 : N TRANSACTION (identifying). BORROWER CUSTOMER M : N LOAN (every loan has a borrower: total).</p><p><b>Schema (all in BCNF: each table’s only determinant is its key):</b> CUSTOMER(<u>CustID</u>, CName, Phone), BRANCH(<u>BranchID</u>, BName, City), ACCOUNT(<u>AccNo</u>, Balance, Type, BranchID FK), DEPOSITOR(<u>CustID</u>, <u>AccNo</u>), TRANSACTION(<u>AccNo</u>, <u>TransNo</u>, Date, Amount, TType), LOAN(<u>LoanNo</u>, LAmount, BranchID FK), BORROWER(<u>CustID</u>, <u>LoanNo</u>).</p></div>')+

MODEL('9. Removing redundant attributes and reducing an ER diagram '+S('IA2QB M3 C10'),'<div class="paper"><p><b>Redundant attributes.</b> If an entity set holds an attribute that is really the key of another entity set it is related to, that attribute is redundant and must be removed, because the relationship already records it. Example: INSTRUCTOR(ID, name, salary, dept_name) and DEPARTMENT(dept_name, building) with relationship INST_DEPT: dept_name in INSTRUCTOR is redundant. It is removed from the entity; when converted to tables it comes back once, as the foreign key of the 1:N relationship.</p><p><b>Reduction example with composite and multivalued attributes:</b> INSTRUCTOR(<u>ID</u>, name (first, middle, last), address (street, city, PIN), {phone_number}, date_of_birth, age()).<br>→ INSTRUCTOR(<u>ID</u>, first_name, middle_name, last_name, street, city, PIN, date_of_birth, dept_name FK)<br>→ INSTRUCTOR_PHONE(<u>ID</u>, <u>phone_number</u>)<br>age is derived, so it is computed from date_of_birth (or kept as a method), not stored.</p></div>')+
'<p class="log">Other ER design questions use the same recipe: library, railway, weak-entity and university questions are answered above; for the airline, hospital and food-delivery ones see models 4–6.</p>';
