/* ================= MODULE 4: File structure and indexing ================= */
var C41='<h2>Storage hierarchy</h2>'+TBL(['Level','Examples','Volatile?','Speed / cost'],[['Primary','cache, main memory (RAM)','yes','fastest, costliest'],['Secondary (online)','magnetic disk, SSD (flash)','no','slower, cheaper'],['Tertiary (offline)','magnetic tape, optical disks','no','slowest, cheapest, for archives/backup']])+
'<p>A database lives on disk; only the blocks being used are brought into memory by the buffer manager. Disk access time = <b>seek time</b> (move the arm to the track) + <b>rotational latency</b> (wait for the sector) + transfer time. Data moves in <b>blocks</b> (typically 4–16 KB), so the DBMS tries to minimise block transfers.</p>'+
'<h2>RAID: Redundant Array of Independent Disks</h2><p>Many cheap disks together give <b>speed</b> (by <b>striping</b> data across disks so they work in parallel) and <b>reliability</b> (by <b>redundancy</b>: mirroring or parity, so data survives a disk failure).</p>'+
TBL(['Level','Technique','Survives','Use'],[['RAID 0','block striping, no redundancy','no failure','speed only, non-critical data'],['RAID 1','mirroring (every disk has a copy)','one disk of each pair','databases, logs; high write load'],['RAID 2','bit striping + Hamming (ECC) codes','one disk','obsolete'],['RAID 3','bit striping + one parity disk','one disk','obsolete'],['RAID 4','block striping + dedicated parity disk','one disk','parity disk is a bottleneck'],['RAID 5','block striping, parity spread over all disks','one disk','read-heavy data, good space use'],['RAID 6','like 5 with two parity blocks (P+Q)','two disks','very large arrays'],['RAID 1+0 (10)','mirrored pairs, striped','one per pair','high-update databases']])+
'<p>Parity: the parity block is the XOR of the data blocks in its stripe, so a lost block = XOR of all the others.</p>'+
'<h2>Practice</h2><ol class="practice">'+
P('What is RAID and why is it used?','Redundant Array of Independent Disks: several disks used together. Striping improves performance through parallel access; redundancy (mirroring/parity) improves reliability, so the data survives a disk failure.')+
P('Compare RAID 1 and RAID 5.','RAID 1 mirrors: 50% space overhead, fast writes, simple recovery. RAID 5 stripes with distributed parity: only 1/N overhead, but every write updates data and parity (4 I/Os for a small write). RAID 1 suits update-heavy data like logs; RAID 5 suits read-heavy data.')+
'</ol>';

var C42='<h2>Records in files</h2><p>A file is a sequence of records stored in disk blocks.</p>'+
TBL(['','Fixed-length records','Variable-length records'],[['Record size','every record has the same size','records differ in size'],['Why variable','-','VARCHAR fields, multivalued/repeating fields, several record types in one file'],['Finding record i','address = (i − 1) × n bytes','needs a slotted-page header'],['Deletion','move the last record into the hole, or keep a <b>free list</b> of deleted slots','compact the page and update the slot array'],['Space','may waste space (padding)','no padding, more bookkeeping'],['Complexity','simple','complex (offsets and lengths stored)']])+
'<p><b>Slotted-page structure</b> (for variable-length records): each block has a header with the number of entries, the end of free space, and an array of (offset, length) for each record. Records grow from the end of the block, the header from the front; records can be moved within the page because outside pointers point to the slot, not the record.</p>'+
'<h2>Organization of records in files</h2>'+TBL(['Organization','How','Good for'],[['<b>Heap</b>','a record goes anywhere there is space','fast inserts, full scans'],['<b>Sequential</b>','records kept sorted on a search key, chained by pointers; overflow blocks for inserts; reorganise periodically','range queries, ordered processing'],['<b>Hashing</b>','a hash function on an attribute picks the block (bucket)','equality lookups'],['<b>Multitable clustering</b>','records of related tables stored together in the same block','frequent joins (department with its instructors)'],['<b>B+ tree file</b>','records stored in the leaves of a B+ tree','both lookup and range']])+
'<h2>Data dictionary storage</h2><p>The <b>data dictionary (system catalog)</b> stores <b>metadata</b>: names of relations, attributes, their domains and lengths, views, integrity constraints, users and their privileges, statistics (number of tuples), indexes and their structure, and the physical organization of each relation. It is itself stored as relations.</p>'+
'<h2>Solved models</h2>'+
MODEL('1. Fixed-length vs variable-length records '+S('M4Asg Q1'),'<div class="paper"><p>Write the comparison table above. Example of fixed-length: instructor(ID char(5), name char(20), dept char(20), salary numeric(8,2)) = 53 bytes per record, record i at byte 53(i − 1). Problem: deleting record 3 leaves a hole; fix by moving the last record into it or keeping a free list. Example of variable-length: name varchar(20) stores only the actual characters; the record stores (offset, length) pairs for variable fields followed by a null bitmap, and pages use the slotted-page structure.</p></div>')+
MODEL('2. File organization and its types '+S('M4Asg Q3')+S('Apr26 Q22b')+S('Jun25 Q22'),'<div class="paper"><p>File organization is the way records are arranged in a file on disk so that they can be accessed efficiently.</p><p><b>1. Heap (pile) file:</b> no order; insert at the end or any free slot. Fast insert, search needs a full scan.<br><b>2. Sequential file:</b> sorted on a search key; records linked in key order; inserts go to overflow blocks; periodic reorganisation. Efficient for range queries and reports in order.<br><b>3. Hash file:</b> h(key) gives the bucket address; very fast for equality search, not for ranges.<br><b>4. Clustered (multitable clustering) file:</b> records of several relations that are often joined are stored together in the same block.<br><b>5. B+ tree file organization:</b> records stored in B+ tree leaves; balanced, good for both point and range queries.</p><p>Draw a small sketch of a sequential file with an overflow block and pointer chain.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P('What is stored in the data dictionary?','Metadata: relation names, attribute names and types, constraints, views, users and privileges, index definitions, statistics, and storage details of each relation.')+
'</ol>';

var C43='<p>An <b>index</b> is like the index at the back of a book: a small file of (search key, pointer) entries that leads straight to the records. Evaluate an index by access time, insertion time, deletion time and space overhead.</p>'+
TBL(['Index type','Definition'],[['<b>Primary (clustering) index</b>','its search key defines the sequential order of the file (usually but not always the primary key)'],['<b>Secondary (non-clustering) index</b>','search key order differs from the file order; must be dense; points to buckets of pointers when values repeat'],['<b>Dense index</b>','an index entry for <b>every</b> search-key value'],['<b>Sparse index</b>','entries for only <b>some</b> values (one per block); only possible on a primary index; search the largest entry ≤ key, then scan'],['<b>Multilevel index</b>','an index on the index: outer sparse index on the inner index, when the index itself is too big for memory'],['<b>Clustered vs unclustered</b>','same as primary vs secondary']])+
'<div class="split"><div style="flex:1 1 260px"><div class="cap log">Dense index on ID</div>'+TBL(['Index','→ Record'],[['10101','10101 Srinivasan'],['12121','12121 Wu'],['15151','15151 Mozart'],['22222','22222 Einstein'],['32343','32343 El Said']])+'</div><div style="flex:1 1 260px"><div class="cap log">Sparse index on ID (one entry per block)</div>'+TBL(['Index','→ Block starting with'],[['10101','10101, 12121, 15151'],['22222','22222, 32343, 33456'],['45565','45565, 58583, 76543']])+'</div></div>'+
'<p>Sparse vs dense: sparse uses less space and less maintenance; dense is faster to search. Good trade-off: a sparse index with one entry per <b>block</b>.</p>'+
'<h2>Solved model</h2>'+
MODEL('1. Indexing and its types '+S('M4Asg Q2'),'<div class="paper"><p><b>Indexing</b> is a data structure technique to retrieve records quickly using a search key, without scanning the whole file. An index entry = (search-key value, pointer to the record or block).</p><p><b>Types:</b><br>1. <b>Ordered indices</b>: entries kept sorted on the search key.<br>&nbsp;&nbsp;a. <b>Primary / clustering index</b>: on the attribute the file is sorted by. Can be <b>dense</b> (entry for every key) or <b>sparse</b> (entry for some keys, one per block).<br>&nbsp;&nbsp;b. <b>Secondary / non-clustering index</b>: on another attribute; always dense; extra level of buckets when values repeat.<br>&nbsp;&nbsp;c. <b>Multilevel index</b>: an outer sparse index on the inner index (ISAM style), reduces disk accesses.<br>2. <b>Tree-based indices</b>: B+ tree and B-tree, balanced and self-maintaining.<br>3. <b>Hash indices</b>: entries distributed into buckets by a hash function.</p><p>Draw the dense and sparse tables above.</p></div>')+
'<h2>Practice</h2><ol class="practice">'+
P('Why must a secondary index be dense?','The file is not sorted on the secondary key, so a record cannot be found by scanning forward from a nearby entry. Every key value needs its own entry (pointing to a bucket of record pointers when the key repeats).')+
P('What is a multilevel index?','When the index itself is too large for memory, it is treated as a sorted file and a sparse outer index is built on it (and so on). A search reads one block per level instead of binary-searching the whole index.')+
'</ol>';

var C44='<p>A <b>B+ tree</b> is a balanced tree index: every path from root to leaf has the same length, so a lookup costs about log<sub>⌈n/2⌉</sub>(number of keys) block reads. It is the default index in almost every DBMS.</p>'+
'<h2>Structure (order n = at most n pointers per node, as in the teacher’s slides)</h2>'+TBL(['Node','Keys','Pointers'],[['Leaf','⌈(n−1)/2⌉ to n − 1','one record pointer per key + one pointer P<sub>n</sub> to the next leaf'],['Internal (non-root)','⌈n/2⌉ − 1 to n − 1','⌈n/2⌉ to n child pointers'],['Root','1 to n − 1 (or 0 if the tree is a single leaf)','2 to n children']])+
'<p>For <b>order 4</b>: a leaf holds 2 or 3 keys, an internal node 2 to 4 children (1 to 3 keys). All keys appear in the leaves; internal keys are only <b>separators</b>; leaves are chained left to right for range queries.</p>'+
'<h2>Insertion</h2><ol class="steps"><li>Find the leaf where the key belongs and insert it in order.</li><li>If the leaf now has n keys (overflow): keep the first ⌈n/2⌉, move the rest to a new leaf, and <b>copy</b> the first key of the new leaf up into the parent.</li><li>If the parent now has n + 1 pointers: keep the first ⌈(n+1)/2⌉ pointers, <b>move</b> the middle key up (it is not kept in either half), put the rest in a new node.</li><li>If the root splits, a new root is created: the tree grows by one level, at the top.</li></ol>'+
'<h2>Deletion</h2><ol class="steps"><li>Remove the key from its leaf.</li><li>If the leaf still has at least ⌈(n−1)/2⌉ keys, stop. (The separator in the parent may stay; it still separates correctly.)</li><li>Underflow: if the leaf and a sibling fit in one node, <b>merge</b> them and delete the separator from the parent (which may underflow in turn).</li><li>Otherwise <b>redistribute</b>: borrow one key from the sibling and update the separator in the parent.</li><li>If the root ends up with one child, that child becomes the new root.</li></ol>'+
'<h2>Solved model</h2>'+
MODEL('1. Construct a B+ tree of order 4, insert 13, delete 18 '+S('Rev1 Q3'),BPT('Press Prev / Next to step through every insertion. The last two steps apply “insert 13” and “delete 18” to the finished tree','4','15 8 3 18 6 21 10 4 16 25 7 12 20 5','+13 -18')+'<div class="paper"><p><b>Order 4:</b> max 3 keys per leaf, min 2; internal nodes 2 to 4 children.</p><p><b>(i) Construction</b> (draw the tree after each split):<br>15, 8, 3 → [3 8 15].<br>18 → [3 8 15 18] overflows: split [3 8] | [15 18], copy 15 up. Root [15].<br>6 → [3 6 8]. 21 → [15 18 21].<br>10 → [3 6 8 10] splits [3 6] | [8 10], copy 8 up. Root [8 15].<br>4 → [3 4 6]. 16 → [15 16 18 21] splits [15 16] | [18 21], copy 18 up. Root [8 15 18].<br>25 → [18 21 25].<br>7 → [3 4 6 7] splits [3 4] | [6 7], copy 6 up; root becomes [6 8 15 18] with 5 pointers: overflow. Split the root: [6 8] | [18], move 15 up. New root [15].<br>12 → [8 10 12]. 20 → [18 20 21 25] splits [18 20] | [21 25], copy 21 up: right internal node [18 21].<br>5 → [3 4 5].</p><p><b>Final tree:</b> root [15]; internal [6 8] and [18 21]; leaves [3 4 5] → [6 7] → [8 10 12] → [15 16] → [18 20] → [21 25].</p><p><b>(ii) Insert 13</b> into the final tree: leaf [8 10 12] becomes [8 10 12 13], overflows, splits into [8 10] | [12 13] and 12 is copied up: internal node [6 8 12] (4 pointers, fits). Root unchanged.</p><p><b>(iii) Delete 18</b> from the original tree: leaf [18 20] becomes [20], below the minimum of 2. Its left sibling [15 16] has 2 keys; together 3 keys fit in one leaf, so merge into [15 16 20] and remove the separator 18 from the parent, which becomes [21] with 2 children (still legal). Result: root [15]; internal [6 8] and [21]; leaves [3 4 5] [6 7] [8 10 12] [15 16 20] [21 25].</p></div>')+
MODEL('2. Benefits and limitations of B+ trees as an index '+S('Rev1 Q10')+S('Jun25 Q23a'),'<div class="paper"><p><b>Benefits.</b><br>1. <b>Balanced:</b> all leaves at the same depth, so every search costs the same: O(log<sub>⌈n/2⌉</sub> K) block reads, about 3–4 even for millions of keys, because the fan-out is high (hundreds of pointers per block).<br>2. <b>Range queries and sorted access:</b> leaves are linked, so after finding the first key we scan leaves in order.<br>3. <b>Insertion and deletion</b> are local (split/merge along one path), so the index never needs full reorganisation, unlike index-sequential files.<br>4. <b>Storage:</b> nodes are at least half full, so space use is ≥ 50%; internal nodes hold only keys, so more fit in a block and the tree is shallow.<br>5. Works as a dense index and as a file organization (records in leaves).</p><p><b>Limitations.</b><br>1. Extra space for the index and up to 50% empty space in nodes.<br>2. Insert/delete overhead: splits, merges and redistribution, and locking overhead under concurrency.<br>3. For pure equality lookups a hash index can be faster (one block access).<br>4. Keys are duplicated in internal nodes and leaves.</p></div>')+
'<h2>Try your own</h2><p>Exam papers change the keys, not the method. Type any order and keys; add +k or −k steps to insert into or delete from the finished tree.</p>'+
'<div class="w"><div class="cap">Your own B+ tree</div><div class="bpme"></div></div>';

var C45='<h2>B-tree</h2><p>A <b>B-tree</b> is like a B+ tree but each search key appears <b>only once</b>, in either an internal node or a leaf. Internal nodes therefore also hold record pointers.</p>'+TBL(['','B-tree','B+ tree'],[['Keys stored','once, anywhere in the tree','all in leaves; internal keys are copies used as separators'],['Record pointers','in internal nodes and leaves','only in leaves'],['Leaves linked','no','yes (sequential scan)'],['Fan-out of internal nodes','smaller (also stores record pointers)','larger, so shallower tree'],['Search','may end early at an internal node','always goes to a leaf'],['Range queries','in-order traversal of the tree','scan the linked leaves'],['Deletion','harder (key may be in an internal node)','simpler (always from a leaf)'],['Used in practice','rarely','almost always']])+
'<h2>Multiple-key access</h2><p>For a query like <code>WHERE dept_name = \'Finance\' AND salary = 80000</code>:</p><ol><li>Use the index on dept_name and test salary on each record; or</li><li>use the index on salary and test dept_name; or</li><li>use both indices, take the <b>intersection</b> of the two sets of record pointers, then fetch only those records.</li><li>Better: a <b>composite index</b> on the search key (dept_name, salary), ordered lexicographically, which also answers <code>dept_name = \'Finance\' AND salary &lt; 80000</code>.</li></ol><p>Other options: <b>bitmap indices</b> (one bit vector per value, AND them), <b>covering indices</b> (store extra attributes in the index so the record need not be read).</p>'+
'<h2>Practice</h2><ol class="practice">'+P('Why is a B+ tree preferred to a B-tree?','Internal nodes hold only keys, so fan-out is higher and the tree shallower; leaves are linked for range scans; deletion is simpler; every search has the same cost. The B-tree’s saving (each key stored once, early hits) is small.')+P('What is a composite (multiple-key) index?','An index whose search key has several attributes, e.g. (dept_name, salary), ordered lexicographically. It answers queries that fix the first attribute and fix or range over the second.')+'</ol>';

var C46='<h2>Static hashing</h2><p>A <b>bucket</b> is a unit of storage (usually a disk block). A <b>hash function</b> h maps a search-key value to a bucket address: h: K → {0, …, B − 1}, e.g. h(k) = k mod B. Lookup, insert and delete need one bucket access. A good hash function is <b>uniform</b> (each bucket gets about the same number of possible keys) and <b>random</b> (even for real key distributions).</p>'+
'<p><b>Bucket overflow</b> happens when a bucket is full: too few buckets, or <b>skew</b> (many records share a key, or a poor hash function). Handled by <b>overflow chaining</b> (closed hashing: overflow buckets linked to the bucket) or <b>open addressing</b> (linear probing: use the next bucket; rarely used in databases).</p>'+
TBL(['Key','h(k) = k mod 5'],[['25','0'],['37','2'],['42','2'],['18','3'],['50','0'],['67','2 (bucket 2 overflows if its size is 2: chain an overflow bucket)']])+
'<p>Problem with static hashing: B is fixed. If the database grows, buckets overflow and performance falls; if B is chosen large, space is wasted; reorganising means rehashing every record.</p>'+
'<h2>Dynamic hashing: extendible hashing</h2><p>The hash function produces b-bit values (e.g. 32 bits). Only the first <b>i</b> bits (the <b>global depth</b>) are used to index a <b>bucket address table</b> of 2<sup>i</sup> entries. Several entries may point to the same bucket; each bucket j has a <b>local depth</b> i<sub>j</sub> ≤ i.</p><ol class="steps"><li><b>Lookup:</b> take the first i bits of h(K), follow that entry in the table.</li><li><b>Insert:</b> if the bucket has room, insert.</li><li>If full and i<sub>j</sub> &lt; i (several entries point to it): make a new bucket, set both local depths to i<sub>j</sub> + 1, re-point half the entries, rehash the bucket’s records, retry.</li><li>If full and i<sub>j</sub> = i (only one entry points to it): <b>double the table</b> (i := i + 1, each entry duplicated), then split as above.</li><li>Delete: remove the record; an empty bucket can be merged with its buddy and the table halved.</li></ol><p>Benefits: performance does not degrade as the file grows; minimal space overhead (only the table). Cost: an extra level of indirection; doubling the table is expensive when it happens. (<b>Linear hashing</b> avoids the table doubling by splitting buckets one at a time.)</p>'+
'<h2>Ordered indexing vs hashing</h2>'+TBL(['','Ordered index (B+ tree)','Hashing'],[['Equality query (A = v)','log<sub>⌈n/2⌉</sub>(N) blocks','≈ 1 block (best)'],['Range query (A between v1 and v2)','efficient: find v1, scan leaves','poor: hashing scatters neighbouring values'],['Periodic reorganisation','not needed','static: needed; dynamic: not needed'],['Insert/delete cost','moderate','low (unless overflow)'],['Worst case','still logarithmic','all keys in one bucket: a full scan'],['Default in DBMSs','yes (PostgreSQL, Oracle, MySQL)','hash indexes and hash joins for equality']])+
'<h2>Practice</h2><ol class="practice">'+P('What is bucket overflow and how is it handled?','A record hashes to a bucket that is already full. Causes: insufficient buckets or skew. Handled by overflow chaining (link overflow buckets to the primary bucket) or open addressing (linear probing).')+P('Static vs dynamic hashing.','Static: fixed number of buckets, so the file’s growth causes overflow chains or wasted space, and resizing needs a full rehash. Dynamic (extendible): the bucket address table grows and shrinks, buckets split and merge one at a time, so performance stays constant as the file grows.')+'</ol>';

/* ================= MODULE 5: Transactions ================= */
var C51='<p>A <b>transaction</b> is a unit of program execution that accesses and possibly updates data items. The standard example, used in the slides, transfers ₹50 from A to B:</p>'+CODE("T1:  read(A);\n     A := A - 50;\n     write(A);\n     read(B);\n     B := B + 50;\n     write(B);")+
'<h2>ACID properties</h2>'+TBL(['Property','Meaning','In the transfer','Who ensures it'],[['<b>Atomicity</b>','all operations happen or none do','a crash after write(A) must not lose ₹50','recovery system (undo using the log)'],['<b>Consistency</b>','a transaction run alone preserves database consistency','A + B is unchanged','the programmer + integrity constraints'],['<b>Isolation</b>','concurrent transactions do not see each other’s intermediate state','another transaction must not see A debited but B not yet credited','concurrency-control system'],['<b>Durability</b>','after commit, changes survive failures','once the user is told “done”, the transfer persists','recovery system (redo, stable storage)']])+
'<h2>Transaction states</h2><div class="w"><div class="cap">State diagram</div><div class="scroll"><svg xmlns="'+NS+'" viewBox="0 0 560 230" width="560" height="230" role="img" aria-label="transaction states"><defs><marker id="tsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fa-a"/></marker></defs><g text-anchor="middle" class="fa-t" style="font-size:13px">'+
'<line class="fa-e" x1="120" y1="115" x2="196" y2="60" marker-end="url(#tsa)"/><line class="fa-e" x1="120" y1="125" x2="196" y2="180" marker-end="url(#tsa)"/><line class="fa-e" x1="330" y1="50" x2="410" y2="50" marker-end="url(#tsa)"/><line class="fa-e" x1="268" y1="68" x2="268" y2="162" marker-end="url(#tsa)"/><line class="fa-e" x1="330" y1="190" x2="410" y2="190" marker-end="url(#tsa)"/>'+
'<rect class="fa-c" x="30" y="100" width="90" height="36" rx="18"/><text x="75" y="123">active</text><rect class="fa-c" x="200" y="32" width="136" height="36" rx="18"/><text x="268" y="55">partially committed</text><rect class="fa-c" x="415" y="32" width="110" height="36" rx="18"/><text x="470" y="55">committed</text><rect class="fa-c" x="200" y="172" width="136" height="36" rx="18"/><text x="268" y="195">failed</text><rect class="fa-c" x="415" y="172" width="110" height="36" rx="18"/><text x="470" y="195">aborted</text></g></svg></div></div>'+
TBL(['State','Meaning'],[['Active','initial state; executing'],['Partially committed','after the final statement has executed (output may still be in memory)'],['Failed','normal execution can no longer proceed'],['Aborted','rolled back, database restored to its state before the transaction; then <b>restart</b> it (if the failure was not a logic error) or <b>kill</b> it'],['Committed','after successful completion; changes are permanent']])+
'<h2>Practice</h2><ol class="practice">'+P('Explain ACID with an example.','Use the transfer: Atomicity (crash after debit is undone), Consistency (sum A + B preserved), Isolation (no one sees A debited but B not credited), Durability (after commit, the transfer survives a crash). See the table.')+P('Draw and explain the transaction state diagram.','active → partially committed → committed; active or partially committed → failed → aborted (then restart or kill). Explain each state as in the table.')+'</ol>';

var C52='<h2>Implementing atomicity and durability</h2><p><b>Shadow-copy scheme</b> (simple, for small databases): a pointer db_pointer points to the current copy. A transaction writes to a fresh copy; on commit, the new copy is flushed to disk and db_pointer is atomically switched to it. Abort = just delete the new copy. Inefficient for large databases.</p><p><b>Log-based recovery</b> (real systems): before any change, a log record ⟨Ti, X, old value, new value⟩ is written to stable storage (<b>write-ahead logging</b>). After a crash, <b>undo</b> transactions without a ⟨Ti commit⟩ record (restore old values) and <b>redo</b> committed ones (re-apply new values). Checkpoints limit how much log must be scanned.</p>'+
'<h2>Schedules</h2><p>A <b>schedule</b> is the order in which the instructions of concurrent transactions are executed; it keeps each transaction’s own order. Concurrency is worth it: better throughput and resource use (CPU and disk overlap) and shorter waiting time for short transactions.</p>'+
'<div class="split"><div style="flex:1 1 260px">'+TBL(['T1','T2'],[['read(A)',''],['A := A − 50',''],['write(A)',''],['read(B)',''],['B := B + 50',''],['write(B)',''],['','read(A)'],['','temp := A × 0.1'],['','A := A − temp'],['','write(A)'],['','read(B)'],['','B := B + temp'],['','write(B)']])+'<p class="log">Serial schedule: T1 then T2.</p></div><div style="flex:1 1 260px">'+TBL(['T1','T2'],[['read(A)',''],['A := A − 50',''],['write(A)',''],['','read(A)'],['','temp := A × 0.1'],['','A := A − temp'],['','write(A)'],['read(B)',''],['B := B + 50',''],['write(B)',''],['','read(B)'],['','B := B + temp'],['','write(B)']])+'<p class="log">Concurrent, but equivalent to the serial one: consistent.</p></div></div>'+
'<h2>Recoverability</h2>'+TBL(['Schedule kind','Rule'],[['<b>Recoverable</b>','if Tj reads data written by Ti, Ti commits before Tj commits'],['<b>Cascadeless</b>','if Tj reads data written by Ti, Ti commits before Tj <b>reads</b> it (no cascading rollback)'],['Cascading rollback','one transaction’s abort forces aborting the transactions that read its uncommitted data']])+
'<h2>Practice</h2><ol class="practice">'+P('What is write-ahead logging?','The log record describing a change must reach stable storage before the changed data block is written to disk, and all log records of a transaction must be on stable storage before it commits. This makes undo and redo possible after a crash.')+P('Recoverable vs cascadeless schedules.','Recoverable: a reader commits only after the writer it read from commits. Cascadeless: a transaction reads only committed data, so one abort never forces others to abort. Every cascadeless schedule is recoverable.')+'</ol>';

var C53='<p>A schedule is <b>serializable</b> if it is equivalent to some serial schedule. Then running transactions concurrently is as safe as running them one by one.</p>'+
'<h2>Conflict serializability</h2><p>Two instructions <b>conflict</b> if they belong to different transactions, access the same item, and at least one is a <b>write</b>: read–write, write–read, write–write. (read–read never conflicts.) A schedule is <b>conflict serializable</b> if swapping non-conflicting adjacent instructions can turn it into a serial schedule.</p>'+
'<h2>Precedence graph test</h2><ol class="steps"><li>One node per transaction.</li><li>Edge Ti → Tj for each conflicting pair where Ti’s instruction comes first.</li><li><b>Cycle → not conflict serializable. No cycle → conflict serializable</b>, and a topological sort of the graph gives an equivalent serial order.</li></ol>'+
SER('Precedence graph checker. Type any schedule','r1(A) w1(A) r2(A) w2(A) r1(B) w1(B) r2(B) w2(B)')+
SER('A non-serializable schedule (lost update)','r1(A) r2(A) w1(A) w2(A)')+
'<h2>View serializability</h2><p>Two schedules are <b>view equivalent</b> if: (1) each transaction reads the initial value of an item in one iff it does in the other; (2) each read reads the value written by the same transaction in both; (3) the final write of each item is by the same transaction. Every conflict-serializable schedule is view serializable; the extra view-serializable ones contain <b>blind writes</b> (writes without a preceding read). Testing view serializability is NP-complete, so systems use conflict serializability.</p>'+
'<h2>Practice</h2><ol class="practice">'+P('Is r1(X) r2(Y) w2(X) w1(Y) conflict serializable?','Conflicts: r1(X) before w2(X) gives T1 → T2; r2(Y) before w1(Y) gives T2 → T1. Cycle, so <b>not</b> conflict serializable. (Paste it into the checker.)')+P('Is r1(A) r2(A) r1(B) w1(A) r3(B) w2(B) conflict serializable? Give the order.','Edges: r2(A)→w1(A): T2 → T1; r1(B)→w2(B): T1 → T2. Cycle T1 ↔ T2: not serializable. Check with the widget.')+'</ol>';

var C54='<h2>Concurrency anomalies (why isolation is needed)</h2>'+TBL(['Problem','What happens','Schedule'],[['<b>Lost update</b> (write–write)','two transactions read the same value and both write; the first write is overwritten','r1(A) r2(A) w1(A) w2(A)'],['<b>Dirty read</b> (temporary update, write–read)','a transaction reads a value written by another that later aborts','w1(A) r2(A) abort1'],['<b>Unrepeatable read</b> (read–write)','reading the same item twice gives different values because another transaction changed it in between','r1(A) w2(A) commit2 r1(A)'],['<b>Phantom</b>','re-running a query returns new rows inserted by another transaction','T1 counts rows WHERE dept=CSE; T2 inserts a CSE row; T1 counts again'],['Incorrect summary','an aggregate is computed while another transaction is updating some of the rows','T1 sums all balances while T2 transfers money']])+
'<h2>SQL isolation levels</h2>'+TBL(['Level','Dirty read','Unrepeatable read','Phantom'],[['Read uncommitted','possible','possible','possible'],['Read committed (Oracle default)','prevented','possible','possible'],['Repeatable read','prevented','prevented','possible'],['Serializable','prevented','prevented','prevented']],'c')+CODE("SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;")+
'<p>All levels forbid dirty writes. Lower levels give more concurrency for transactions that can tolerate the anomaly (e.g. approximate statistics).</p>'+
'<h2>Solved model</h2>'+
MODEL('1. Three major concurrency anomalies with examples '+S('Rev1 Q12'),'<div class="paper"><p>When transactions run concurrently without control, three classic problems occur. Use A = 100.</p><p><b>1. Lost update (write–write conflict).</b> T1: read(A) = 100, A := A − 10. T2: read(A) = 100, A := A + 20. T1 writes 90, then T2 writes 120. T1’s update is lost; the correct value is 110.</p>'+TBL(['T1','T2'],[['read(A) [100]',''],['','read(A) [100]'],['A := A − 10; write(A) [90]',''],['','A := A + 20; write(A) [120]']])+'<p><b>2. Dirty read / temporary update (write–read conflict).</b> T1 writes A = 90; T2 reads 90 and uses it; then T1 fails and is rolled back to 100. T2 has used a value that never officially existed.</p><p><b>3. Unrepeatable read (read–write conflict).</b> T1 reads A = 100; T2 updates A to 120 and commits; T1 reads A again and gets 120. The same transaction sees two different values.</p><p>(Also mention the <b>phantom</b> and <b>incorrect summary</b> problems.) <b>Prevention:</b> concurrency-control protocols (two-phase locking, timestamp ordering, validation) that ensure serializable, recoverable schedules, and the SQL isolation level SERIALIZABLE.</p></div>');

var C55='<h2>Locks</h2><p>A transaction must hold a lock on an item before accessing it. <b>Shared (S)</b> lock: read only; many transactions may hold S together. <b>Exclusive (X)</b> lock: read and write; no other lock allowed.</p>'+TBL(['Requested \\ Held','S','X'],[['S','✓ compatible','✗ wait'],['X','✗ wait','✗ wait']],'c')+
'<h2>Two-phase locking (2PL)</h2><p>Each transaction locks and unlocks in two phases: <b>growing phase</b> (may obtain locks, may not release any) then <b>shrinking phase</b> (may release, may not obtain). The point where it gets its last lock is the <b>lock point</b>. 2PL guarantees <b>conflict serializability</b>, in lock-point order.</p>'+
TBL(['Variant','Rule','Gives'],[['Basic 2PL','growing then shrinking','serializability; cascading rollbacks and deadlocks still possible'],['<b>Strict 2PL</b>','hold all <b>X</b> locks until commit/abort','cascadeless (recoverable) schedules'],['<b>Rigorous 2PL</b>','hold <b>all</b> locks until commit/abort','transactions serialize in commit order'],['Lock conversion','upgrade S→X only in growing phase, downgrade X→S only in shrinking','more concurrency']])+
CODE("T1: lock-X(B); read(B); B := B - 50; write(B);\n    lock-X(A); read(A); A := A + 50; write(A);   -- lock point\n    unlock(B); unlock(A);                       -- shrinking phase")+
'<p><b>Deadlock</b> is still possible under 2PL (T1 holds A wants B, T2 holds B wants A). Handled by prevention (ordering locks, <b>wait-die</b> / <b>wound-wait</b> using timestamps), timeouts, or detection with a <b>wait-for graph</b> (cycle = deadlock; roll back a victim).</p>'+
'<h2>Multiple granularity locking</h2><p>Data is a tree: database → areas → files (tables) → records. Locking a node implicitly locks all its descendants. To do this safely, <b>intention locks</b> are placed on ancestors:</p>'+TBL(['Mode','Meaning'],[['IS (intention-shared)','explicit S locks will be taken lower down'],['IX (intention-exclusive)','explicit X (or S) locks lower down'],['S','this whole subtree is read'],['SIX','whole subtree read, and X locks lower down'],['X','whole subtree written']])+
TBL(['','IS','IX','S','SIX','X'],[['IS','✓','✓','✓','✓','✗'],['IX','✓','✓','✗','✗','✗'],['S','✓','✗','✓','✗','✗'],['SIX','✓','✗','✗','✗','✗'],['X','✗','✗','✗','✗','✗']],'c')+
'<p>Rules: lock the root first; to lock a node in S or IS the parent must be held in IX or IS; to lock in X, SIX or IX the parent must be held in IX or SIX; follow 2PL; unlock bottom-up. Fine granularity (records) = more concurrency, more overhead; coarse (table) = less overhead, less concurrency.</p>'+
'<h2>Practice</h2><ol class="practice">'+P('Why does 2PL ensure serializability but not freedom from cascading rollback?','Order transactions by their lock points; every conflicting pair is ordered the same way, so the precedence graph has no cycle. But a transaction may release an X lock in its shrinking phase before committing, so another can read its uncommitted data; if the first aborts, the second must roll back too. Strict 2PL fixes this.')+P('What are intention locks for?','To let a transaction lock a large unit (a table) while others lock small units (rows) inside it, without checking every row: an IX on the table says some rows below are being written, so an S request on the whole table is refused immediately.')+'</ol>';

var C56='<h2>Timestamp-ordering protocol</h2><p>Each transaction gets a unique timestamp TS(Ti) when it starts (older = smaller). Each item Q keeps <b>W-timestamp(Q)</b> (largest TS of any transaction that wrote Q) and <b>R-timestamp(Q)</b> (largest TS that read Q). Conflicting operations must run in timestamp order.</p>'+TBL(['Ti issues','Check','Action'],[['read(Q)','TS(Ti) &lt; W-ts(Q)','Ti would read an overwritten value: <b>reject, roll back Ti</b>'],['read(Q)','otherwise','execute; R-ts(Q) := max(R-ts(Q), TS(Ti))'],['write(Q)','TS(Ti) &lt; R-ts(Q)','a younger transaction already read Q: <b>roll back Ti</b>'],['write(Q)','TS(Ti) &lt; W-ts(Q)','Ti writes an obsolete value: <b>roll back Ti</b> (Thomas’ write rule: just ignore the write)'],['write(Q)','otherwise','execute; W-ts(Q) := TS(Ti)']])+
'<p>A rolled-back transaction restarts with a <b>new</b> timestamp. Guarantees conflict serializability (edges only go from older to younger) and is <b>deadlock-free</b> (no waiting), but may starve long transactions and may produce non-recoverable schedules unless writes are held until commit.</p>'+
'<h2>Validation-based (optimistic) protocol</h2><p>Assumes conflicts are rare, so no locking during execution. Each transaction runs in three phases:</p><ol class="steps"><li><b>Read (and execution) phase:</b> reads data into local variables and performs all writes on <b>local copies</b> only.</li><li><b>Validation phase:</b> checks whether its writes can be applied without violating serializability.</li><li><b>Write phase:</b> if validated, local updates are copied to the database; otherwise the transaction is rolled back and restarted.</li></ol><p>Timestamps: Start(Ti), Validation(Ti), Finish(Ti); TS(Ti) = Validation(Ti). <b>Validation test</b> for Tj: for every Ti with TS(Ti) &lt; TS(Tj), one must hold: (a) Finish(Ti) &lt; Start(Tj); or (b) Start(Tj) &lt; Finish(Ti) &lt; Validation(Tj) <b>and</b> the set of items written by Ti does not intersect the set read by Tj.</p>'+
'<h2>Multiversion schemes</h2><p>Each write creates a new <b>version</b> of the item, so reads never wait or fail. <b>Multiversion timestamp ordering</b>: a read by Ti returns the version with the largest write-timestamp ≤ TS(Ti); a write is rejected only if a younger transaction already read the version it would replace. <b>Multiversion 2PL</b>: update transactions use rigorous 2PL; read-only transactions read a consistent snapshot without locks.</p>'+
'<h2>Snapshot isolation</h2><p>Each transaction reads from a snapshot of the committed data as of its start, so reads never block. At commit, <b>first-committer-wins</b>: if another concurrent transaction already committed a write to an item this one wrote, abort. Used by Oracle and PostgreSQL. It prevents dirty reads, unrepeatable reads and lost updates but allows <b>write skew</b> (two transactions read overlapping data and write disjoint items, breaking a constraint), so it is not fully serializable.</p>'+
'<h2>Solved models</h2>'+
MODEL('1. Optimistic concurrency control and validation '+S('Self Q9'),'<div class="paper"><p><b>Idea.</b> Optimistic (validation-based) concurrency control lets transactions run without locks and checks for conflicts only at the end, because in most workloads conflicts are rare.</p><p><b>Phases:</b> write the read, validation and write phases above.</p><p><b>Validation test</b> (write the two conditions above). Condition (a): Ti finished before Tj started, so they are serial. Condition (b): Ti finished its writes before Tj began validating, and Tj never read anything Ti wrote, so Tj could not have seen a partial state of Ti.</p><p><b>How it ensures consistency:</b> the schedule produced is equivalent to the serial order of validation timestamps, so it is conflict serializable; writes are applied only after validation, so no other transaction sees uncommitted data and there are no cascading rollbacks; no locks, so no deadlocks.</p><p><b>Evaluation:</b> excellent for read-mostly workloads (high concurrency, no lock overhead); poor when conflicts are frequent, because work is wasted on rolled-back transactions and long transactions may starve.</p></div>')+
MODEL('2. Timestamp-ordering protocol '+S('Self Q10'),'<div class="paper"><p><b>Timestamps:</b> TS(Ti) assigned on entry (system clock or counter); TS(Ti) &lt; TS(Tj) means Ti is older and the schedule must be equivalent to Ti before Tj. Each item Q stores W-timestamp(Q) and R-timestamp(Q).</p><p><b>Rules:</b> write the read and write rules in the table above.</p><p><b>Conflict detection and resolution:</b> a conflict is detected when an operation arrives “too late” (a younger transaction has already read or written the item). It is resolved by rolling back the older transaction and restarting it with a new timestamp. <b>Thomas’ write rule</b> ignores an obsolete write instead of rolling back, allowing more (view-serializable) schedules.</p><p><b>Example:</b> TS(T1) = 5, TS(T2) = 10. T2 writes Q (W-ts = 10). T1 then tries read(Q): 5 &lt; 10, so T1 is rolled back.</p><p><b>Properties:</b> conflict serializable, deadlock-free; possible starvation; needs extra steps (e.g. delaying reads of uncommitted data) for recoverability.</p></div>');

/* ================= MODULE 6: NoSQL ================= */
var C61='<p><b>NoSQL</b> (“Not only SQL”) is an umbrella term for databases that do not follow the relational model: schema-free, distributed, built for very large data and very many users. They grew from internet-scale systems: Google BigTable (2003+), Amazon Dynamo, Hadoop/HBase, then Facebook, Netflix and others.</p>'+
TBL(['','RDBMS','NoSQL'],[['Data model','tables with a fixed schema','documents, key-value, column families, graphs'],['Schema','defined before data','flexible / schema-less'],['Scaling','vertical (bigger server)','horizontal (more servers, sharding)'],['Transactions','ACID','often BASE: Basically Available, Soft state, Eventually consistent'],['Joins','yes','usually avoided (data denormalized)'],['Query language','SQL','APIs or own languages (MongoDB query, CQL, Cypher)'],['Best for','structured data, complex queries, strong consistency','big data, high write rates, semi-structured data']])+
'<h2>CAP theorem</h2><p>In a distributed system you can fully guarantee at most <b>two</b> of three properties at one time:</p>'+TBL(['Property','Meaning'],[['<b>C</b>onsistency','every client sees the same, latest data'],['<b>A</b>vailability','every request gets a response (read and write always possible)'],['<b>P</b>artition tolerance','the system keeps working when the network splits it into parts']])+
'<p>Networks do partition, so in practice the choice is between <b>CP</b> (stay consistent, refuse some requests during a partition: HBase, MongoDB with majority writes) and <b>AP</b> (stay available, allow temporary inconsistency, reconcile later: Cassandra, DynamoDB). <b>CA</b> systems (single-site RDBMS) give up partition tolerance. The choice is not binary: AP systems still offer some consistency, CP systems are still mostly available.</p>'+
'<h2>Practice</h2><ol class="practice">'+P('State the CAP theorem.','A distributed data store can provide at most two of Consistency, Availability and Partition tolerance simultaneously. Since partitions are unavoidable, systems choose between consistency (CP) and availability (AP) during a partition.')+P('What is BASE?','Basically Available, Soft state, Eventually consistent: the NoSQL alternative to ACID. The system always answers, its state may change without input as replicas sync, and all replicas become consistent if no new updates arrive.')+'</ol>';

var C62='<h2>Document databases</h2><p>Store data as <b>documents</b> (JSON, BSON, XML): self-describing sets of key-value pairs that can nest objects and arrays. Documents are grouped into <b>collections</b>; documents in one collection need not have the same fields. Retrieved by key or by content. Examples: <b>MongoDB</b>, CouchDB.</p>'+
CODE('// collection: books (from the teacher\'s Online Bookstore example)\n{ "ISBN": "B101", "Title": "Database Management Systems", "Author": "Raj", "Price": 500, "Genre": "Education" }\n{ "ISBN": "B102", "Title": "Operating Systems", "Author": "Kumar", "Price": 450,\n  "Publisher": "ABC Publications", "Tags": ["OS", "Programming"] }\n\ndb.books.find({ Price: { $lt: 480 } })\ndb.books.insertOne({ ISBN: "B103", Title: "Python", Price: 600 })')+
'<p>Advantages: flexible schema, nested data needs no joins, natural mapping to objects, horizontal scaling. Limitations: duplicated data, complex relationships are awkward, large document updates are costly. Uses: e-commerce catalogues, content management, mobile apps, user profiles.</p>'+
'<h2>Key-value stores</h2><p>The simplest model: a big <b>hash map</b> from a unique key to an opaque value. Operations: put(key, value), get(key), delete(key). Extremely fast and easy to partition. No queries on the value’s contents. Examples: <b>Redis</b>, Amazon DynamoDB, Riak, Voldemort, Memcached. Uses: caching, session stores, shopping carts, leaderboards.</p>'+CODE('SET session:9f2a "{user: 101, cart: [B101, B102]}"\nGET session:9f2a')+
'<h2>Practice</h2><ol class="practice">'+P('Document store vs key-value store.','Both are keyed. A key-value store treats the value as opaque and only supports get/put by key. A document store understands the document’s structure, so it can index fields and query by content (find books with Price &lt; 500).')+'</ol>';

var C63='<h2>Column-family (wide-column) stores</h2><p>Data is organised by <b>row key</b> into <b>column families</b>: groups of related columns stored together. Different rows can have different columns. Designed for huge, distributed, write-heavy data. Examples: <b>Apache Cassandra</b>, HBase, Google BigTable.</p>'+
CODE('Customer_Orders\n  Row key C101 -> Personal_Info: { Name = Arun }\n                 Order_Info:    { Order_ID = O101, Book = DBMS, Amount = 1000 }\n  Row key C102 -> Personal_Info: { Name = Priya }\n                 Order_Info:    { Order_ID = O102, Book = Operating Systems, Amount = 450 }')+
'<p><b>Column stores</b> (the slides’ row-store vs column-store comparison): storing each column separately means a query that reads 3 of 20 attributes reads only those columns, and similar values compress well. Row stores are better for inserting/updating whole records (OLTP); column stores for read-heavy analytics.</p>'+
'<h2>Graph databases</h2><p>Store <b>nodes</b> (entities), <b>edges</b> (relationships) and <b>properties</b> on both; nodes and edges can be labelled. Relationship traversal is direct (no joins), so queries like “friends of friends who like X” are fast. Examples: <b>Neo4j</b>, Amazon Neptune. Query language: Cypher.</p>'+CODE("MATCH (a:Person {name:'Asha'})-[:FRIEND]->(f)-[:FRIEND]->(fof)\nWHERE fof <> a RETURN DISTINCT fof.name;")+
'<h2>Comparison</h2>'+TBL(['','Key-value','Document','Column-family','Graph'],[['Unit of data','key → opaque value','document (JSON/BSON)','row key → column families','nodes, edges, properties'],['Schema','none','flexible per document','flexible columns per row','flexible properties'],['Query by','key only','key and document fields','row key, column ranges','graph traversal / patterns'],['Strength','speed, simplicity','rich nested records','massive scale, writes, analytics','connected data'],['Weakness','no content queries','cross-document relations','modelling by query pattern, no joins','hard to shard, not for bulk aggregates'],['Examples','Redis, DynamoDB','MongoDB, CouchDB','Cassandra, HBase','Neo4j'],['Typical use','cache, sessions','catalogues, CMS, profiles','IoT, logs, time series, messaging','social networks, recommendations, fraud']])+
'<h2>Solved models</h2>'+
MODEL('1. Architectural differences among key-value, document, column-family and graph databases '+S('Self Q3')+S('Apr26 Q24'),'<div class="paper"><p>For each type state the <b>data model, organisation, access method</b> and an example, then give the comparison table above.</p><p><b>Key-value:</b> a distributed hash table; data partitioned by hashing the key over nodes (consistent hashing), replicated; value is a blob. <b>Document:</b> collections of JSON/BSON documents with secondary indexes on fields; sharded by a shard key; nested documents replace joins. <b>Column-family:</b> sparse, distributed, sorted maps (row key → column family → column → timestamped value); writes go to a commit log and memtable, flushed to immutable SSTables; partitioned by row key across a ring (Cassandra) or regions (HBase). <b>Graph:</b> nodes and edges stored with direct pointers to neighbours (index-free adjacency), so traversals cost per edge, not per table size.</p></div>')+
MODEL('2. Which NoSQL type for a large social network? '+S('Self Q4'),'<div class="paper"><p>A social network needs: user profiles, posts and comments, a news feed, friend/follow relationships and recommendations, sessions, at very large scale.</p><p><b>Graph DB</b> (Neo4j): best for the friendship graph: mutual friends, “people you may know”, shortest paths; poor at storing billions of posts.<br><b>Document DB</b> (MongoDB): best for profiles and posts with nested comments, likes and media metadata; flexible as features change.<br><b>Column-family</b> (Cassandra): best for the timeline/news feed and messaging: huge write volume, rows keyed by user and time-ordered columns, always available (AP).<br><b>Key-value</b> (Redis): best for sessions, caching hot feeds, counters (likes), online presence.</p><p><b>Conclusion:</b> no single model fits everything; large platforms use <b>polyglot persistence</b>: graph for relationships, column-family for feeds, document for content, key-value for caching. If one must be chosen, a graph DB for the core social graph plus a column-family store for the feed.</p></div>')+
MODEL('3. Distributed and spatial databases '+S('Self Q13'),'<div class="paper"><p><b>(i) Distributed databases.</b> A single logical database whose data is stored at several sites connected by a network; each site has its own DBMS and can run local and global transactions. <b>Features:</b> fragmentation (horizontal/vertical) and replication, distribution transparency, distributed query processing, distributed transactions with <b>two-phase commit (2PC)</b>, distributed concurrency control and deadlock detection. Homogeneous (same DBMS everywhere) or heterogeneous. <b>Capabilities:</b> local autonomy, availability (a site failure does not stop others), faster local access, scalability. <b>Drawbacks:</b> complex, costly coordination, CAP trade-offs. <b>Suited for:</b> banks with branches, airline reservations, multinational companies, cloud services.</p><p><b>(ii) Spatial databases.</b> Store and query <b>spatial data</b>: points, lines, polygons, regions in 2D/3D, with geographic or geometric coordinates. <b>Features:</b> spatial data types (POINT, LINESTRING, POLYGON), spatial operators (contains, intersects, within distance, nearest neighbour), spatial indexes (<b>R-tree</b>, quadtree, k-d tree, grid files). Examples: PostGIS, Oracle Spatial. <b>Suited for:</b> GIS and maps, navigation and ride-hailing (nearest driver), urban planning, location-based services, CAD.</p></div>');

/* ===== B-tree (not B+): order m = at most m − 1 keys and m children. On overflow (m keys) the key at index ⌊(m−1)/2⌋
   moves up and is NOT kept below; left gets the keys before it, right the keys after. This is the split used in the
   end-sem answer layout (order 4: [5 10 15 25] sends 10 up). ===== */
function btInsert(root,k,m,log){
  function ins(N){
    var i=0;while(i<N.keys.length&&k>N.keys[i])i++;
    if(N.keys[i]===k){log.push(k+' is already in the tree.');return null}
    if(N.leaf)N.keys.splice(i,0,k);
    else{var r=ins(N.kids[i]);if(!r)return null;N.keys.splice(i,0,r.key);N.kids.splice(i+1,0,r.right)}
    if(N.keys.length<=m-1){if(N.leaf)log.push(k+' goes into the node ['+N.keys.join(', ')+']. No split.');else log.push('The parent takes the key: ['+N.keys.join(', ')+'].');return null}
    var mid=Math.floor((m-1)/2),up=N.keys[mid],R={leaf:N.leaf,keys:N.keys.slice(mid+1),kids:N.leaf?[]:N.kids.slice(mid+1)};
    log.push('['+N.keys.join(', ')+'] has '+m+' keys (max '+(m-1)+'), so split: ['+N.keys.slice(0,mid).join(', ')+'] | '+up+' | ['+R.keys.join(', ')+']. '+up+' moves up.');
    N.keys=N.keys.slice(0,mid);if(!N.leaf)N.kids=N.kids.slice(0,mid+1);
    return {key:up,right:R};
  }
  var r=ins(root);
  if(r){log.push('The root split, so '+r.key+' becomes the new root. The tree grows one level.');return {leaf:false,keys:[r.key],kids:[root,r.right]}}
  return root;
}
function mkBt(el){
  var m=+el.dataset.n,keys=el.dataset.keys.trim().split(/[\s,]+/).map(Number),then=(el.dataset.then||'').trim().split(/\s+/).filter(Boolean),steps=[],T=bpNew(true);
  keys.forEach(function(k){var log=[];T=btInsert(T,k,m,log);steps.push({t:'Insert '+k,log:log,tree:bpClone(T),hi:k})});
  then.forEach(function(op){var k=+op.replace('+',''),log=[];T=btInsert(T,k,m,log);steps.push({t:'Then insert '+k,log:log,tree:bpClone(T),hi:k})});
  var i=steps.length-1;
  function draw(){var s=steps[i];el.innerHTML='<div class="row"><button data-a="0">⏮</button><button data-a="-1">◀ Prev</button><span class="log" style="margin:0">Step '+(i+1)+' of '+steps.length+'</span><button data-a="1">Next ▶</button><button data-a="9">⏭</button></div><p style="margin:8px 0 4px"><b>'+s.t+'</b></p><div class="log" style="margin:0 0 6px">'+s.log.map(esc).join('<br>')+'</div><div class="scroll">'+bpSVG(s.tree,s.hi,1)+'</div>'}
  el.addEventListener('click',function(e){var b=e.target.closest('button[data-a]');if(!b)return;var a=+b.dataset.a;i=a===0?0:a===9?steps.length-1:Math.max(0,Math.min(steps.length-1,i+a));draw()});
  draw();
}
WIDGETS['.btw']=mkBt;
function BTW(cap,m,keys,then){return '<div class="w"><div class="cap">'+cap+'</div><div class="btw" data-n="'+m+'" data-keys="'+keys+'"'+(then?' data-then="'+then+'"':'')+'></div></div>'}

ES('2.6',['Apr26 Q19','Nov25 Q12'],MODEL('Item, Po and Supplier queries '+S('Apr26 Q19'),'<div class="paper"><p><b>Step 1: turn the relationships into tables</b> (this earns marks). Supplier 1 : N Po, so Po gets S_no. Item–Po carries cost and quantity, so it becomes its own table Po_Item.</p><p>Item(<u>I_no</u>, I_name, I_qty), Supplier(<u>S_no</u>, S_name, S_addr), Po(<u>P_no</u>, P_date, S_no FK), Po_Item(<u>P_no</u> FK, <u>I_no</u> FK, cost, qty)</p>'+CODE("-- I\nINSERT INTO Item (I_no, I_name, I_qty) VALUES (101, 'mouse', 50);\n\n-- II\nSELECT DISTINCT s.S_name FROM Supplier s\nJOIN Po p ON s.S_no = p.S_no JOIN Po_Item pi ON p.P_no = pi.P_no JOIN Item i ON pi.I_no = i.I_no\nWHERE i.I_name = 'mouse';\n\n-- III\nSELECT s.S_name, i.I_name FROM Supplier s\nJOIN Po p ON s.S_no = p.S_no JOIN Po_Item pi ON p.P_no = pi.P_no JOIN Item i ON pi.I_no = i.I_no\nWHERE p.P_date = TO_DATE('30-SEP-2009', 'DD-MON-YYYY');\n\n-- IV\nSELECT s.S_name FROM Supplier s\nJOIN Po p ON s.S_no = p.S_no JOIN Po_Item pi ON p.P_no = pi.P_no JOIN Item i ON pi.I_no = i.I_no\nWHERE i.I_name = 'monitor'\n  AND pi.cost = (SELECT MIN(pi2.cost) FROM Po_Item pi2 JOIN Item i2 ON pi2.I_no = i2.I_no\n                 WHERE i2.I_name = 'monitor');\n\n-- V  (amount of a Po = SUM(qty * cost))\nSELECT p.P_no, p.P_date, s.S_name FROM Po p\nJOIN Supplier s ON p.S_no = s.S_no JOIN Po_Item pi ON p.P_no = pi.P_no\nGROUP BY p.P_no, p.P_date, s.S_name\nHAVING SUM(pi.qty * pi.cost) = (SELECT MAX(SUM(qty * cost)) FROM Po_Item GROUP BY P_no);\n\n-- VI\nSELECT p.P_no, p.P_date, s.S_name, i.I_name, pi.qty, pi.cost AS rate FROM Po p\nJOIN Supplier s ON p.S_no = s.S_no JOIN Po_Item pi ON p.P_no = pi.P_no JOIN Item i ON pi.I_no = i.I_no\nORDER BY p.P_no;")+'<p class="pn">Marks idea (12): table design 2, each query about 1.5. MAX(SUM(...)) with GROUP BY is Oracle; in MySQL use ORDER BY SUM(...) DESC LIMIT 1.</p></div>')+
'<p>Nov25 Q12 (INNER vs OUTER JOIN, 3 marks) is in the practice list above.</p>');

ES('2.9',['Nov25 Q18b','Jun25 Q19b'],MODEL('Trigger that sets RegDate on insert '+S('Nov25 Q18b'),'<div class="paper"><p>A trigger is a stored block that runs automatically when an event (INSERT, UPDATE, DELETE) happens on a table. Parts: <b>event</b>, <b>timing</b> (BEFORE/AFTER), <b>action</b>. Uses: filling default values, checking rules, auditing.</p><p>We need the date filled in <i>before</i> the row is stored, so a BEFORE INSERT row trigger.</p>'+CODE("-- Oracle\nCREATE OR REPLACE TRIGGER trg_set_regdate\nBEFORE INSERT ON Student\nFOR EACH ROW\nBEGIN\n  :NEW.RegDate := SYSDATE;\nEND;\n/\n\n-- MySQL\nCREATE TRIGGER trg_set_regdate BEFORE INSERT ON Student\nFOR EACH ROW SET NEW.RegDate = CURDATE();")+'<p><b>Working:</b> <code>INSERT INTO Student (StudentID, Name, Course) VALUES (4, \'Divya\', \'BCA\');</code> The trigger fires before the row is written and fills RegDate, so the row is stored as (4, Divya, BCA, today’s date).</p></div>')+'<p>Jun25 Q19b (before vs after triggers, 4 marks) is model 4 above.</p>');

ES('3.4',['Jun25 Q13'],MODEL('Minimum number of tables for the ER diagram '+S('Jun25 Q13'),'<div class="paper"><p>Read the diagram: M (key M1) takes part in R1 with a <b>double line</b> (total) and R1 has an <b>arrow to P</b>, so R1 is many-to-one from M to P. N is a <b>weak entity</b> (double rectangle, partial key N1) identified by P through the identifying relationship R2 (double diamond, arrow to P).</p><p>R1 is many-to-one with total participation of M, so it needs no table: put P1 into M as a foreign key. R2 is the identifying relationship of a weak entity, so it is absorbed into N.</p><p>M(<u>M1</u>, M2, M3, P1 FK)<br>P(<u>P1</u>, P2)<br>N(<u>P1</u> FK, <u>N1</u>, N2)</p><p><b>Minimum number of tables = 3.</b></p></div>'));

ES('3.6',['Nov25 Q19b, Q5, Q13','Apr26 Q20b, Q6','Jun25 Q21'],
MODEL('Normalize the table to 3NF '+S('Nov25 Q19b'),'<div class="paper"><p><b>FDs:</b> EmpID → EmpName, Dept, Salary; Dept → DeptHead. So EmpID → Dept → DeptHead is transitive. Projects holds more than one value in a cell.</p><p><b>1NF</b> (one value per cell): split “Alpha, Beta” into two rows; the key becomes (EmpID, Project).</p>'+TBL(['EmpID','EmpName','Dept','DeptHead','Project','Salary'],[['201','John','CS','Alice','Alpha','5000'],['201','John','CS','Alice','Beta','5000'],['202','Mary','CS','Alice','Beta','5500'],['203','Steve','IT','Bob','Gamma','6000'],['204','John','CS','Alice','Alpha','5000']])+'<p><b>2NF</b> (no partial dependency): EmpName, Dept, DeptHead, Salary depend on EmpID alone, part of the key. Split: EMPLOYEE(<u>EmpID</u>, EmpName, Dept, DeptHead, Salary) and EMP_PROJECT(<u>EmpID</u>, <u>Project</u>).</p><p><b>3NF</b> (no transitive dependency): in EMPLOYEE, Dept → DeptHead. Move it out.</p><div class="split"><div style="flex:1 1 220px">'+TBL(['EmpID','EmpName','Dept','Salary'],[['201','John','CS','5000'],['202','Mary','CS','5500'],['203','Steve','IT','6000'],['204','John','CS','5000']])+'</div><div style="flex:0 1 160px">'+TBL(['Dept','DeptHead'],[['CS','Alice'],['IT','Bob']])+'</div><div style="flex:0 1 160px">'+TBL(['EmpID','Project'],[['201','Alpha'],['201','Beta'],['202','Beta'],['203','Gamma'],['204','Alpha']])+'</div></div><p>EMPLOYEE(<u>EmpID</u>, EmpName, Dept FK, Salary), DEPARTMENT(<u>Dept</u>, DeptHead), EMP_PROJECT(<u>EmpID</u>, <u>Project</u>). DeptHead is now stored once per department.</p></div>'+FDT('Check it: the FDs of the original (1NF) table','EmpID EmpName Dept DeptHead Project Salary','EmpID->EmpName, EmpID->Dept, EmpID->Salary, Dept->DeptHead',''))+
MODEL('BCNF and how it differs from 3NF '+S('Apr26 Q20b'),'<div class="paper"><p>A relation is in <b>BCNF</b> if for every non-trivial FD X → Y, X is a superkey. It is a stronger form of 3NF.</p>'+TBL(['Point','3NF','BCNF'],[['Rule','for X → Y: X is a superkey <b>or</b> Y is prime','for X → Y: X must be a superkey (no exception)'],['Strength','weaker','stronger: every BCNF table is in 3NF, not the reverse'],['Redundancy','a little may remain','almost none (from FDs)'],['Dependency preservation','always possible','not always possible']])+'<p><b>Example in 3NF but not BCNF:</b> Teaching(Student, Course, Teacher) with (Student, Course) → Teacher and Teacher → Course (each teacher teaches one course). Key (Student, Course). Teacher → Course: Teacher is not a superkey, but Course is prime, so 3NF holds and BCNF fails. Decompose into (Teacher, Course) and (Student, Teacher).</p></div>')+
PRAC(P(S('Apr26 Q6')+'Reasons for normalization.','Remove redundant data, avoid insertion, deletion and update anomalies, keep data consistent, save storage, and make the design easier to maintain.')+
P(S('Nov25 Q5')+'Define 1NF and 2NF simply.','1NF: every cell holds one atomic value, no repeating groups. 2NF: in 1NF, and every non-key column depends on the whole key, not part of it.')+
P(S('Nov25 Q13')+'Three types of anomalies with examples (3 marks).','Table Student(RollNo, Name, Dept, HOD) with HOD repeated per student. <b>Insertion:</b> a new department with no students cannot be stored (RollNo cannot be NULL). <b>Deletion:</b> deleting the last ECE student also loses who heads ECE. <b>Update:</b> changing the CSE head means changing every CSE row; missing one leaves inconsistent data.'))+
'<p>Jun25 Q21 (12 marks) is model 1 above (1NF to BCNF with benefits and trade-offs).</p>');

ES('4.1',['Apr26 Q21b','Nov25 Q7'],MODEL('RAID and its levels '+S('Apr26 Q21b'),'<div class="paper"><p><b>RAID</b> (Redundant Array of Independent Disks) uses several disks as one: <b>striping</b> spreads blocks over disks so they are read in parallel (speed); <b>mirroring</b> or <b>parity</b> keeps redundant data so a failed disk can be rebuilt (safety).</p>'+TBL(['Level','Technique','Survives','Note'],[['RAID 0','striping only','no failure','fastest, no safety'],['RAID 1','mirroring','one disk','50% usable space'],['RAID 5','striping + parity spread over all disks','one disk','good balance; slower writes'],['RAID 6','striping + two parity blocks','two disks','large arrays'],['RAID 10','mirrored pairs, striped','one per pair','fast and safe, costly']])+'<p>Draw RAID 0 (A1 A3 | A2 A4), RAID 1 (A1 A2 | A1 A2) and RAID 5 (A1 B1 Cp | A2 Bp C1 | Ap B2 C2).</p></div>')+PRAC(P(S('Nov25 Q7')+'Why is RAID used in DBMS?','To make storage faster (striping: read from many disks in parallel) and safer (mirroring or parity: data survives a disk failure).')));

ES('4.2',['Nov25 Q23a, Q23b','Apr26 Q22b','Jun25 Q22'],
MODEL('File organization for a large e-commerce platform '+S('Nov25 Q23a'),'<div class="paper">'+TBL(['Method','Access speed','Insert / delete','Storage use','Best e-commerce scenario'],[['Heap','slow search (full scan)','very fast insert; deletes leave gaps','good, gaps later','click logs, audit logs (append-only)'],['Sequential (sorted)','fast range and ordered reads','slow (keep order, overflow blocks)','good','daily sales reports, order history by date'],['Hash','fastest equality look-up (≈1 block)','fast; overflow slows it','may waste space','product page by ProductID, cart by session ID'],['B+ tree indexed','fast equality and range','moderate (index updates)','extra space for index','search by price range, name, category'],['Clustered (multitable)','fast joins','slower inserts','good','an order stored with its order items']])+'<p><b>Conclusion:</b> no single method is best; a large platform mixes them, with B+ tree indexes as the main tool.</p></div>')+
MODEL('Organize the instructor records '+S('Nov25 Q23b'),'<div class="paper"><p><b>(a) Sequential order by InstructorID</b></p>'+TBL(['InstructorID','Name','Dept','Salary'],[['101','Alice','Comp. Sci.','60000'],['102','Bob','IT','55000'],['103','Charlie','Comp. Sci.','62000'],['104','David','History','58000'],['105','Eva','Finance','70000'],['106','Frank','Biology','72000'],['107','Grace','Elec. Eng.','68000'],['108','Helen','Music','50000']])+'<p><b>(b) Hash, h(ID) = ID mod 5</b> (taking the records in the given order):</p>'+TBL(['ID','ID mod 5'],[['105','0'],['101','1'],['108','3'],['104','4'],['103','3'],['107','2'],['102','2'],['106','1']])+TBL(['Bucket','Records'],[['0','105 Eva'],['1','101 Alice, 106 Frank'],['2','107 Grace, 102 Bob'],['3','108 Helen, 103 Charlie'],['4','104 David']])+'<p>To find 107: 107 mod 5 = 2, read bucket 2 only. Sequential suits range queries (IDs 101–105); hashing suits exact look-ups.</p></div>')+
'<p>Apr26 Q22b and Jun25 Q22 are model 2 above (file organization types).</p>');

ES('4.3',['Apr26 Q21a, Q7','Nov25 Q8'],
MODEL('Indexing for searches on a non-key attribute '+S('Apr26 Q21a'),'<div class="paper"><p><b>Choice: a secondary (non-clustering) index on that attribute, built as a B+ tree.</b></p><p>The file is sorted on its primary key, so the primary index cannot help a search on, say, Dept. A secondary index is a separate sorted structure: each value of the attribute with pointers to all records having it. Values repeat, so each entry points to a <b>bucket of record pointers</b>.</p>'+TBL(['Index on Dept','→ records (RollNo)'],[['CSE','1, 3, 5'],['ECE','2, 6'],['MECH','4']])+TBL(['Technique','Non-key search?','Remark'],[['No index','yes, slow','full scan, O(n) blocks'],['Primary index','no','only on the sort key'],['Clustering index','only if the file is sorted on it','a file has one sort order'],['<b>Secondary B+ tree index</b>','yes','O(log n), equality and range'],['Hash index','equality only','no range queries']])+'<p><b>Justification:</b> search falls from a full scan to a few block reads; duplicates handled by buckets; ranges (Marks &gt; 70) work; several secondary indexes can coexist. <b>Cost:</b> extra space and slower INSERT/UPDATE/DELETE, so index only columns searched often.</p></div>')+
PRAC(P(S('Apr26 Q7')+'Dense vs sparse index.','Dense: one entry for every search-key value; faster search, more space. Sparse: entries for only some values (one per block); less space, slightly slower; only possible when the file is sorted on that key.')+
P(S('Nov25 Q8')+'Purpose of ordered indexing.','Index entries are kept sorted on the search key, so a record is found quickly (binary search or a tree) and range queries can scan entries in order.')));

ES('4.4',['Jun25 Q23a, Q23b'],MODEL('B+ tree of order 4 for 5, 10, …, 50 '+S('Jun25 Q23b'),BPT('Step through the ten insertions','4','5 10 15 20 25 30 35 40 45 50')+'<div class="paper"><p>Order 4: at most 3 keys in a leaf; on overflow keep the first 2, copy the first key of the new leaf up. Splits happen at 20 (copy 15), 30 (copy 25), 40 (copy 35; root [15 25 35] full), 50 (copy 45; the root would have 5 pointers, so it splits and 35 moves up).</p><p><b>Final:</b> root [35]; internal [15 25] and [45]; leaves [5 10] → [15 20] → [25 30] → [35 40] → [45 50].</p></div>')+'<p>Jun25 Q23a (characteristics and advantages, 8 marks) is model 2 above.</p>');

ES('4.5',['Nov25 Q14, Q20b','Jun25 Q7'],
MODEL('B-tree of order 3: 10, 20, 5, 6, 12, then 15 '+S('Nov25 Q14'),BTW('B-tree, order 3 (max 2 keys per node)','3','10 20 5 6 12','+15')+'<div class="paper"><p>Insert 10, 20: [10 20]. Insert 5: [5 10 20] overflows, 10 moves up: root [10], children [5] [20]. Insert 6: [5 6]. Insert 12: [12 20]. Insert 15: [12 15 20] overflows, 15 moves up: root [10 15], children [5 6] [12] [20].</p></div>')+
MODEL('B-tree of order 4: 15, 25, 5, 10, 20, 30, then 12, then 18 '+S('Nov25 Q20b'),BTW('B-tree, order 4 (max 3 keys per node)','4','15 25 5 10 20 30','+12 +18')+'<div class="paper"><p>15, 25, 5 → [5 15 25]. 10 → [5 10 15 25] overflows; 10 moves up: [10] / [5] [15 25]. 20 → [15 20 25]. 30 → [15 20 25 30] overflows; 20 moves up: [10 20] / [5] [15] [25 30]. <b>Insert 12</b> → [12 15], no split. <b>Insert 18</b> → [12 15 18], 3 keys, no split. Final: root [10 20]; children [5] [12 15 18] [25 30].</p><p><b>Why B-trees stay balanced:</b> all leaves are at the same level; the tree grows only at the top (a root split adds a level to every path at once); every non-root node stays at least half full.</p><p><b>Effect of the order:</b> order m allows at most m − 1 keys and m children per node (order 4: 3 keys; order 3: 2 keys). A larger order means more keys per node, a shorter tree and fewer disk reads per search.</p><p class="pn">With an even order the split point is a choice; this follows the layout used in your answer book (the 2nd key of 4 goes up). Say which rule you use.</p></div>')+
PRAC(P(S('Jun25 Q7')+'B-tree vs B+ tree index.','B-tree: each key stored once, in internal nodes or leaves, with record pointers everywhere; leaves not linked. B+ tree: all keys and record pointers in the leaves, internal keys are only separators, and leaves are linked for range scans.')));

ES('4.6',['Nov25 Q20a','Apr26 Q22a','Jun25 Q14'],MODEL('Static vs dynamic hashing, and fixing overflow chains '+S('Nov25 Q20a')+S('Apr26 Q22a')+S('Jun25 Q14'),'<div class="paper"><p><b>(i) Comparison</b></p>'+TBL(['Point','Static hashing','Dynamic (extendible) hashing'],[['Buckets','fixed number, decided at the start','grow and shrink with the data'],['Performance','fast at first; slows as overflow chains grow','stays about one directory look-up + one bucket read'],['Scalability','poor: adding buckets needs a full rehash','good: only the full bucket splits'],['Space','wasted if too many buckets, overflow if too few','used as needed; small directory overhead'],['Example','h(K) = K mod 4 forever','extendible or linear hashing']])+'<p><b>(ii) Suggested technique: extendible hashing.</b> With h(K) = K mod 4, keys 4, 8, 12, 16 all go to bucket 0 and form a long chain. Extendible hashing splits a full bucket instead of chaining, rehashes only that bucket, and doubles the directory only when needed.</p><p><b>Example</b> (bucket size 2, use the last bits of the key):</p>'+TBL(['Step','Directory','Buckets'],[['keys 1, 2, 3, 4; global depth 1','0 → A, 1 → B','A [2, 4] (local 1), B [1, 3] (local 1)'],['insert 6 (110): last bit 0 → A, which is full and local depth = global depth, so double the directory','00 → A1, 10 → A2, 01 and 11 → B','A1 [4] (local 2), A2 [2, 6] (local 2), B [1, 3] (local 1)']])+'<p>Only bucket A split; B is untouched and no overflow chain was created.</p></div>'));

ES('5.1',['Apr26 Q14, Q23b','Nov25 Q15, Q9'],MODEL('ACID with a bank transfer '+S('Apr26 Q14')+S('Apr26 Q23b')+S('Nov25 Q15'),'<div class="paper"><p>Transfer ₹500 from A (1000) to B (2000): read(A); A := A − 500; write(A); read(B); B := B + 500; write(B).</p>'+TBL(['Property','Meaning','In the transfer'],[['Atomicity','all steps or none','a crash after write(A) is rolled back, so ₹500 is not lost'],['Consistency','a correct state to a correct state','A + B = 3000 before and after'],['Isolation','concurrent transactions do not see partial work','another transaction sees A = 1000 or 500 together with the matching B, never A debited but B not credited'],['Durability','after commit, the change survives crashes','after commit, A = 500 and B = 2500 even after a power failure (log)']])+'<p class="pn">3 marks: the four meanings with the one example. 4 marks (an example for each): the full table.</p></div>')+PRAC(P(S('Nov25 Q9')+'What is a transaction? Example.','A group of operations executed as one logical unit, all or nothing. Example: transferring ₹500 from account A to account B (debit A, credit B).')));

ES('5.2',['Jun25 Q8'],PRAC(P(S('Jun25 Q8')+'Main goal of implementing atomicity.','That a transaction’s changes are either all applied or none: if it fails midway, its partial updates are undone (using the log) so the database never stays half-updated.')));

ES('5.3',['Nov25 Q21a, Q21b','Apr26 Q8'],
MODEL('What serializability is, with an example '+S('Nov25 Q21a'),'<div class="paper"><p>A <b>serial schedule</b> runs transactions one after another: always correct, but slow. Interleaving is faster but can corrupt data. A schedule is <b>serializable</b> if its effect equals that of some serial schedule. Types: <b>conflict serializability</b> (tested with a precedence graph) and <b>view serializability</b>.</p><p><b>Example:</b> A = 5. T1: A := A + 10. T2: A := A × 2. Serial T1;T2 gives 30, T2;T1 gives 20. An interleaving that ends with 30 or 20 is acceptable; if both read A = 5 and then both write, the result is 15 or 10 (a lost update): not serializable.</p></div>')+
MODEL('T1 and T2 each Read(A), Write(A): interleave and test '+S('Nov25 Q21b'),SER('The interleaved schedule','r1(A) r2(A) w1(A) w2(A)')+'<div class="paper"><p><b>Schedule S:</b> R1(A), R2(A), W1(A), W2(A).</p><p><b>Conflicts:</b> R2(A) before W1(A): T2 → T1. R1(A) before W2(A): T1 → T2. W1(A) before W2(A): T1 → T2.</p><p><b>Precedence graph</b> has T1 → T2 and T2 → T1: a <b>cycle</b>, so S is <b>not conflict serializable</b> (T1’s update is lost).</p><p><b>Equivalent serial schedules</b> to use instead: T1 then T2: R1(A) W1(A) R2(A) W2(A), or T2 then T1: R2(A) W2(A) R1(A) W1(A). Each has a single edge and no cycle.</p></div>')+
PRAC(P(S('Apr26 Q8')+'Define serializability.','A concurrent schedule is serializable if its result is equivalent to some serial execution of the same transactions.')));

ES('5.5',['Apr26 Q23a, Q9, Q15','Jun25 Q9, Q15'],
MODEL('Working of two-phase locking on a schedule '+S('Apr26 Q23a'),'<div class="paper"><p>2PL makes schedules conflict serializable. Operations: lock-S(Q) (read), lock-X(Q) (read and write), unlock(Q). <b>Growing phase:</b> may get locks, never release. <b>Shrinking phase:</b> may release, never get. The moment of the last lock is the <b>lock point</b>; transactions are serialized in lock-point order.</p><p>T1: A := A − 100, B := B + 100. T2: reads A.</p>'+TBL(['Step','T1','T2','Remark'],[['1','lock-X(A)','','growing'],['2','read(A); A := A − 100; write(A)','',''],['3','','lock-S(A)','denied: T1 holds X on A, T2 waits'],['4','lock-X(B)','','lock point'],['5','read(B); B := B + 100; write(B)','',''],['6','unlock(A)','','shrinking: T1 may not lock again'],['7','unlock(B)','lock-S(A) granted',''],['8','','read(A); unlock(A)','T2 sees the final A']])+'<p>Result: same as T1 then T2. Variants: <b>strict 2PL</b> (keep X locks until commit, no cascading rollback), <b>rigorous 2PL</b> (all locks until commit). Limitation: deadlocks are possible (detect with a wait-for graph or use timeouts).</p></div>')+
MODEL('Shared lock vs exclusive lock '+S('Apr26 Q15')+S('Jun25 Q15'),'<div class="paper">'+TBL(['Point','Shared (S)','Exclusive (X)'],[['Used for','reading','reading and writing'],['Holders','many transactions at once','only one transaction'],['Compatible with','S','nothing'],['Concurrency','high','low'],['Risk','low','waiting and possible deadlock'],['Command','lock-S(A)','lock-X(A)']])+'</div>')+
PRAC(P(S('Apr26 Q9')+'State the 2PL protocol.','Each transaction first only acquires locks (growing phase) and then only releases them (shrinking phase); after its first unlock it may not lock again.')+P(S('Jun25 Q9')+'Two phases of 2PL.','Growing phase and shrinking phase.')));

ES('6.1',['Nov25 Q24a, Q24b','Jun25 Q10, Q16'],
MODEL('CAP theorem '+S('Nov25 Q24a'),'<div class="paper"><p>A distributed data store can guarantee at most two of: <b>Consistency</b> (every user sees the same latest data), <b>Availability</b> (every request gets a response) and <b>Partition tolerance</b> (it keeps working when the network splits). Partitions do happen, so P is required and the real choice during a partition is <b>C or A</b>.</p>'+TBL(['Choice','Behaviour','Examples'],[['CP','stays correct, may refuse requests','HBase, MongoDB (majority), banking systems'],['AP','always answers, data may be briefly stale (eventual consistency)','Cassandra, DynamoDB'],['CA','only without partitions','a single-node RDBMS']])+'<p>Draw a triangle with C, A, P at the corners and CP, AP, CA on the sides.</p></div>')+
MODEL('Google Drive and CAP '+S('Nov25 Q24b'),'<div class="paper"><p><b>Google Drive prioritizes Availability and Partition tolerance (AP)</b>, with eventual consistency.</p><p><b>Reasoning:</b> (1) data and users are spread across many data centres, so network partitions must be tolerated (P); (2) users expect to open, upload and edit files at any time, even if one data centre is slow or cut off, so it chooses availability (A); (3) to stay available it lets replicas differ briefly and syncs them later.</p><p><b>Implications:</b> good: files almost always open, quick responses, offline editing that syncs later. Bad: a user may briefly see an older version after someone else’s edit; simultaneous edits can conflict (a “conflicted copy” or a merge); sync delays between devices. Drive softens this with version history, change notifications and conflict resolution.</p><p class="pn">Google Docs’ live editing uses extra techniques; the expected exam answer is AP with eventual consistency.</p></div>')+
PRAC(P(S('Jun25 Q10')+'State the CAP theorem.','A distributed system can provide at most two of consistency, availability and partition tolerance at the same time.')+
P(S('Jun25 Q16')+'Importance of CAP in NoSQL, with an example (3 marks).','NoSQL systems are distributed, so CAP forces each to choose what to give up during a network partition, and that choice decides which applications it suits. Cassandra (AP) keeps accepting writes for a social feed and reconciles later; HBase/MongoDB with majority writes (CP) refuse some requests but never return stale data, as banking-like data needs.')));

ES('6.2',['Apr26 Q16','Nov25 Q16'],PRAC(P(S('Apr26 Q16')+S('Nov25 Q16')+'Key-value and document NoSQL databases (3 marks).','<b>Key-value:</b> each item is a unique key and a value, like a dictionary; very fast get/put by key; e.g. Redis: <code>user:101 → {Anu, anu@mail.com}</code>; used for sessions, carts, caches. <b>Document:</b> each record is a JSON/BSON document with its own fields, grouped in collections and queryable by field; e.g. MongoDB <code>{_id: 1, name: "Anu", skills: ["Java","SQL"]}</code>; used for catalogues and profiles.')));

ES('6.3',['Apr26 Q24, Q10','Jun25 Q24','Nov25 Q10'],
MODEL('Column-based NoSQL and its advantages over relational databases '+S('Jun25 Q24'),'<div class="paper"><p><b>Working.</b> A column-family database (Cassandra, HBase, BigTable) stores data by <b>row key</b>, with columns grouped into <b>column families</b>. Rows are sparse: each can have different columns. A row key is hashed to choose the node(s) that hold it (Cassandra’s ring) and the data is replicated. A write goes to a commit log and an in-memory table, later flushed to immutable sorted files (SSTables), so writes are very fast. Reads fetch only the column families requested.</p>'+CODE("Customer_Orders\n  C101 -> Personal: {name = Arun}  Orders: {O101 = DBMS 1000}\n  C102 -> Personal: {name = Priya} Orders: {O102 = OS 450, O107 = Python 600}")+'<p><b>Advantages over relational databases:</b> 1. horizontal scaling across commodity servers; 2. very high write throughput; 3. flexible schema (add columns per row without ALTER TABLE); 4. high availability through replication, no single point of failure; 5. reads only the needed columns, good compression, fast analytics on huge data; 6. handles sparse data without storing NULLs.</p><p><b>Limitations:</b> no joins, limited transactions, queries must be designed around access patterns, often eventual consistency.</p><p><b>Uses:</b> IoT and sensor data, logs, time series, messaging (Facebook inbox, Netflix viewing history).</p></div>')+
'<p>Apr26 Q24 (all four types, 12 marks) is model 1 above with the comparison table.</p>'+
