<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study</title>
<script src="shared/study.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#121a22;--muted:#5a6773;--line:#d8dfe5;--accent:#0a6f8f;--bar:#e3e8ec;--ok:#1b7f45;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
:root[data-theme="dark"]{--bg:#0f151b;--surface:#162029;--ink:#e5ecf2;--muted:#8fa2b1;--line:#27343f;--accent:#4cc2e6;--bar:#22303b;--ok:#5fd18c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
.wrap{max-width:960px;margin:0 auto;padding:72px 20px 60px}
.kicker{font:500 .8rem var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h1{font-size:2rem;margin:6px 0 4px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{font:500 .75rem var(--mono);color:var(--muted)}
.name{font-weight:600;font-size:1.15rem}
.desc{color:var(--muted);font-size:.92rem;margin:0;flex:1}
.bar{height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.prog{font:500 .8rem var(--mono);color:var(--muted)}
.foot{margin-top:32px;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Study</div>
  <h1>Pick a subject</h1>
  <p class="sub">Your progress is saved in this browser only, separately for each subject.</p>
  <div class="grid" id="grid"></div>
  <p class="foot">Use the selector at the top right to jump between subjects, and the moon / sun button to switch theme.</p>
</div>
<script>
var DESC={
  toc:'Interactive Theory of Computation course: parse trees, state diagrams, derivation steppers and solved previous-year questions.',
  dbms:'Interactive DBMS course (23CS2013): relational algebra, SQL, ER design, normalization, B+ trees, transactions and NoSQL, with every revision and question-bank question linked to its answer.',
  webtech:'Web Technology (23CS2048): five past end-sem papers from the last two years with every question shown as set and answered right under it, with live previews and real MongoDB and Node output.',
  quantum:'Quantum Computing (23CS2037): the Apr/May 2026 and old-regulation Nov/Dec 2024 papers, the 50-question bank and every Classroom problem set, each question shown as set and answered under it, every circuit checked by an exact simulator.',
  pandas:'Type-the-code drill for the DSE lab exam: NumPy, pandas, statistics and plots.',
  sql:'Type-the-query drill for the Oracle SQL*Plus lab: DDL, DML, joins, views, PL/SQL and triggers.'
};
function read(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function progress(id){
  if(id==='toc'){var p=read('toc-progress-v1')||{},n=Object.keys(p).length;return {pct:Math.round(n/39*100),txt:n+' of 39 chunks done'}}
  if(id==='dbms'){var d=read('dbms-progress-v1')||{},k=Object.keys(d).length;return {pct:Math.round(k/40*100),txt:k+' of 40 chunks done'}}
  if(id==='webtech'){var w=read('webtech-progress-v1')||{},j=Object.keys(w).length;return {pct:Math.round(j/27*100),txt:j+' of 27 chunks done'}}
  if(id==='quantum'){var q=read('quantum-progress-v1')||{},k=Object.keys(q).length;return {pct:Math.round(k/23*100),txt:k+' of 23 chunks done'}}
  var s=read(id==='pandas'?'pandrill':'sqldrill');
  if(!s||!s.answered)return {pct:0,txt:'not started'};
  return {pct:Math.round(s.correct/s.answered*100),txt:s.answered+' answered · '+Math.round(s.correct/s.answered*100)+'% correct'};
}
document.getElementById('grid').innerHTML=STUDY_SUBJECTS.map(function(s){
  var p=progress(s.id);
  return '<a class="card" href="'+s.path+'"><span class="tag">'+s.tag+'</span><span class="name">'+s.name+'</span><p class="desc">'+DESC[s.id]+'</p><div class="bar"><i style="width:'+p.pct+'%"></i></div><span class="prog">'+p.txt+'</span></a>';
}).join('');
</script>
</body>
</html>
